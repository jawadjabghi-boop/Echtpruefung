{
  id:"h2",
  title:{
    ar:"الحافلة إلى العمل (أندرياس)", ma:"الطوبيس للخدمة (أندرياس)", eg:"الأتوبيس للشغل (أندرياس)",
    en:"Bus to Work (Andreas)", fr:"Bus pour le travail (Andreas)", hi:"काम पर बस (एंड्रियास)",
    tr:"İşe Otobüsle (Andreas)", vi:"Xe buýt đi làm (Andreas)", uk:"Автобус на роботу (Андреас)",
    es:"Autobús al trabajo (Andreas)", pt:"Ônibus para o trabalho (Andreas)", zh:"乘公交上班（Andreas）", ru:"Автобус на работу (Андреас)"
  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen. Teil 1. Nummer 41. Ich fahre jeden Tag mit dem Auto zur Arbeit. Nummer 42. Ich arbeite in der Innenstadt und laufe morgens ein kleines Stück zu Fuß. Nummer 43. Früher bin ich oft mit dem Auto zur Arbeit gefahren. Nummer 44. Ich fahre immer auf dieselbe Weise zur Arbeit. Nummer 45. Zur Arbeit fahre ich manchmal mit dem Fahrrad.",
  story:{
    ar:"أحمد كيمشي شوية على رجليه (ein Stück zu Fuß) كل نهار، حيث هو عمره ما كيمشي بالطوموبيل (fährt nie mit dem Auto) وكيفضل الحركة.",
    ma:"أحمد كيمشي شوية على رجليه (ein Stück zu Fuß) كل نهار، حيث هو عمره ما كيمشي بالطوموبيل (fährt nie mit dem Auto) وكيفضل الحركة.",
    eg:"أحمد بيمشي شوية على رجليه (ein Stück zu Fuß) كل يوم، لأنه عمره ما بيسوق العربية (fährt nie mit dem Auto) وبيحب الحركة.",
    en:"Ahmed walks a bit every day (ein Stück zu Fuß), as he never drives a car (fährt nie mit dem Auto) and prefers to move.",
    fr:"Ahmed marche un peu chaque jour (ein Stück zu Fuß), car il ne conduit jamais de voiture (fährt nie mit dem Auto) et préfère bouger.",
    hi:"अहमद हर दिन थोड़ा पैदल चलता है (ein Stück zu Fuß), क्योंकि वह कभी कार नहीं चलाता (fährt nie mit dem Auto) और चलना पसंद करता है।",
    tr:"Ahmed her gün biraz yürüyor (ein Stück zu Fuß), çünkü asla araba kullanmıyor (fährt nie mit dem Auto) ve hareket etmeyi tercih ediyor.",
    vi:"Ahmed đi bộ một chút mỗi ngày (ein Stück zu Fuß), vì anh ấy không bao giờ lái xe (fährt nie mit dem Auto) và thích vận động.",
    uk:"Ахмед щодня трохи ходить пішки (ein Stück zu Fuß), оскільки він ніколи не водить машину (fährt nie mit dem Auto) і віддає перевагу руху.",
    es:"Ahmed camina un poco todos los días (ein Stück zu Fuß), ya que nunca conduce un coche (fährt nie mit dem Auto) y prefiere moverse.",
    pt:"Ahmed caminha um pouco todos os dias (ein Stück zu Fuß), pois nunca dirige um carro (fährt nie mit dem Auto) e prefere movimentar-se.",
    zh:"艾哈迈德每天都会走一点路（ein Stück zu Fuß），因为他从不自己开车（fährt nie mit dem Auto），更喜欢活动。",
    ru:"Ахмед немного ходит пешком каждый день (ein Stück zu Fuß), так как он никогда не водит машину (fährt nie mit dem Auto) и предпочитает движение."
  },
  items:[
    { n:1, c:"F", de:"Die Sprecherin könnte sich vorstellen, mit dem Bus zur Arbeit zu fahren.", ar:"المتحدثة يمكنها تخيل الذهاب بالحافلة.", ma:"المتحدثة يمكنها تخيل الذهاب بالحافلة.", eg:"المتحدثة ممكن تتخيل تروح بالأتوبيس.", en:"The speaker could imagine taking the bus to work.", fr:"L'oratrice pourrait imaginer prendre le bus pour aller au travail.", hi:"वक्ता काम पर बस लेने की कल्पना कर सकती है।", tr:"Konuşmacı işe otobüsle gitmeyi hayal edebiliyor.", vi:"Người nói có thể tưởng tượng việc đi xe buýt đi làm.", uk:"Мовець може уявити поїздку на роботу автобусом.", es:"La oradora podría imaginarse tomar el autobús al trabajo.", pt:"A oradora poderia imaginar ir de ônibus para o trabalho.", zh:"说话者可以想象乘公共汽车上班。", ru:"Говорящий может представить поездку на автобусе на работу." },
    { n:2, c:"R", de:"Die Sprecherin findet es gut, dass sie zur Arbeit ein Stück zu Fuß gehen kann.", ar:"المتحدثة تحب أنها تمشي شوية على رجليها.", ma:"المتحدثة تحب أنها تمشي شوية على رجليها.", eg:"المتحدثة بتحب إنها تمشي شوية على رجليها.", en:"The speaker thinks it's good that she can walk part of the way to work.", fr:"L'oratrice trouve bien de pouvoir marcher une partie du chemin pour aller au travail.", hi:"वक्ता को यह अच्छा लगता है कि वह काम पर जाने के लिए थोड़ा पैदल चल सकती है।", tr:"Konuşmacı işe giderken bir kısmını yürüyebildiği için bunu iyi buluyor.", vi:"Người nói cho rằng việc cô ấy có thể đi bộ một đoạn đường đi làm là tốt.", uk:"Мовець вважає добре, що вона може частину шляху на роботу пройти пішки.", es:"La oradora cree que es bueno poder caminar parte del camino al trabajo.", pt:"A oradora acha bom poder caminhar parte do caminho para o trabalho.", zh:"说话者认为能步行一段路去上班很好。", ru:"Говорящий считает хорошим, что может часть пути на работу пройти пешком." },
    { n:3, c:"R", de:"Der Sprecher fährt nie mit dem Auto zur Arbeit.", ar:"المتحدث لا يقود السيارة أبداً.", ma:"المتحدث لا يقود السيارة أبداً.", eg:"المتحدث عمره ما بيسوق العربية.", en:"The speaker never drives to work.", fr:"L'orateur ne va jamais au travail en voiture.", hi:"वक्ता कभी भी काम पर कार से नहीं जाता है।", tr:"Konuşmacı işe asla arabayla gitmez.", vi:"Người nói không bao giờ lái xe đi làm.", uk:"Мовець ніколи не їздить на роботу на машині.", es:"El orador nunca conduce al trabajo.", pt:"O orador nunca dirige para o trabalho.", zh:"说话者从不开车上班。", ru:"Говорящий никогда не ездит на работу на машине." },
    { n:4, c:"R", de:"Der Sprecher benutzt für den Weg zur Arbeit zurzeit verschiedene Verkehrsmittel.", ar:"المتحدث يستخدم وسائل نقل مختلفة.", ma:"المتحدث يستخدم وسائل نقل مختلفة.", eg:"المتحدث بيستخدم وسايل نقل مختلفة.", en:"The speaker currently uses various means of transport to get to work.", fr:"L'orateur utilise actuellement différents moyens de transport pour se rendre au travail.", hi:"वक्ता वर्तमान में काम पर जाने के लिए विभिन्न परिवहन साधनों का उपयोग करता है।", tr:"Konuşmacı şu anda işe gitmek için çeşitli ulaşım araçları kullanıyor.", vi:"Người nói hiện đang sử dụng nhiều phương tiện giao thông khác nhau để đi làm.", uk:"Мовець наразі використовує різні види транспорту, щоб дістатися до роботи.", es:"El orador actualmente usa varios medios de transporte para ir al trabajo.", pt:"O orador atualmente usa vários meios de transporte para ir ao trabalho.", zh:"说话者目前使用各种交通工具上班。", ru:"В настоящее время говорящий использует различные виды транспорта, чтобы добраться до работы." },
    { n:5, c:"F", de:"Für die Sprecherin ist der Firmenbus die einzige Möglichkeit zur Arbeit zu kommen.", ar:"حافلة الشركة هي الخيار الوحيد.", ma:"حافلة الشركة هي الخيار الوحيد.", eg:"أتوبيس الشركة هو الخيار الوحيد.", en:"For the speaker, the company bus is the only way to get to work.", fr:"Pour l'oratrice, le bus de l'entreprise est le seul moyen de se rendre au travail.", hi:"वक्ता के लिए, कंपनी की बस काम पर जाने का एकमात्र तरीका है।", tr:"Konuşmacı için şirket otobüsü işe gitmenin tek yolu.", vi:"Đối với người nói, xe buýt của công ty là cách duy nhất để đi làm.", uk:"Для мовця автобус компанії — єдиний спосіб дістатися до роботи.", es:"Para la oradora, el autobús de la empresa es la única forma de llegar al trabajo.", pt:"Para a oradora, o ônibus da empresa é a única maneira de chegar ao trabalho.", zh:"对于说话者来说，公司班车是上班的唯一途径。", ru:"Для говорящего корпоративный автобус — единственный способ добраться до работы." }
  ]

{

  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen. Teil 1. Nummer 41. Mein Vater hat eine Arbeit. Nummer 42. Ich bin kein sehr guter Schüler. Nummer 43. Ich bin gern allein. Nummer 44. Meine Mutter und ich streiten oft. Nummer 45. Meine Eltern sind nett, aber ich verbringe meine Zeit lieber mit Freunden.",
  story:{
    ar:"سفيان تلميذ مزيان (guter Schüler)، وماشي ديما كيقلق القسم (nicht immer gestört)، ولكن للأسف العلاقة ديالو ماشي مزيانة مع مو (nicht gut mit seiner Mutter)، وهاد الشي كيأثر عليه مرات.",
    ma:"سفيان تلميذ مزيان (guter Schüler)، وماشي ديما كيقلق القسم (nicht immer gestört)، ولكن للأسف العلاقة ديالو ماشي مزيانة مع مو (nicht gut mit seiner Mutter)، وهاد الشي كيأثر عليه مرات.",
    eg:"سفيان تلميذ كويس (guter Schüler)، ومش دايماً بيعمل شغب في الفصل (nicht immer gestört)، بس للأسف علاقته بأمه مش كويسة (nicht gut mit seiner Mutter)، وده بيأثر عليه أحياناً.",
    en:"Sufyan is a good student (guter Schüler) and doesn't always disturb the class (nicht immer gestört), but unfortunately his relationship with his mother is not good (nicht gut mit seiner Mutter), and this affects him sometimes.",
    fr:"Sufyan est un bon élève (guter Schüler) et ne perturbe pas toujours la classe (nicht immer gestört), mais malheureusement sa relation avec sa mère n'est pas bonne (nicht gut mit seiner Mutter), et cela l'affecte parfois.",
    hi:"सुफयान एक अच्छा छात्र है (guter Schüler) और हमेशा कक्षा में गड़बड़ नहीं करता (nicht immer gestört), लेकिन दुर्भाग्य से उसकी अपनी माँ के साथ संबंध अच्छा नहीं है (nicht gut mit seiner Mutter), और यह कभी-कभी उसे प्रभावित करता है।",
    tr:"Süfyan iyi bir öğrencidir (guter Schüler) ve sınıfı her zaman rahatsız etmez (nicht immer gestört), ancak ne yazık ki annesiyle ilişkisi iyi değildir (nicht gut mit seiner Mutter) ve bu onu bazen etkiler.",
    vi:"Sufyan là một học sinh giỏi (guter Schüler) và không phải lúc nào cũng quấy rầy lớp học (nicht immer gestört), nhưng thật không may, mối quan hệ của cậu với mẹ không tốt (nicht gut mit seiner Mutter), và điều này đôi khi ảnh hưởng đến cậu.",
    uk:"Суф'ян — хороший учень (guter Schüler) і не завжди заважає класу (nicht immer gestört), але, на жаль, його стосунки з матір'ю не дуже хороші (nicht gut mit seiner Mutter), і це іноді на нього впливає.",
    es:"Sufyan es un buen estudiante (guter Schüler) y no siempre molesta en clase (nicht immer gestört), pero desafortunadamente su relación con su madre no es buena (nicht gut mit seiner Mutter), y esto le afecta a veces.",
    pt:"Sufyan é um bom aluno (guter Schüler) e não perturba sempre a aula (nicht immer gestört), mas infelizmente o seu relacionamento com a mãe não é bom (nicht gut mit seiner Mutter), e isso afeta-o às vezes.",
    zh:"苏菲扬是个好学生（guter Schüler），并不总是打扰课堂（nicht immer gestört），但不幸的是，他与母亲的关系并不好（nicht gut mit seiner Mutter），这有时会影响他。",
    ru:"Суфьян — хороший ученик (guter Schüler) и не всегда мешает классу (nicht immer gestört), но, к сожалению, его отношения с матерью не очень хорошие (nicht gut mit seiner Mutter), и это иногда на него влияет."
  },
  items:[

    { n:3, c:"R", de:"Die Sprecherin möchte nicht immer gestört werden.", ar:"المتحدثة لا تريد أن يتم إزعاجها دائماً.", ma:"المتحدثة ما بغاتش تتزعج ديما.", eg:"المتحدثة مش عايزة حد يزعجها دايماً.", en:"The speaker doesn't want to be disturbed all the time.", fr:"L'oratrice ne veut pas être dérangée tout le temps.", hi:"वक्ता हर समय परेशान नहीं होना चाहती।", tr:"Konuşmacı sürekli rahatsız edilmek istemiyor.", vi:"Người nói không muốn bị làm phiền mọi lúc.", uk:"Мовець не хоче, щоб її постійно турбували.", es:"La oradora no quiere que la molesten todo el tiempo.", pt:"A oradora não quer ser incomodada o tempo todo.", zh:"说话者不想一直被打扰。", ru:"Говорящий не хочет, чтобы его постоянно беспокоили." },
    { n:4, c:"R", de:"Der Sprecher versteht sich nicht gut mit seiner Mutter.", ar:"المتحدث لا يتفاهم جيداً مع والدته.", ma:"المتحدث ما كيتفاهمش مزيان مع مو.", eg:"المتحدث مش متفق مع أمه.", en:"The speaker doesn't get along well with his mother.", fr:"L'orateur ne s'entend pas bien avec sa mère.", hi:"वक्ता अपनी माँ के साथ अच्छी तरह से नहीं मिलता।", tr:"Konuşmacı annesiyle iyi geçinemiyor.", vi:"Người nói không hòa thuận với mẹ của mình.", uk:"Мовець не ладнає зі своєю матір'ю.", es:"El orador no se lleva bien con su madre.", pt:"O orador não se dá bem com sua mãe.", zh:"说话者与母亲相处得不好。", ru:"Говорящий не ладит со своей матерью." },
    { n:5, c:"F", de:"Die Sprecherin ist am liebsten mit ihren Eltern zusammen.", ar:"المتحدثة تفضل أن تكون مع والديها.", ma:"المتحدثة كتفضل تكون مع الوالدين ديالها.", eg:"المتحدثة بتحب تكون مع والديها.", en:"The speaker prefers to be with her parents.", fr:"L'oratrice préfère être avec ses parents.", hi:"वक्ता अपने माता-पिता के साथ रहना पसंद करती है।", tr:"Konuşmacı ailesiyle birlikte olmayı tercih ediyor.", vi:"Người nói thích ở bên bố mẹ hơn.", uk:"Мовець віддає перевагу бути зі своїми батьками.", es:"La oradora prefiere estar con sus padres.", pt:"A oradora prefere estar com seus pais.", zh:"说话者更喜欢和父母在一起。", ru:"Говорящий предпочитает быть со своими родителями." }

{
  id:"h5",
  title:{
    ar:"الطفل الوحيد", ma:"الدرّي الوحيد", eg:"الطفل الوحيد",

    es:"Hijo único", pt:"Filho único", zh:"独生子女", ru:"Единственный ребенок"

  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"كريم عندو علاقة زوينة مع خوه (gutes Verhältnis zu seinem Bruder)، ومن صغرو كان خاصو يقرا بكري (früh lernen müssen)، وحتى ختو علاقتها ممتازة مع خوها (sehr gut mit ihrem Bruder)، وديما كيشجعو بعضياتهم.",
    ma:"كريم عندو علاقة زوينة مع خوه (gutes Verhältnis zu seinem Bruder)، ومن صغرو كان خاصو يقرا بكري (früh lernen müssen)، وحتى ختو علاقتها ممتازة مع خوها (sehr gut mit ihrem Bruder)، وديما كيشجعو بعضياتهم.",
    eg:"كريم عنده علاقة كويسة مع أخوه (gutes Verhältnis zu seinem Bruder)، ومن صغره كان لازم يتعلم بدرى (früh lernen müssen)، وحتى أخته علاقتها ممتازة مع أخوها (sehr gut mit ihrem Bruder)، ودايماً بيشجعوا بعض.",
    en:"Karim has a good relationship with his brother (gutes Verhältnis zu seinem Bruder); since childhood he had to learn early (früh lernen müssen), and even his sister has an excellent relationship with her brother (sehr gut mit ihrem Bruder), and they always encourage each other.",
    fr:"Karim a une bonne relation avec son frère (gutes Verhältnis zu seinem Bruder) ; depuis son enfance, il a dû apprendre tôt (früh lernen müssen), et même sa sœur a une excellente relation avec son frère (sehr gut mit ihrem Bruder), et ils s'encouragent toujours mutuellement.",
    hi:"करीम का अपने भाई के साथ अच्छा संबंध है (gutes Verhältnis zu seinem Bruder); बचपन से ही उसे जल्दी सीखना पड़ा (früh lernen müssen), और यहां तक कि उसकी बहन का भी अपने भाई के साथ उत्कृष्ट संबंध है (sehr gut mit ihrem Bruder), और वे हमेशा एक-दूसरे को प्रोत्साहित करते हैं।",
    tr:"Kerim'in kardeşiyle iyi bir ilişkisi var (gutes Verhältnis zu seinem Bruder); çocukluğundan beri erken öğrenmek zorundaydı (früh lernen müssen) ve kız kardeşinin bile kardeşiyle mükemmel bir ilişkisi var (sehr gut mit ihrem Bruder), ve her zaman birbirlerini teşvik ediyorlar.",
    vi:"Karim có một mối quan hệ tốt với anh trai mình (gutes Verhältnis zu seinem Bruder); từ nhỏ, cậu ấy đã phải học sớm (früh lernen müssen), và ngay cả em gái cậu ấy cũng có mối quan hệ tuyệt vời với anh trai mình (sehr gut mit ihrem Bruder), và họ luôn khuyến khích nhau.",
    uk:"Карім має хороші стосунки зі своїм братом (gutes Verhältnis zu seinem Bruder); з дитинства йому доводилося рано вчитися (früh lernen müssen), і навіть його сестра має чудові стосунки зі своїм братом (sehr gut mit ihrem Bruder), і вони завжди підтримують одне одного.",
    es:"Karim tiene una buena relación con su hermano (gutes Verhältnis zu seinem Bruder); desde pequeño tuvo que aprender temprano (früh lernen müssen), e incluso su hermana tiene una excelente relación con su hermano (sehr gut mit ihrem Bruder), y siempre se animan mutuamente.",
    pt:"Karim tem um bom relacionamento com seu irmão (gutes Verhältnis zu seinem Bruder); desde criança, teve que aprender cedo (früh lernen müssen), e até sua irmã tem uma excelente relação com o irmão (sehr gut mit ihrem Bruder), e sempre se incentivam mutuamente.",
    zh:"卡里姆和哥哥关系很好（gutes Verhältnis zu seinem Bruder）；从小他就必须早早学会（früh lernen müssen），甚至他的妹妹和哥哥也关系极好（sehr gut mit ihrem Bruder），他们总是互相鼓励。",
    ru:"У Карима хорошие отношения с братом (gutes Verhältnis zu seinem Bruder); с детства ему приходилось рано учиться (früh lernen müssen), и даже у его сестры отличные отношения с братом (sehr gut mit ihrem Bruder), и они всегда поддерживают друг друга."
  },

  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"عمر عندو علاقة زوينة مع خوه (gutes Verhältnis zu seinem Bruder)، ولكن ختو ما كتحبش تدوز الوقت مع خوها (nicht gerne Zeit mit ihrem Bruder)، وكتتمنى أن الوالدين يدوزو معاها وقت أكثر (Eltern mehr mit ihr unternehmen) باش متحسش بالإهمال.",
    ma:"عمر عندو علاقة زوينة مع خوه (gutes Verhältnis zu seinem Bruder)، ولكن ختو ما كتحبش تدوز الوقت مع خوها (nicht gerne Zeit mit ihrem Bruder)، وكتتمنى أن الوالدين يدوزو معاها وقت أكثر (Eltern mehr mit ihr unternehmen) باش متحسش بالإهمال.",
    eg:"عمر عنده علاقة كويسة مع أخوه (gutes Verhältnis zu seinem Bruder)، بس أخته مش بتحب تقضي وقت مع أخوها (nicht gerne Zeit mit ihrem Bruder)، وبتتمنى إن الوالدين يقضوا معاها وقت أكتر (Eltern mehr mit ihr unternehmen) عشان متحسش بالإهمال.",
    en:"Omar has a good relationship with his brother (gutes Verhältnis zu seinem Bruder), but his sister doesn't like spending time with her brother (nicht gerne Zeit mit ihrem Bruder), and wishes her parents would do more things with her (Eltern mehr mit ihr unternehmen) so she doesn't feel neglected.",
    fr:"Omar a une bonne relation avec son frère (gutes Verhältnis zu seinem Bruder), mais sa sœur n'aime pas passer du temps avec son frère (nicht gerne Zeit mit ihrem Bruder), et souhaite que ses parents fassent plus de choses avec elle (Eltern mehr mit ihr unternehmen) pour qu'elle ne se sente pas négligée.",
    hi:"उमर का अपने भाई के साथ अच्छा संबंध है (gutes Verhältnis zu seinem Bruder), लेकिन उसकी बहन अपने भाई के साथ समय बिताना पसंद नहीं करती (nicht gerne Zeit mit ihrem Bruder), और चाहती है कि उसके माता-पिता उसके साथ और चीजें करें (Eltern mehr mit ihr unternehmen) ताकि उसे उपेक्षित महसूस न हो।",
    tr:"Omar'ın kardeşiyle iyi bir ilişkisi var (gutes Verhältnis zu seinem Bruder), ancak kız kardeşi kardeşiyle zaman geçirmeyi sevmiyor (nicht gerne Zeit mit ihrem Bruder) ve ebeveynlerinin onunla daha fazla şey yapmasını istiyor (Eltern mehr mit ihr unternehmen) böylece kendini ihmal edilmiş hissetmez.",
    vi:"Omar có một mối quan hệ tốt với anh trai mình (gutes Verhältnis zu seinem Bruder), nhưng em gái cậu ấy không thích dành thời gian với anh trai mình (nicht gerne Zeit mit ihrem Bruder), và mong bố mẹ làm nhiều điều hơn với cô ấy (Eltern mehr mit ihr unternehmen) để cô ấy không cảm thấy bị bỏ rơi.",
    uk:"Омар має хороші стосунки зі своїм братом (gutes Verhältnis zu seinem Bruder), але його сестра не любить проводити час зі своїм братом (nicht gerne Zeit mit ihrem Bruder) і бажає, щоб батьки більше займалися з нею (Eltern mehr mit ihr unternehmen), щоб вона не почувалася покинутою.",
    es:"Omar tiene una buena relación con su hermano (gutes Verhältnis zu seinem Bruder), pero a su hermana no le gusta pasar tiempo con su hermano (nicht gerne Zeit mit ihrem Bruder), y desea que sus padres hagan más cosas con ella (Eltern mehr mit ihr unternehmen) para que no se sienta desatendida.",
    pt:"Omar tem um bom relacionamento com seu irmão (gutes Verhältnis zu seinem Bruder), mas sua irmã não gosta de passar tempo com o irmão (nicht gerne Zeit mit ihrem Bruder), e deseja que os pais façam mais coisas com ela (Eltern mehr mit ihr unternehmen) para que ela não se sinta negligenciada.",
    zh:"奥马尔和哥哥关系很好（gutes Verhältnis zu seinem Bruder），但他妹妹不喜欢和哥哥待在一起（nicht gerne Zeit mit ihrem Bruder），希望父母多陪她做些事情（Eltern mehr mit ihr unternehmen），这样她就不会觉得被忽视。",
    ru:"У Омара хорошие отношения с братом (gutes Verhältnis zu seinem Bruder), но его сестра не любит проводить время с братом (nicht gerne Zeit mit ihrem Bruder) и хочет, чтобы родители больше занимались с ней (Eltern mehr mit ihr unternehmen), чтобы она не чувствовала себя забытой."
  },

    { n:4, c:"F", de:"Die Sprecherin wäre gerne Einzelkind.", ar:"المتحدثة تود أن تكون طفلة وحيدة.", ma:"المتحدثة كتود تكون درّية وحيدة.", eg:"المتحدثة عايزة تكون طفلة وحيدة.", en:"The speaker would like to be an only child.", fr:"L'oratrice aimerait être enfant unique.", hi:"वक्ता अकेला बच्चा बनना चाहती है।", tr:"Konuşmacı tek çocuk olmak istiyor.", vi:"Người nói muốn làm con một.", uk:"Мовець хотів би бути єдиною дитиною в сім'ї.", es:"La oradora le gustaría ser hija única.", pt:"A oradora gostaria de ser filha única.", zh:"说话者想做个独生子女。", ru:"Говорящий хотел бы быть единственным ребенком." },

{
  id:"h7",
  title:{

  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen. Teil 1. Nummer 41. Als Kind wollte ich unbedingt Urlaub wie meine Freunde machen. Nummer 42. Einmal waren wir im Schwarzwald zum Wandern. Nummer 43. Wir sind früher oft in den Ferien an einen See gefahren. Nummer 44. Mit meiner Familie haben wir meistens Städtereisen gemacht. Nummer 45. Ich durfte bei der Urlaubsplanung immer mitreden.",
  story:{
    ar:"مريم كتحب تسافر فالعيطلة (gern Urlaub)، ولكن عطلة المشي فالجبال ما كتعجبهاش بزاف (Wanderurlaub nicht so gut)، وكتفضل تدوز العطلة مع الوالدين (Urlaub mit den Eltern).",
    ma:"مريم كتحب تسافر فالعطلة (gern Urlaub)، ولكن عطلة المشي فالجبال ما كتعجبهاش بزاف (Wanderurlaub nicht so gut)، وكتفضل تدوز العطلة مع الوالدين (Urlaub mit den Eltern).",
    eg:"مريم بتحب تسافر في الأجازة (gern Urlaub)، بس أجازة المشي في الجبال مش بتعجبها قوي (Wanderurlaub nicht so gut)، وبتفضل تقضي الأجازة مع الوالدين (Urlaub mit den Eltern).",
    en:"Miriam likes going on vacation (gern Urlaub), but hiking vacations in the mountains don't appeal to her much (Wanderurlaub nicht so gut), and she prefers to spend the vacation with her parents (Urlaub mit den Eltern).",
    fr:"Miriam aime partir en vacances (gern Urlaub), mais les vacances de randonnée à la montagne ne lui plaisent pas beaucoup (Wanderurlaub nicht so gut), et elle préfère passer les vacances avec ses parents (Urlaub mit den Eltern).",
    hi:"मरियम को छुट्टी पर जाना पसंद है (gern Urlaub), लेकिन पहाड़ों में लंबी पैदल यात्रा की छुट्टी उसे ज्यादा पसंद नहीं है (Wanderurlaub nicht so gut), और वह अपने माता-पिता के साथ छुट्टी बिताना पसंद करती है (Urlaub mit den Eltern)।",
    tr:"Meryem tatile gitmeyi sever (gern Urlaub), ancak dağlarda yürüyüş tatili ondan pek hoşlanmaz (Wanderurlaub nicht so gut) ve tatili ailesiyle geçirmeyi tercih eder (Urlaub mit den Eltern).",
    vi:"Miriam thích đi nghỉ (gern Urlaub), nhưng kỳ nghỉ đi bộ đường dài ở núi không hấp dẫn cô ấy lắm (Wanderurlaub nicht so gut), và cô ấy thích dành kỳ nghỉ với bố mẹ hơn (Urlaub mit den Eltern).",
    uk:"Міріам любить відпустку (gern Urlaub), але піші походи в горах їй не дуже подобаються (Wanderurlaub nicht so gut), і вона віддає перевагу відпустці з батьками (Urlaub mit den Eltern).",
    es:"A Miriam le gusta ir de vacaciones (gern Urlaub), pero las vacaciones de senderismo en la montaña no le atraen mucho (Wanderurlaub nicht so gut), y prefiere pasar las vacaciones con sus padres (Urlaub mit den Eltern).",
    pt:"Miriam gosta de tirar férias (gern Urlaub), mas as férias de caminhadas na montanha não a atraem muito (Wanderurlaub nicht so gut), e prefere passar as férias com os pais (Urlaub mit den Eltern).",
    zh:"玛丽亚姆喜欢度假（gern Urlaub），但山里的徒步假期不太吸引她（Wanderurlaub nicht so gut），她更喜欢和父母一起度假（Urlaub mit den Eltern）。",
    ru:"Мириам любит отдыхать (gern Urlaub), но пешие походы в горах ей не очень нравятся (Wanderurlaub nicht so gut), и она предпочитает проводить отпуск с родителями (Urlaub mit den Eltern)."
  },
  items:[
    { n:1, c:"R", de:"Der Sprecher hätte gern Urlaub wie die anderen Kinder gemacht.", ar:"كان يتمنى قضاء عطلة مثل الأطفال الآخرين.", ma:"كان كيتمنى يدوز عطلة بحال الدراري الآخرين.", eg:"كان بيتمنى يقضي أجازة زي الأطفال التانيين.", en:"The speaker would have liked to have a vacation like the other children.", fr:"L'orateur aurait aimé passer des vacances comme les autres enfants.", hi:"वक्ता दूसरे बच्चों की तरह छुट्टी बिताना चाहता था।", tr:"Konuşmacı diğer çocuklar gibi tatil yapmayı isterdi.", vi:"Người nói thích có một kỳ nghỉ giống những đứa trẻ khác.", uk:"Мовець хотів би провести відпустку, як інші діти.", es:"Al orador le habría gustado tener unas vacaciones como los otros niños.", pt:"O orador gostaria de ter tido férias como as outras crianças.", zh:"说话者希望像其他孩子一样度假。", ru:"Говорящий хотел бы провести отпуск так же, как другие дети." },
    { n:2, c:"R", de:"Dem Sprecher hat der Wanderurlaub nicht so gut gefallen.", ar:"لم تعجبه عطلة المشي كثيراً.", ma:"ما عجباتوش عطلة المشي بزاف.", eg:"أجازة المشي مش عجبته قوي.", en:"The speaker didn't like the hiking vacation very much.", fr:"L'orateur n'a pas tellement aimé les vacances de randonnée.", hi:"वक्ता को पैदल यात्रा की छुट्टी ज्यादा पसंद नहीं आई।", tr:"Konuşmacı yürüyüş tatilini pek beğenmedi.", vi:"Người nói không thích kỳ nghỉ đi bộ đường dài lắm.", uk:"Мовцю не дуже сподобалася відпустка з пішими походами.", es:"Al orador no le gustaron mucho las vacaciones de senderismo.", pt:"O orador não gostou muito das férias de caminhadas.", zh:"说话者不太喜欢徒步假期。", ru:"Говорящему не очень понравился отпуск с походами." },
    { n:3, c:"F", de:"Die Sprecherin hat die Ferien bei Verwandten verbracht.", ar:"قضت المتحدثة العطلة عند الأقارب.", ma:"المتحدثة دازت العطلة عند الأقارب.", eg:"المتحدثة قضت الأجازة عند الأقارب.", en:"The speaker spent the holidays with relatives.", fr:"L'oratrice a passé les vacances chez des parents.", hi:"वक्ता ने छुट्टियां रिश्तेदारों के साथ बिताईं।", tr:"Konuşmacı tatilleri akrabalarıyla geçirdi.", vi:"Người nói đã dành kỳ nghỉ với họ hàng.", uk:"Мовець провів канікули у родичів.", es:"La oradora pasó las vacaciones con familiares.", pt:"A oradora passou as férias com parentes.", zh:"说话者和亲戚一起度过了假期。", ru:"Говорящий провел каникулы у родственников." },
    { n:4, c:"F", de:"Die Sprecherin hat mit ihren Eltern regelmäßig Fahrradausflüge gemacht.", ar:"قامت المتحدثة برحلات دراجات منتظمة مع والديها.", ma:"المتحدثة كانت كتدير رحلات بالبيسكليت بانتظام مع الوالدين.", eg:"المتحدثة كانت بتعمل رحلات بالعجلة بانتظام مع والديها.", en:"The speaker regularly went on bike trips with her parents.", fr:"L'oratrice faisait régulièrement des balades à vélo avec ses parents.", hi:"वक्ता नियमित रूप से अपने माता-पिता के साथ साइकिल यात्रा पर जाती थी।", tr:"Konuşmacı ebeveynleriyle düzenli olarak bisiklet gezilerine çıkardı.", vi:"Người nói thường xuyên đi xe đạp với bố mẹ.", uk:"Мовець регулярно їздив на велосипеді з батьками.", es:"La oradora hacía regularmente excursiones en bicicleta con sus padres.", pt:"A oradora regularmente fazia passeios de bicicleta com os pais.", zh:"说话者经常和父母一起去骑自行车旅行。", ru:"Говорящий регулярно совершал велосипедные поездки с родителями." },
    { n:5, c:"R", de:"Der Sprecher hat den Urlaub mit den Eltern gemeinsam geplant.", ar:"خطط المتحدث للعطلة مع والديه معاً.", ma:"المتحدث خطط للعطلة مع الوالدين بجوج.", eg:"المتحدث خطط للأجازة مع والديه مع بعض.", en:"The speaker planned the vacation together with his parents.", fr:"L'orateur a planifié les vacances avec ses parents.", hi:"वक्ता ने अपने माता-पिता के साथ मिलकर छुट्टी की योजना बनाई।", tr:"Konuşmacı tatili ebeveynleriyle birlikte planladı.", vi:"Người nói đã lên kế hoạch kỳ nghỉ cùng với bố mẹ.", uk:"Мовець планував відпустку разом з батьками.", es:"El orador planificó las vacaciones junto con sus padres.", pt:"O orador planejou as férias junto com os pais.", zh:"说话者和父母一起计划了假期。", ru:"Говорящий планировал отпуск вместе с родителями." }

{

  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"كريم عمره ما سافر فالعطلة مع العائلة (mit seiner Familie nie in Urlaub)، والولد عندو رغبات أخرى بالنسبة للعطلة (Kind andere Urlaubswünsche)، ولكن الوالدين باغين يقضيو العطلة مع أولادهم (Urlaub mit den Eltern) باش يفرحو كاملين.",
    ma:"كريم عمره ما سافر فالعطلة مع العائلة (mit seiner Familie nie in Urlaub)، والولد عندو رغبات أخرى بالنسبة للعطلة (Kind andere Urlaubswünsche)، ولكن الوالدين باغين يقضيو العطلة مع أولادهم (Urlaub mit den Eltern) باش يفرحو كاملين.",
    eg:"كريم عمره ما سافر في الأجازة مع العيلة (mit seiner Familie nie in Urlaub)، والولد عنده رغبات تانية بخصوص الأجازة (Kind andere Urlaubswünsche)، بس الوالدين عايزين يقضوا الأجازة مع أولادهم (Urlaub mit den Eltern) عشان يفرحوا كلهم.",
    en:"Karim has never been on vacation with his family (mit seiner Familie nie in Urlaub), and the boy has other vacation wishes (Kind andere Urlaubswünsche), but the parents want to spend the vacation with their children (Urlaub mit den Eltern) so that everyone is happy.",
    fr:"Karim n'est jamais parti en vacances avec sa famille (mit seiner Familie nie in Urlaub), et le garçon a d'autres envies de vacances (Kind andere Urlaubswünsche), mais les parents veulent passer les vacances avec leurs enfants (Urlaub mit den Eltern) pour que tout le monde soit heureux.",
    hi:"करीम कभी अपने परिवार के साथ छुट्टी पर नहीं गया (mit seiner Familie nie in Urlaub), और लड़के की छुट्टी की अन्य इच्छाएँ हैं (Kind andere Urlaubswünsche), लेकिन माता-पिता अपने बच्चों के साथ छुट्टी बिताना चाहते हैं (Urlaub mit den Eltern) ताकि सभी खुश हों।",
    tr:"Kerim ailesiyle hiç tatile gitmedi (mit seiner Familie nie in Urlaub) ve çocuğun başka tatil istekleri var (Kind andere Urlaubswünsche), ancak ebeveynler herkes mutlu olsun diye tatili çocuklarıyla geçirmek istiyor (Urlaub mit den Eltern).",
    vi:"Karim chưa bao giờ đi nghỉ với gia đình (mit seiner Familie nie in Urlaub), và cậu bé có những mong muốn kỳ nghỉ khác (Kind andere Urlaubswünsche), nhưng bố mẹ muốn dành kỳ nghỉ với con cái (Urlaub mit den Eltern) để mọi người đều vui.",
    uk:"Карім ніколи не їздив у відпустку зі своєю сім'єю (mit seiner Familie nie in Urlaub), і у хлопчика є інші побажання щодо відпустки (Kind andere Urlaubswünsche), але батьки хочуть провести відпустку з дітьми (Urlaub mit den Eltern), щоб усі були щасливі.",
    es:"Karim nunca ha ido de vacaciones con su familia (mit seiner Familie nie in Urlaub), y el niño tiene otros deseos de vacaciones (Kind andere Urlaubswünsche), pero los padres quieren pasar las vacaciones con sus hijos (Urlaub mit den Eltern) para que todos sean felices.",
    pt:"Karim nunca foi de férias com a família (mit seiner Familie nie in Urlaub), e o menino tem outros desejos de férias (Kind andere Urlaubswünsche), mas os pais querem passar as férias com os filhos (Urlaub mit den Eltern) para que todos sejam felizes.",
    zh:"卡里姆从未和家人一起度假（mit seiner Familie nie in Urlaub），这个男孩有其他的度假愿望（Kind andere Urlaubswünsche），但父母想和孩子们一起度假（Urlaub mit den Eltern），以便大家都开心。",
    ru:"Карим никогда не отдыхал со своей семьей (mit seiner Familie nie in Urlaub), и у мальчика другие желания насчет отпуска (Kind andere Urlaubswünsche), но родители хотят провести отпуск с детьми (Urlaub mit den Eltern), чтобы все были счастливы."
  },
  items:[
    { n:1, c:"R", de:"Der Sprecher ist als Kind mit seiner Familie nie in Urlaub gefahren.", ar:"المتحدث لم يسافر مع عائلته في عطلة عندما كان طفلاً.", ma:"المتحدث عمره ما سافر مع العائلة فالعطلة ملي كان صغير.", eg:"المتحدث عمره ما سافر مع العيلة في أجازة لما كان صغير.", en:"The speaker never went on vacation with his family as a child.", fr:"L'orateur n'est jamais parti en vacances avec sa famille quand il était enfant.", hi:"वक्ता बचपन में कभी अपने परिवार के साथ छुट्टी पर नहीं गया।", tr:"Konuşmacı çocukken ailesiyle hiç tatile gitmedi.", vi:"Người nói chưa bao giờ đi nghỉ với gia đình khi còn nhỏ.", uk:"Мовець у дитинстві ніколи не їздив у відпустку з родиною.", es:"El orador nunca fue de vacaciones con su familia de niño.", pt:"O orador nunca foi de férias com a família quando criança.", zh:"说话者小时候从未和家人一起度假。", ru:"Говорящий в детстве никогда не ездил в отпуск с семьей." },
    { n:2, c:"R", de:"Der Sprecher hatte als Kind andere Urlaubswünsche als seine Eltern.", ar:"كان لدى المتحدث رغبات عطلة مختلفة عن والديه عندما كان طفلاً.", ma:"المتحدث كان عندو رغبات عطلة مختلفة على الوالدين ملي كان صغير.", eg:"المتحدث كان عنده رغبات أجازة مختلفة عن والديه لما كان صغير.", en:"As a child, the speaker had different vacation wishes than his parents.", fr:"Enfant, l'orateur avait des envies de vacances différentes de celles de ses parents.", hi:"बचपन में, वक्ता की छुट्टी की इच्छाएँ उसके माता-पिता से अलग थीं।", tr:"Çocukken konuşmacının tatil istekleri ebeveynlerinden farklıydı.", vi:"Khi còn nhỏ, người nói có những mong muốn kỳ nghỉ khác với bố mẹ.", uk:"У дитинстві у мовця були інші побажання щодо відпустки, ніж у батьків.", es:"De niño, el orador tenía diferentes deseos de vacaciones que sus padres.", pt:"Quando criança, o orador tinha desejos de férias diferentes dos pais.", zh:"小时候，说话者的度假愿望与父母不同。", ru:"В детстве у говорящего были другие пожелания насчет отпуска, чем у родителей." },
    { n:3, c:"F", de:"Die Sprecherin fand die Fahrt in die Ferien immer aufregend.", ar:"كانت المتحدثة تجد الرحلة إلى العطلة مثيرة دائماً.", ma:"المتحدثة كانت كتشوف الرحلة للعطلة مثيرة ديما.", eg:"المتحدثة كانت شايفة الرحلة للأجازة مثيرة دايماً.", en:"The speaker always found the journey to the holidays exciting.", fr:"L'oratrice trouvait toujours le voyage vers les vacances passionnant.", hi:"वक्ता को छुट्टियों की यात्रा हमेशा रोमांचक लगती थी।", tr:"Konuşmacı tatil yolculuğunu her zaman heyecan verici bulurdu.", vi:"Người nói luôn thấy chuyến đi đến kỳ nghỉ thật thú vị.", uk:"Мовець завжди вважав подорож на відпочинок захоплюючою.", es:"La oradora siempre encontraba emocionante el viaje a las vacaciones.", pt:"A oradora sempre achava a viagem para as férias emocionante.", zh:"说话者总是觉得去度假的旅程很令人兴奋。", ru:"Говорящий всегда находил поездку на отдых захватывающей." },
    { n:4, c:"F", de:"Die Sprecherin hat immer mit ihren Eltern Urlaub gemacht.", ar:"كانت المتحدثة تذهب دائماً في عطلة مع والديها.", ma:"المتحدثة كانت ديما كتدوز العطلة مع الوالدين.", eg:"المتحدثة كانت دايماً بتاخد أجازة مع والديها.", en:"The speaker always went on vacation with her parents.", fr:"L'oratrice partait toujours en vacances avec ses parents.", hi:"वक्ता हमेशा अपने माता-पिता के साथ छुट्टी पर जाती थी।", tr:"Konuşmacı her zaman ebeveynleriyle tatile giderdi.", vi:"Người nói luôn đi nghỉ với bố mẹ.", uk:"Мовець завжди їздив у відпустку з батьками.", es:"La oradora siempre iba de vacaciones con sus padres.", pt:"A oradora sempre ia de férias com os pais.", zh:"说话者总是和父母一起去度假。", ru:"Говорящий всегда ездил в отпуск с родителями." },
    { n:5, c:"R", de:"Der Sprecher hat den Urlaub mit den Eltern gemeinsam geplant.", ar:"خطط المتحدث للعطلة مع والديه معاً.", ma:"المتحدث خطط للعطلة مع الوالدين بجوج.", eg:"المتحدث خطط للأجازة مع والديه مع بعض.", en:"The speaker planned the vacation together with his parents.", fr:"L'orateur a planifié les vacances avec ses parents.", hi:"वक्ता ने अपने माता-पिता के साथ मिलकर छुट्टी की योजना बनाई।", tr:"Konuşmacı tatili ebeveynleriyle birlikte planladı.", vi:"Người nói đã lên kế hoạch kỳ nghỉ cùng với bố mẹ.", uk:"Мовець планував відпустку разом з батьками.", es:"El orador planificó las vacaciones junto con sus padres.", pt:"O orador planejou as férias junto com os pais.", zh:"说话者和父母一起计划了假期。", ru:"Говорящий планировал отпуск вместе с родителями." }

{
  id:"h9",
  title:{
    ar:"الأطفال في المدرسة", ma:"الدراري فالمدرسة", eg:"العيال في المدرسة",
    en:"Children in School", fr:"Enfants à l'école", hi:"स्कूल में बच्चे",
    tr:"Okulda Çocuklar", vi:"Trẻ em ở trường", uk:"Діти в школі",
    es:"Niños en la escuela", pt:"Crianças na escola", zh:"学校里的孩子", ru:"Дети в школе"
  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen Teil 1. Nummer 41. Also, ich finde es sehr wichtig, dass meine Kinder gute Noten bekommen. Nummer 42. Für mich ist es selbstverständlich, dass Eltern immer für ihre Kinder da sind. Nummer 43. Ich denke, ich spreche schon sehr oft mit meiner Tochter. Nummer 44. Mir ist es sehr wichtig, dass meine Kinder gesund leben. Nummer 45. Ich möchte, dass mein Kind seine eigenen Ideen verwirklichen kann.",
  story:{
    ar:"أي أب وأم خاصهم ديما يكونو مع ولادهم ويساندوهم (Eltern immer für ihre Kinder da sind)، وكيتمنّاو ولادهم يعيشو بصحة مزيانة (seine Kinder gesund leben)، ويخليو كل طفل يحقق الأفكار والأحلام ديالو (Kind die eigenen Ideen realisieren).",
    ma:"أي أب وأم خاصهم ديما يكونو مع ولادهم ويساندوهم (Eltern immer für ihre Kinder da sind)، وكيتمنّاو ولادهم يعيشو بصحة مزيانة (seine Kinder gesund leben)، ويخليو كل طفل يحقق الأفكار والأحلام ديالو (Kind die eigenen Ideen realisieren).",
    eg:"أي أب وأم لازم دايماً يكونوا مع ولادهم ويساندوهم (Eltern immer für ihre Kinder da sind)، ويتمنّوا ولادهم يعيشوا بصحة كويسة (seine Kinder gesund leben)، ويسيبوا كل طفل يحقق أفكاره وأحلامه (Kind die eigenen Ideen realisieren).",
    en:"Every parent should always be there for their children and support them (Eltern immer für ihre Kinder da sind), wish their children to live healthily (seine Kinder gesund leben), and let each child realize their own ideas and dreams (Kind die eigenen Ideen realisieren).",
    fr:"Chaque parent devrait toujours être là pour ses enfants et les soutenir (Eltern immer für ihre Kinder da sind), souhaiter que leurs enfants vivent sainement (seine Kinder gesund leben), et laisser chaque enfant réaliser ses propres idées et rêves (Kind die eigenen Ideen realisieren).",
    hi:"हर माता-पिता को हमेशा अपने बच्चों के लिए उपलब्ध रहना चाहिए और उनका समर्थन करना चाहिए (Eltern immer für ihre Kinder da sind), अपने बच्चों के स्वस्थ रहने की कामना करनी चाहिए (seine Kinder gesund leben), और हर बच्चे को अपने विचारों और सपनों को साकार करने देना चाहिए (Kind die eigenen Ideen realisieren)।",
    tr:"Her ebeveyn her zaman çocukları için orada olmalı ve onları desteklemelidir (Eltern immer für ihre Kinder da sind), çocuklarının sağlıklı yaşamasını dilemelidir (seine Kinder gesund leben) ve her çocuğun kendi fikirlerini ve hayallerini gerçekleştirmesine izin vermelidir (Kind die eigenen Ideen realisieren).",
    vi:"Mỗi bậc cha mẹ nên luôn ở bên con cái và hỗ trợ chúng (Eltern immer für ihre Kinder da sind), mong con sống lành mạnh (seine Kinder gesund leben), và để mỗi đứa trẻ thực hiện những ý tưởng và ước mơ của riêng mình (Kind die eigenen Ideen realisieren).",
    uk:"Кожен з батьків повинен завжди бути поруч зі своїми дітьми та підтримувати їх (Eltern immer für ihre Kinder da sind), бажати своїм дітям здорового життя (seine Kinder gesund leben) і дозволяти кожній дитині реалізовувати свої власні ідеї та мрії (Kind die eigenen Ideen realisieren).",
    es:"Todo padre debería estar siempre ahí para sus hijos y apoyarlos (Eltern immer für ihre Kinder da sind), desear que sus hijos vivan sanamente (seine Kinder gesund leben) y dejar que cada niño realice sus propias ideas y sueños (Kind die eigenen Ideen realisieren).",
    pt:"Todo pai deve estar sempre presente para seus filhos e apoiá-los (Eltern immer für ihre Kinder da sind), desejar que seus filhos vivam de forma saudável (seine Kinder gesund leben) e deixar que cada criança realize suas próprias ideias e sonhos (Kind die eigenen Ideen realisieren).",
    zh:"每一位父母都应该始终陪伴在孩子身边并支持他们（Eltern immer für ihre Kinder da sind），希望孩子健康生活（seine Kinder gesund leben），并让每个孩子实现自己的想法和梦想（Kind die eigenen Ideen realisieren）。",
    ru:"Каждый родитель должен всегда быть рядом со своими детьми и поддерживать их (Eltern immer für ihre Kinder da sind), желать своим детям здоровой жизни (seine Kinder gesund leben) и позволять каждому ребенку реализовывать свои собственные идеи и мечты (Kind die eigenen Ideen realisieren)."
  },
  items:[

  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"الأب ديما كيكون حاضر مع ولادو (immer für ihre Kinder da)، وكيهتم بالتغذية ديالهم (die Ernährung seiner Kinder) باش يبقاو بصحة مزيانة، وفنفس الوقت كيشجع كل طفل يحقق الأفكار ديالو (Kind die eigenen Ideen realisieren).",
    ma:"الأب ديما كيكون حاضر مع ولادو (immer für ihre Kinder da)، وكيهتم بالتغذية ديالهم (die Ernährung seiner Kinder) باش يبقاو بصحة مزيانة، وفنفس الوقت كيشجع كل طفل يحقق الأفكار ديالو (Kind die eigenen Ideen realisieren).",
    eg:"الأب دايماً موجود مع عياله (immer für ihre Kinder da)، وبيهتم بتغذيتهم (die Ernährung seiner Kinder) عشان يفضلوا بصحة كويسة، وفي نفس الوقت بيشجع كل طفل يحقق أفكاره (Kind die eigenen Ideen realisieren).",
    en:"The father is always there for his children (immer für ihre Kinder da) and pays attention to their nutrition (die Ernährung seiner Kinder) so that they stay healthy, and at the same time he encourages each child to realize their own ideas (Kind die eigenen Ideen realisieren).",
    fr:"Le père est toujours là pour ses enfants (immer für ihre Kinder da) et fait attention à leur alimentation (die Ernährung seiner Kinder) pour qu'ils restent en bonne santé, et en même temps il encourage chaque enfant à réaliser ses propres idées (Kind die eigenen Ideen realisieren).",
    hi:"पिता हमेशा अपने बच्चों के लिए उपलब्ध रहते हैं (immer für ihre Kinder da) और उनके पोषण पर ध्यान देते हैं (die Ernährung seiner Kinder) ताकि वे स्वस्थ रहें, और साथ ही वे हर बच्चे को उसके अपने विचारों को साकार करने के लिए प्रोत्साहित करते हैं (Kind die eigenen Ideen realisieren)।",
    tr:"Baba her zaman çocukları için oradadır (immer für ihre Kinder da) ve sağlıklı kalmaları için beslenmelerine dikkat eder (die Ernährung seiner Kinder) ve aynı zamanda her çocuğu kendi fikirlerini gerçekleştirmesi için teşvik eder (Kind die eigenen Ideen realisieren).",
    vi:"Người cha luôn ở bên con cái (immer für ihre Kinder da) và chú ý đến dinh dưỡng của chúng (die Ernährung seiner Kinder) để chúng khỏe mạnh, đồng thời khuyến khích mỗi đứa trẻ thực hiện những ý tưởng của riêng mình (Kind die eigenen Ideen realisieren).",
    uk:"Батько завжди поруч зі своїми дітьми (immer für ihre Kinder da) і дбає про їхнє харчування (die Ernährung seiner Kinder), щоб вони залишалися здоровими, і водночас заохочує кожну дитину реалізовувати свої власні ідеї (Kind die eigenen Ideen realisieren).",
    es:"El padre siempre está ahí para sus hijos (immer für ihre Kinder da) y presta atención a su nutrición (die Ernährung seiner Kinder) para que se mantengan sanos, y al mismo tiempo anima a cada niño a realizar sus propias ideas (Kind die eigenen Ideen realisieren).",
    pt:"O pai está sempre presente para os filhos (immer für ihre Kinder da) e presta atenção à sua nutrição (die Ernährung seiner Kinder) para que se mantenham saudáveis, e ao mesmo tempo incentiva cada criança a realizar suas próprias ideias (Kind die eigenen Ideen realisieren).",
    zh:"父亲总是陪伴在孩子身边（immer für ihre Kinder da），关注他们的营养（die Ernährung seiner Kinder），让他们保持健康，同时鼓励每个孩子实现自己的想法（Kind die eigenen Ideen realisieren）。",
    ru:"Отец всегда рядом со своими детьми (immer für ihre Kinder da) и заботится об их питании (die Ernährung seiner Kinder), чтобы они оставались здоровыми, и в то же время поощряет каждого ребенка реализовывать свои собственные идеи (Kind die eigenen Ideen realisieren)."
  },

{
  id:"h11",
  title:{
    ar:"مسارات الدراجات", ma:"مسارات البيسكليت", eg:"مسارات العجل",
    en:"Cycle Paths", fr:"Pistes cyclables", hi:"साइकिल पथ",
    tr:"Bisiklet Yolları", vi:"Đường xe đạp", uk:"Велодоріжки",
    es:"Carriles bici", pt:"Ciclovias", zh:"自行车道", ru:"Велодорожки"
  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen Teil 1. Nummer 41. Ich fahre jeden Tag mit dem Fahrrad zur Arbeit. Nummer 42. Ich fahre nur am Wochenende Fahrrad. Nummer 43. Ich finde Radwege sehr wichtig. Nummer 44. Wenn Fahrradfahrer auf der Straße fahren, wird der Verkehr oft langsamer. Nummer 45. Ich fühle mich auf Radwegen viel sicherer.",
  story:{
    ar:"إنشاء مسارات خاصة بالدراجات (Radwege Vorteile) عندو بزاف ديال الفوائد، حيث كيخلي ركوب الدراجة أكثر أماناً (Radfahren sicherer)، ولكن كاينين ناس كيشوفو أن هاد المسارات كتعرقل حركة المرور (den Verkehr behindernd).",
    ma:"إنشاء مسارات خاصة بالدراجات (Radwege Vorteile) عندو بزاف ديال الفوائد، حيث كيخلي ركوب الدراجة أكثر أماناً (Radfahren sicherer)، ولكن كاينين ناس كيشوفو أن هاد المسارات كتعرقل حركة المرور (den Verkehr behindernd).",
    eg:"عمل مسارات خاصة بالعجل (Radwege Vorteile) ليه فوايد كتير، لأنه بيخلي سواقة العجلة أأمن (Radfahren sicherer)، بس في ناس شايفين إن المسارات دي بتعرقل حركة المرور (den Verkehr behindernd).",
    en:"Creating cycle paths (Radwege Vorteile) has many benefits, as it makes cycling safer (Radfahren sicherer), but some people think these paths obstruct traffic (den Verkehr behindernd).",
    fr:"La création de pistes cyclables (Radwege Vorteile) présente de nombreux avantages, car elle rend le vélo plus sûr (Radfahren sicherer), mais certaines personnes pensent que ces pistes gênent la circulation (den Verkehr behindernd).",
    hi:"साइकिल पथ बनाने (Radwege Vorteile) के कई फायदे हैं, क्योंकि यह साइकिल चलाना सुरक्षित बनाता है (Radfahren sicherer), लेकिन कुछ लोग सोचते हैं कि ये पथ यातायात में बाधा डालते हैं (den Verkehr behindernd)।",
    tr:"Bisiklet yolları oluşturmak (Radwege Vorteile) birçok fayda sağlar çünkü bisiklet sürmeyi daha güvenli hale getirir (Radfahren sicherer), ancak bazı insanlar bu yolların trafiği engellediğini düşünüyor (den Verkehr behindernd).",
    vi:"Tạo đường xe đạp (Radwege Vorteile) có nhiều lợi ích vì nó làm cho việc đi xe đạp an toàn hơn (Radfahren sicherer), nhưng một số người nghĩ rằng những con đường này cản trở giao thông (den Verkehr behindernd).",
    uk:"Створення велодоріжок (Radwege Vorteile) має багато переваг, оскільки робить їзду на велосипеді безпечнішою (Radfahren sicherer), але деякі люди вважають, що ці доріжки заважають руху (den Verkehr behindernd).",
    es:"Crear carriles bici (Radwege Vorteile) tiene muchas ventajas, ya que hace que ir en bicicleta sea más seguro (Radfahren sicherer), pero algunas personas piensan que estos carriles obstruyen el tráfico (den Verkehr behindernd).",
    pt:"Criar ciclovias (Radwege Vorteile) tem muitas vantagens, pois torna o ciclismo mais seguro (Radfahren sicherer), mas algumas pessoas pensam que essas vias obstruem o trânsito (den Verkehr behindernd).",

  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"بعض الآباء كيشوفو أن الأطفال خاصهم يتعلمو لغة أجنبية من بكري (schon früh Fremdsprache lernen)، والأفضل يبداو بها فالمدرسة (in der Schule beginnen)، ولكن كاين اللي كيشوف أن تعلم لغة أجنبية عندو عيوب بالنسبة لعدد كبير من الأطفال (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    ma:"بعض الآباء كيشوفو أن الأطفال خاصهم يتعلمو لغة أجنبية من بكري (schon früh Fremdsprache lernen)، والأفضل يبداو بها فالمدرسة (in der Schule beginnen)، ولكن كاين اللي كيشوف أن تعلم لغة أجنبية عندو عيوب بالنسبة لعدد كبير من الأطفال (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    eg:"بعض الأهل شايفين إن الأطفال لازم يتعلموا لغة أجنبية من بدرى (schon früh Fremdsprache lernen)، والأفضل يبدأوا بيها في المدرسة (in der Schule beginnen)، بس في ناس شايفين إن تعلم لغة أجنبية عنده عيوب لعدد كبير من الأطفال (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    en:"Some parents believe that children should learn a foreign language early (schon früh Fremdsprache lernen), and it's better to start at school (in der Schule beginnen), but there are those who think that learning a foreign language has disadvantages for a large number of children (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",

    hi:"कुछ माता-पिता मानते हैं कि बच्चों को जल्दी विदेशी भाषा सीखनी चाहिए (schon früh Fremdsprache lernen), और स्कूल में शुरू करना बेहतर है (in der Schule beginnen), लेकिन ऐसे लोग भी हैं जो सोचते हैं कि विदेशी भाषा सीखने से बड़ी संख्या में बच्चों को नुकसान होता है (Lernen einer Fremdsprache für viele Kinder Nachteile hat)।",
    tr:"Bazı ebeveynler çocukların erken bir yabancı dil öğrenmesi gerektiğine inanıyor (schon früh Fremdsprache lernen) ve okulda başlamanın daha iyi olduğunu düşünüyor (in der Schule beginnen), ancak bir yabancı dil öğrenmenin çok sayıda çocuk için dezavantajları olduğunu düşünenler de var (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    vi:"Một số phụ huynh tin rằng trẻ em nên học ngoại ngữ sớm (schon früh Fremdsprache lernen), và tốt hơn là bắt đầu ở trường (in der Schule beginnen), nhưng có những người cho rằng việc học ngoại ngữ có những bất lợi cho một số lượng lớn trẻ em (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    uk:"Деякі батьки вважають, що діти повинні вивчати іноземну мову рано (schon früh Fremdsprache lernen), і краще починати в школі (in der Schule beginnen), але є й ті, хто вважає, що вивчення іноземної мови має недоліки для великої кількості дітей (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    es:"Algunos padres creen que los niños deberían aprender un idioma extranjero desde muy temprano (schon früh Fremdsprache lernen), y es mejor empezar en la escuela (in der Schule beginnen), pero hay quienes piensan que aprender un idioma extranjero tiene desventajas para un gran número de niños (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    pt:"Alguns pais acreditam que as crianças devem aprender uma língua estrangeira cedo (schon früh Fremdsprache lernen), e é melhor começar na escola (in der Schule beginnen), mas há quem pense que aprender uma língua estrangeira tem desvantagens para um grande número de crianças (Lernen einer Fremdsprache für viele Kinder Nachteile hat).",
    zh:"一些父母认为孩子应该尽早学习外语（schon früh Fremdsprache lernen），最好在学校开始（in der Schule beginnen），但也有人认为学习外语对大量儿童有弊端（Lernen einer Fremdsprache für viele Kinder Nachteile hat）。",
    ru:"Некоторые родители считают, что дети должны изучать иностранный язык рано (schon früh Fremdsprache lernen), и лучше начинать в школе (in der Schule beginnen), но есть и те, кто считает, что изучение иностранного языка имеет недостатки для большого числа детей (Lernen einer Fremdsprache für viele Kinder Nachteile hat)."

  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Verstehen. Teil 1. Nummer 41. Sport spielt eine viel größere Rolle in meinem Leben als Kultur. Nummer 42. Sobald sich die Gelegenheit ergibt, besuche ich eine Theateraufführung. Nummer 43. Ehrlich gesagt kann ich mit moderner Musik wenig anfangen. Nummer 44. Kunstausstellungen besuche ich nur selten. Nummer 45. Ich bedauere es sehr, dass ich nicht mehr Zeit für kulturelle Erlebnisse habe.",
  story:{
    ar:"سارة مهتمة بالرياضة أكثر من الثقافة (interessiert sich mehr für Sport als für Kultur)، ولكن كتقدر تمشي للمسرح بزاف ديال المرات (oft sie kann ins Theater)، وكتحاول تخصص وقت أكثر للثقافة (mehr Zeit für die Kultur).",
    ma:"سارة مهتمة بالرياضة أكثر من الثقافة (interessiert sich mehr für Sport als für Kultur)، ولكن كتقدر تمشي للمسرح بزاف ديال المرات (oft sie kann ins Theater)، وكتحاول تخصص وقت أكثر للثقافة (mehr Zeit für die Kultur).",
    eg:"سارة مهتمة بالرياضة أكتر من الثقافة (interessiert sich mehr für Sport als für Kultur)، بس بتقدر تروح للمسرح كتير (oft sie kann ins Theater)، وبت حاول تخصص وقت أكتر للثقافة (mehr Zeit für die Kultur).",
    en:"Sara is more interested in sports than culture (interessiert sich mehr für Sport als für Kultur), but she goes to the theater as often as she can (oft sie kann ins Theater), and tries to dedicate more time to culture (mehr Zeit für die Kultur).",
    fr:"Sara s'intéresse plus au sport qu'à la culture (interessiert sich mehr für Sport als für Kultur), mais elle va au théâtre aussi souvent qu'elle le peut (oft sie kann ins Theater), et essaie de consacrer plus de temps à la culture (mehr Zeit für die Kultur).",

    tr:"Sara kültürden çok spora ilgi duyuyor (interessiert sich mehr für Sport als für Kultur), ancak mümkün olduğunca sık tiyatroya gidiyor (oft sie kann ins Theater) ve kültüre daha fazla zaman ayırmaya çalışıyor (mehr Zeit für die Kultur).",
    vi:"Sara quan tâm đến thể thao hơn văn hóa (interessiert sich mehr für Sport als für Kultur), nhưng cô ấy đến nhà hát thường xuyên nhất có thể (oft sie kann ins Theater), và cố gắng dành nhiều thời gian hơn cho văn hóa (mehr Zeit für die Kultur).",
    uk:"Сара більше цікавиться спортом, ніж культурою (interessiert sich mehr für Sport als für Kultur), але вона ходить до театру так часто, як може (oft sie kann ins Theater), і намагається приділяти більше часу культурі (mehr Zeit für die Kultur).",
    es:"A Sara le interesa más el deporte que la cultura (interessiert sich mehr für Sport als für Kultur), pero va al teatro siempre que puede (oft sie kann ins Theater) e intenta dedicar más tiempo a la cultura (mehr Zeit für die Kultur).",
    pt:"Sara se interessa mais por esportes do que por cultura (interessiert sich mehr für Sport als für Kultur), mas vai ao teatro sempre que pode (oft sie kann ins Theater) e tenta dedicar mais tempo à cultura (mehr Zeit für die Kultur).",
    zh:"萨拉对体育的兴趣胜过文化（interessiert sich mehr für Sport als für Kultur），但她尽可能经常去看戏（oft sie kann ins Theater），并努力为文化投入更多时间（mehr Zeit für die Kultur）。",
    ru:"Сара больше интересуется спортом, чем культурой (interessiert sich mehr für Sport als für Kultur), но она ходит в театр так часто, как может (oft sie kann ins Theater), и старается уделять больше времени культуре (mehr Zeit für die Kultur)."

  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Verstehen. Teil 1. Nummer 41. Sport spielt eine viel größere Rolle in meinem Leben als Kultur. Nummer 42. Sobald sich die Gelegenheit ergibt, besuche ich eine Theateraufführung. Nummer 43. Ehrlich gesagt kann ich mit moderner Musik wenig anfangen. Nummer 44. Kunstausstellungen besuche ich nur selten. Nummer 45. Ich bedauere es sehr, dass ich nicht mehr Zeit für kulturelle Erlebnisse habe.",
  story:{
    ar:"سارة مهتمة بالرياضة أكثر من الثقافة (interessiert sich mehr für Sport als für Kultur)، ولكن كتقدر تمشي للمسرح بزاف ديال المرات (oft sie kann ins Theater)، وكتحاول تخصص وقت أكثر للثقافة (mehr Zeit für die Kultur).",

    eg:"سارة مهتمة بالرياضة أكتر من الثقافة (interessiert sich mehr für Sport als für Kultur)، بس بتقدر تروح للمسرح كتير (oft sie kann ins Theater)، وبت حاول تخصص وقت أكتر للثقافة (mehr Zeit für die Kultur).",
    en:"Sara is more interested in sports than culture (interessiert sich mehr für Sport als für Kultur), but she goes to the theater as often as she can (oft sie kann ins Theater), and tries to dedicate more time to culture (mehr Zeit für die Kultur).",
    fr:"Sara s'intéresse plus au sport qu'à la culture (interessiert sich mehr für Sport als für Kultur), mais elle va au théâtre aussi souvent qu'elle le peut (oft sie kann ins Theater), et essaie de consacrer plus de temps à la culture (mehr Zeit für die Kultur).",
    hi:"सारा संस्कृति से ज्यादा खेलों में रुचि रखती हैं (interessiert sich mehr für Sport als für Kultur), लेकिन वह जितना हो सके थिएटर जाती हैं (oft sie kann ins Theater), और संस्कृति के लिए अधिक समय देने की कोशिश करती हैं (mehr Zeit für die Kultur)।",
    tr:"Sara kültürden çok spora ilgi duyuyor (interessiert sich mehr für Sport als für Kultur), ancak mümkün olduğunca sık tiyatroya gidiyor (oft sie kann ins Theater) ve kültüre daha fazla zaman ayırmaya çalışıyor (mehr Zeit für die Kultur).",
    vi:"Sara quan tâm đến thể thao hơn văn hóa (interessiert sich mehr für Sport als für Kultur), nhưng cô ấy đến nhà hát thường xuyên nhất có thể (oft sie kann ins Theater), và cố gắng dành nhiều thời gian hơn cho văn hóa (mehr Zeit für die Kultur).",
    uk:"Сара більше цікавиться спортом, ніж культурою (interessiert sich mehr für Sport als für Kultur), але вона ходить до театру так часто, як може (oft sie kann ins Theater), і намагається приділяти більше часу культурі (mehr Zeit für die Kultur).",
    es:"A Sara le interesa más el deporte que la cultura (interessiert sich mehr für Sport als für Kultur), pero va al teatro siempre que puede (oft sie kann ins Theater) e intenta dedicar más tiempo a la cultura (mehr Zeit für die Kultur).",
    pt:"Sara se interessa mais por esportes do que por cultura (interessiert sich mehr für Sport als für Kultur), mas vai ao teatro sempre que pode (oft sie kann ins Theater) e tenta dedicar mais tempo à cultura (mehr Zeit für die Kultur).",
    zh:"萨拉对体育的兴趣胜过文化（interessiert sich mehr für Sport als für Kultur），但她尽可能经常去看戏（oft sie kann ins Theater），并努力为文化投入更多时间（mehr Zeit für die Kultur）。",
    ru:"Сара больше интересуется спортом, чем культурой (interessiert sich mehr für Sport als für Kultur), но она ходит в театр так часто, как может (oft sie kann ins Theater), и старается уделять больше времени культуре (mehr Zeit für die Kultur)."
  },

    { n:3, c:"F", de:"Der Sprecher hört besonders gern moderne Musik.", ar:"المتحدث يحب سماع الموسيقى الحديثة جداً.", ma:"المتحدث كيحب يسمع الموسيقى الحديثة بزاف.", eg:"المتحدث بيحب يسمع الموسيقى الحديثة جداً.", en:"The speaker particularly likes listening to modern music.", fr:"L'orateur aime particulièrement écouter de la musique moderne.", hi:"वक्ता विशेष रूप से आधुनिक संगीत सुनना पसंद करता है।", tr:"Konuşmacı özellikle modern müzik dinlemeyi seviyor.", vi:"Người nói đặc biệt thích nghe nhạc hiện đại.", uk:"Мовець особливо любить слухати сучасну музику.", es:"Al orador le gusta especialmente escuchar música moderna.", pt:"O orador gosta particularmente de ouvir música moderna.", zh:"说话者特别喜欢听现代音乐。", ru:"Говорящий особенно любит слушать современную музыку." },
    { n:4, c:"F", de:"Die Sprecherin geht oft in Kunstausstellungen.", ar:"المتحدثة تذهب كثيراً إلى معارض الفن.", ma:"المتحدثة كتمشي بزاف لمعارض الفن.", eg:"المتحدثة بتروح كتير لمعارض الفن.", en:"The speaker often goes to art exhibitions.", fr:"L'oratrice va souvent à des expositions d'art.", hi:"वक्ता अक्सर कला प्रदर्शनियों में जाती है।", tr:"Konuşmacı sık sık sanat sergilerine gidiyor.", vi:"Người nói thường đến các triển lãm nghệ thuật.", uk:"Мовець часто ходить на художні виставки.", es:"La oradora va a menudo a exposiciones de arte.", pt:"A oradora vai frequentemente a exposições de arte.", zh:"说话者经常去艺术展览。", ru:"Говорящий часто ходит на художественные выставки." },
    { n:5, c:"R", de:"Die Sprecherin hätte gerne mehr Zeit für die Kultur.", ar:"المتحدثة تود الحصول على المزيد من الوقت للثقافة.", ma:"المتحدثة كتود تحصل على وقت كثر للثقافة.", eg:"المتحدثة بتتمنى يكون عندها وقت أكتر للثقافة.", en:"The speaker would like to have more time for culture.", fr:"L'oratrice aimerait avoir plus de temps pour la culture.", hi:"वक्ता संस्कृति के लिए अधिक समय चाहती है।", tr:"Konuşmacı kültür için daha fazla zaman istiyor.", vi:"Người nói muốn có nhiều thời gian hơn cho văn hóa.", uk:"Мовець хотів би мати більше часу для культури.", es:"A la oradora le gustaría tener más tiempo para la cultura.", pt:"A oradora gostaria de ter mais tempo para a cultura.", zh:"说话者希望有更多时间用于文化。", ru:"Говорящий хотел бы иметь больше времени для культуры." }

  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hörverstehen. Teil 1. Nummer 41. Ich finde Busfahren ehrlich gesagt nicht so gut. Nummer 42. Zu Fuß zur Arbeit gehen? Nein, das mache ich fast nie. Nummer 43. Meine Frau nimmt jeden Morgen das Auto zur Arbeit. Nummer 44. Ich fahre jeden Tag mit meinem Motorrad zur Arbeit. Nummer 45. Mit dem Fahrrad zur Arbeit fahre ich eigentlich nie.",
  story:{
    ar:"مراتو ديما عندها الطوموبيل (seine Frau immer das Auto hat)، وهاد الشي علاش هو كيمشي للخدمة بالموتور ديالها (mit ihrem Motorrad zur Arbeit).",
    ma:"مراتو ديما عندها الطوموبيل (seine Frau immer das Auto hat)، وهاد الشي علاش هو كيمشي للخدمة بالموتور ديالها (mit ihrem Motorrad zur Arbeit).",
    eg:"مراته دايماً عندها العربية (seine Frau immer das Auto hat)، وعشان كده هو بيروح الشغل بالموتوسيكل بتاعها (mit ihrem Motorrad zur Arbeit).",
    en:"His wife always has the car (seine Frau immer das Auto hat), and that's why he rides to work on her motorcycle (mit ihrem Motorrad zur Arbeit).",
    fr:"Sa femme a toujours la voiture (seine Frau immer das Auto hat), et c'est pourquoi il va au travail avec sa moto à elle (mit ihrem Motorrad zur Arbeit).",
    hi:"उसकी पत्नी के पास हमेशा कार रहती है (seine Frau immer das Auto hat), और इसलिए वह उसकी मोटरसाइकिल से काम पर जाता है (mit ihrem Motorrad zur Arbeit)।",
    tr:"Karısının her zaman arabası var (seine Frau immer das Auto hat) ve bu yüzden işe onun motosikletiyle gidiyor (mit ihrem Motorrad zur Arbeit).",
    vi:"Vợ anh ấy luôn có xe hơi (seine Frau immer das Auto hat), và đó là lý do tại sao anh ấy đi làm bằng xe máy của cô ấy (mit ihrem Motorrad zur Arbeit).",
    uk:"У його дружини завжди є машина (seine Frau immer das Auto hat), і саме тому він їздить на роботу на її мотоциклі (mit ihrem Motorrad zur Arbeit).",
    es:"Su esposa siempre tiene el coche (seine Frau immer das Auto hat), y por eso él va al trabajo en la moto de ella (mit ihrem Motorrad zur Arbeit).",
    pt:"A esposa dele sempre tem o carro (seine Frau immer das Auto hat), e é por isso que ele vai ao trabalho com a moto dela (mit ihrem Motorrad zur Arbeit).",
    zh:"他的妻子总是有车（seine Frau immer das Auto hat），所以他骑她的摩托车上班（mit ihrem Motorrad zur Arbeit）。",
    ru:"У его жены всегда есть машина (seine Frau immer das Auto hat), и поэтому он ездит на работу на её мотоцикле (mit ihrem Motorrad zur Arbeit)."

    { n:2, c:"R", de:"Die Sprecherin geht gern zu Fuß.", ar:"المتحدثة تحب المشي على قدميها.", ma:"المتحدثة كتحب تمشي على رجليها.", eg:"المتحدثة بتحب تمشي على رجليها.", en:"The speaker likes walking.", fr:"L'oratrice aime marcher.", hi:"वक्ता पैदल चलना पसंद करती है।", tr:"Konuşmacı yürümeyi seviyor.", vi:"Người nói thích đi bộ.", uk:"Мовець любить ходити пішки.", es:"A la oradora le gusta caminar.", pt:"A oradora gosta de caminhar.", zh:"说话者喜欢步行。", ru:"Говорящий любит ходить пешком." },
    { n:3, c:"R", de:"Der Sprecher findet es in Ordnung, dass seine Frau immer das Auto hat.", ar:"يرى المتحدث أنه من الطبيعي أن تكون السيارة دائماً مع زوجته.", ma:"المتحدث كيشوف أنه عادي أن الطوموبيل تكون ديما مع مراتو.", eg:"المتحدث شايف إنه عادي إن العربية دايماً مع مراته.", en:"The speaker thinks it's fine that his wife always has the car.", fr:"L'orateur trouve normal que sa femme ait toujours la voiture.", hi:"वक्ता को लगता है कि यह ठीक है कि उसकी पत्नी के पास हमेशा कार रहती है।", tr:"Konuşmacı karısının her zaman arabaya sahip olmasını normal buluyor.", vi:"Người nói thấy ổn khi vợ anh ấy luôn có xe hơi.", uk:"Мовець вважає нормальним, що його дружина завжди має машину.", es:"El orador considera normal que su esposa siempre tenga el coche.", pt:"O orador acha normal que a esposa dele sempre tenha o carro.", zh:"说话者认为妻子总是有车是正常的。", ru:"Говорящий считает нормальным, что у его жены всегда есть машина." },
    { n:4, c:"F", de:"Die Sprecherin fährt jeden Tag mit ihrem Motorrad zur Arbeit.", ar:"المتحدثة تقود دراجتها النارية إلى العمل كل يوم.", ma:"المتحدثة كتمشي كل نهار للخدمة بالموتور ديالها.", eg:"المتحدثة بتروح كل يوم الشغل بالموتوسيكل بتاعها.", en:"The speaker rides her motorcycle to work every day.", fr:"L'oratrice va au travail à moto tous les jours.", hi:"वक्ता हर दिन अपनी मोटरसाइकिल से काम पर जाती है।", tr:"Konuşmacı her gün motosikletiyle işe gidiyor.", vi:"Người nói đi xe máy đến chỗ làm mỗi ngày.", uk:"Мовець щодня їздить на роботу на своєму мотоциклі.", es:"La oradora va al trabajo en su moto todos los días.", pt:"A oradora vai ao trabalho na sua moto todos os dias.", zh:"说话者每天骑摩托车上班。", ru:"Говорящий каждый день ездит на работу на своем мотоцикле." },
    { n:5, c:"F", de:"Die Sprecherin fährt immer mit dem Fahrrad zur Arbeit.", ar:"المتحدثة تركب الدراجة إلى العمل دائماً.", ma:"المتحدثة كتمشي ديما للخدمة بالبيسكليت.", eg:"المتحدثة بتروح دايماً الشغل بالعجلة.", en:"The speaker always bikes to work.", fr:"L'oratrice va toujours au travail à vélo.", hi:"वक्ता हमेशा साइकिल से काम पर जाती है।", tr:"Konuşmacı her zaman bisikletle işe gidiyor.", vi:"Người nói luôn đi xe đạp đi làm.", uk:"Мовець завжди їздить на роботу велосипедом.", es:"La oradora siempre va al trabajo en bicicleta.", pt:"A oradora sempre vai ao trabalho de bicicleta.", zh:"说话者总是骑自行车上班。", ru:"Говорящий всегда ездит на работу на велосипеде." }

{
  id:"h19",
  title:{
    ar:"اللحم", ma:"اللحم", eg:"اللحمة",
    en:"Meat", fr:"Viande", hi:"मांस",
    tr:"Et", vi:"Thịt", uk:"М'ясо",
    es:"Carne", pt:"Carne", zh:"肉类", ru:"Мясо"
  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"سارة ولات ما كتاكلش اللحم بزاف (isst nicht mehr so viel Fleisch)، وكتفضل تشري المواد الغذائية من السوبرماركت حيث المواد الغذائية فالسوبرماركيت مراقَبة (Lebensmittel in den Supermärkten kontrolliert). ولكن كتحب حتى الأجواء ديال السوق الأسبوعي (Atmosphäre auf dem Wochenmarkt)، وكتحاول ما تصرفش الفلوس على الحوايج اللي ماشي مهمة (Geld für unwichtige Dinge ausgeben).",
    ma:"سارة ولات ما كتاكلش اللحم بزاف (isst nicht mehr so viel Fleisch)، وكتفضل تشري المواد الغذائية من السوبرماركت حيث المواد الغذائية فالسوبرماركيت مراقَبة (Lebensmittel in den Supermärkten kontrolliert). ولكن كتحب حتى الأجواء ديال السوق الأسبوعي (Atmosphäre auf dem Wochenmarkt)، وكتحاول ما تصرفش الفلوس على الحوايج اللي ماشي مهمة (Geld für unwichtige Dinge ausgeben).",
    eg:"سارة بقت مش بتاكل اللحمة كتير (isst nicht mehr so viel Fleisch)، وبتفضل تشتري المواد الغذائية من السوبرماركت عشان المواد الغذائية في السوبرماركت مراقبة (Lebensmittel in den Supermärkten kontrolliert). بس بتحب كمان جو السوق الأسبوعي (Atmosphäre auf dem Wochenmarkt)، وبتحاول مش تصرف الفلوس على حاجات مش مهمة (Geld für unwichtige Dinge ausgeben).",
    en:"Sara no longer eats much meat (isst nicht mehr so viel Fleisch), and prefers buying groceries at the supermarket because the food there is controlled (Lebensmittel in den Supermärkten kontrolliert). But she also loves the atmosphere at the weekly market (Atmosphäre auf dem Wochenmarkt), and tries not to spend money on unimportant things (Geld für unwichtige Dinge ausgeben).",
    fr:"Sara ne mange plus beaucoup de viande (isst nicht mehr so viel Fleisch) et préfère acheter ses courses au supermarché car les aliments y sont contrôlés (Lebensmittel in den Supermärkten kontrolliert). Mais elle aime aussi l'ambiance du marché hebdomadaire (Atmosphäre auf dem Wochenmarkt) et essaie de ne pas dépenser d'argent pour des choses sans importance (Geld für unwichtige Dinge ausgeben).",
    hi:"सारा अब ज्यादा मांस नहीं खाती हैं (isst nicht mehr so viel Fleisch), और सुपरमार्केट में किराने का सामान खरीदना पसंद करती हैं क्योंकि वहां खाना नियंत्रित होता है (Lebensmittel in den Supermärkten kontrolliert)। लेकिन उन्हें साप्ताहिक बाजार का माहौल भी पसंद है (Atmosphäre auf dem Wochenmarkt), और वे अनावश्यक चीजों पर पैसा खर्च न करने की कोशिश करती हैं (Geld für unwichtige Dinge ausgeben)।",
    tr:"Sara artık fazla et yemiyor (isst nicht mehr so viel Fleisch) ve market alışverişini süpermarketten yapmayı tercih ediyor çünkü oradaki gıdalar denetleniyor (Lebensmittel in den Supermärkten kontrolliert). Ancak haftalık pazarın atmosferini de seviyor (Atmosphäre auf dem Wochenmarkt) ve gereksiz şeylere para harcamamaya çalışıyor (Geld für unwichtige Dinge ausgeben).",
    vi:"Sara không còn ăn nhiều thịt nữa (isst nicht mehr so viel Fleisch), và thích mua thực phẩm ở siêu thị vì thực phẩm ở đó được kiểm soát (Lebensmittel in den Supermärkten kontrolliert). Nhưng cô cũng thích không khí của chợ phiên (Atmosphäre auf dem Wochenmarkt), và cố gắng không tiêu tiền vào những thứ không quan trọng (Geld für unwichtige Dinge ausgeben).",
    uk:"Сара більше не їсть багато м'яса (isst nicht mehr so viel Fleisch) і віддає перевагу покупкам у супермаркеті, оскільки там продукти контролюються (Lebensmittel in den Supermärkten kontrolliert). Але їй також подобається атмосфера на щотижневому ринку (Atmosphäre auf dem Wochenmarkt), і вона намагається не витрачати гроші на неважливі речі (Geld für unwichtige Dinge ausgeben).",
    es:"Sara ya no come mucha carne (isst nicht mehr so viel Fleisch) y prefiere comprar en el supermercado porque los alimentos allí están controlados (Lebensmittel in den Supermärkten kontrolliert). Pero también le encanta el ambiente del mercado semanal (Atmosphäre auf dem Wochenmarkt) e intenta no gastar dinero en cosas sin importancia (Geld für unwichtige Dinge ausgeben).",
    pt:"A Sara já não come muita carne (isst nicht mehr so viel Fleisch) e prefere comprar no supermercado porque os alimentos lá são controlados (Lebensmittel in den Supermärkten kontrolliert). Mas também adora o ambiente do mercado semanal (Atmosphäre auf dem Wochenmarkt) e tenta não gastar dinheiro em coisas sem importância (Geld für unwichtige Dinge ausgeben).",
    zh:"萨拉不再吃很多肉了（isst nicht mehr so viel Fleisch），她更喜欢在超市购物，因为那里的食品受到监管（Lebensmittel in den Supermärkten kontrolliert）。但她也喜欢每周集市的气氛（Atmosphäre auf dem Wochenmarkt），尽量不把钱花在不重要的事情上（Geld für unwichtige Dinge ausgeben）。",
    ru:"Сара больше не ест много мяса (isst nicht mehr so viel Fleisch) и предпочитает покупать продукты в супермаркете, потому что там продукты контролируются (Lebensmittel in den Supermärkten kontrolliert). Но ей также нравится атмосфера на еженедельном рынке (Atmosphäre auf dem Wochenmarkt), и она старается не тратить деньги на неважные вещи (Geld für unwichtige Dinge ausgeben)."
  },

    { n:2, c:"R", de:"Die Sprecherin ist überzeugt, dass die Lebensmittel in den Supermärkten kontrolliert werden.", ar:"المتحدثة مقتنعة بأن المواد الغذائية في السوبرماركت يتم مراقبتها.", ma:"المتحدثة مقتنعة بلي الماكلة فالسوبرماركتي مراقبة.", eg:"المتحدثة مقتنعة إن الأكل في السوبرماركت بيتفتش عليه.", en:"The speaker is convinced that food in supermarkets is controlled.", fr:"L'oratrice est convaincue que les aliments dans les supermarchés sont contrôlés.", hi:"वक्ता आश्वस्त है कि सुपरमार्केट में खाद्य पदार्थ नियंत्रित होते हैं।", tr:"Konuşmacı süpermarketlerdeki gıdaların denetlendiğine inanıyor.", vi:"Người nói tin rằng thực phẩm trong siêu thị được kiểm soát.", uk:"Мовець переконаний, що продукти в супермаркетах контролюються.", es:"La oradora está convencida de que los alimentos en los supermercados están controlados.", pt:"A oradora está convencida de que os alimentos nos supermercados são controlados.", zh:"说话者坚信超市里的食品受到监管。", ru:"Говорящий убежден, что продукты в супермаркетах контролируются." },
    { n:3, c:"F", de:"Die Sprecherin hat Angst vor Krankheiten, weil die Lebensmittel so schlecht sind.", ar:"المتحدثة تخاف من الأمراض لأن المواد الغذائية سيئة جداً.", ma:"المتحدثة كتخاف من الأمراض حيت الماكلة خايبة بزاف.", eg:"المتحدثة خايفة من الأمراض عشان الأكل وحش جداً.", en:"The speaker is afraid of diseases because the food is so bad.", fr:"L'oratrice a peur des maladies parce que la nourriture est si mauvaise.", hi:"वक्ता को बीमारियों का डर है क्योंकि खाना बहुत खराब है।", tr:"Konuşmacı gıdalar çok kötü olduğu için hastalıklardan korkuyor.", vi:"Người nói sợ bệnh tật vì thực phẩm quá tệ.", uk:"Мовець боїться хвороб, бо продукти дуже погані.", es:"La oradora tiene miedo a las enfermedades porque la comida es muy mala.", pt:"A oradora tem medo de doenças porque a comida é muito má.", zh:"说话者因为食物太差而害怕生病。", ru:"Говорящий боится болезней, потому что продукты очень плохие." },

    { n:5, c:"R", de:"Der Sprecher findet, dass die meisten Menschen zu viel Geld für unwichtige Dinge ausgeben.", ar:"يرى المتحدث أن معظم الناس ينفقون الكثير من المال على أشياء غير مهمة.", ma:"المتحدث كيشوف أن أغلب الناس كيصرفو فلوس بزاف على حوايج ماشي مهمة.", eg:"المتحدث شايف إن أغلب الناس بيصرفوا فلوس كتير على حاجات مش مهمة.", en:"The speaker thinks most people spend too much money on unimportant things.", fr:"L'orateur pense que la plupart des gens dépensent trop d'argent pour des choses sans importance.", hi:"वक्ता सोचता है कि ज्यादातर लोग अनावश्यक चीजों पर बहुत ज्यादा पैसा खर्च करते हैं।", tr:"Konuşmacı çoğu insanın gereksiz şeylere çok fazla para harcadığını düşünüyor.", vi:"Người nói nghĩ rằng hầu hết mọi người tiêu quá nhiều tiền vào những thứ không quan trọng.", uk:"Мовець вважає, що більшість людей витрачають занадто багато грошей на неважливі речі.", es:"El orador piensa que la mayoría de la gente gasta demasiado dinero en cosas sin importancia.", pt:"O orador pensa que a maioria das pessoas gasta demasiado dinheiro em coisas sem importância.", zh:"说话者认为大多数人把太多钱花在不重要的事情上。", ru:"Говорящий считает, что большинство людей тратят слишком много денег на неважные вещи." }

{
  id:"h20",
  title:{
    ar:"الرأي", ma:"الرأي", eg:"الرأي",
    en:"Opinion", fr:"Opinion", hi:"राय",

  level:"B1", sub:"Teile 1", type:"horen",
  audio:"Hör, verstehen. Teil 1. Nummer 41. Ich arbeite sehr gern im Büro. Nummer 42. Ich bin alleinerziehend und muss arbeiten. Nummer 43. Ich finde es nicht gut, wenn beide Eltern arbeiten müssen. Nummer 44. Meiner Meinung nach sollten kleine Kinder möglichst von ihrer Mutter betreut werden. Nummer 45. Seitdem mein Kind in der Kita ist, läuft alles perfekt.",
  story:{
    ar:"فهاد العائلة إلا ما خدموش بجوج الوالدين، الفلوس ما غاديش تكفي (sonst das Geld nicht reicht)، وداكشي علاش الوالدين بجوج خاصهم يخدمو (beide Eltern arbeiten müssen)، ولكن فالنفس الوقت كيبغيو الأطفال تهتم بيهم الأم ديالهم بنفسها (Kinder von der eigenen Mutter betreut werden).",
    ma:"فهاد العائلة إلا ما خدموش بجوج الوالدين، الفلوس ما غاديش تكفي (sonst das Geld nicht reicht)، وداكشي علاش الوالدين بجوج خاصهم يخدمو (beide Eltern arbeiten müssen)، ولكن فالنفس الوقت كيبغيو الأطفال تهتم بيهم الأم ديالهم بنفسها (Kinder von der eigenen Mutter betreut werden).",
    eg:"في العيلة دي، لو ما اشتغلوش الوالدين الاتنين، الفلوس مش هتكفي (sonst das Geld nicht reicht)، وعشان كده الوالدين لازم يشتغلوا (beide Eltern arbeiten müssen)، بس في نفس الوقت عايزين الأطفال تهتم بيهم أمهم بنفسها (Kinder von der eigenen Mutter betreut werden).",
    en:"In this family, if both parents don't work, the money won't be enough (sonst das Geld nicht reicht), which is why both parents have to work (beide Eltern arbeiten müssen), but at the same time they want the children to be looked after by their own mother (Kinder von der eigenen Mutter betreut werden).",
    fr:"Dans cette famille, si les deux parents ne travaillent pas, l'argent ne suffira pas (sonst das Geld nicht reicht), c'est pourquoi les deux parents doivent travailler (beide Eltern arbeiten müssen), mais en même temps ils veulent que les enfants soient gardés par leur propre mère (Kinder von der eigenen Mutter betreut werden).",
    hi:"इस परिवार में, अगर दोनों माता-पिता काम नहीं करते, तो पैसा पर्याप्त नहीं होगा (sonst das Geld nicht reicht), इसलिए दोनों माता-पिता को काम करना पड़ता है (beide Eltern arbeiten müssen), लेकिन साथ ही वे चाहते हैं कि बच्चों की देखभाल उनकी अपनी माँ करे (Kinder von der eigenen Mutter betreut werden)।",
    tr:"Bu ailede, ebeveynlerin ikisi de çalışmazsa para yetmez (sonst das Geld nicht reicht), bu yüzden her iki ebeveynin de çalışması gerekir (beide Eltern arbeiten müssen), ancak aynı zamanda çocuklara kendi annelerinin bakmasını istiyorlar (Kinder von der eigenen Mutter betreut werden).",
    vi:"Trong gia đình này, nếu cả bố và mẹ đều không đi làm thì sẽ không đủ tiền (sonst das Geld nicht reicht), đó là lý do tại sao cả hai bố mẹ đều phải đi làm (beide Eltern arbeiten müssen), nhưng đồng thời họ muốn con cái được chính mẹ chúng chăm sóc (Kinder von der eigenen Mutter betreut werden).",
    uk:"У цій родині, якщо обоє батьків не працюють, грошей не вистачить (sonst das Geld nicht reicht), тому обом батькам доводиться працювати (beide Eltern arbeiten müssen), але водночас вони хочуть, щоб за дітьми доглядала їхня власна мати (Kinder von der eigenen Mutter betreut werden).",
    es:"En esta familia, si ambos padres no trabajan, el dinero no será suficiente (sonst das Geld nicht reicht), por eso ambos padres tienen que trabajar (beide Eltern arbeiten müssen), pero al mismo tiempo quieren que los niños sean cuidados por su propia madre (Kinder von der eigenen Mutter betreut werden).",
    pt:"Nesta família, se ambos os pais não trabalharem, o dinheiro não será suficiente (sonst das Geld nicht reicht), por isso ambos os pais têm de trabalhar (beide Eltern arbeiten müssen), mas ao mesmo tempo querem que as crianças sejam cuidadas pela própria mãe (Kinder von der eigenen Mutter betreut werden).",
    zh:"在这个家庭里，如果父母双方都不工作，钱就不够用（sonst das Geld nicht reicht），这就是为什么父母双方都必须工作（beide Eltern arbeiten müssen），但同时他们希望孩子由自己的母亲照顾（Kinder von der eigenen Mutter betreut werden）。",
    ru:"В этой семье, если оба родителя не работают, денег не хватит (sonst das Geld nicht reicht), поэтому оба родителя вынуждены работать (beide Eltern arbeiten müssen), но в то же время они хотят, чтобы за детьми ухаживала их собственная мать (Kinder von der eigenen Mutter betreut werden)."
  },
  items:[

    { n:2, c:"R", de:"Die Sprecherin muss arbeiten, weil sonst das Geld nicht reicht.", ar:"المتحدثة يجب أن تعمل لأن المال لن يكفي بدون ذلك.", ma:"المتحدثة خاصها تخدم حيت الفلوس ما غاديش تكفي بلاها.", eg:"المتحدثة لازم تشتغل عشان الفلوس مش هتكفي من غير كده.", en:"The speaker has to work, otherwise the money won't be enough.", fr:"L'oratrice doit travailler, sinon l'argent ne suffira pas.", hi:"वक्ता को काम करना पड़ता है, अन्यथा पैसा पर्याप्त नहीं होगा।", tr:"Konuşmacı çalışmak zorunda, aksi halde para yetmez.", vi:"Người nói phải đi làm, nếu không sẽ không đủ tiền.", uk:"Мовець змушений працювати, інакше грошей не вистачить.", es:"La oradora tiene que trabajar, de lo contrario el dinero no será suficiente.", pt:"A oradora tem de trabalhar, senão o dinheiro não será suficiente.", zh:"说话者必须工作，否则钱不够用。", ru:"Говорящий вынужден работать, иначе денег не хватит." },
    { n:3, c:"R", de:"Der Sprecher findet es nicht gut, wenn beide Eltern arbeiten müssen.", ar:"يرى المتحدث أنه ليس جيداً إذا اضطر كلا الوالدين للعمل.", ma:"المتحدث كيشوف أنه ماشي مزيان إلا كان خاص الوالدين بجوج يخدمو.", eg:"المتحدث شايف إنه مش كويس لما الوالدين الاتنين لازم يشتغلوا.", en:"The speaker doesn't think it's good when both parents have to work.", fr:"L'orateur ne trouve pas bien que les deux parents doivent travailler.", hi:"वक्ता को यह अच्छा नहीं लगता जब दोनों माता-पिता को काम करना पड़ता है।", tr:"Konuşmacı her iki ebeveynin de çalışmak zorunda olmasını iyi bulmuyor.", vi:"Người nói không thấy tốt khi cả hai bố mẹ đều phải đi làm.", uk:"Мовець не вважає добре, коли обидва батьки змушені працювати.", es:"El orador no cree que sea bueno que ambos padres tengan que trabajar.", pt:"O orador não acha bom quando ambos os pais têm de trabalhar.", zh:"说话者认为父母双方都必须工作不好。", ru:"Говорящий не считает хорошим, когда оба родителя вынуждены работать." },
    { n:4, c:"R", de:"Die Sprecherin ist der Meinung, dass Kinder von der eigenen Mutter betreut werden sollten.", ar:"ترى المتحدثة أن الأطفال يجب أن تعتني بهم أمهم.", ma:"المتحدثة كتشوف أن الأطفال خاص الأم ديالهم تعتني بيهم.", eg:"المتحدثة شايفة إن الأطفال لازم أمهم تهتم بيهم.", en:"The speaker believes that children should be cared for by their own mother.", fr:"L'oratrice estime que les enfants devraient être gardés par leur propre mère.", hi:"वक्ता का मानना है कि बच्चों की देखभाल उनकी अपनी माँ को करनी चाहिए।", tr:"Konuşmacı çocuklara kendi annelerinin bakması gerektiğine inanıyor.", vi:"Người nói tin rằng con cái nên được chính mẹ chăm sóc.", uk:"Мовець вважає, що за дітьми має доглядати їхня власна мати.", es:"La oradora cree que los niños deberían ser cuidados por su propia madre.", pt:"A oradora acredita que as crianças devem ser cuidadas pela própria mãe.", zh:"说话者认为孩子应该由自己的母亲照顾。", ru:"Говорящий считает, что за детьми должна ухаживать их собственная мать." },
    { n:5, c:"F", de:"Der Sprecher hat trotz Kindertagesstätte manchmal Probleme bei der Arbeit.", ar:"على الرغم من وجود الحضانة، يواجه المتحدث أحياناً مشاكل في العمل.", ma:"رغم أن كاينة الحضانة، المتحدث كيواجه مرات مشاكل فالخدمة.", eg:"رغم إن فيه حضانة، المتحدث أحياناً بيواجه مشاكل في الشغل.", en:"Despite the daycare center, the speaker sometimes has problems at work.", fr:"Malgré la crèche, l'orateur a parfois des problèmes au travail.", hi:"डेकेयर सेंटर के बावजूद, वक्ता को कभी-कभी काम में समस्याएँ होती हैं।", tr:"Kreş olmasına rağmen, konuşmacı bazen işte sorunlar yaşıyor.", vi:"Mặc dù có nhà trẻ, đôi khi người nói vẫn gặp vấn đề trong công việc.", uk:"Незважаючи на дитячий садок, у мовця іноді виникають проблеми на роботі.", es:"A pesar de la guardería, el orador a veces tiene problemas en el trabajo.", pt:"Apesar da creche, o orador às vezes tem problemas no trabalho.", zh:"尽管有托儿所，说话者有时在工作中也会遇到问题。", ru:"Несмотря на детский сад, у говорящего иногда возникают проблемы на работе." }

  audio:null,
  story:{
    ar:"أحمد كيدير تقريباً كلشي بوحدو فالدار (im Haushalt fast alles alleine)، ولكن دابا قرر يقسم الأشغال مع الشريكة ديالو (mit seiner Partnerin die Arbeit) باش ما يبقاش عليه كلشي.",
    ma:"أحمد كيدير تقريباً كلشي بوحدو فالدار (im Haushalt fast alles alleine)، ولكن دابا قرر يقسم الأشغال مع الشريكة ديالو (mit seiner Partnerin die Arbeit) باش ما يبقاش عليه كلشي.",
