  }
  .dark{
    --paper:#0B1120; --card:#1E293B; --text:#F8FAFC; --muted:#94A3B8; --line:#334155;
    --okc:#86EFAC; --okbg:#14532D; --badc:#FCA5A5; --badbg:#7F1D1D;

  }
  html{ font-size:calc(18px * var(--fs)); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background-color:var(--paper); background-image:var(--splash); background-attachment:fixed; color:var(--text); font-family:'Cairo',system-ui,sans-serif; direction:rtl; min-height:100vh; padding-bottom:100px; transition:background .3s,color .3s; }

  .de{ direction:ltr; text-align:left; font-family:system-ui,-apple-system,sans-serif; }
  
  /* Cards & Layout */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 4px 15px rgba(0,0,0,0.02); }
  .header{ position:sticky; top:12px; z-index:30; margin:12px; display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 16px; box-shadow:0 4px 15px rgba(0,0,0,0.03); overflow:hidden; }
  .header::after{ content:""; position:absolute; bottom:0; left:20px; right:20px; height:3px; border-radius:3px 3px 0 0; background:linear-gradient(90deg,#111 33.33%,#DD0000 33.33%,#DD0000 66.66%,#FFCE00 66.66%); opacity:0.8; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{ width:46px; height:46px; border-radius:12px; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  
  /* Buttons & Icons */
  .btnI{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .btnI:active{ background:var(--paper); transform:scale(0.95); }
  .btn{ border-radius:12px; padding:14px 16px; font-weight:800; background:var(--ink); color:var(--gold); width:100%; font-size:1.05em; transition:opacity 0.2s; }
  .btn.ghost{ background:var(--card); color:var(--text); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  
  /* Options (Lesen) */
  .opt{ display:flex; gap:12px; align-items:flex-start; border:2px solid transparent; background:var(--paper); color:var(--text); border-radius:14px; padding:14px; margin-bottom:8px; width:100%; text-align:right; transition:all .2s; font-size:1.05em; }
  .opt.sel{ border-color:var(--gold); background:rgba(245,184,46,.1); }
  .opt.good{ border-color:var(--okc); background:var(--okbg); color:var(--okc); }
  .opt.bad{ border-color:var(--badc); background:var(--badbg); color:var(--badc); }
  .opt.faded{ opacity:.4; }
  .letter{ width:32px; height:32px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0; font-size:1.1em; border:1px solid var(--line); }
  
  /* Feedback */
  .fb{ border-radius:12px; padding:14px; margin-top:10px; font-size:.95em; line-height:1.8; }
  .fb.good{ background:var(--okbg); color:var(--okc); }
  .fb.bad{ background:var(--badbg); color:var(--badc); }
  
  /* Toast */
  .toast{ position:fixed; top:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--gold); padding:10px 20px; border-radius:14px; font-weight:800; z-index:60; font-size:.95em; box-shadow:0 10px 25px rgba(0,0,0,0.2); animation:slideDown .3s; }
  @keyframes slideDown{ from{top:-20px;opacity:0} to{top:100px;opacity:1} }
  
  /* Bottom Nav */
  .nav{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 4px 20px; z-index:40; }
  .nav button{ color:var(--muted); font-size:.8em; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:60px; transition:all 0.2s; }
  .nav button.on{ color:var(--ink); }
  .dark .nav button.on{ color:var(--gold); }
  .nav .ic{ font-size:1.8em; padding:6px 12px; border-radius:12px; transition:background .2s; }
  .nav button.on .ic{ background:rgba(245,184,46,.15); }
  
  /* Overlays & Modals */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; justify-content:center; align-items:center; padding:20px; backdrop-filter:blur(4px); }
  .sheet{ background:var(--card); border:1px solid var(--line); border-radius:24px; padding:24px; width:100%; max-width:440px; max-height:85vh; overflow-y:auto; }
  
  /* Sprach Word Bank */
  .word-bank{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:14px; background:var(--paper); border-radius:14px; border:1px dashed var(--line); }
  .word-btn{ padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:800; font-size:1em; text-align:right; display:flex; gap:10px; align-items:center; }
  .word-btn.used{ opacity:.3; text-decoration:line-through; pointer-events:none; }
  
  /* Splash & Auth */
  .splash-screen{ position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; background:var(--splash), var(--paper); }
  .splash-logo{ width:180px; height:180px; animation:pulse 2s infinite; }

  .auth-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ background:var(--card); padding:32px; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.05); border:1px solid var(--line); width:100%; max-width:420px; }
  .auth-input{ width:100%; padding:16px; margin-bottom:16px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--text); font-family:inherit; outline:none; font-size:1.05em; }
  .auth-input:focus{ border-color:var(--gold); }
  .auth-btn{ width:100%; padding:16px; border-radius:12px; border:none; background:var(--ink); color:var(--gold); font-weight:800; font-size:1.1em; cursor:pointer; margin-bottom:12px; }
  .auth-btn.guest{ background:var(--gold); color:var(--ink); }
  
  /* Lang Grid */
  .lang-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; max-height:300px; overflow-y:auto; padding-right:5px; }
  .lang-btn{ display:flex; align-items:center; gap:10px; padding:12px; border-radius:14px; background:var(--paper); border:2px solid var(--line); color:var(--text); font-weight:800; transition:all 0.2s; }
  .lang-btn.on{ background:rgba(245,184,46,0.15); border-color:var(--gold); }
  
  /* Inline Gaps */
  .inline-gap{ display:inline-flex; align-items:center; justify-content:center; min-width:90px; border-bottom:2px dashed var(--gold); padding:2px 8px; margin:0 6px; cursor:pointer; font-weight:900; vertical-align:middle; background:rgba(245,184,46,0.05); border-radius:6px 6px 0 0; }
  .inline-gap.filled{ border-bottom-style:solid; background:rgba(245,184,46,0.15); color:var(--gold); }
  .sp1-correct{ background:var(--okbg); color:var(--okc); padding:4px 12px; border-radius:6px; font-weight:900; margin:0 4px; border:1px solid var(--okc); }
  .sp1-wrong{ background:var(--badbg); color:var(--badc); text-decoration:line-through; padding:4px 12px; border-radius:6px; font-weight:900; margin:0 4px; border:1px solid var(--badc); }

  /* Hören (Listening) Specific Styles */
  .rf-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
  .rf-circle.sel { border-color: var(--gold); background: rgba(245,184,46,0.1); }
  .rf-circle.good { border-color: var(--okc); background: var(--okbg); }
  .rf-circle.bad { border-color: var(--badc); background: var(--badbg); }
  .rf-circle.sel::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
  .rf-circle.good::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--okc); }
  .rf-circle.bad::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--badc); }
  
  .audio-header { display:flex; align-items:center; gap:10px; font-weight:900; color:var(--okc); margin-bottom:12px; }
  .audio-icon-big { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:var(--okbg); color:var(--okc); }
</style>
</head>

    { de: "Egal ob Hund, Katze oder Maus: Haustiere sind in Deutschland sehr beliebt.", ar: "سواء كان كلباً أو قطة أو فأراً: الحيوانات الأليفة تحظى بشعبية كبيرة في ألمانيا.", ma: "سواء كان كلب ولا قط ولا فار: الحيوانات الأليفة كيعجبو بزاف فألمانيا.", eg: "سواء كلب أو قطة أو فار: الحيوانات الأليفة ليها شعبية كبيرة في ألمانيا.", en: "Whether dog, cat or mouse: pets are very popular in Germany.", fr: "Qu'il s'agisse de chiens, de chats ou de souris : les animaux de compagnie sont très populaires en Allemagne." },
    { de: "In deutschen Haushalten gibt es rund 34 Millionen Haustiere. Besonders Katzen sind sehr beliebt.", ar: "يوجد في الأسر الألمانية حوالي 34 مليون حيوان أليف. القطط تحظى بشعبية خاصة.", ma: "كاين فالدور ديال الألمان حوالي 34 مليون حيوان أليف. القطط كيعجبو بزاف.", eg: "في البيوت الألمانية فيه حوالي 34 مليون حيوان أليف. القطط ليها شعبية خاصة.", en: "There are around 34 million pets in German households. Cats are particularly popular.", fr: "Il y a environ 34 millions d'animaux de compagnie dans les foyers allemands. Les chats sont particulièrement populaires." },
    { de: "Der Hundeexperte Marius Klotz sieht es kritisch: Wichtig sind klare Regeln, die der Hund verstehen kann.", ar: "خبير الكلاب ماريوس كلوتز يرى الأمر بشكل نقدي: المهم هو القواعد الواضحة التي يمكن للكلب فهمها.", ma: "خبير الكلاب ماريوس كلوتز كيشوفها بنقد: المهم هو القواعد الواضحة اللي يقدر الكلب يفهمها.", eg: "خبير الكلاب ماريوس كلوتز شايفها بشكل نقدي: المهم هو القواعد الواضحة اللي الكلب يقدر يفهمها.", en: "Dog expert Marius Klotz sees it critically: Clear rules that the dog can understand are important.", fr: "L'expert canin Marius Klotz est critique : des règles claires que le chien peut comprendre sont importantes." }
  ],

    {n:1, c:"H", de:"Sie verbringen gern viele Stunden im Cafe, wollen aber nicht viel Geld ausgeben.", ar:"تحب قضاء ساعات طويلة في المقهى، ولكنك لا ترغب في إنفاق الكثير من المال.", ma:"كتحب تدوز ساعات فالمقهى، ولكن ما بغيتيش تصرف فلوس بزاف.", eg:"بتحب تقعد ساعات في القهوة، بس مش عايز تصرف فلوس كتير.", en:"You like spending many hours in a cafe but don't want to spend much money.", fr:"Vous aimez passer de nombreuses heures dans un café mais ne voulez pas dépenser beaucoup d'argent."},
    {n:2, c:"G", de:"Sie haben gerade den Beruf gewechselt und brauchen für die neue Aufgabe Grundkenntnisse für die Arbeit am Computer.", ar:"لقد غيرت مهنتك مؤخرًا وتحتاج إلى معرفة أساسية للعمل على الكمبيوتر من أجل المهمة الجديدة.", ma:"بدلتي الخدمة دابا وكتحتاج تعرف أساسيات الكمبيوتر للمهمة الجديدة.", eg:"غيرت شغلك وعايز أساسيات الكمبيوتر عشان المهمة الجديدة.", en:"You have just changed jobs and need basic computer skills for the new task.", fr:"Vous venez de changer de métier et avez besoin de connaissances informatiques de base pour votre nouvelle tâche."},
    {n:3, c:"D", de:"Sie arbeiten in einem Krankenhaus und haben dort häufig mit Patienten aus aller Welt zu tun. Sie möchten für diese Arbeit noch besser qualifiziert sein.", ar:"تعمل في مستشفى وتتعامل غالبًا مع مرضى من جميع أنحاء العالم. ترغب في أن تكون أكثر تأهيلاً لهذه الوظيفة.", ma:"كتخدم فالمستشفى وكتعامل مع مرضى من العالم كامل. بغيتي تكون واجد كثر لهاد الخدمة.", eg:"بتشتغل في مستشفى وبتتعامل مع مرضى من كل حتة. عايز تبقى متأهل أكتر للشغل ده.", en:"You work in a hospital and often deal with patients from all over the world. You want to be better qualified for this work.", fr:"Vous travaillez dans un hôpital et avez souvent affaire à des patients du monde entier. Vous souhaitez être mieux qualifié pour ce travail."},

    {n:5, c:"J", de:"Sie möchten beruflich etwas mit Fremdsprachen machen. Deshalb wollen Sie im Ausland studieren um später vielleicht auch dort zu arbeiten.", ar:"ترغب في العمل في مجال يتعلق باللغات الأجنبية. لذلك تريد الدراسة في الخارج وربما العمل هناك لاحقًا.", ma:"بغيتي تخدم شي حاجة فاللغات. داكشي علاش بغيتي تقرا فالخارج وربما تخدم تما من بعد.", eg:"عايز تشتغل في حاجة ليها علاقة باللغات. عشان كده عايز تدرس بره ويمكن تشتغل هناك بعدين.", en:"You want to work in a field related to foreign languages. That's why you want to study abroad and maybe work there later.", fr:"Vous souhaitez travailler dans un domaine lié aux langues étrangères. C'est pourquoi vous voulez étudier à l'étranger et peut-être y travailler plus tard."},

    {n:8, c:"X", de:"In Ihrer Freizeit möchten Sie sich mit anderen Ländern, fremden Kulturen und Traditionen beschäftigen.", ar:"في وقت فراغك، ترغب في التعرف على بلدان أخرى وثقافات وتقاليد مختلفة.", ma:"فوقت الفراغ ديالك، بغيتي تعرف بلدان وثقافات وتقاليد أخرى.", eg:"في وقت فراغك، عايز تتعرف على بلاد تانية وثقافات وتقاليد مختلفة.", en:"In your free time, you want to deal with other countries, foreign cultures and traditions.", fr:"Pendant votre temps libre, vous souhaitez vous intéresser à d'autres pays, cultures et traditions étrangères."},
    {n:9, c:"F", de:"Die Tochter Ihrer Freunde hat gerade Abitur gemacht und ist nicht sicher, was sie später machen will. Sie braucht Informationen und Beratung.", ar:"ابنة أصدقائك أنهت للتو الثانوية العامة وهي غير متأكدة مما تريد فعله لاحقًا. تحتاج إلى معلومات واستشارة.", ma:"بنت صحابك دازت الباك دابا وما عارفاش شنو بغات دير من بعد. كتحتاج معلومات ونصيحة.", eg:"بنت صحابك خلصت الثانوية العامة ومش متأكدة هتعمل إيه بعدين. محتاجة معلومات ونصيحة.", en:"Your friend's daughter has just graduated from high school and is unsure what she wants to do later. She needs information and advice.", fr:"La fille de vos amis vient d'obtenir son baccalauréat et ne sait pas ce qu'elle veut faire plus tard. Elle a besoin d'informations et de conseils."},

  text: `Schaffhausen, den...\nHallo Isabelle,\nwie geht es dir? Hast du deine Prüfungen geschafft?\nWie du ja weißt, .....(1)..... ich seit zwei Monaten in einem Altersheim .....(2)..... der Nähe von Schaffhausen. Die Arbeit in .....(3)..... Haus gefällt mir gut, obwohl es manchmal auch sehr stressig ist. Besonders schön ist der enge .....(4)..... zu einigen der alten Menschen. Eine Frau, Anna Ringier, mag ich .....(5)..... gern. Sie ist schon 96 Jahre alt und sitzt im Rollstuhl, aber sie ist immer fröhlich. Gestern hat sie mir .....(6)..... ganzes Leben erzählt. Sie hat bis zum 84. Lebensjahr .....(7)..... gearbeitet. Schon als achtjähriges Mädchen musste sie bei einem Bauern arbeiten, .....(8)..... ihre Eltern die neunköpfige Familie nicht ernähren konnten. Später arbeitete Anna als Schneiderin.\nNeben ihrer Arbeit hat Anna .....(9)..... auf eine Sache nie verzichtet: das Bergsteigen! Das war immer ihre große Leidenschaft. Diese Frau ist wirklich sehr beeindruckend!\nAber du .....(10)..... bestimmt auch viel erlebt. Ich würde mich sehr freuen, wenn du mir bald wieder einmal schreibst!\nHerzliche Grüße\ndeine Julie`,

{
  id:"rita-sp1", title:"Rita", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Liebe Catherine,\nich hab's geschafft! Endlich habe ich einen Job bekommen. Wie versprochen möchte ich dir gleich .....(1)..... erzählen. Am Anfang .....(2)..... ich ziemlich enttäuscht, weil ich auf meine vielen Bewerbungsschreiben insgesamt .....(3)..... zwei Antworten bekommen habe. Aber zum Glück hat einer davon .....(4).....: Ich werde nun zwei Nachmittage in der Woche als Babysitterin .....(5)..... einer Familie arbeiten, die zwei Kinder hat. Sie sind 3 und 5 Jahre alt und .....(6)..... sind sehr nett. Wir haben in der .....(7)..... Woche bereits Vieles gemeinsam gemacht, sind in den Zoo und .....(8)..... Kindermuseum gegangen. .....(9)..... kann man eine Stadt gar nicht kennenlernen, und es macht mir viel Spaß!\nFür heute wünsche ich dir alles Gute, schreibe mir bald, wie es dir .....(10)..... .\nLiebe Grüße\nDeine Tanja`,

  text: `Ihre Anzeige in der Frankfurter Rundschau\n\nSehr geehrte Frau Herrmann ,\n\nich habe Ihre Anzeige in der Frankfurter Rundschau vom 5. Oktober gelesen und interessiere mich sehr für die 3-Zimmer-Wohnung.\n\nZurzeit wohne ich noch in Krakau (Polen). Demnächst .....(1)..... ich aber aus beruflichen Gründen mit meinem Sohn (3 Jahre) .....(2)..... Frankfurt umziehen. Deshalb suche ich zum 1. November eine Wohnung, .....(3)..... möglichst zentral gelegen sein sollte. Ihre Wohnung .....(4)..... deshalb genau richtig für uns.\n\nIch hätte jedoch noch einige Fragen zu Ihrer Anzeige: Ist die Wohnung auch für Kleinkinder .....(5).....? Und gibt es in der näheren Umgebung einen Spielplatz, .....(6)..... mein Sohn spielen könnte? Außerdem würde ich .....(7)..... wissen, ob die Haltung von Haustieren in .....(8)..... Wohnung erlaubt ist. .....(9)..... es möglich ist, würden wir nämlich gerne unseren Hund mitbringen.\n\nIch danke Ihnen .....(10)..... jetzt für Ihre Antwort und grüße Sie freundlich.\n\nKASIA KLOC`,

    { de: "Anne und Melanie (beide 6) stehen Erzieherinnen mit Vorschlägen hilfreich zur Seite. Sie sind die Problemlöser im Kindergarten.", ar: "آن وميلاني (كلاهما 6 سنوات) تساعدان المربيات باقتراحات مفيدة.", ma: "آن وميلاني (بجوج عندهم 6 سنين) كيعاونو المربيات بالاقتراحات.", eg: "آن وميلاني (بجوج عندهم 6 سنين) بيساعدوا المربيات بالاقتراحات.", en: "Anne and Melanie (both 6) help educators with suggestions. They are the problem solvers in kindergarten.", fr: "Anne et Melanie (toutes deux 6 ans) aident les éducatrices avec des suggestions." },
    { de: "Im Rahmen dieses Projekts werden in städtischen Kindergärten zwei Wanderstationen mit je drei Multimedia-Computern installiert.", ar: "في إطار هذا المشروع، سيتم تركيب محطتين متنقلتين في رياض الأطفال البلدية.", ma: "فهاد المشروع، غادي يحطو جوج محطات متنقلين فرض الأطفال.", eg: "في المشروع ده، هيتحطوا اتنين محطات متنقلين في الروضات.", en: "As part of this project, two mobile stations will be installed in municipal kindergartens.", fr: "Dans le cadre de ce projet, deux stations mobiles seront installées dans les jardins d'enfants municipaux." },
    { de: "Bevor jedoch die Computer in die Kindergärten kamen, waren die Eltern aufzuklären. Bei manchen Eltern löste das Stichwort Computer akute Ängste aus.", ar: "لكن قبل أن تصل أجهزة الكمبيوتر إلى رياض الأطفال، كان لا بد من توعية الآباء.", ma: "ولكن قبل ما توصل الكمبيوترات لرض الأطفال، كان خاص توعية الوالدين.", eg: "بس قبل ما توصل الكمبيوترات للروضات، كان لازم توعية الأهل.", en: "However, before the computers arrived in the kindergartens, the parents had to be educated.", fr: "Cependant, avant l'arrivée des ordinateurs dans les jardins d'enfants, il fallait informer les parents." },
    { de: "Diese Ängste haben sich inzwischen gelegt und die Erfahrung vor Ort zeigt, dass sie weitgehend überflüssig sind. Die Erzieherinnen achten auch darauf, dass die Kinder nie länger als 15 bis 20 Minuten vor den Computern sitzen, und holen vor allem kreative Software auf den Bildschirm.", ar: "لقد هدأت هذه المخاوف في غضون ذلك، وتظهر التجربة الميدانية أنها زائدة عن الحاجة إلى حد كبير. يحرص المربيات أيضاً على ألا يجلس الأطفال أمام الكمبيوتر لأكثر من 15 إلى 20 دقيقة، ويجلبون برامج إبداعية إلى الشاشة قبل كل شيء.", ma: "هاد المخاوف هدات دابا، والتجربة كتبين بلي هادشي زايد. المربيات كيحرصو بلي الدراري ما يقعدوش كثر من 15 ولا 20 دقيقة قدام الكمبيوتر، وكتجيبو ليهم برامج إبداعية.", eg: "المخاوف دي اتهدت، والتجربة بتقول إن ده مش محتاج. المربيات بيتأكدوا إن العيال ميقعدوش أكتر من 15 لـ 20 دقيقة قدام الكمبيوتر، وبيجيبولهم برامج إبداعية.", en: "These fears have now subsided and experience on site shows that they are largely superfluous. The educators also make sure that the children never sit in front of the computers for longer than 15 to 20 minutes, and above all bring creative software to the screen.", fr: "Ces craintes se sont depuis lors apaisées et l'expérience sur le terrain montre qu'elles sont largement superflues. Les éducatrices veillent également à ce que les enfants ne restent jamais plus de 15 à 20 minutes devant les ordinateurs, et mettent surtout des logiciels créatifs à l'écran." },
    { de: "Das einsame Dämmern vor dem Computer ist wohl ohnehin eher Sache der Erwachsenen – die Kinder spielen immer zu zweit oder zu dritt an der Maschine. Eva Schilling hat beobachtet, dass die Kinder am Computer sehr friedlich miteinander umgehen, sie helfen sich gegenseitig, es gibt wenig Konflikte.", ar: "على أي حال، فإن النعاس الوحيد أمام الكمبيوتر هو بالأحرى من شؤون البالغين - فالأطفال يلعبون دائماً في مجموعات من شخصين أو ثلاثة على الجهاز. لاحظت إيفا شيلينغ أن الأطفال يتعاملون مع بعضهم البعض بسلام شديد على الكمبيوتر، ويساعدون بعضهم البعض، ولا يوجد سوى القليل من الصراعات.", ma: "القعدة بوحدك قدام الكمبيوتر هي حاجة ديال الكبار - الدراري ديما كيلعبو بجوج ولا بثلاثة. إيفا شيلينغ لاحظات بلي الدراري كيتعاملو مزيان مع بعضياتهم قدام الكمبيوتر، كيعاونو بعضياتهم، وما كاينش المشاكل.", eg: "القعدة لوحدك قدام الكمبيوتر دي حاجة بتاعة الكبار - العيال دايماً بيلعبوا اتنين أو تلاتة. إيفا شيلينغ لاحظت إن العيال بيتعاملوا كويس مع بعض قدام الكمبيوتر، بيساعدوا بعض، ومفيش مشاكل.", en: "Lonely brooding in front of the computer is probably more a matter for adults anyway - the children always play in twos or threes on the machine. Eva Schilling has observed that the children treat each other very peacefully on the computer, they help each other, there are few conflicts.", fr: "La rêverie solitaire devant l'ordinateur est de toute façon plutôt l'affaire des adultes - les enfants jouent toujours à deux ou à trois sur la machine. Eva Schilling a observé que les enfants se traitent très paisiblement sur l'ordinateur, ils s'entraident, il y a peu de conflits." }
  ],

    { n:3, c:"R", de:"Der Sprecher findet es schade, dass er im Kindergarten keine Fremdsprache lernen konnte.", ar:"يأسف المتحدث لأنه لم يتمكن من تعلم لغة أجنبية في رياض الأطفال.", ma:"يأسف المتحدث لأنه لم يتمكن من تعلم لغة أجنبية في رياض الأطفال.", eg:"يأسف المتحدث لأنه لم يتمكن من تعلم لغة أجنبية في رياض الأطفال.", en:"The speaker regrets that he couldn't learn a foreign language in kindergarten.", fr:"L'orateur regrette de ne pas avoir pu apprendre une langue étrangère à la maternelle.", story:"بعض الآباء كيشوفو أن الأطفال خاصهم يتعلمو لغة أجنبية من بكري، والأفضل يبداو بها فالمدرسة، ولكن كاين اللي كيشوف أن تعلم لغة أجنبية عندو عيوب بالنسبة لعدد كبير من الأطفال." },
    { n:4, c:"R", de:"Die Sprecherin meint, dass das Fremdsprachenlernen erst in der Schule beginnen sollte.", ar:"ترى المتحدثة أن تعلم اللغات الأجنبية يجب أن يبدأ فقط في المدرسة.", ma:"ترى المتحدثة أن تعلم اللغات الأجنبية يجب أن يبدأ فقط في المدرسة.", eg:"ترى المتحدثة أن تعلم اللغات الأجنبية يجب أن يبدأ فقط في المدرسة.", en:"The speaker thinks that foreign language learning should only start at school.", fr:"L'oratrice pense que l'apprentissage des langues étrangères ne devrait commencer qu'à l'école.", story:"بعض الآباء كيشوفو أن الأطفال خاصهم يتعلمو لغة أجنبية من بكري، والأفضل يبداو بها فالمدرسة، ولكن كاين اللي كيشوف أن تعلم لغة أجنبية عندو عيوب بالنسبة لعدد كبير من الأطفال." },
    { n:5, c:"R", de:"Der Sprecher ist dagegen, dass Kinder schon früh Fremdsprache lernen.", ar:"المتحدث ضد أن يتعلم الأطفال لغة أجنبية في وقت مبكر.", ma:"المتحدث ضد أن يتعلم الأطفال لغة أجنبية في وقت مبكر.", eg:"المتحدث ضد أن يتعلم الأطفال لغة أجنبية في وقت مبكر.", en:"The speaker is against children learning a foreign language early.", fr:"L'orateur est contre le fait que les enfants apprennent une langue étrangère tôt.", story:"بعض الآباء كيشوفو أن الأطفال خاصهم يتعلمو لغة أجنبية من بكري، والأفضل يبداو بها فالمدرسة، ولكن كاين اللي كيشوف أن تعلم لغة أجنبية عندو عيوب بالنسبة لعدد كبير من الأطفال." }
  ]

);
const pointsOf = (ex) => {
  if (ex.type === "matching") return 2.5;
  if (ex.type === "sprach1" || ex.type === "sprach2") return 1.5;
  return 5;
};
const maxOf = (ex) => ex.items.length * pointsOf(ex);

function ExamView({ exam, onBack, onNext, dark, setDark, onSave, userLang }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(null);
  const [toast, setToast] = useState(null);
  const [modalGap, setModalGap] = useState(null);
  const [activeGap, setActiveGap] = useState(null);
  const [showTranslation, setShowTranslation] = useState(false);
  const [showHeader, setShowHeader] = useState(true);
  const [excluded, setExcluded] = useState({});
  const [scrollProgress, setScrollProgress] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [showStory, setShowStory] = useState(false);

  const lastScrollY = React.useRef(0);
  const toastTimer = React.useRef(null);

  useEffect(() => {
    const handleScroll = () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY < 50) setShowHeader(true);
      else if (currentScrollY > lastScrollY.current && currentScrollY > 100) setShowHeader(false);
      lastScrollY.current = currentScrollY;
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (totalScroll > 0) setScrollProgress((currentScrollY / totalScroll) * 100);
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const pts = pointsOf(exam);
  const total = maxOf(exam);
  const answered = Object.keys(ans).length;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  const flash = (m) => {
    setToast(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };

  const optsFor = (it) => {
    if (exam.type === "headings") return exam.options;
    if (exam.type === "mcq") return it.opts;
    if (exam.type === "matching") return [...exam.ads.map(a => ({ k: a.k, de: a.t })), { k: "X", de: "لا يوجد إعلان مناسب" }];
    return [];
  };

  const usedElsewhere = (n, k) => {
    if (exam.type !== "matching" || k === "X") return false;
    return Object.entries(ans).some(([id, v]) => Number(id) !== n && v === k);
  };

  const pick = (it, k) => {
    if (done !== null) return;
    if (usedElsewhere(it.n, k)) return;
    
    // Toggle off logic
    if (ans[it.n] === k) {
      const newAns = { ...ans };
      delete newAns[it.n];
      setAns(newAns);
      return;
    }

    const newAns = { ...ans, [it.n]: k };
    if (exam.type === "sprach2") {
      Object.keys(newAns).forEach(key => { if (Number(key) !== it.n && newAns[key] === k) delete newAns[key]; });
    }
    setAns(newAns);
    if (modalGap) setModalGap(null);
  };

  const selectSituation = (n, k) => {
    if (done !== null) return;
    if (ans[n] === k) {
      const newAns = { ...ans };
      delete newAns[n];
      setAns(newAns);
      return;
    }
    if (ans[n] !== undefined && ans[n] !== k) return;
    setAns(prev => ({ ...prev, [n]: k }));
    setExcluded(prev => {
      const newExc = { ...prev };
      if (newExc[n]) delete newExc[n][k];
      return newExc;
    });
  };

  const toggleExclude = (n, k) => {
    if (done !== null) return;
    if (ans[n] !== undefined) return;
    setExcluded(prev => {
      const newExc = { ...prev };
      if (!newExc[n]) newExc[n] = {};
      if (newExc[n][k]) delete newExc[n][k];
      else newExc[n][k] = true;
      return newExc;
    });
  };

  const pickHoren = (n, c) => {
    if (done !== null) return;
    if (ans[n] === c) {
      const newAns = { ...ans };
      delete newAns[n];
      setAns(newAns);
      return;
    }
    setAns(prev => ({ ...prev, [n]: c }));
  };

  const cls = (it, k) => {
    const sel = ans[it.n];
    const isDone = done !== null;
    if (isDone) {
      if (k === it.c) return "opt good";
      if (sel === k) return "opt bad";
      return "opt faded";
    }
    if (sel === k) return "opt sel";
    return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
  };

  const reset = () => { setAns({}); setDone(null); setActiveGap(null); setShowTranslation(false); setExcluded({}); setShowStory(false); window.scrollTo(0, 0); };
  const finish = () => { setDone(score); onSave(exam.id, score, total); window.scrollTo({ top: 0, behavior: "smooth" }); };

  const onWordClick = (w) => {
    if (done !== null) return;
    const target = activeGap !== null ? activeGap : (exam.items.find(x => ans[x.n] === undefined) || {}).n;
    if (!target) return;
    if (usedElsewhere(target, w)) return;
    const newAns = { ...ans, [target]: w };
    if (exam.type === "sprach2") {
      Object.keys(newAns).forEach(key => { if (Number(key) !== target && newAns[key] === w) delete newAns[key]; });
    }
    setAns(newAns);
    const next = exam.items.find(x => x.n !== target && newAns[x.n] === undefined);
    setActiveGap(next ? next.n : null);
  };

  const playHorenAudio = (segments, onEnd) => {
    if (!window.speechSynthesis) {
      alert("المتصفح ديالك ماكيدعمش النطق الصوتي.");
      if (onEnd) onEnd();
      return;
    }
    window.speechSynthesis.cancel();
    let currentIndex = 0;

    const playNext = () => {
      if (currentIndex >= segments.length) {
        if (onEnd) onEnd();
        return;
      }
      const segment = segments[currentIndex];
      const utterance = new SpeechSynthesisUtterance(segment.text);
      utterance.lang = 'de-DE';
      utterance.pitch = segment.pitch || 1;
      utterance.rate = segment.rate || 1;
      utterance.onend = () => {
        currentIndex++;
        setTimeout(playNext, 500);
      };
      utterance.onerror = () => {
        if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(utterance);
    };
    playNext();
  };

  const toggleAudio = () => {
    if (isPlaying) {
      window.speechSynthesis.cancel();
      setIsPlaying(false);
      return;
    }
    setIsPlaying(true);
    playHorenAudio(exam.audio, () => setIsPlaying(false));
  };

  const renderSprachText = () => {
    if (showTranslation) {
      return <div style={{ textAlign: "center", color: "var(--muted)", padding: 20, fontSize: "1.1em" }}>الترجمة العربية لهذا النص غير متوفرة حالياً.</div>;
    }
    const parts = exam.text.split(/\.{3,}\s*\((\d+)\)\s*\.{3,}/g);
    return parts.map((part, i) => {
      if (i % 2 === 1) {
        const gapNum = parseInt(part);
        const it = exam.items.find(x => x.n === gapNum);
        const selected = ans[gapNum];
        const isDone = done !== null;
        let gapContent = <span className="inline-gap" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{selected ? selected : `(${gapNum})`}</span>;
        if (isDone && selected) {
          if (selected === it.c) gapContent = <span className="sp1-correct">{selected}</span>;
          else gapContent = <span style={{display: 'inline-flex', alignItems: 'center', gap: '4px'}}><span className="sp1-wrong">{selected}</span><span className="sp1-correct">{it.c}</span></span>;
        } else if (isDone && !selected) {
           gapContent = <span className="sp1-correct">{it.c}</span>;
        } else if (selected) {
           gapContent = <span className="inline-gap filled" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{selected}</span>;
        }
        return <span key={i}>{gapContent}</span>;
      }
      return <span key={i} className="de" style={{ whiteSpace: "pre-wrap" }}>{part}</span>;
    });
  };

  const renderTeil3 = () => {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {exam.ads.map(ad => (
          <div key={ad.k} className="card" style={{ padding: 16, border: "1px solid var(--line)" }}>
            <div style={{ marginBottom: 16, borderBottom: "1px solid var(--line)", paddingBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                 <span className="de" style={{ fontWeight: 900, fontSize: "1.1em", color: "var(--gold)" }}>ANZEIGE {ad.k}</span>
              </div>
              <div className="de" style={{ fontWeight: 900, marginTop: 8, fontSize: "1.05em" }}>{ad.t}</div>
              <div className="de" style={{ fontSize: "0.95em", color: "var(--muted)", marginTop: 4, lineHeight: 1.5 }}>{tr(ad, userLang) !== ad.t ? tr(ad, userLang) : ad.de}</div>
              {showTranslation && <div style={{ fontSize: "0.9em", color: "var(--muted)", marginTop: 4, direction: "rtl", textAlign: "right" }}>{tr(ad, userLang)}</div>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {exam.items.map(it => {
                const isSelected = ans[it.n] === ad.k;
                const isSelectedElsewhere = ans[it.n] !== undefined && ans[it.n] !== ad.k;
                const isExcluded = excluded[it.n]?.[ad.k];
                const isDone = done !== null;
                let textStyle = {
                  flex: 1, padding: "12px 14px", borderRadius: 10,
                  border: "1.5px solid transparent", background: "var(--paper)", color: "var(--text)",
                  textAlign: "left", direction: "ltr", cursor: "pointer", transition: "all 0.2s", opacity: 1,
                  fontSize: "0.95em", lineHeight: 1.6
                };
                if (isSelected) {
                  textStyle.background = "rgba(37, 99, 235, 0.1)"; textStyle.borderColor = "#2563EB"; textStyle.color = "#2563EB";
                } else if (isSelectedElsewhere) {
                  textStyle.opacity = 0.3; textStyle.cursor = "not-allowed";
                } else if (isExcluded) {
                  textStyle.opacity = 0.3; textStyle.textDecoration = "line-through"; textStyle.cursor = "not-allowed";
                }
                if (isDone) {
                  if (ad.k === it.c) { textStyle.background = "var(--okbg)"; textStyle.borderColor = "var(--okc)"; textStyle.color = "var(--okc)"; }
                  else if (isSelected) { textStyle.background = "var(--badbg)"; textStyle.borderColor = "var(--badc)"; textStyle.color = "var(--badc)"; }
                }
                return (
                  <div key={it.n} style={{ display: "flex", gap: 12, alignItems: "flex-start", direction: "ltr" }}>
                     <button
                        onClick={() => toggleExclude(it.n, ad.k)}
                        disabled={isSelected || isSelectedElsewhere || isDone}
                        style={{
                          width: 28, height: 28, borderRadius: 6, marginTop: 4,
                          border: `1.5px solid ${isExcluded ? "var(--badc)" : "var(--line)"}`,
                          background: isExcluded ? "var(--badbg)" : "transparent",
                          color: isExcluded ? "var(--badc)" : "var(--muted)",
                          fontWeight: 900, fontSize: "1em", display: "flex", alignItems: "center", justifyContent: "center",
                          flexShrink: 0, cursor: (isSelected || isSelectedElsewhere || isDone) ? "not-allowed" : "pointer"
                        }}
                     >
                       {isExcluded ? "✕" : ""}
                     </button>
                     <span style={{ fontWeight: 900, width: 20, textAlign: "center", marginTop: 8, color: isSelected ? "#2563EB" : "var(--muted)" }}>{it.n}</span>
                     <div onClick={() => selectSituation(it.n, ad.k)} style={textStyle}>
                       <div className="de">{it.de}</div>
                       {showTranslation && <div style={{ marginTop: 6, color: isSelected ? "#2563EB" : "var(--muted)", fontSize: "0.9em", direction: "rtl", textAlign: "right" }}>{tr(it, userLang)}</div>}
                     </div>
                  </div>
                )
              })}
            </div>
          </div>
        ))}
      </div>
    );
  };

  const renderHoren = () => {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div className="card" style={{ padding: 16 }}>
          <div className="audio-header">
            <div className="audio-icon-big">🎧</div>
            <div>
              <div>Hörtext (Audio)</div>
              <div style={{ fontSize: "0.8em", color: "var(--muted)", fontWeight: "normal" }}>استمع للنص الألماني ثم أجب</div>
            </div>
          </div>
          <button onClick={toggleAudio} style={{
            width: "100%", padding: "16px", borderRadius: "16px",
            background: isPlaying ? "var(--badbg)" : "var(--okbg)",
            color: isPlaying ? "var(--badc)" : "var(--okc)",
            border: `2px solid ${isPlaying ? "var(--badc)" : "var(--okc)"}`,
            fontWeight: 900, fontSize: "1.1em", display: "flex", alignItems: "center", justifyContent: "center", gap: 10
          }}>
            {isPlaying ? "⏹ إيقاف الصوت" : "▶️ استمع الآن"}
          </button>
        </div>

        <div className="card" style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ display: "flex", background: "var(--paper)", borderBottom: "1px solid var(--line)", fontWeight: 900, fontSize: "0.9em", color: "var(--muted)" }}>
            <div style={{ padding: "12px 8px", width: 60, textAlign: "center" }}>R</div>
            <div style={{ padding: "12px 8px", width: 60, textAlign: "center" }}>F</div>
            <div style={{ padding: "12px 8px", flex: 1 }}>AUSSAGE</div>
            <div style={{ padding: "12px 8px", width: 40 }}></div>
          </div>

          {exam.items.map((it, idx) => {
            const isDone = done !== null;
            const isRight = ans[it.n] === "R";
            const isFalsch = ans[it.n] === "F";
            
            let rClass = "rf-circle", fClass = "rf-circle";
            if (isRight) rClass += " sel";
            if (isFalsch) fClass += " sel";
            
            if (isDone) {
              if (it.c === "R") rClass += " good";
              else if (isRight) rClass += " bad";
              
              if (it.c === "F") fClass += " good";
              else if (isFalsch) fClass += " bad";
            }

            return (
              <div key={it.n} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--line)", background: isDone ? (ans[it.n] === it.c ? "var(--okbg)" : "var(--badbg)") : "var(--card)" }}>
                <div style={{ padding: "12px 8px", width: 60, display: "flex", justifyContent: "center" }}>
                  <div className={rClass} onClick={() => !isDone && pickHoren(it.n, "R")}></div>
                </div>
                <div style={{ padding: "12px 8px", width: 60, display: "flex", justifyContent: "center" }}>
                  <div className={fClass} onClick={() => !isDone && pickHoren(it.n, "F")}></div>
                </div>
                <div style={{ padding: "12px 8px", flex: 1, fontSize: "0.95em", lineHeight: 1.5 }}>
                  <span style={{ opacity: 0.5, marginRight: 8, fontWeight: 900 }}>{it.n}</span>
                  <span className="de">{it.de}</span>
                  {showTranslation && <div style={{ marginTop: 6, fontSize: "0.85em", color: "var(--muted)", direction: "rtl", textAlign: "right" }}>{tr(it, userLang)}</div>}
                </div>
                <div style={{ padding: "12px 8px", width: 40, display: "flex", justifyContent: "center" }}>
                   {isDone && (ans[it.n] === it.c ? <span style={{ color: "var(--okc)", fontWeight: 900 }}>✓</span> : <span style={{ color: "var(--badc)", fontWeight: 900 }}>✗</span>)}
                </div>
              </div>
            );
          })}
        </div>

        <div className="card" style={{ padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={() => setShowStory(!showStory)} style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--muted)", fontWeight: 800 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            قصة سهلة للحفظ
          </button>
          {done !== null && <span style={{ fontWeight: 900, color: ans[exam.items[0].n] === exam.items[0].c ? "var(--okc)" : "var(--badc)" }}>النتيجة: {score} / {total}</span>}
        </div>

        {showStory && (
          <div className="t2-ar" style={{ marginTop: 0 }}>
            {exam.items[0].story}
          </div>
        )}
      </div>
    );
  };

  const iconStyle = {
    width: 36, height: 36, borderRadius: "50%", background: "var(--card)",
    border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center",
    color: "var(--text)", padding: 2
  };

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{
        position: "fixed", top: 0, left: 0, right: 0, height: 4, zIndex: 100,
        backgroundImage: "linear-gradient(to right, #111 33.33%, #DD0000 33.33%, #DD0000 66.66%, #FFCE00 66.66%)",
        backgroundSize: `${scrollProgress}% 100%`,
        backgroundRepeat: "no-repeat",
        backgroundColor: "transparent"
      }} />

      {toast && <div className="toast">{toast}</div>}

      <div style={{
        position: "sticky", top: 0, zIndex: 30, background: "var(--paper)",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        padding: "12px 16px", transition: 'transform 0.3s ease-in-out',
        transform: showHeader ? 'translateY(0)' : 'translateY(-100%)'
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={onBack} style={{ ...iconStyle, width: 32, height: 32 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div>
            <div className="de" style={{ fontWeight: 900, fontSize: "1em", lineHeight: 1.2 }}>{exam.title}</div>
            <div className="de" style={{ fontSize: ".75em", color: "var(--muted)", fontWeight: "bold" }}>{exam.type === "horen" ? "HÖREN" : "LESEN"} · {exam.sub.toUpperCase()}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
           <div style={{ fontWeight: 900, fontSize: "0.9em", color: "var(--muted)", marginRight: 4 }}>
             <span className="de">{answered} / {exam.items.length}</span>
           </div>
           <button onClick={() => setShowTranslation(!showTranslation)} style={{ ...iconStyle, color: showTranslation ? "#2563EB" : "var(--text)" }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 5h12M9 3v2c0 4.418-2.686 8-6 8m0-8h12m-6 0v2c0 4.418 2.686 8 6 8m-4-2l-4 8m2-4h4m-2 0l2 4"/></svg>
           </button>
           <button onClick={() => setDark(!dark)} style={{ ...iconStyle }}>
            {dark ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}
           </button>
        </div>
      </div>

      <div style={{ margin: "0 10px" }}>
        {exam.type === "horen" && renderHoren()}
        
        {exam.type === "mcq" && (
          <div className="card" style={{ padding: "20px 16px" }}>
            {exam.paragraphs && exam.paragraphs.map((p, i) => (
              <div key={i} style={{ marginBottom: 20 }}>
                <p className="de" style={{ lineHeight: 1.8, margin: "0 0 10px", fontSize: "1.05em" }}>{p.de}</p>
                {showTranslation && <div className="t2-ar" style={{ marginTop: 0 }}>{tr(p, userLang)}</div>}
              </div>
            ))}
          </div>
        )}

        {(exam.type === "sprach1" || exam.type === "sprach2") && (
          <div className="card" style={{ fontSize: "1.1em", lineHeight: 2.2, padding: "24px 16px" }}>
            {renderSprachText()}
          </div>
        )}

        {exam.type === "matching" && renderTeil3()}

        {exam.type !== "sprach1" && exam.type !== "sprach2" && exam.type !== "matching" && exam.type !== "horen" && exam.items.map((it, idx) => {
          const sel = ans[it.n];
          const isDone = done !== null;
          return (
            <div key={it.n} className="card" style={{ padding: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 12 }}>
                <span className="letter" style={{ width: 32, height: 32, fontSize: "1em" }}>{idx + 1}</span>
                <div style={{flex: 1, paddingTop: 4}}>
                  {exam.type === "headings" && (
                    <div style={{ lineHeight: 1.8, margin: 0, fontSize: "1.05em" }}>
                      <span className="de">{it.de}</span>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em" }}>{tr(it, userLang)}</div>}
                    </div>
                  )}
                  {exam.type === "mcq" && (
                    <div>
                      <p className="de" style={{ fontWeight: 900, margin: 0, fontSize: "1.05em" }}>{tr(it, userLang)}</p>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em" }}>{tr(it, userLang)}</div>}
                    </div>
                  )}
                </div>
              </div>
              {optsFor(it).map(o => (
                <button key={o.k} className={cls(it, o.k)} onClick={() => pick(it, o.k)} disabled={isDone} style={{ padding: "12px", fontSize: "0.95em" }}>
                  <span className="letter" style={{ width: 26, height: 26, fontSize: "0.9em" }}>{o.k}</span>
                  <span className="de" style={{ flex: 1, lineHeight: 1.5 }}>{showTranslation ? tr(o, userLang) : o.de}</span>
                </button>
              ))}
              {isDone && (
                <div className={sel === it.c ? "fb good" : "fb bad"} style={{ marginTop: 10, padding: 12, fontSize: "0.95em" }}>
                  <b>{sel === it.c ? "✓ صحيح" : (sel ? "✗ غلط" : "⚠️ لم تجب")}</b>
                  {sel !== it.c && <span style={{fontWeight:900}}> — الجواب: {it.c}</span>}
                  <div style={{marginTop: 6, opacity: 0.9}}>{tr(it, userLang)}</div>
                </div>
              )}
            </div>
          );
        })}

        {modalGap !== null && exam.type === "sprach1" && (
          <div className="overlay" onClick={() => setModalGap(null)}>
            <div className="sheet" onClick={e => e.stopPropagation()}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15}}>
                <h3 style={{margin:0, fontSize:"1.2em"}}>الفراغ ({modalGap})</h3>
                <button className="btnI" onClick={() => setModalGap(null)}>✕</button>
              </div>
              <div className="modal-list">
                {exam.items.find(x => x.n === modalGap).opts.map((opt, i) => (
                  <button key={i} className={"modal-item" + (ans[modalGap] === opt ? " selected" : "")} onClick={() => pick(exam.items.find(x => x.n === modalGap), opt)}>
                    <span style={{ opacity: 0.5, fontWeight: 900 }}>{String.fromCharCode(65 + i)}</span>
                    <span className="de" style={{fontSize:"1.05em"}}>{opt}</span>
                    {ans[modalGap] === opt && <span style={{ color: "var(--gold)", fontSize:"1.1em" }}>✓</span>}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {activeGap !== null && exam.type === "sprach2" && (
           <div className="overlay" onClick={() => setActiveGap(null)}>
             <div className="sheet" onClick={e => e.stopPropagation()}>
               <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15}}>
                 <h3 style={{margin:0, fontSize:"1.2em"}}>اختر الكلمة للفراغ ({activeGap})</h3>
                 <button className="btnI" onClick={() => setActiveGap(null)}>✕</button>
               </div>
               <div className="word-bank" style={{marginBottom:0, gridTemplateColumns: "1fr"}}>
                 {exam.wordBank.map(w => {
                   const isUsed = Object.values(ans).includes(w.w) && ans[activeGap] !== w.w;
                   return (
                     <button key={w.k} className={"word-btn" + (isUsed ? " used" : "")} onClick={() => onWordClick(w.w)} style={{ padding: "10px" }}>
                       <span style={{ opacity: 0.6, marginRight: 8, fontWeight: 900, fontSize:"0.9em" }}>{w.k}</span> <span style={{fontSize:"1.05em"}}>{w.w}</span>
                     </button>
                   )
                 })}
               </div>
             </div>
           </div>
        )}
      </div>

      <div style={{
        position: 'fixed', bottom: 12, left: 16, right: 16, zIndex: 40,
        display: 'flex', justifyContent: 'space-between', pointerEvents: 'none'
      }}>
        <button onClick={done !== null ? reset : finish} style={{
          pointerEvents: 'auto', padding: "8px 18px", fontSize: "0.85em", fontWeight: 800, borderRadius: 20,
          background: done !== null ? "rgba(220, 252, 231, 0.85)" : "rgba(15, 27, 51, 0.85)",
          color: done !== null ? "var(--okc)" : "var(--gold)",
          border: "1px solid rgba(255,255,255,0.1)",
          backdropFilter: "blur(8px)",
          boxShadow: "0 4px 15px rgba(0,0,0,0.15)", cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6
        }}>
          {done !== null ? "إعادة" : "تصحيح"}
        </button>
        <button onClick={() => { if(done !== null) onBack(); else onNext(); }} style={{
          pointerEvents: 'auto', padding: "8px 18px", fontSize: "0.85em", fontWeight: 800, borderRadius: 20,
          background: "rgba(255, 255, 255, 0.85)", color: "var(--text)",
          border: "1px solid rgba(0,0,0,0.05)",
          backdropFilter: "blur(8px)",
          boxShadow: "0 4px 15px rgba(0,0,0,0.1)", cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6
        }}>
          {done !== null ? "رجوع" : "التالي"}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [isReady, setIsReady] = useState(false);
  const [view, setView] = useState("home");
  const [level, setLevel] = useState("B1");
  const [exam, setExam] = useState(null);
  const [dark, setDark] = useState(false);
  const [fs, setFs] = useState(() => { try { return Number(localStorage.getItem("ep_fs")) || 100; } catch (e) { return 100; } });
  const [menu, setMenu] = useState(false);
  const [settings, setSettings] = useState(false);
  const [results, setResults] = useState(() => { try { return JSON.parse(localStorage.getItem("ep_results") || "{}"); } catch (e) { return {}; } });
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedExamTitle, setSelectedExamTitle] = useState(null);
  const [showSubscription, setShowSubscription] = useState(false);
  const [userLang, setUserLang] = useState(() => { try { return localStorage.getItem("ep_lang") || "ar"; } catch (e) { return "ar"; } });
  const [toast, setToast] = useState(null);

  const toastTimer = useRef(null);
  const flash = (m) => {
    setToast(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };

  useEffect(() => {
    const timer = setTimeout(() => setIsReady(true), 1500);
    const savedUser = localStorage.getItem("ep_user");
    if (savedUser) setUser(JSON.parse(savedUser));
    return () => clearTimeout(timer);
  }, []);

  const handleGuest = () => { const guest = { name: "زائر", isGuest: true }; setUser(guest); localStorage.setItem("ep_user", JSON.stringify(guest)); };
  const handleAuth = (e) => {
    e.preventDefault();
    const name = e.target.name.value;
    const pass = e.target.pass.value;
    const remember = e.target.remember.checked;
    if(name && pass) {
      const newUser = { name, pass, remember };
      setUser(newUser);
      localStorage.setItem("ep_user", JSON.stringify(newUser));
    }
  };
  const logout = () => { localStorage.removeItem("ep_user"); sessionStorage.removeItem("subShown"); setUser(null); };

  useEffect(() => { document.documentElement.classList.toggle("dark", dark); }, [dark]);
  useEffect(() => { document.documentElement.style.setProperty("--fs", fs / 100); try { localStorage.setItem("ep_fs", fs); } catch (e) {} }, [fs]);
  useEffect(() => { try { localStorage.setItem("ep_results", JSON.stringify(results)); } catch (e) {} }, [results]);

  const saveResult = (id, score, max) => setResults(r => ({ ...r, [id]: { score, max, date: Date.now() } }));
  const go = (v) => { setView(v); setExam(null); setMenu(false); window.scrollTo(0, 0); };

  const levelExams = EXAMS.filter(e => e.level === level);
  const uniqueTitles = Array.from(new Set(levelExams.map(e => e.title)))
    .filter(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

  const handleNextExam = (currentExam) => {
    const currentTitleIndex = uniqueTitles.indexOf(currentExam.title);
    if (currentTitleIndex !== -1 && currentTitleIndex < uniqueTitles.length - 1) {
      const nextTitle = uniqueTitles[currentTitleIndex + 1];
      const nextParts = EXAMS.filter(e => e.title === nextTitle && e.level === level);
      if (nextParts.length > 0) setExam(nextParts[0]);
    } else {
      setExam(null);
    }
  };

  if (!isReady) {
    return (
      <div className="splash-screen">
        <div className="splash-logo"><LogoImage size={180} /></div>
        <h1 className="de" style={{ color: "#0F1B33", fontSize: "2em", marginTop: 20, fontWeight: 900 }}>EchtPrüfung</h1>
      </div>
    );
  }

  if (!user) {
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div style={{textAlign:"center", marginBottom: 30}}>
            <LogoImage size={80} />
            <h2 style={{marginTop: 16, fontSize: "1.5em", fontWeight: 900}}>مرحباً بك في EchtPrüfung</h2>
            <p style={{color: "var(--muted)"}}>تطبيقك الأول للتحضير لامتحان B1</p>
          </div>
          <button className="auth-btn guest" onClick={handleGuest}>دخول كزائر (بنقرة واحدة)</button>
          <div style={{textAlign:"center", margin:"20px 0", color:"var(--muted)"}}>أو</div>
          <form onSubmit={handleAuth}>
            <input className="auth-input" name="name" placeholder="الاسم الفريد" required />
            <input className="auth-input" name="pass" type="password" placeholder="رقم سري" required />
            <div style={{ display: "flex", alignItems: "center", marginBottom: 16, gap: 8 }}>
              <input type="checkbox" name="remember" id="remember" style={{ width: 18, height: 18, accentColor: "var(--gold)" }} />
              <label htmlFor="remember" style={{ fontSize: "0.95em", color: "var(--text)", cursor: "pointer" }}>تذكرني</label>
            </div>
            <button type="submit" className="auth-btn">تسجيل الدخول</button>
          </form>
          <button onClick={() => wa("مرحباً، نسيت كلمة السر ديالي فـ EchtPrüfung.")} style={{ width: "100%", padding: "10px", background: "transparent", color: "var(--badc)", border: "none", fontWeight: 800, cursor: "pointer", fontSize: "0.95em" }}>هل نسيت كلمة السر؟</button>
        </div>
      </div>
    );
  }

  if (exam) {
    return <ExamView
      key={exam.id}
      exam={exam}
      dark={dark}
      setDark={setDark}
      onBack={() => setExam(null)}
      onNext={() => handleNextExam(exam)}
      onSave={saveResult}
      userLang={userLang}
    />;

              <span>Deutsch B1 / B2</span> <span>•</span>
              <span>{LANGS.find(l => l.c === userLang)?.f}</span>
              <span>{LANGS.find(l => l.c === userLang)?.n}</span>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btnI" aria-label="الوضع الليلي" onClick={() => setDark(!dark)}>
            {dark ? <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> : <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}
          </button>

          </button>
          <button className="btnI" aria-label="القائمة" onClick={() => setMenu(true)}>
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
          </button>
        </div>
      </div>

      <main style={{ margin: "0 12px", paddingTop: 10 }}>
        {view === "home" && (

              display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",

            }}>
              <div style={{

                backgroundImage: "url('https://images.unsplash.com/photo-1560969184-10fe8719e047?q=80&w=1000&auto=format&fit=crop')",
                backgroundSize: "cover", backgroundPosition: "center", zIndex: 0

                position: "absolute", top: 0, left: 0, right: 0, bottom: 0,

              }} />
              <div style={{ position: "relative", zIndex: 2, textAlign: "center", width: "100%" }}>
                <div style={{ display: "inline-block", padding: 20, background: "rgba(255,255,255,0.1)", borderRadius: 28, backdropFilter: "blur(10px)", border: "1px solid rgba(255,255,255,0.2)" }}>
                  <LogoImage size={90} />
                </div>
                <h2 className="de" style={{ margin: "20px 0 8px", fontSize: "2.2em", fontWeight: 900, color: "#FFF", textShadow: "0 2px 10px rgba(0,0,0,0.5)", letterSpacing: "-0.5px" }}>EchtPrüfung</h2>
                
                <div style={{ background: "rgba(245,184,46,0.2)", border: "1px solid var(--gold)", padding: "10px 20px", borderRadius: 16, margin: "0 auto 20px", maxWidth: "90%" }}>
                  <p style={{ margin: 0, color: "#FFF", fontSize: "1.2em", fontWeight: 900 }}>

                <div style={{ display: "inline-flex", alignItems: "center", gap: "12px", direction: "ltr", fontSize: "1.5em", fontWeight: 900, background: "rgba(255,255,255,0.95)", padding: "10px 28px", borderRadius: 20, boxShadow: "0 8px 20px rgba(0,0,0,0.3)" }}>
                  <span style={{ color: "#0F1B33" }}>B1</span>
                  <span style={{ color: "#DD0000" }}>&</span>
                  <span style={{ color: "#F5B82E" }}>B2</span>

            <div className="card" style={{ padding: 20, borderRadius: 24 }}>

              <p className="de" style={{ margin: "0 0 20px", color: "var(--muted)", fontSize: "0.95em", fontWeight: 600 }}>Support & Problemmeldung</p>
              <button style={{ width: "100%", padding: "16px", borderRadius: "16px", background: "#25D366", color: "#fff", border: "none", fontWeight: 900, fontSize: "1.05em", display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", boxShadow: "0 8px 25px rgba(37, 211, 102, 0.4)", cursor: "pointer", transition: "transform 0.2s" }} onClick={() => wa("مرحباً، بغيت نبلغ على مشكل فالتطبيق / Ich möchte ein Problem melden.")}>
                <svg width="26" height="26" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", lineHeight: 1.2 }}>
                  <span>تواصل مع الدعم / إبلاغ عن مشكل</span>
                  <span className="de" style={{ fontSize: "0.75em", opacity: 0.9 }}>Support kontaktieren</span>
                </div>
              </button>
            </div>
          </div>
        )}

        {view === "lesen" && (
          <div>
            <h1 className="de" style={{ fontSize: "2.6em", fontWeight: 900, margin: "4px 0 14px" }}>Lesen</h1>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>
              <div style={{ display: "inline-flex", background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 4 }}>
                <button className={`tab ${level === "B1" ? "on" : ""}`} onClick={() => setLevel("B1")} style={{ padding: "8px 28px", fontSize: "1.1em" }}>B1</button>
                <button className={`tab ${level === "B2" ? "on" : ""}`} onClick={() => setLevel("B2")} style={{ padding: "8px 28px", fontSize: "1.1em" }}>B2</button>
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <input type="text" placeholder="...بحث عن موضوع" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ width: "100%", padding: "14px 20px", borderRadius: 16, border: "1px solid var(--line)", background: "var(--card)", color: "var(--text)", fontSize: "1em", outline: "none" }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", margin: "8px 0" }}>
              <span className="chip" style={{ background: "var(--card)", color: "var(--text)", fontSize: ".9em" }}>{uniqueTitles.length} امتحان</span>
              <strong style={{fontSize:"1.1em"}}>قائمة الامتحانات</strong>
            </div>
            {uniqueTitles.map(title => (
              <button key={title} className="card" onClick={() => setSelectedExamTitle(title)} style={{ width: "100%", textAlign: "right", display: "block", color: "var(--text)", padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div className="de" style={{ fontWeight: 900, fontSize: "1.2em" }}>{title}</div>
                    <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center", color: "var(--muted)", fontSize: ".9em" }}>
                      <span className="chip">{level}</span>
                      <span>90 Min</span>
                    </div>
                  </div>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{ color: "var(--muted)" }}><path d="M9 18l6-6-6-6"/></svg>
                </div>
              </button>
            ))}
          </div>
        )}

        {view === "horen" && (
          <div>
            <h1 className="de" style={{ fontSize: "2.6em", fontWeight: 900, margin: "4px 0 14px" }}>Hören</h1>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>
              <div style={{ display: "inline-flex", background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 4 }}>
                <button className={`tab ${level === "B1" ? "on" : ""}`} onClick={() => setLevel("B1")} style={{ padding: "8px 28px", fontSize: "1.1em" }}>B1</button>
                <button className={`tab ${level === "B2" ? "on" : ""}`} onClick={() => setLevel("B2")} style={{ padding: "8px 28px", fontSize: "1.1em" }}>B2</button>
              </div>
            </div>
            
            {HOREN_EXAMS.filter(e => e.level === level).map(ex => (
              <button key={ex.id} className="card" onClick={() => setExam(ex)} style={{ width: "100%", textAlign: "right", display: "block", color: "var(--text)", padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div className="de" style={{ fontWeight: 900, fontSize: "1.2em" }}>{ex.title}</div>
                    <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center", color: "var(--muted)", fontSize: ".9em" }}>
                      <span className="chip">{level}</span>
                      <span>{ex.sub}</span>
                    </div>
                  </div>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{ color: "var(--muted)" }}><path d="M9 18l6-6-6-6"/></svg>
                </div>
              </button>
            ))}
          </div>
        )}

        {(view === "schreiben" || view === "sprechen" || view === "pruefung") && (
          <div className="card" style={{ textAlign: "center", padding: 40 }}>
            <h2 style={{ margin: "0 0 6px", fontSize: "1.5em" }}>
              {view === "schreiben" ? "Schreiben" : view === "sprechen" ? "Sprechen" : "امتحان"}
            </h2>
            <p style={{ color: "var(--muted)", margin: 0, fontSize: "1.1em" }}>هاد القسم قريباً.</p>
          </div>
        )}
      </main>

      <nav className="nav">
        {[["lesen","Lesen","📖"],["horen","Hören","🎧"],["schreiben","Schreiben","✎"],["sprechen","Sprechen","🎙"],["pruefung","امتحان","🎓"],["home","الرئيسية","⌂"]].map(([k, label, ic]) => (
          <button key={k} className={view === k ? "on" : ""} onClick={() => go(k)}>
            <span className="ic">{ic}</span>
            <span>{label}</span>
          </button>
        ))}
      </nav>

      {showSubscription && (
        <div className="overlay" onClick={() => setShowSubscription(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 style={{ margin: 0, fontSize: "1.3em", fontWeight: 900 }}>عروض الاشتراك</h3>
              <button className="btnI" onClick={() => setShowSubscription(false)}>✕</button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div className="card" style={{ margin: 0, padding: 16, border: "2px solid var(--gold)", background: "rgba(245,184,46,0.05)" }}>
                <h4 style={{ margin: "0 0 8px", fontSize: "1.1em", color: "var(--gold)" }}>تجربة مجانية</h4>
                <p style={{ margin: "0 0 12px", fontSize: "1.5em", fontWeight: 900 }}>0 درهم <span style={{ fontSize: "0.5em", color: "var(--muted)" }}>/ يومين</span></p>
                <button className="btn" style={{ background: "#25D366", color: "#fff", padding: "10px" }} onClick={() => wa("مرحباً، بغيت نستافد من تجربة يومين مجانية فـ EchtPrüfung.")}>واتساب - تجربة مجانية</button>
              </div>
              <div className="card" style={{ margin: 0, padding: 16 }}>
                <h4 style={{ margin: "0 0 8px", fontSize: "1.1em" }}>اشتراك 15 يوم</h4>
                <p style={{ margin: "0 0 12px", fontSize: "1.5em", fontWeight: 900 }}>30 درهم</p>
                <button className="btn ghost" style={{ padding: "10px" }} onClick={() => wa("مرحباً، بغيت نشترك لمدة 15 يوم بـ 30 درهم فـ EchtPrüfung.")}>واتساب - اشتراك 15 يوم</button>
              </div>
              <div className="card" style={{ margin: 0, padding: 16, position: "relative", overflow: "hidden" }}>
                <div style={{ position: "absolute", top: 10, left: 10, background: "var(--badc)", color: "#fff", padding: "2px 8px", borderRadius: 4, fontSize: "0.7em", fontWeight: 900 }}>عرض خاص</div>
                <h4 style={{ margin: "0 0 8px", fontSize: "1.1em" }}>اشتراك شهر كامل</h4>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                  <span style={{ fontSize: "1.5em", fontWeight: 900, color: "var(--gold)" }}>60 درهم</span>
                  <span style={{ fontSize: "1em", textDecoration: "line-through", color: "var(--badc)" }}>125 درهم</span>
                </div>
                <button className="btn" style={{ padding: "10px" }} onClick={() => wa("مرحباً، بغيت نستافد من عرض الشهر بـ 60 درهم فـ EchtPrüfung.")}>واتساب - اشتراك شهر كامل</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {selectedExamTitle && (
        <div className="overlay" onClick={() => setSelectedExamTitle(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 className="de" style={{ margin: 0, fontSize: "1.3em", fontWeight: 900 }}>{selectedExamTitle}</h3>
              <button className="btnI" onClick={() => setSelectedExamTitle(null)}>✕</button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {["Teile 1", "Teile 2", "Teile 3", "Sprach 1", "Sprach 2"].map(subName => {
                const existingExam = EXAMS.find(e => e.title === selectedExamTitle && e.level === level && e.sub === subName);
                return (
                  <button
                    key={subName}
                    className="btn ghost"
                    disabled={!existingExam}
                    style={{
                      padding: "16px", fontSize: "1.1em", display: "flex", justifyContent: "space-between", alignItems: "center",
                      opacity: existingExam ? 1 : 0.5,
                      cursor: existingExam ? "pointer" : "not-allowed"
                    }}
                    onClick={() => {
                      if (existingExam) {
                        setExam(existingExam);
                        setSelectedExamTitle(null);
                      } else {
                        flash("هذا الجزء فارغ حالياً / Dieses Teil ist leer");
                      }
                    }}
                  >
                    <span className="de" style={{ fontWeight: 800 }}>{subName}</span>
                    {existingExam && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {menu && (
        <div className="overlay" onClick={() => setMenu(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()} style={{ maxWidth: 360, padding: 0, overflow: "hidden", borderRadius: 24 }}>
            <div style={{ padding: "30px 20px 20px", background: "var(--paper)", borderBottom: "1px solid var(--line)", position: "relative", textAlign: "center" }}>
              <button className="btnI" style={{ position: "absolute", top: 16, left: 16, background: "var(--card)", width: 32, height: 32 }} onClick={() => setMenu(false)}>✕</button>
              <div style={{ width: 76, height: 76, margin: "0 auto 12px", borderRadius: "50%", background: "linear-gradient(135deg, #111 33%, #DD0000 33%, #DD0000 66%, #FFCE00 66%)", padding: 3, boxShadow: "0 6px 20px rgba(0,0,0,0.15)" }}>
                 <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--card)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "2em", fontWeight: 900, color: "var(--text)" }}>
                   {user?.name?.charAt(0).toUpperCase() || "ز"}
                 </div>
              </div>
              <h2 style={{ margin: 0, fontSize: "1.4em", fontWeight: 900 }}>{user?.name || "زائر"}</h2>
              <div className="de" style={{ margin: "6px 0 0", fontSize: "0.9em", color: "var(--muted)", fontWeight: "bold" }}>
                {user?.isGuest ? "Gast-Modus" : "Profil"} • B1 / B2
              </div>
            </div>
            <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { k: "lesen", l: "Lesen", icon: "📖" },
                { k: "horen", l: "Hören", icon: "🎧" },
                { k: "schreiben", l: "Schreiben", icon: "✍️" },
                { k: "sprechen", l: "Sprechen", icon: "🎙️" }
              ].map((item) => (
                <button key={item.k} className="btn ghost" style={{ padding: "14px 16px", fontSize: "1.05em", display: "flex", justifyContent: "flex-start", alignItems: "center", gap: 12, border: "1px solid var(--line)" }} onClick={() => go(item.k)}>
                  <span style={{ fontSize: "1.3em" }}>{item.icon}</span>
                  <span style={{ fontWeight: 800 }}>{item.l}</span>
                </button>
              ))}
              <button
                style={{
                  marginTop: 10, padding: "12px", borderRadius: "14px", background: "rgba(37, 211, 102, 0.1)",
                  color: "#15803D", border: "1.5px solid #25D366", fontWeight: 900, fontSize: "0.95em",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: "8px", cursor: "pointer", transition: "all 0.2s"
                }}
                onClick={() => wa("مرحباً، بغيت نستفسر على الاشتراك وتواصل مع الدعم فـ EchtPrüfung.")}
              >
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                </svg>
                <span>الاشتراك وتواصل مع الدعم</span>
              </button>
            </div>
            <div style={{ padding: "0 20px 20px" }}>
              <button className="btn" style={{ background: "rgba(185, 28, 28, 0.1)", color: "var(--badc)", border: "1px solid var(--badc)", padding: "14px", fontSize: "1.05em", display: "flex", justifyContent: "center", alignItems: "center", gap: 8 }} onClick={logout}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14l5-5-5-5m5 5H9"/></svg>
                تسجيل الخروج
              </button>
            </div>
          </div>
        </div>
      )}

      {settings && (
        <div className="overlay" onClick={() => setSettings(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <strong style={{fontSize:"1.3em"}}>الإعدادات</strong>
              <button className="btnI" onClick={() => setSettings(false)}>✕</button>
            </div>
            
            <div style={{ marginBottom: 16 }}>
              <span style={{fontWeight:900, fontSize:"1.1em", display: "block", marginBottom: 8}}>تغيير اللغة / اللهجة</span>
              <div className="lang-grid" style={{ maxHeight: 150 }}>
                {LANGS.map(lang => (
                  <button 
                    key={lang.c}
                    onClick={() => { 
                      setUserLang(lang.c); 
                      localStorage.setItem("ep_lang", lang.c); 
                      flash(`تم اختيار اللغة: ${lang.n}`);
                    }}
                    className={`lang-btn ${userLang === lang.c ? "on" : ""}`}
                    style={{ padding: "8px" }}
                  >
                    <span style={{ fontSize: "1.2em" }}>{lang.f}</span>
                    <span style={{ fontSize: "0.85em" }}>{lang.n}</span>
                  </button>
                ))}
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <span style={{fontWeight:900, fontSize:"1.1em"}}>حجم النص</span>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button className="btnI" onClick={() => setFs(Math.max(80, fs - 10))}>−</button>
                <span style={{ minWidth: 48, textAlign: "center", fontWeight: 900, fontSize:"1.1em" }}>{fs}%</span>
                <button className="btnI" onClick={() => setFs(Math.min(150, fs + 10))}>+</button>
              </div>
            </div>
            <p className="de" style={{ background: "var(--paper)", padding: 16, borderRadius: 12, margin: "0 0 16px", fontSize: "1.1em" }}>
              Lesen Teil 1 — Beispieltext
            </p>
            <button className="btn ghost" onClick={() => setFs(100)}>إعادة الحجم الأصلي</button>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
