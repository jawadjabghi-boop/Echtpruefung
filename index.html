    id: "sch1", title: "Urlaub Im Schwarzwald - Antwort An Petra", level: "B1",
    text: `Liebe(r).......\n\nIch habe eine tolle Überraschung. stelle dir vor, was mir mein Onkel angeboten hat. Er rief mich am Samstag an. Er hat ein großes Ferienhaus im Schwarzwald. Das Haus kann ich für die Ferien kostenlos haben. Ich kann auch Freunde mitbringen! Wäre das nichts für uns? Wir könnten uns alle dort treffen. Du, deine Eltern und Freunde, und ich mit meiner Familie und meinen Freunden. Ich würde mich wahnsinnig freuen, wenn das klappen würde. Bitte schreibe mir so schnell du kannst, damit wir alles planen können. Urlaub im Schwarzwald - das wird traumhaft schön!\n\nHerzliche Grüße\nPetra`,
    transText: {
      ar: `عزيزي/عزيزتي...\n\nعندي ليك مفاجأة زوينة. تخيل شنو عرض عليا عمي. عيط ليا نهار السبت. عندو دار كبيرة ديال العطلة في الغابة السوداء (Schwarzwald). نقدر ناخد الدار فهاد العطلة. ونقدر نجيب معايا حتى صحابي! واش هادشي ماشي فكرة زوينة لينا؟ نقدر ونتجمعو تما كاملين. أنت، والديك وصحابك، وأنا مع عائلتي وصحابي. غادي نفرح بزاف يلا صدقات هاد القضية. عفاك جاوبني في أقرب وقت باش نقدر وخططو لكشي. عطلة في الغابة السوداء - غتكون رائعة!\n\nتحياتي القلبية\nبيترا`,
      ma: `عزيزي/عزيزتي...\n\nعندي ليك مفاجأة زوينة. تخيل شنو عرض عليا عمي. عيط ليا نهار السبت. عندو دار كبيرة ديال العطلة في الغابة السوداء (Schwarzwald). نقدر ناخد الدار فهاد العطلة. ونقدر نجيب معايا حتى صحابي! واش هادشي ماشي فكرة زوينة لينا؟ نقدر ونتجمعو تما كاملين. أنت، والديك وصحابك، وأنا مع عائلتي وصحابي. غادي نفرح بزاف يلا صدقات هاد القضية. عفاك جاوبني في أقرب وقت باش نقدر وخططو لكشي. عطلة في الغابة السوداء - غتكون رائعة!\n\nتحياتي القلبية\nبيترا`,
      en: `Dear...\n\nI have a great surprise. Imagine what my uncle offered me. He called me on Saturday. He has a big holiday house in the Black Forest. I can have the house for the holidays for free. I can also bring friends! Wouldn't that be something for us? We could all meet there. You, your parents and friends, and me with my family and my friends. I would be incredibly happy if that would work out. Please write to me as soon as you can so that we can plan everything. Vacation in the Black Forest - that will be incredibly beautiful!\n\nBest regards\nPetra`,
      fr: `Cher/Chère...\n\nJ'ai une super surprise. Imagine ce que mon oncle m'a proposé. Il m'a appelé samedi. Il a une grande maison de vacances dans la Forêt-Noire. Je peux avoir la maison pour les vacances gratuitement. Je peux aussi amener des amis ! Ne serait-ce pas quelque chose pour nous ? Nous pourrions tous nous y retrouver. Toi, tes parents et amis, et moi avec ma famille et mes amis. Je serais incroyablement heureux si cela pouvait fonctionner. S'il te plaît, écris-moi dès que tu peux pour que nous puissions tout planifier. Des vacances dans la Forêt-Noire - ce sera incroyablement beau !\n\nCordialement\nPetra`,
      hi: `प्रिय...\n\nमेरे पास एक शानदार आश्चर्य है। सोचो मेरे चाचा ने मुझे क्या पेशकश की। उन्होंने मुझे शनिवार को फोन किया। ब्लैक फॉरेस्ट में उनका छुट्टियों का एक बड़ा घर है। मैं छुट्टियों के लिए घर मुफ्त में ले सकता हूं। मैं दोस्तों को भी ला सकता हूं! क्या यह हमारे लिए कुछ नहीं होगा? हम सब वहां मिल सकते हैं। तुम, तुम्हारे माता-पिता और दोस्त, और मैं अपने परिवार और अपने दोस्तों के साथ। अगर यह काम करेगा तो मैं अविश्वसनीय रूप से खुश होऊंगा। कृपया मुझे जल्द से जल्द लिखें ताकि हम सब कुछ योजना बना सकें। ब्लैक फॉरेस्ट में छुट्टी - यह अविश्वसनीय रूप से सुंदर होगी!\n\nसादर\nपेट्रा`
    },

  {
    id: "sch2", title: "Eva - Traumberuf Und Neuigkeiten", level: "B1",
    text: `Liebe(r).......\n\nwie geht es denn so mit dem Deutsch lernen? Kommst du gut voran, und was machst du im Moment so? Stell dir vor, ich habe die neue Stelle bei der Zeitschrift VIA bekommen! ich arbeite jetzt als Journalistin, und das war ja immer mein Traumberuf!\n\nVIA wird vor allem von jüngeren Leuten gelesen. Deshalb schreiben wir viel über Berufe und Ausbildungen und auch über Freizeit und Sport. Für die nächsten Hefte von VIA planen wir jetzt eine neue Serie über Berufs wünsche. Was ist eigentlich dein Traumberuf? Wenn du möchtest, schicke ich dir gerne einmal ein Gratisheft von VIA, damit du siehst, was ich so mache.\n\nIch freue mich schon auf deine Antwort.\n\nHerzliche Grüße\nEva`,
    transText: {
      ar: `عزيزي/عزيزتي...\n\nكيف تسير الأمور مع تعلم اللغة الألمانية؟ هل تتقدم بشكل جيد، وماذا تفعل في الوقت الحالي؟ تخيل، لقد حصلت على الوظيفة الجديدة في مجلة VIA! أنا أعمل الآن كصحفية، وكان هذا دائماً حلم حياتي!\n\nمجلة VIA يقرأها بشكل أساسي الشباب. لذلك نكتب الكثير عن المهن والتدريبات وأيضاً عن وقت الفراغ والرياضة. للأعداد القادمة من VIA، نخطط الآن لسلسلة جديدة عن المهن المرغوبة. ما هي في الواقع مهنة أحلامك؟ إذا كنت ترغب في ذلك، سأرسل لك بكل سرور عدداً مجانياً من VIA لترى ما أفعله.\n\nأتطلع بالفعل إلى ردك.\n\nتحياتي القلبية\nإيفا`,
      ma: `عزيزي/عزيزتي...\n\nكيفاش دازة معاك القراية ديال الألمانية؟ واصل مزيان؟ وشنو كدير دابا؟ تخيل، خديت الخدمة الجديدة فالمجلة VIA! أنا دابا كنخدم كصحفية، وهادشي كان ديما الحلم ديالي!\n\nالمجلة VIA كيقراها بزاف الشباب. داكشي علاش كنكتبو بزاف على المهن والتكوينات وحتى على وقت الفراغ والرياضة. للأعداد الجاية ديال VIA، كنخطوطو دابا لسلسلة جديدة على المهن اللي كيحلمو بيها الناس. شنو هو الحلم ديالك فالمستقبل؟ يلا بغيتي، نصيفط ليك عدد مجاني من VIA باش تشوف شنو كندير.\n\nكنتسنى فالرد ديالك.\n\nتحياتي\nإيفا`,
      en: `Dear...\n\nhow are things going with learning German? Are you making good progress, and what are you doing at the moment? Imagine, I got the new job at the magazine VIA! I am now working as a journalist, and that was always my dream job!\n\nVIA is read mainly by younger people. That's why we write a lot about professions and training and also about leisure and sports. For the next issues of VIA we are now planning a new series about dream jobs. What is your dream job actually? If you want, I'll gladly send you a free copy of VIA so you can see what I do.\n\nI am already looking forward to your answer.\n\nBest regards\nEva`,
      fr: `Cher/Chère...\n\ncomment se passe l'apprentissage de l'allemand ? Est-ce que tu progresses bien, et qu'est-ce que tu fais en ce moment ? Figure-toi que j'ai obtenu le nouveau poste au magazine VIA ! Je travaille maintenant comme journaliste, et c'était toujours mon métier de rêve !\n\nVIA est surtout lu par les jeunes. C'est pourquoi nous écrivons beaucoup sur les métiers et les formations, mais aussi sur les loisirs et le sport. Pour les prochains numéros de VIA, nous prévoyons maintenant une nouvelle série sur les métiers de rêve. Quel est ton métier de rêve ? Si tu veux, je te donnerai volontiers un numéro gratuit de VIA pour que tu voies ce que je fais.\n\nJe me réjouis déjà de ta réponse.\n\nCordialement\nEva`,
      hi: `प्रिय...\n\nजर्मन सीखना कैसा चल रहा है? क्या आप अच्छी प्रगति कर रहे हैं, और इस समय क्या कर रहे हैं? कल्पना कीजिए, मुझे VIA पत्रिका में नई नौकरी मिल गई! मैं अब एक पत्रकार के रूप में काम कर रहा हूँ, और यह हमेशा मेरा सपनों का काम था!\n\nVIA मुख्य रूप से युवा लोगों द्वारा पढ़ा जाता है। इसलिए हम पेशे और प्रशिक्षण के बारे में बहुत कुछ लिखते हैं और आराम और खेल के बारे में भी। VIA के अगले अंकों के लिए हम अब सपनों की नौकरियों के बारे में एक नई श्रृंखला की योजना बना रहे हैं। वास्तव में आपका सपनों का काम क्या है? यदि आप चाहें, तो मैं आपको VIA की एक मुफ्त प्रति भेजकर खुशी से भेज दूंगा ताकि आप देख सकें कि मैं क्या करता हूं।\n\nमैं पहले से ही आपके जवाब का इंतजार कर रहा हूं।\n\nसादर\nएवा`
    },

    {n:1, c:"H", de:"Sie verbringen gern viele Stunden im Cafe, wollen aber nicht viel Geld ausgeben.", ar:"تحب قضاء ساعات طويلة في المقهى، ولكنك لا ترغب في إنفاق الكثير من المال.", ma:"كتحب تدوز ساعات فالمقهى، ولكن ما بغيتيش تصرف فلوس بزاف.", en:"You like spending many hours in a cafe but don't want to spend much money.", fr:"Vous aimez passer de nombreuses heures dans un café mais ne voulez pas dépenser beaucoup d'argent."},
    {n:2, c:"G", de:"Sie haben gerade den Beruf gewechselt und brauchen für die neue Aufgabe Grundkenntnisse für die Arbeit am Computer.", ar:"لقد غيرت مهنتك مؤخرًا وتحتاج إلى معرفة أساسية للعمل على الكمبيوتر من أجل المهمة الجديدة.", ma:"بدلتي الخدمة دابا وكتحتاج تعرف أساسيات الكمبيوتر للمهمة الجديدة.", en:"You have just changed jobs and need basic computer skills for the new task.", fr:"Vous venez de changer de métier et avez besoin de connaissances informatiques de base pour votre nouvelle tâche."},
    {n:3, c:"D", de:"Sie arbeiten in einem Krankenhaus und haben dort häufig mit Patienten aus aller Welt zu tun. Sie möchten für diese Arbeit noch besser qualifiziert sein.", ar:"تعمل في مستشفى وتتعامل غالبًا مع مرضى من جميع أنحاء العالم. ترغب في أن تكون أكثر تأهيلاً لهذه الوظيفة.", ma:"كتخدم فالمستشفى وكتعامل مع مرضى من العالم كامل. بغيتي تكون واجد كثر لهاد الخدمة.", en:"You work in a hospital and often deal with patients from all over the world. You want to be better qualified for this work.", fr:"Vous travaillez dans un hôpital et avez souvent affaire à des patients du monde entier. Vous souhaitez être mieux qualifié pour ce travail."},

    {n:5, c:"J", de:"Sie möchten beruflich etwas mit Fremdsprachen machen. Deshalb wollen Sie im Ausland studieren um später vielleicht auch dort zu arbeiten.", ar:"ترغب في العمل في مجال يتعلق باللغات الأجنبية. لذلك تريد الدراسة في الخارج وربما العمل هناك لاحقًا.", ma:"بغيتي تخدم شي حاجة فاللغات. داكشي علاش بغيتي تقرا فالخارج وربما تخدم تما من بعد.", en:"You want to work in a field related to foreign languages. That's why you want to study abroad and maybe work there later.", fr:"Vous souhaitez travailler dans un domaine lié aux langues étrangères. C'est pourquoi vous voulez étudier à l'étranger et peut-être y travailler plus tard."},
    {n:6, c:"A", de:"Sie wollen mit einem Bekannten einen gemütlichen Nachmittag in der Stadt verbringen. Sie wissen, dass Ihr Bekannter am Liebsten süße Sachen isst.", ar:"تريد قضاء فترة بعد الظهر المريحة في المدينة مع أحد معارفك. تعلم أن صديقك يفضل تناول الأشياء الحلوة.", ma:"بغيتي تدوز شي نهار مريح فالمدينة مع شي صاحب. عارف بلي صحابك كيحب الحلويات.", en:"You want to spend a cozy afternoon in the city with an acquaintance. You know that your acquaintance loves eating sweet things.", fr:"Vous voulez passer un après-midi agréable en ville avec une connaissance. Vous savez que votre connaissance aime manger des choses sucrées."},
    {n:7, c:"I", de:"Ihr Freund aus den USA ist zu Besuch. Er ist Weinkenner und möchte europäische Weine probieren.", ar:"صديقك من الولايات المتحدة يزورك. هو خبير في النبيذ ويرغب في تذوق النبيذ الأوروبي.", ma:"صاحبك من أمريكا جاي يزورك. هو خبير فنبيذ وبغى يدوق النبيذ الأوروبي.", en:"Your friend from the USA is visiting. He is a wine connoisseur and wants to try European wines.", fr:"Votre ami des États-Unis est en visite. Il est connaisseur en vin et souhaite goûter des vins européens."},
    {n:8, c:"X", de:"In Ihrer Freizeit möchten Sie sich mit anderen Ländern, fremden Kulturen und Traditionen beschäftigen.", ar:"في وقت فراغك، ترغب في التعرف على بلدان أخرى وثقافات وتقاليد مختلفة.", ma:"فوقت الفراغ ديالك، بغيتي تعرف بلدان وثقافات وتقاليد أخرى.", en:"In your free time, you want to deal with other countries, foreign cultures and traditions.", fr:"Pendant votre temps libre, vous souhaitez vous intéresser à d'autres pays, cultures et traditions étrangères."},
    {n:9, c:"F", de:"Die Tochter Ihrer Freunde hat gerade Abitur gemacht und ist nicht sicher, was sie später machen will. Sie braucht Informationen und Beratung.", ar:"ابنة أصدقائك أنهت للتو الثانوية العامة وهي غير متأكدة مما تريد فعله لاحقًا. تحتاج إلى معلومات واستشارة.", ma:"بنت صحابك دازت الباك دابا وما عارفاش شنو بغات دير من بعد. كتحتاج معلومات ونصيحة.", en:"Your friend's daughter has just graduated from high school and is unsure what she wants to do later. She needs information and advice.", fr:"La fille de vos amis vient d'obtenir son baccalauréat et ne sait pas ce qu'elle veut faire plus tard. Elle a besoin d'informations et de conseils."},
    {n:10, c:"C", de:"Sie möchten mit Freunden in einem Lokal mit Unterhaltungsprogramm essen. Ihre Freunde essen aber weder Fleisch noch Fisch.", ar:"ترغب في تناول الطعام مع أصدقائك في مكان يقدم برنامج ترفيهي. لكن أصدقاؤك لا يتناولون اللحوم أو الأسماك.", ma:"بغيتي تاكل مع صحابك فشي بلاصة فيها برنامج ترفيهي. ولكن صحابك ما كياكلوش اللحم ولا الحوت.", en:"You want to eat with friends in a restaurant with an entertainment program. But your friends eat neither meat nor fish.", fr:"Vous souhaitez manger avec des amis dans un restaurant avec un programme de divertissement. Mais vos amis ne mangent ni viande ni poisson."}

{
  id:"alex-sp1", title:"Alex Und Cora", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Schaffhausen, den...\nHallo Isabelle,\nwie geht es dir? Hast du deine Prüfungen geschafft?\nWie du ja weißt, .....(1)..... ich seit zwei Monaten in einem Altersheim .....(2)..... der Nähe von Schaffhausen. Die Arbeit in .....(3)..... Haus gefällt mir gut, obwohl es manchmal auch sehr stressig ist. Besonders schön ist der enge .....(4)..... zu einigen der alten Menschen. Eine Frau, Anna Ringier, mag ich .....(5)..... gern. Sie ist schon 96 Jahre alt und sitzt im Rollstuhl, aber sie ist immer fröhlich. Gestern hat sie mir .....(6)..... ganzes Leben erzählt. Sie hat bis zum 84. Lebensjahr .....(7)..... gearbeitet. Schon als achtjähriges Mädchen musste sie bei einem Bauern arbeiten, .....(8)..... ihre Eltern die neunköpfige Familie nicht ernähren konnten. Später arbeitete Anna als Schneiderin.\nNeben ihrer Arbeit hat Anna .....(9)..... auf eine Sache nie verzichtet: das Bergsteigen! Das war immer ihre große Leidenschaft. Diese Frau ist wirklich sehr beeindruckend!\nAber du .....(10)..... bestimmt auch viel erlebt. Ich würde mich sehr freuen, wenn du mir bald wieder einmal schreibst!\nHerzliche Grüße\ndeine Julie`,
  transText: {
    ar: `شافهاوزن، في...\nمرحباً إيزابيل،\nكيف حالك؟ هل اجتزت امتحاناتك؟\nكما تعلمين، أنا أعمل منذ شهرين في دار للمسنين بالقرب من شافهاوزن. العمل في هذا المنزل يعجبني، رغم أنه مرهق جداً في بعض الأحيان. الشيء الجميل بشكل خاص هو التواصل الوثيق مع بعض كبار السن. هناك سيدة، آنا رينجير، أحبها كثيراً. عمرها 96 عاماً وتجلس على كرسي متحرك، لكنها دائماً مبتهجة. أمس أخبرتني عن حياتها بأكملها. عملت بجد حتى سن 84. حتى عندما كانت فتاة في الثامنة من عمرها، كان عليها أن تعمل لدى مزارع لأن والديها لم يتمكنا من إطعام الأسرة المكونة من تسعة أفراد. في وقت لاحق عملت آنا كخياطة.\nإلى جانب عملها، لم تتخل آنا أبداً عن شيء واحد: تسلق الجبال! كان هذا دائماً شغفها الكبير. هذه المرأة مثيرة للإعجاب حقاً!\nولكن من المؤكد أنك مررت بالكثير من التجارب أيضاً. سأكون سعيداً جداً إذا كتبت لي مرة أخرى قريباً!\nتحياتي الحارة\nجوليا`,
    ma: `شافهاوزن، في...\nمرحباً إيزابيل،\nكيف حالك؟ واش دوزتي الامتحانات ديالك؟\nبحال ما كتعرفي، أنا كنخدم منذ شهرين في دار المسنين قرب شافهاوزن. الخدمة في هاد الدار كتعجبني، رغم أنها مرهقة جداً في بعض الأحيان. الحاجة الزوينة بزاف هي التواصل القريب مع بعض الناس الكبار. كاينة سيدة، آنا رينجير، كنحبها بزاف. عمرها 96 عاماً وكتجلس على كرسي متحرك، ولكنها دائماً مبتهجة. البارح حكات ليا على حياتها كاملة. خدمت بجد حتى لسن 84. حتى ملي كانت بنت عندها 8 سنين، كان عليها تخدم عند مزارع حيت والديها ما قدروش يكلو عائلة ديال 9 ديال الناس. من بعد آنا خدمت كخياطة.\nإلى جانب الخدمة ديالها، آنا عمرها ما تنازلت على حاجة وحدة: تسلق الجبال! هادشي كان ديما شغفها الكبير. هاد السيدة مثيرة للإعجاب بزاف!\nولكن أكيد نتا حتى نتا دوزتي بزاف ديال التجارب. غادي نفرح بزاف يلا كتبتي ليا مرة أخرى قريباً!\nتحياتي الحارة\nجوليا`
  },

{
  id:"alex-sp2", title:"Alex Und Cora", level:"B1", sub:"Sprach 2", type:"sprach2",
  wordBank:[{k:"a",w:"an"},{k:"b",w:"Bekannte"},{k:"c",w:"bereits"},{k:"d",w:"dafür"},{k:"e",w:"darüber"},{k:"f",w:"dass"},{k:"g",w:"Familie"},{k:"h",w:"kann"},{k:"i",w:"mich"},{k:"j",w:"mit"},{k:"k",w:"muss"},{k:"l",w:"ob"},{k:"m",w:"sehr"},{k:"n",w:"was"},{k:"o",w:"welche"}],
  text: `Sehr geehrte Damen und Herren,\n\nnachdem ich Ihr Inserat gelesen habe, möchte ich .....(1)..... gern genauer über Ihr Restaurant informieren. In einem Monat feiere ich meinen 30. Geburtstag und möchte dazu viele Freunde und .....(2)..... einladen. .....(3)..... wäre Ihr Hotel sicher sehr gut geeignet. Deshalb noch einige Fragen .....(4)..... Sie: Ich rechne ungefähr mit 25 Personen. Wie hoch ist die Miete für den passenden Raum und .....(5)..... Gerichte können Sie mir empfehlen? Da fast alle Gäste mit dem Auto kommen werden, wäre es auch wichtig, .....(6)..... genügend Parkplätze vorhanden sind.\n\nEs wäre .....(7)..... freundlich von Ihnen, wenn Sie mir möglichst bald Bescheid geben könnten, damit ich die Einladungen verschicken .....(8)...... Bitte senden Sie mir einen Prospekt Ihres Hotels .....(9)..... genauer Wegbeschreibung. Sollten Ihre Räume für den Monat Mai .....(10)..... ausgebucht sein, geben Sie mir bitte umgehend Bescheid.\n\nMit freundlichen Grüßen\nBarbara Heuberger`,
  transText: {
    ar: `سيداتي وسادتي،\n\nبعد أن قرأت إعلانكم، أود الحصول على مزيد من المعلومات حول مطعمكم. بعد شهر سأحتفل بعيد ميلادي الثلاثين وأود دعوة العديد من الأصدقاء والمعارف. لذلك سيكون فندقكم مناسباً جداً بالتأكيد. لذلك لدي بعض الأسئلة لكم: أتوقع حوالي 25 شخصاً. كم تبلغ تكلفة استئجار الغرفة المناسبة وما هي الأطباق التي يمكنكم التوصية بها؟ نظراً لأن جميع الضيوف تقريباً سيأتون بالسيارة، سيكون من المهم أيضاً التأكد من توفر ما يكفي من مواقف السيارات.\n\nسأكون ممتناً جداً إذا تمكنتم من إبلاغي في أقرب وقت ممكن حتى أتمكن من إرسال الدعوات. يرجى إرسال كتيب عن فندقكم مع وصف دقيق للطريق. إذا كانت غرفكم محجوزة بالكامل لشهر مايو، فيرجى إبلاغي على الفور.\n\nمع أطيب التحيات\nباربرا هوبرغر`,
    ma: `سيداتي وسادتي،\n\nمن بعد ما قريت الإعلان ديالكم، بغيت نعرف كثر على المطعم ديالكم. من بعد شهر غادي نحتفل بعيد ميلادي الثلاثين وبغيت نعيط لبزاف ديال الصحاب والمعارف. داكشي علاش الفندق ديالكم أكيد غادي يكون مناسب بزاف. داكشي علاش عندي شي أسئلة ليكم: كنتوقع حوالي 25 ديال الناس. بشحال كتكري الغرفة المناسبة وشنو هي الماكلة اللي تقدرو تنصحوني بها؟ حيت تقريباً كاع الضيوف غادي يجيو بالطوموبيل، خاصنا نتأكدو بلي كاينين مواقف كافيين للطوموبيلات.\n\nغادي نكون ممتن بزاف يلا قديتو تخبروني في أقرب وقت ممكن باش نقدر نصيفط الدعوات. عفاك صيفطو ليا كتيب على الفندق ديالكم مع وصف دقيق للطريق. يلا كانت الغرف ديالكم محجوزة بالكامل لشهر ماي، عفاك خبروني دغيا.\n\nمع أطيب التحيات\nباربرا هوبرغر`
  },

  items:[
    {n:1, c:"h", de:"Du bist, was du isst, hat als Slogan ausgedient. Heute muss es heißen: Gut aussehen mit dem richtigen Essen. Dort kaufen bereits viele Leute neue teure Lebensmittel, die jüngeres Aussehen versprechen.", ar:"اتجاه جديد من أمريكا: أطعمة غالية تعد بمظهر أصغر، والناس مستعدون لدفع الكثير.", ma:"ترند جديد من أمريكا: ماكلة غالية كتعطي مظهر صغير، والناس واجدين يخلصو بزاف.", en:"New trend from the USA: expensive foods promise a younger appearance, and people are willing to pay a lot.", fr:"Nouvelle tendance des États-Unis : des aliments chers promettent une apparence plus jeune, et les gens sont prêts à payer cher."},
    {n:2, c:"c", de:"Frisch verheiratete Paare nehmen oft schon in den Flitterwochen einige Kilos zu, weil sie ihre Essgewohnheiten ändern.", ar:"المتزوجون حديثاً يكتسبون وزناً بسبب تغيير عاداتهم الغذائية.", ma:"اللي تزوجو جديد كيزيدو فالوزن حيت كيبدلو عادات الماكلة ديالهم.", en:"Newly married couples often gain weight because they change their eating habits.", fr:"Les jeunes mariés prennent souvent du poids parce qu'ils changent leurs habitudes alimentaires."},
    {n:3, c:"e", de:"Der Schokolade-Boom hat nun auch die Schönheitsindustrie erreicht. Vom 16. Januar bis zum 24. Februar bietet das Grand Hotel Bad Ragaz unter dem Namen Choco Therapy Behandlungen mit Schokolade an.", ar:"النص يتكلم عن علاجات تجميل بالشوكولاتة في فندق سويسري.", ma:"النص كيهضر على علاجات ديال الزين بالشوكولا فشي فندق سويسري.", en:"The text is about chocolate beauty treatments in a Swiss hotel.", fr:"Le texte parle de soins de beauté au chocolat dans un hôtel suisse."},
    {n:4, c:"f", de:"Nach dem Motto „beschwingt und bewegt“ starten die Schweizer Gesundheitsbehörden eine landesweite Bewegungskampagne. Dabei soll die Schweizer Bevölkerung aufgerufen werden, ausgewogen zu essen und sich täglich zu bewegen.", ar:"حملة صحية سويسرية لتشجيع الناس على الرياضة وأكل متوازن.", ma:"حملة صحية سويسرية باش تشجع الناس على الرياضة والماكلة المتوازنة.", en:"A Swiss health campaign to encourage people to exercise and eat a balanced diet.", fr:"Une campagne de santé suisse pour encourager les gens à faire du sport et à manger équilibré."},
    {n:5, c:"i", de:"Wer acht Stunden und länger schläft, hat eine deutlich kürzere Lebenserwartung. Das berichtete das Apothekenmagazin Gesundheit und bezog sich auf eine neue japanische Studie.", ar:"الدراسة اليابانية تقول إن النوم الطويل يقلل العمر، والعنوان الصحيح هو النوم أقل.", ma:"الدراسة اليابانية كتقول بلي النعاس الطويل كينقص العمر، والعنوان الصحيح هو نعس قليل.", en:"The Japanese study says that long sleep reduces lifespan, and the correct title is sleep less.", fr:"L'étude japonaise dit que dormir longtemps réduit l'espérance de vie, et le bon titre est dormir moins."}

},
{
  id:"rita-t2", title:"Rita", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Endlich wird der Traum von Louis Palmer wahr: Der Schweizer startet mit seinem Auto, das mit Sonnenenergie fährt, zur Weltumrundung.", ar: "أخيراً يتحقق حلم لويس بالمر: يبدأ السويسري رحلته حول العالم بسيارته التي تعمل بالطاقة الشمسية.", ma: "أخيراً تحقق الحلم ديال لويس بالمر: السويسري غادي يدور العالم بالطوموبيل ديالو اللي كتمشي بالطاقة الشمسية.", en: "Louis Palmer's dream is finally coming true: the Swiss man is starting his trip around the world in a solar-powered car.", fr: "Le rêve de Louis Palmer se réalise enfin : le Suisse entame son tour du monde dans une voiture solaire." },
    { de: "Entwickelt für mich ein Fahrzeug für eine Weltreise, die mit Sonnenenergie fährt, forderte Louis Palmer Studenten auf. Heute ist das Auto fertig: ein dreirädriges Fahrzeug mit zwei Sitzplätzen.", ar: "\"طوروا لي مركبة لرحلة حول العالم تعمل بالطاقة الشمسية\"، طلب لويس بالمر من طلاب في جامعات سويسرية.", ma: "\"طورو ليا طوموبيل تدور العالم بالطاقة الشمسية\"، هادشي طلبو لويس بالمر من طلبة فجامعات سويسرية.", en: "\"Develop a solar-powered vehicle for a trip around the world for me,\" Louis Palmer asked students at Swiss universities.", fr: "\"Développez-moi un véhicule solaire pour un tour du monde\", a demandé Louis Palmer à des étudiants d'universités suisses." },
    { de: "Phase eins begann mit 23 Jahren: Er zog aus, um 50 Länder auf allen Kontinenten zu bereisen: Anstatt an die Uni zu gehen, habe ich die Welt studiert.", ar: "بدأت المرحلة الأولى في سن 23: خرج للسفر إلى 50 دولة في جميع القارات: \"بدلاً من الذهاب إلى الجامعة، درست العالم\".", ma: "المرحلة الأولى بدات فسن 23: خرج باش يسافر لـ 50 بلاد فجميع القارات: \"بلاصة ما نمشي للجامعة، قريت العالم\".", en: "Phase one began at the age of 23: He set out to travel to 50 countries on all continents: \"Instead of going to university, I studied the world.\"", fr: "La première phase a commencé à l'âge de 23 ans : Il est parti voyager dans 50 pays sur tous les continents : \"Au lieu d'aller à l'université, j'ai étudié le monde.\"" }

{
  id:"rita-sp1", title:"Rita", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Liebe Catherine,\nich hab's geschafft! Endlich habe ich einen Job bekommen. Wie versprochen möchte ich dir gleich .....(1)..... erzählen. Am Anfang .....(2)..... ich ziemlich enttäuscht, weil ich auf meine vielen Bewerbungsschreiben insgesamt .....(3)..... zwei Antworten bekommen habe. Aber zum Glück hat einer davon .....(4).....: Ich werde nun zwei Nachmittage in der Woche als Babysitterin .....(5)..... einer Familie arbeiten, die zwei Kinder hat. Sie sind 3 und 5 Jahre alt und .....(6)..... sind sehr nett. Wir haben in der .....(7)..... Woche bereits Vieles gemeinsam gemacht, sind in den Zoo und .....(8)..... Kindermuseum gegangen. .....(9)..... kann man eine Stadt gar nicht kennenlernen, und es macht mir viel Spaß!\nFür heute wünsche ich dir alles Gute, schreibe mir bald, wie es dir .....(10)..... .\nLiebe Grüße\nDeine Tanja`,
  transText: {
    ar: `عزيزتي كاثرين،\nلقد نجحت! أخيراً حصلت على وظيفة. كما وعدتك، أريد أن أخبرك فوراً بالخبر. في البداية كنت محبطة جداً، لأنني تلقيت فقط إجابتين من إجمالي طلبات التوظيف الكثيرة التي أرسلتها. لكن لحسن الحظ، نجح أحدها: سأعمل الآن كجليسة أطفال لأسرة لديها طفلان، لمدة فترتين بعد الظهر في الأسبوع. يبلغان من العمر 3 و 5 سنوات وكلاهما لطيفان جداً. لقد قمنا بالكثير من الأشياء معاً في الأسبوع الأول، وذهبنا إلى حديقة الحيوان ومتحف الأطفال. بهذه الطريقة لا يمكنك التعرف على المدينة على الإطلاق، لكن الأمر ممتع للغاية بالنسبة لي!\nأتمنى لك كل التوفيق اليوم، اكتبي لي قريباً كيف حالك.\nمع أطيب التحيات\nتانيا`,
    ma: `عزيزتي كاثرين،\nنجحت! أخيراً حصلت على عمل. كما وعدتك، أريد أن أخبرك على الفور. في البداية كنت محبطة جداً، لأنني تلقيت فقط إجابتين من إجمالي طلبات التوظيف الكثيرة التي أرسلتها. لكن لحسن الحظ، نجح أحدها: سأعمل الآن كجليسة أطفال لأسرة لديها طفلان، لمدة فترتين بعد الظهر في الأسبوع. يبلغان من العمر 3 و 5 سنوات وكلاهما لطيفان جداً. لقد قمنا بالكثير من الأشياء معاً في الأسبوع الأول، وذهبنا إلى حديقة الحيوان ومتحف الأطفال. بهذه الطريقة لا يمكنك التعرف على المدينة على الإطلاق، لكن الأمر ممتع للغاية بالنسبة لي!\nأتمنى لك كل التوفيق اليوم، اكتبي لي قريباً كيف حالك.\nمع أطيب التحيات\nتانيا`
  },

{
  id:"rita-sp2", title:"Rita", level:"B1", sub:"Sprach 2", type:"sprach2",
  wordBank:[{k:"a",w:"der"},{k:"b",w:"die"},{k:"c",w:"Erst"},{k:"d",w:"geeignet"},{k:"e",w:"gerne"},{k:"f",w:"hätte"},{k:"g",w:"in"},{k:"h",w:"muss"},{k:"i",w:"nach"},{k:"j",w:"noch"},{k:"k",w:"schon"},{k:"l",w:"wann"},{k:"m",w:"wäre"},{k:"n",w:"wenn"},{k:"o",w:"wo"}],
  text: `Ihre Anzeige in der Frankfurter Rundschau\n\nSehr geehrte Frau Herrmann ,\n\nich habe Ihre Anzeige in der Frankfurter Rundschau vom 5. Oktober gelesen und interessiere mich sehr für die 3-Zimmer-Wohnung.\n\nZurzeit wohne ich noch in Krakau (Polen). Demnächst .....(1)..... ich aber aus beruflichen Gründen mit meinem Sohn (3 Jahre) .....(2)..... Frankfurt umziehen. Deshalb suche ich zum 1. November eine Wohnung, .....(3)..... möglichst zentral gelegen sein sollte. Ihre Wohnung .....(4)..... deshalb genau richtig für uns.\n\nIch hätte jedoch noch einige Fragen zu Ihrer Anzeige: Ist die Wohnung auch für Kleinkinder .....(5).....? Und gibt es in der näheren Umgebung einen Spielplatz, .....(6)..... mein Sohn spielen könnte? Außerdem würde ich .....(7)..... wissen, ob die Haltung von Haustieren in .....(8)..... Wohnung erlaubt ist. .....(9)..... es möglich ist, würden wir nämlich gerne unseren Hund mitbringen.\n\nIch danke Ihnen .....(10)..... jetzt für Ihre Antwort und grüße Sie freundlich.\n\nKASIA KLOC`,
  transText: {
    ar: `إعلانكم في صحيفة فرانكفورتر روندشاو\n\nعزيزتي السيدة هيرمان،\n\nلقد قرأت إعلانكم في صحيفة فرانكفورتر روندشاو بتاريخ 5 أكتوبر وأنا مهتمة جداً بشقة بثلاث غرف.\n\nأعيش حالياً في كراكوف (بولندا). ولكن قريباً سأضطر إلى الانتقال إلى فرانكفورت مع ابني (3 سنوات) لأسباب مهنية. لذلك أبحث عن شقة اعتباراً من 1 نوفمبر، يجب أن تكون في موقع مركزي قدر الإمكان. لذلك فإن شقتكم مناسبة تماماً لنا.\n\nومع ذلك، لدي بعض الأسئلة حول إعلانكم: هل الشقة مناسبة أيضاً للأطفال الصغار؟ وهل توجد ملعب أطفال في الجوار يمكن لابني اللعب فيه؟ بالإضافة إلى ذلك، أود أن أعرف ما إذا كان يُسمح بتربية الحيوانات الأليفة في الشقة. إذا كان ذلك ممكناً، نود أن نجلب كلبنا معنا.\n\nأشكركم مسبقاً على ردكم وأحييكم بتحية طيبة.\n\nكاسيا كلوك`,
    ma: `إعلانكم في صحيفة فرانكفورتر روندشاو\n\nعزيزتي السيدة هيرمان،\n\nقريت الإعلان ديالكم في صحيفة فرانكفورتر روندشاو بتاريخ 5 أكتوبر وأنا مهتمة بزاف بشقة فيها 3 ديال الغرف.\n\nدابا كنعيش في كراكوف (بولندا). ولكن قريباً غادي نضطر ننتقل لفرانكفورت مع ولدي (3 سنين) لأسباب مهنية. داكشي علاش كنقلب على شقة من 1 نوفمبر، خاصها تكون في موقع مركزي قد ما يمكن. داكشي علاش الشقة ديالكم مناسبة تماماً لينا.\n\nولكن عندي شي أسئلة على الإعلان ديالكم: واش الشقة مناسبة حتى للدراري الصغار؟ وواش كاين شي ملعب ديال الدراري قريب فين يقدر ولدي يلعب؟ بالإضافة لهادشي، بغيت نعرف واش مسموح بتربية الحيوانات الأليفة في الشقة. يلا كان ممكن، بغينا نجيبو الكلب ديالنا معانا.\n\nكنشكركم مقدماً على الرد ديالكم وكنحييكم بتحية طيبة.\n\nكاسيا كلوك`
  },

{
  id:"caroline-t2", title:"Caroline", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Anne und Melanie (beide 6) stehen Erzieherinnen mit Vorschlägen hilfreich zur Seite. Sie sind die Problemlöser im Kindergarten.", ar: "آن وميلاني (كلاهما 6 سنوات) تساعدان المربيات باقتراحات مفيدة.", ma: "آن وميلاني (بجوج عندهم 6 سنين) كيعاونو المربيات بالاقتراحات.", en: "Anne and Melanie (both 6) help educators with suggestions. They are the problem solvers in kindergarten.", fr: "Anne et Melanie (toutes deux 6 ans) aident les éducatrices avec des suggestions." },
    { de: "Im Rahmen dieses Projekts werden in städtischen Kindergärten zwei Wanderstationen mit je drei Multimedia-Computern installiert.", ar: "في إطار هذا المشروع، سيتم تركيب محطتين متنقلتين في رياض الأطفال البلدية.", ma: "فهاد المشروع، غادي يحطو جوج محطات متنقلين فرض الأطفال.", en: "As part of this project, two mobile stations will be installed in municipal kindergartens.", fr: "Dans le cadre de ce projet, deux stations mobiles seront installées dans les jardins d'enfants municipaux." },
    { de: "Bevor jedoch die Computer in die Kindergärten kamen, waren die Eltern aufzuklären. Bei manchen Eltern löste das Stichwort Computer akute Ängste aus.", ar: "لكن قبل أن تصل أجهزة الكمبيوتر إلى رياض الأطفال، كان لا بد من توعية الآباء.", ma: "ولكن قبل ما توصل الكمبيوترات لرض الأطفال، كان خاص توعية الوالدين.", en: "However, before the computers arrived in the kindergartens, the parents had to be educated.", fr: "Cependant, avant l'arrivée des ordinateurs dans les jardins d'enfants, il fallait informer les parents." },
    { de: "Diese Ängste haben sich inzwischen gelegt und die Erfahrung vor Ort zeigt, dass sie weitgehend überflüssig sind. Die Erzieherinnen achten auch darauf, dass die Kinder nie länger als 15 bis 20 Minuten vor den Computern sitzen, und holen vor allem kreative Software auf den Bildschirm.", ar: "لقد هدأت هذه المخاوف في غضون ذلك، وتظهر التجربة الميدانية أنها زائدة عن الحاجة إلى حد كبير. يحرص المربيات أيضاً على ألا يجلس الأطفال أمام الكمبيوتر لأكثر من 15 إلى 20 دقيقة، ويجلبون برامج إبداعية إلى الشاشة قبل كل شيء.", ma: "هاد المخاوف هدات دابا، والتجربة كتبين بلي هادشي زايد. المربيات كيحرصو بلي الدراري ما يقعدوش كثر من 15 ولا 20 دقيقة قدام الكمبيوتر، وكتجيبو ليهم برامج إبداعية.", en: "These fears have now subsided and experience on site shows that they are largely superfluous. The educators also make sure that the children never sit in front of the computers for longer than 15 to 20 minutes, and above all bring creative software to the screen.", fr: "Ces craintes se sont depuis lors apaisées et l'expérience sur le terrain montre qu'elles sont largement superflues. Les éducatrices veillent également à ce que les enfants ne restent jamais plus de 15 à 20 minutes devant les ordinateurs, et mettent surtout des logiciels créatifs à l'écran." },
    { de: "Das einsame Dämmern vor dem Computer ist wohl ohnehin eher Sache der Erwachsenen – die Kinder spielen immer zu zweit oder zu dritt an der Maschine. Eva Schilling hat beobachtet, dass die Kinder am Computer sehr friedlich miteinander umgehen, sie helfen sich gegenseitig, es gibt wenig Konflikte.", ar: "على أي حال، فإن النعاس الوحيد أمام الكمبيوتر هو بالأحرى من شؤون البالغين - فالأطفال يلعبون دائماً في مجموعات من شخصين أو ثلاثة على الجهاز. لاحظت إيفا شيلينغ أن الأطفال يتعاملون مع بعضهم البعض بسلام شديد على الكمبيوتر، ويساعدون بعضهم البعض، ولا يوجد سوى القليل من الصراعات.", ma: "القعدة بوحدك قدام الكمبيوتر هي حاجة ديال الكبار - الدراري ديما كيلعبو بجوج ولا بثلاثة. إيفا شيلينغ لاحظات بلي الدراري كيتعاملو مزيان مع بعضياتهم قدام الكمبيوتر، كيعاونو بعضياتهم، وما كاينش المشاكل.", en: "Lonely brooding in front of the computer is probably more a matter for adults anyway - the children always play in twos or threes on the machine. Eva Schilling has observed that the children treat each other very peacefully on the computer, they help each other, there are few conflicts.", fr: "La rêverie solitaire devant l'ordinateur est de toute façon plutôt l'affaire des adultes - les enfants jouent toujours à deux ou à trois sur la machine. Eva Schilling a observé que les enfants se traitent très paisiblement sur l'ordinateur, ils s'entraident, il y a peu de conflits." }
  ],

{
  id:"caroline-sp1", title:"Caroline", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Liebe Catherine,\nseit ich dir letzte Mal von meinem Sprachhaufenhalt in der Schweiz .....(1)..... habe, ist viel passiert. Ich kenne .....(2)..... Land jetzt schon recht gut. Die Schweiz ist ja wirklich nicht groß. .....(3)..... in jeder Gegend wird ein anderer Dialekt oder gar eine andere Sprache gesprochen. Das ist .....(4)..... mich fast unglaublich! Bei uns in Australien fährt man mit dem Auto 24 Stunden lang geradeaus, und .....(5)..... man ankommt, dann sprechen die Leute dort immer noch dieselbe Sprache. Am Anfang hat mich das Sprachgemisch .....(6)..... sehr verwirrt, aber .....(7)..... verstehe ich fast alles, wenn jemand auf Schweizerdeutsch zu mir spricht. Ich kann aber nur auf Hochdeutsch antworten. Zwischen der Schule hier und unserem Schulsystem in Australien gibt es einige .....(8).....: In der Schweiz sprechen die Lehrer viel und die Schüler .....(9)..... Vieles im Kopf behalteIn Australien arbeiten wir meistens im Rahmen von Projekten und machen eigentlich alle Aufgaben auf .....(10)..... Computer.\nViele Grüße\nJack`,
  transText: {
    ar: `عزيزتي كاثرين،\nمنذ أن أخبرتك آخر مرة عن إقامتي لتعلم اللغة في سويسرا، حدث الكثير. أنا أعرف هذا البلد جيداً الآن. سويسرا حقاً ليست كبيرة. ولكن في كل منطقة يتم التحدث بلهجة مختلفة أو حتى بلغة مختلفة. هذا أمر لا يصدق تقريباً بالنسبة لي! في أستراليا، يمكنك القيادة بالسيارة لمدة 24 ساعة على التوالي، وعندما تصل إلى هناك، لا يزال الناس يتحدثون نفس اللغة. في البداية، أربكني هذا المزيج اللغوي كثيراً، ولكن الآن أفهم تقريباً كل شيء عندما يتحدث إلي شخص ما باللهجة السويسرية الألمانية. لكن لا يمكنني الرد إلا بالألمانية الفصحى. هناك بعض الاختلافات بين المدرسة هنا ونظامنا المدرسي في أستراليا: في سويسرا يتحدث المعلمون كثيراً ويجب على الطلاب الاحتفاظ بالكثير في رؤوسهم أو كتابته. في أستراليا، نعمل غالباً في إطار مشاريع ونقوم بجميع المهام على الكمبيوتر.\nمع أطيب التحيات\nجاك`,
    ma: `عزيزتي كاثرين،\nمن بعد ما خبرتك آخر مرة على الإقامة ديالي باش نتعلم اللغة فسويسرا، وقع بزاف ديال الحوايج. دابا كنعرف هاد البلاد مزيان. سويسرا بصح ماشي كبيرة. ولكن فكل منطقة كيهضرو بلهجة مختلفة ولا حتى بلغة مختلفة. هادشي بالنسبة ليا شبه مستحيل! فأستراليا، كتقدر تسوق الطوموبيل لمدة 24 ساعة على التوالي، وملي توصل، كتلاقى الناس تما مازال كيهضرو نفس اللغة. في البداية، هاد الخلط اللغوي ربلني بزاف، ولكن دابا كنفهم تقريباً كلشي ملي شي واحد كيهضر معايا بالألمانية السويسرية. ولكن ما كنقدرش نجاوب غير بالألمانية الفصحى. كاينين شي فروقات بين المدرسة هنا والنظام المدرسي ديالنا فأستراليا: فسويسرا الأساتذة كيهضرو بزاف والتلاميذ خاصهم يحفظو بزاف ديال الحوايج ولا يكتبوهم. فأستراليا، كنخدمو غالباً فإطار مشاريع وكنديرو تقريباً كاع المهام على الكمبيوتر.\nمع أطيب التحيات\nجاك`
  },

  text: `QUANTUM-SYSTEM\n\nDas Lotterie – Systemspiel\n\nOtto – Suhr- Allee 100. D- 10120 Berlin\n\nSehr geehrte Lottospieler,\n\nwer möchte nicht auch .....(1)..... bei sechs Richtigen im Lotto dabei sein? Vertrauen Sie beim Lottospiel nicht .....(2)..... auf das Glück, denn Sie .....(3)..... Ihre Chancen selbst stark verbessern, .....(4)..... Sie mit unserem Lotterie-System spielen – und das für nur 5 Euro in der Woche! .....(5)..... allein zu spielen, spielen Sie mit uns in einer starken Spielergemeinschaft. Dadurch erhöhen sich .....(6)..... automatisch Ihre Chancen! Und was Sie gewinnen können? .....(7)..... unserem Quantum-System spielen Sie mit einer Chance auf einen Gewinn von 1 Million Euro! Alle Gewinne erhalten Sie umgehend und ungekürzt zu 100% – das .....(8)..... wir Ihnen!\n\nDavon habe ich mich selbst überzeugt! Spielen Sie mit uns das Quantum-System: .....(9)..... 700 Quantum-Systemspielgruppen haben zusammen schon über sieben Millionen Euro gewonnen.\n\nHerzliche Grüße\nIhre SABINE MEIER-PÜTZ\n\nPS: Als besondere Gewinnchance erhalten Sie heute das Vier-Richtige-Gratisspiel. .....(10)..... Sie hier unbedingt mit und gewinnen Sie! Ich drücke Ihnen die Daumen……`,
  transText: {
    ar: `نظام الكم\n\nلعبة اليانصيب - النظام\n\nأوتو - سور ألي 100. D-10120 برلين\n\nعزيزي لاعب اليانصيب،\n\nمن لا يريد أن يكون هناك أيضاً عند الفوز بستة أرقام صحيحة في اليانصيب؟ لا تثق بالحظ فقط عند لعب اليانصيب، لأنك يمكنك تحسين فرصك بشكل كبير إذا لعبت بنظام اليانصيب الخاص بنا - وذلك مقابل 5 يورو فقط في الأسبوع! بدلاً من اللعب بمفردك، العب معنا في مجتمع لاعبين قوي. هذا يزيد تلقائياً من فرصك! وماذا يمكنك أن تفوز؟ مع نظام الكم الخاص بنا، لديك فرصة للفوز بمليون يورو! سوف تتلقى جميع المكاسب على الفور وبدون خصم 100% - نحن نضمن لك ذلك!\n\nلقد أقنعت نفسي بذلك! العب معنا نظام الكم: أكثر من 700 مجموعة من نظام الكم فازت معاً بأكثر من سبعة ملايين يورو.\n\nتحياتي الحارة\nسابين ماير-بوتز\n\nملاحظة: كفرصة ربح خاصة، ستتلقى اليوم لعبة الأرقام الأربعة الصحيحة المجانية. شارك بالتأكيد واربح! أنا أعبر لك عن أمنياتي……`,
    ma: `نظام الكم\n\nلعبة اليانصيب - النظام\n\nأوتو - سور ألي 100. D-10120 برلين\n\nعزيزي لاعب اليانصيب،\n\nشكون ما بغاش يكون تما حتا هو ملي كتربح 6 ديال الأرقام فاللوتو؟ ماتيقش غير فالحظ ملي كتلعب اللوتو، حيت نتا تقدر تحسن الفرص ديالك بزاف يلا لعبت بنظام اللوتو ديالنا - وهاداك غير بـ 5 يورو فالسيمانة! بلاصة ما تلعب بوحدك، العب معانا فمجتمع ديال اللاعبين قوي. هادشي كيزيد تلقائياً من الفرص ديالك! وشنو تقدر تربح؟ مع نظام الكم ديالنا، عندك فرصة تربح مليون يورو! غادي تتلقى كاع الأرباح دغيا وبلا خصم 100% - حنا كنضمنو ليك هادشي!\n\nأنا قنعت راسي بهادشي! العب معانا نظام الكم: كثر من 700 مجموعة ديال نظام الكم ربحو مع بعضياتهم كثر من 7 ملايين يورو.\n\nتحياتي الحارة\nسابين ماير-بوتز\n\nملاحظة: كفرصة ربح خاصة، غادي تتلقى اليوم لعبة الأرقام الأربعة الصحيحة المجانية. شارك أكيد وربح! أنا كنعبر ليك على أمنياتي……`

const globalTransCache = {};

function AutoTrans({ text, lang, force = false }) {
  const [translated, setTranslated] = useState(text);
  
  useEffect(() => {
    if (!text) return;
    if (!force && ['ar', 'ma', 'en', 'fr', 'de'].includes(lang)) {
      setTranslated(text);
      return;
    }
    
    const cacheKey = `${lang}_${text}`;
    if (globalTransCache[cacheKey]) {
      setTranslated(globalTransCache[cacheKey]);
      return;
    }

    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data[0]) {
          const result = data[0].map(item => item[0]).join('');
          globalTransCache[cacheKey] = result;
          setTranslated(result);
        }
      })
      .catch(() => setTranslated(text));
  }, [text, lang, force]);

  return <span>{translated}</span>;
}

function SmartTrans({ obj, lang }) {
  if (!obj) return "";
  const textDe = obj.de || obj.en || (obj.q ? obj.q : "") || (typeof obj === 'string' ? obj : "");
  
  if (typeof obj === 'object' && obj[lang]) {
    return <span>{obj[lang]}</span>;
  }
  
  if (['ar', 'ma', 'en', 'fr'].includes(lang)) {
     return <span>{typeof obj === 'object' ? (obj[lang] || obj['en'] || obj['ar'] || textDe) : textDe}</span>;
  }

  return <AutoTrans text={textDe} lang={lang} />;
}

  const pts = 5;
  const total = exam.items.length * pts;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  useEffect(() => {
    return () => {
      clearInterval(audioInterval.current);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    };
  }, []);

  const playHorenAudio = (segments) => {
    if (!window.speechSynthesis) {
      alert("المتصفح ديالك ماكيدعمش النطق الصوتي.");
      setIsPlaying(false);
      return;
    }
    window.speechSynthesis.cancel();
    let currentIndex = 0;

    const playNext = () => {
      if (currentIndex >= segments.length) {
        setIsPlaying(false);
        clearInterval(audioInterval.current);
        return;
      }
      const segment = segments[currentIndex];
      const utterance = new SpeechSynthesisUtterance(segment.text);
      utterance.lang = 'de-DE';
      utterance.pitch = segment.pitch || 1;
      utterance.rate = segment.rate || 1;
      utterance.onend = () => {
        currentIndex++;
        setTimeout(playNext, 500);
      };
      utterance.onerror = () => {
        setIsPlaying(false);
        clearInterval(audioInterval.current);
      };
      window.speechSynthesis.speak(utterance);
    };
    playNext();
  };

  const toggleAudio = () => {
    if (isPlaying) {
      window.speechSynthesis.cancel();
      clearInterval(audioInterval.current);
      setIsPlaying(false);
      return;
    }
    setIsPlaying(true);
    setAudioTime(0);
    audioInterval.current = setInterval(() => {

    playHorenAudio(exam.audio);

function ExamView({ exam, onBack, onNext, dark, setDark, onSave, userLang, timeLeft, setTimeLeft }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(null);
  const [modalGap, setModalGap] = useState(null);
  const [activeGap, setActiveGap] = useState(null);
  const [showTranslation, setShowTranslation] = useState(false);
  const [excluded, setExcluded] = useState({});
  const [scrollProgress, setScrollProgress] = useState(0);
  const [mode, setMode] = useState("exam");

  useEffect(() => {
    const handleScroll = () => {
      const currentScrollY = window.scrollY;
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (totalScroll > 0) setScrollProgress((currentScrollY / totalScroll) * 100);
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const pts = exam.type === "matching" ? 2.5 : (exam.type.includes("sprach") ? 1.5 : 5);
  const total = exam.items.length * pts;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  const usedElsewhere = (n, k) => {
    if ((exam.type !== "matching" && exam.type !== "headings") || k === "X") return false;
    return Object.entries(ans).some(([id, v]) => Number(id) !== n && v === k);
  };

  const pick = (it, k) => {
    if (done !== null) return;
    if (usedElsewhere(it.n, k)) return;

    if (ans[it.n] === k) {
      const newAns = { ...ans };
      delete newAns[it.n];
      setAns(newAns);
    } else {
      setAns({ ...ans, [it.n]: k });
    }
    if (modalGap) setModalGap(null);
  };

  const pickSprach2 = (w) => {
    if (done !== null) return;
    const target = activeGap !== null ? activeGap : (exam.items.find(x => ans[x.n] === undefined) || {}).n;
    if (!target) return;
    if (usedElsewhere(target, w)) return;
    const newAns = { ...ans, [target]: w };
    Object.keys(newAns).forEach(key => { if (Number(key) !== target && newAns[key] === w) delete newAns[key]; });
    setAns(newAns);
    const next = exam.items.find(x => x.n !== target && newAns[x.n] === undefined);
    setActiveGap(next ? next.n : null);
  };

  const cls = (it, k) => {
    const sel = ans[it.n];
    const isDone = done !== null || (mode === "practice" && sel !== undefined);
    if (isDone) {
      if (k === it.c) return "opt good";
      if (sel === k) return "opt bad";
      return "opt faded";
    }
    if (mode === "exam") {
      if (sel === k) return "opt sel";
      return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
    }
    if (sel === undefined) return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
    return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
  };

  const finish = () => { setDone(score); onSave(exam.id, score, total); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const reset = () => { setAns({}); setDone(null); setShowTranslation(false); setExcluded({}); window.scrollTo(0, 0); };

  const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

    <div style={{ paddingBottom: 120 }}>
      <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: 4, zIndex: 100, backgroundImage: "linear-gradient(to right, #111 33.33%, #DD0000 33.33%, #DD0000 66.66%, #FFCE00 66.66%)", backgroundSize: `${scrollProgress}% 100%`, backgroundRepeat: "no-repeat" }} />

        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={onBack} className="btnI" style={{ width: 36, height: 36 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div>
            <div className="de" style={{ fontWeight: 900, fontSize: "1em", lineHeight: 1.2 }}>{exam.title}</div>
            <div className="de" style={{ fontSize: ".7em", color: "var(--muted)", fontWeight: "bold" }}>{exam.type === "horen" ? "HÖREN" : "LESEN"} · {exam.sub.toUpperCase()}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
           <div className="timer-badge" style={{ padding: '4px 10px', fontSize: '14px' }}>
             ⏱️ {formatTime(timeLeft)}
           </div>
           <button onClick={() => setShowTranslation(!showTranslation)} className="btnI" style={{ width: 40, height: 40, color: showTranslation ? "var(--blue)" : "var(--text)", borderColor: showTranslation ? "var(--blue)" : "var(--line)" }}>

           </button>
           <button onClick={() => setDark(!dark)} className="btnI" style={{ width: 36, height: 36 }}>
            {dark ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}

      </div>

      <div style={{ margin: "10px 12px" }}>
        {exam.type !== "matching" && exam.type !== "horen" && (
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            <button className={"modeBtn " + (mode === "exam" ? "on" : "")} onClick={() => { setMode("exam"); reset(); }}>🎯 {t("exam_mode", userLang)}</button>
            <button className={"modeBtn " + (mode === "practice" ? "on" : "")} onClick={() => { setMode("practice"); reset(); }}>📚 {t("practice_mode", userLang)}</button>
          </div>
        )}

        {exam.type === "horen" && (
          <HorenCard exam={exam} userLang={userLang} showTranslation={showTranslation} />
        )}

        {exam.type === "mcq" && (
          <div className="card" style={{ padding: 20 }}>
            {exam.paragraphs.map((p, i) => (
              <div key={i} style={{ marginBottom: 16 }}>
                <p className="de" style={{ lineHeight: 1.8, fontSize: "1.05em", margin: 0 }}>{p.de}</p>
                {showTranslation && <div className="t2-ar"><SmartTrans obj={p} lang={userLang} /></div>}
              </div>
            ))}
          </div>
        )}

        {(exam.type === "sprach1" || exam.type === "sprach2") && (
          <div className="card" style={{ fontSize: "1.1em", lineHeight: 2.2, padding: 20 }}>
            {exam.text.split(/\.{3,}\s*\((\d+)\)\s*\.{3,}/g).map((part, i) => {
              if (i % 2 === 1) {
                const gapNum = parseInt(part);
                const it = exam.items.find(x => x.n === gapNum);
                const sel = ans[gapNum];
                const isDone = done !== null;
                
                let content = <span className="inline-gap" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{sel || `(${gapNum})`}</span>;
                if (isDone) {
                  if (sel === it.c) content = <span className="sp1-correct">{sel}</span>;
                  else if (sel) content = <span style={{display:'inline-flex', gap:4}}><span className="sp1-wrong">{sel}</span><span className="sp1-correct">{it.c}</span></span>;
                  else content = <span className="sp1-correct">{it.c}</span>;
                }
                return <React.Fragment key={i}>{content}</React.Fragment>;
              }
              return <span key={i} className="de" style={{ whiteSpace: "pre-wrap" }}>{part}</span>;
            })}
            {showTranslation && (
              <div className="t2-ar" style={{ marginTop: 20 }}>
                {exam.transText ? <SmartTrans obj={exam.transText} lang={userLang} /> : <AutoTrans text={exam.text.replace(/\.{3,}\s*\(\d+\)\s*\.{3,}/g, " ___ ")} lang={userLang} force={true} />}
              </div>
            )}
          </div>
        )}

        {exam.type === "matching" && exam.ads.map(ad => (
          <div key={ad.k} className="card" style={{ padding: 16 }}>
            <div style={{ borderBottom: "1px solid var(--line)", paddingBottom: 12, marginBottom: 12 }}>
              <span className="de" style={{ color: "var(--red)", fontWeight: 900, fontSize: "1.1em" }}>ANZEIGE {ad.k}</span>
              <div className="de" style={{ fontWeight: 900, marginTop: 6 }}>{ad.t}</div>
              <div className="de" style={{ fontSize: "0.9em", color: "var(--muted)", marginTop: 4 }}>{ad.de}</div>
              {showTranslation && <div style={{ marginTop: 4, fontSize: "0.85em", color: "var(--muted)", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={ad} lang={userLang} /></div>}
            </div>
            {exam.items.map(it => {
              const isSel = ans[it.n] === ad.k;
              const isElse = ans[it.n] && ans[it.n] !== ad.k;
              const isExc = excluded[it.n]?.[ad.k];
              let st = { padding: 12, borderRadius: 12, background: "var(--paper)", opacity: 1, border: "2px solid transparent", marginBottom: 8, direction: "ltr", textAlign: "left", transition: "all 0.2s", cursor: (done !== null || isExc || isElse) ? "default" : "pointer" };
              
              if (isSel) { st.background = "rgba(37, 99, 235, 0.1)"; st.borderColor = "var(--blue)"; st.color = "var(--blue)"; }
              else if (isElse) { st.opacity = 0.3; st.pointerEvents = "none"; }
              else if (isExc) { st.opacity = 0.3; st.textDecoration = "line-through"; st.pointerEvents = "none"; }
              
              if (done !== null) {
                if (ad.k === it.c) { st.background = "var(--okbg)"; st.borderColor = "var(--okc)"; st.color = "var(--okc)"; }
                else if (isSel) { st.background = "var(--badbg)"; st.borderColor = "var(--badc)"; st.color = "var(--badc)"; }
              }
              return (
                <div key={it.n} style={{ display: "flex", gap: 12, alignItems: "flex-start", direction: "ltr" }}>
                  <button onClick={() => {
                    if (done !== null || isSel || isElse) return;
                    setExcluded(prev => {
                      const n = {...prev}; if(!n[it.n]) n[it.n] = {};
                      n[it.n][ad.k] = !n[it.n][ad.k]; return n;
                    });
                  }} style={{ width: 28, height: 28, borderRadius: 8, border: `1px solid ${isExc ? "var(--red)" : "var(--line)"}`, marginTop: 10, color: isExc ? "var(--red)" : "transparent", background: isExc ? "var(--badbg)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900 }}>✕</button>
                  <div style={{ fontWeight: 900, marginTop: 12, width: 20, color: isSel ? "var(--blue)" : "var(--muted)" }}>{it.n}</div>
                  <div onClick={() => { if(!isExc && !isElse && done === null) pick(it, ad.k); }} style={st}>
                    <span className="de">{it.de}</span>
                    {showTranslation && <div style={{ marginTop: 8, fontSize: "0.85em", color: "var(--muted)", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={it} lang={userLang} /></div>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}

        {(exam.type === "headings" || exam.type === "mcq") && exam.items.map((it, idx) => {
          const sel = ans[it.n];
          const isDone = done !== null || (mode === "practice" && sel !== undefined);
          return (
            <div key={it.n} className="card" style={{ padding: 16 }}>
              <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                <div className="letter" style={{ width: 36, height: 36, fontSize: "1.1em", boxShadow: "0 2px 5px rgba(0,0,0,0.1)" }}>{idx + 1}</div>
                <div style={{ flex: 1 }}>
                  {exam.type === "headings" && (
                    <div style={{ lineHeight: 1.6, fontSize: "1.05em" }}>
                      <div className="de">{it.de}</div>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={it} lang={userLang} /></div>}
                    </div>
                  )}
                  {exam.type === "mcq" && (
                    <div>
                      <p className="de" style={{ fontWeight: 900, margin: 0, fontSize: "1.05em" }}>{it.q}</p>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={{de: it.q}} lang={userLang} /></div>}
                    </div>
                  )}
                </div>
              </div>
              {(exam.type === "headings" ? exam.options : it.opts).map(o => (
                <button key={o.k} className={cls(it, o.k)} onClick={() => pick(it, o.k)} disabled={isDone} style={{ padding: 14 }}>
                  <div className="letter" style={{ width: 28, height: 28, fontSize: "0.9em" }}>{o.k}</div>
                  <div className="de" style={{ flex: 1, textAlign: "left" }}>
                    {o.de}
                    {showTranslation && <div style={{ marginTop: 6, fontSize: "0.85em", color: "var(--muted)", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={o} lang={userLang} /></div>}
                  </div>
                </button>
              ))}
              {isDone && mode === "practice" && (
                <div className={sel === it.c ? "fb good" : "fb bad"} style={{ marginTop: 12, padding: 14, fontSize: "0.95em", borderRadius: 12 }}>
                  <b>{sel === it.c ? t("correct", userLang) : (sel ? t("wrong", userLang) : t("no_answer", userLang))}</b>
                  {sel !== it.c && <span style={{fontWeight:900}}> — {t("the_answer", userLang)}: {it.c}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modalGap !== null && exam.type === "sprach1" && (
        <div className="overlay" onClick={() => setModalGap(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20}}>
              <h3 style={{margin:0, fontSize:"1.3em", fontWeight: 900}}>{t("gap_num", userLang)} ({modalGap})</h3>
              <button className="btnI" onClick={() => setModalGap(null)}>✕</button>
            </div>
            <div className="modal-list" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {exam.items.find(x => x.n === modalGap).opts.map((opt, i) => (
                <button key={i} className={"btn ghost"} style={{ textAlign: 'left', direction: 'ltr', borderColor: ans[modalGap] === opt ? "var(--blue)" : "var(--line)", background: ans[modalGap] === opt ? "rgba(37,99,235,0.1)" : "var(--card)", color: ans[modalGap] === opt ? "var(--blue)" : "var(--text)" }} onClick={() => pick(exam.items.find(x => x.n === modalGap), opt)}>
                  <span style={{ opacity: 0.5, fontWeight: 900, marginRight: 12 }}>{String.fromCharCode(65 + i)}</span>
                  <span className="de" style={{fontSize:"1.05em", flex: 1}}>{opt}</span>
                  {ans[modalGap] === opt && <span style={{ color: "var(--blue)", fontSize:"1.2em" }}>✓</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {activeGap !== null && exam.type === "sprach2" && (
         <div className="overlay" onClick={() => setActiveGap(null)}>
           <div className="sheet" onClick={e => e.stopPropagation()}>
             <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20}}>
               <h3 style={{margin:0, fontSize:"1.3em", fontWeight: 900}}>{t("choose_word_gap", userLang)} ({activeGap})</h3>
               <button className="btnI" onClick={() => setActiveGap(null)}>✕</button>
             </div>
             <div className="word-bank" style={{marginBottom:0, gridTemplateColumns: "1fr"}}>
               {exam.wordBank.map(w => {
                 const isUsed = Object.values(ans).includes(w.w) && ans[activeGap] !== w.w;
                 return (
                   <button key={w.k} className={"word-btn" + (isUsed ? " used" : "")} onClick={() => pickSprach2(w.w)} style={{ padding: "14px", borderColor: ans[activeGap] === w.w ? "var(--blue)" : "var(--line)", background: ans[activeGap] === w.w ? "rgba(37,99,235,0.1)" : "var(--card)", color: ans[activeGap] === w.w ? "var(--blue)" : "var(--text)" }}>
                     <span style={{ opacity: 0.5, marginRight: 10, fontWeight: 900, fontSize:"0.9em" }}>{w.k}</span> <span style={{fontSize:"1.05em"}}>{w.w}</span>
                   </button>
                 )
               })}
             </div>
           </div>
         </div>
      )}

      <div className="bottom-bar">
        <button onClick={done !== null ? reset : finish} className="btn-prev-bar">
          {done !== null ? t("reset_btn", userLang) : t("check_btn", userLang)}
        </button>
        <button onClick={() => done !== null ? onBack() : onNext()} className="btn-correct-bar">
          {done !== null ? t("back_btn", userLang) : t("next_btn", userLang)}
        </button>
        <button className="btn-next-bar" onClick={done !== null ? onBack : onNext}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
    </div>
  );
}

function SchreibenView({ userLang, dark, setDark }) {

  const [showTransText, setShowTransText] = useState(false);
  const [showTransTask, setShowTransTask] = useState(false);
  const [userText, setUserText] = useState("");
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeStep, setAnalyzeStep] = useState(0);
  const [result, setResult] = useState(null);
  
  const [timeLeft, setTimeLeft] = useState(30 * 60); 

  useEffect(() => {
    let timer;
    if (selected && !result && timeLeft > 0) {
      timer = setInterval(() => {
        setTimeLeft(prev => prev - 1);
      }, 1000);
    }
    return () => clearInterval(timer);
  }, [selected, result, timeLeft]);

  const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  const wordCount = userText.trim() === "" ? 0 : userText.trim().split(/\s+/).length;
  const insertChar = (char) => setUserText(prev => prev + char);

  const checkWithAI = () => {
    if (!userText.trim()) return;
    setIsAnalyzing(true);
    setAnalyzeStep(1);
    setResult(null);

    let currentStep = 1;
    const interval = setInterval(() => {
      currentStep++;
      setAnalyzeStep(currentStep);
      if (currentStep > 4) {
        clearInterval(interval);
        finishAnalysis();
      }
    }, 800); 
  };

  const finishAnalysis = () => {
    const cleanText = userText.replace(/[^a-zA-ZäöüÄÖÜß\s]/g, '').trim();
    const words = cleanText.split(/\s+/).filter(w => w.length > 0);
    
    const isGibberish = words.length < 10 || /(.)\1{3,}/.test(userText) || cleanText.length < 15;

    if (isGibberish) {
      setResult({

        contentFeedback: userLang === 'hi' ? "आपने कार्य के किसी भी बिंदु का उल्लेख नहीं किया। कोई पठनीय सामग्री नहीं है।" : "ما ذكرت حتى نقطة من النقط المطلوبة فالمهمة. ما كاينش محتوى مقروء.",
        errors: []
      });
    } else {
      setResult({
        score: 35, maxScore: 45, contentScore: "4/5",
        generalEval: userLang === 'hi' ? "अच्छा प्रयास! आपने अधिकांश आवश्यक बिंदुओं का उत्तर दिया है, लेकिन कुछ छोटी भाषाई त्रुटियां हैं।" : "مجهود جيد! لقد أجبت على معظم النقاط المطلوبة، ولكن هناك بعض الأخطاء اللغوية البسيطة.",
        contentFeedback: userLang === 'hi' ? "आपने कार्य में अधिकांश आवश्यक बिंदुओं का उल्लेख किया है।" : "لقد ذكرت أغلب النقاط المطلوبة في المهمة.",
        errors: [{ error: "Ich habe gehen", fix: "Ich bin gegangen", type: userLang === 'hi' ? "व्याकरण (Grammatik)" : "قواعد (Grammatik)" }]
      });
    }

          <div style={{ color: "var(--muted)", padding: "10px 30px", fontWeight: 900 }}>B2</div>
        </div>
        <div style={{ position: "relative", marginBottom: 20 }}>
          <input type="text" placeholder={t("search_placeholder", userLang)} style={{ width: "100%", padding: "16px 20px", borderRadius: 16, border: "1px solid var(--line)", background: "var(--card)", color: "var(--text)", fontSize: "1em", outline: "none" }} />
        </div>

            {result.score < 20 ? (userLang === 'hi' ? 'अभ्यास की जरूरत है' : 'يحتاج لتدريب') : (userLang === 'hi' ? 'उत्कृष्ट' : 'ممتاز')}
          </div>

              <span style={{ fontSize: "1.5em", fontWeight: 900, color: "var(--ink)" }}>{result.contentScore}</span>
              <span style={{ fontWeight: 900, color: "var(--muted)" }}>Content</span>
            </div>
            <p style={{ margin: 0, color: "var(--muted)", fontSize: "0.9em" }}>{result.contentFeedback}</p>
          </div>
        </div>
        <div className="card" style={{ padding: 20, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: "1.2em", fontWeight: 900 }}>
              <div style={{ width: 4, height: 24, background: "#22C55E", borderRadius: 4 }}></div> {userLang === 'hi' ? 'आपका पाठ' : 'النص الخاص بك'}

          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: "1.2em", fontWeight: 900, marginBottom: 16 }}>
            <div style={{ width: 4, height: 24, background: "#22C55E", borderRadius: 4 }}></div> {userLang === 'hi' ? 'त्रुटियों का विस्तृत विश्लेषण' : 'التحليل التفصيلي للأخطاء'}

function AdminPanel({ userLang, onClose }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [notifTitle, setNotifTitle] = useState("");
  const [notifMsg, setNotifMsg] = useState("");

  useEffect(() => {
    sb.from('profiles').select('*').then(({ data, error }) => {
      if (!error && data) setUsers(data);
      setLoading(false);
    });
  }, []);

  const togglePaid = async (id, current) => {
    await sb.from('profiles').update({ is_paid: !current }).eq('id', id);
    setUsers(users.map(u => u.id === id ? { ...u, is_paid: !current } : u));
  };

  const toggleBlock = async (id, current) => {
    await sb.from('profiles').update({ is_blocked: !current }).eq('id', id);
    setUsers(users.map(u => u.id === id ? { ...u, is_blocked: !current } : u));
  };

  const sendNotification = async () => {
    if (!notifTitle || !notifMsg) return alert("عمر العنوان والرسالة");
    const { error } = await sb.from('notifications').insert([{ title: notifTitle, message: notifMsg, is_active: true }]);
    if (error) alert("مشكل: " + error.message);
    else {
      alert("✅ تصيفط الإشعار بنجاح!");
      setNotifTitle(""); setNotifMsg("");
    }
  };

  return (
    <div style={{ padding: 20, paddingBottom: 100 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <h2 style={{ margin: 0, fontSize: "1.5em", fontWeight: 900 }}>👑 {t("admin_panel", userLang)}</h2>
        <button onClick={onClose} className="btnI">✕</button>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <h3 style={{ margin: "0 0 16px", fontWeight: 900 }}>📢 {t("notifications", userLang)}</h3>
        <input className="auth-input" placeholder={t("title_ar", userLang)} value={notifTitle} onChange={e => setNotifTitle(e.target.value)} />
        <textarea className="auth-input" rows={3} placeholder={t("message_ar", userLang)} value={notifMsg} onChange={e => setNotifMsg(e.target.value)} />
        <button className="btn" onClick={sendNotification}>{t("send_notification", userLang)}</button>
      </div>

      <div className="card">
        <h3 style={{ margin: "0 0 16px", fontWeight: 900 }}>👥 {t("users", userLang)} ({users.length})</h3>
        {loading ? <p>Loading...</p> : users.map(u => (
          <div key={u.id} style={{ borderBottom: "1px solid var(--line)", padding: "12px 0", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ fontWeight: 900 }}>{u.email || u.unique_name}</div>
              <div style={{ fontSize: "0.8em", color: "var(--muted)" }}>
                {u.is_paid ? "✅ مخلص" : "❌ غير مخلص"} | {u.is_blocked ? "🚫 محظور" : "🟢 نشط"}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn ghost" style={{ padding: "8px 12px", fontSize: "0.8em", width: "auto", color: u.is_paid ? "var(--red)" : "var(--okc)" }} onClick={() => togglePaid(u.id, u.is_paid)}>
                {u.is_paid ? t("mark_unpaid", userLang) : t("mark_paid", userLang)}
              </button>
              <button className="btn ghost" style={{ padding: "8px 12px", fontSize: "0.8em", width: "auto", color: u.is_blocked ? "var(--okc)" : "var(--red)" }} onClick={() => toggleBlock(u.id, u.is_blocked)}>
                {u.is_blocked ? t("unblock", userLang) : t("block", userLang)}
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [isPaid, setIsPaid] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [isBlocked, setIsBlocked] = useState(false);
  const [trialActive, setTrialActive] = useState(false);
  const [trialEndsAt, setTrialEndsAt] = useState(null);
  const [trialCountdown, setTrialCountdown] = useState("");
  const [notifications, setNotifications] = useState([]);
  const [isReady, setIsReady] = useState(false);
  const [view, setView] = useState("home");
  const [level, setLevel] = useState("B1");
  const [exam, setExam] = useState(null);
  const [dark, setDark] = useState(false);
  const [fs, setFs] = useState(() => { try { return Number(localStorage.getItem("ep_fs")) || 100; } catch (e) { return 100; } });
  const [settings, setSettings] = useState(false);
  const [results, setResults] = useState(() => { try { return JSON.parse(localStorage.getItem("ep_results") || "{}"); } catch (e) { return {}; } });
  const [searchQuery, setSearchQuery] = useState("");
  const [userLang, setUserLang] = useState(null); 
  const [selectedExamTitle, setSelectedExamTitle] = useState(null);
  const [showHorenLessons, setShowHorenLessons] = useState(false);
  const [showHorenTrans, setShowHorenTrans] = useState(false);
  const [timeLeft, setTimeLeft] = useState(30 * 60);
  const [isSideMenuOpen, setIsSideMenuOpen] = useState(false);

  useEffect(() => {
    const timer = setTimeout(() => setIsReady(true), 1500);
    const savedUser = localStorage.getItem("ep_user");
    const savedLang = localStorage.getItem("ep_lang");
    if (savedUser) {
      const parsed = JSON.parse(savedUser);
      if (parsed.isGuest || parsed.id) {
        setUser(parsed);
      } else {
        localStorage.removeItem("ep_user");
      }
    }
    if (savedLang) setUserLang(savedLang);
    
    // Fetch Notifications
    sb.from('notifications').select('*').eq('is_active', true).then(({ data }) => {
      if (data) setNotifications(data);
    });

    return () => clearTimeout(timer);
  }, []);

  useEffect(() => { document.documentElement.classList.toggle("dark", dark); }, [dark]);
  
  useEffect(() => {
    if (user && !user.isGuest && user.id) {
      const deviceId = localStorage.getItem("ep_device_id");
      sb.from('profiles').select('is_paid, active_device_id, trial_started_at, is_blocked, is_admin').eq('id', user.id).single()
        .then(({ data, error }) => {
          if (error) { console.error("profiles fetch:", error); return; }
          if (data) {
            if (data.is_blocked) {
              alert("⚠️ تم حظر حسابك. تواصل مع الدعم الفني.");
              localStorage.removeItem("ep_user");
              setUser(null);
              setIsBlocked(true);
              return;
            }
            setIsBlocked(false);
            setIsAdmin(!!data.is_admin);
            
            if (data.active_device_id && data.active_device_id !== deviceId) {
              alert("⚠️ تم تسجيل الدخول من هاتف آخر. تم إنهاء الجلسة السابقة.");
              localStorage.removeItem("ep_user");
              setUser(null);
              setIsPaid(false);
              setTrialActive(false);
              return;
            }
            
            setIsPaid(!!data.is_paid);
            if (data.trial_started_at && !data.is_paid) {
              const start = new Date(data.trial_started_at).getTime();
              const end = start + 24 * 60 * 60 * 1000;
              if (Date.now() < end) {
                setTrialActive(true);
                setTrialEndsAt(end);
              } else {
                setTrialActive(false);
                setTrialEndsAt(null);
              }
            }
          }
        });
    } else {
      setIsPaid(false);
      setIsAdmin(false);
      setIsBlocked(false);
      setTrialActive(false);
      setTrialEndsAt(null);
    }
  }, [user]);

  useEffect(() => {
    if (!trialActive || !trialEndsAt) { setTrialCountdown(""); return; }
    const update = () => {
      const diff = trialEndsAt - Date.now();
      if (diff <= 0) {
        setTrialActive(false);
        setTrialCountdown("");
        return;
      }
      const h = Math.floor(diff / (60 * 60 * 1000));
      const m = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
      setTrialCountdown(`${h}س ${m}د`);
    };
    update();
    const interval = setInterval(update, 30000);
    return () => clearInterval(interval);
  }, [trialActive, trialEndsAt]);

  useEffect(() => { document.documentElement.style.setProperty("--fs", fs / 100); try { localStorage.setItem("ep_fs", fs); } catch (e) {} }, [fs]);
  useEffect(() => { try { localStorage.setItem("ep_results", JSON.stringify(results)); } catch (e) {} }, [results]);
  
  useEffect(() => {
    let interval = null;
    if (exam && timeLeft > 0) {
      interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
    }
    return () => clearInterval(interval);
  }, [exam, timeLeft]);

      deviceId = crypto.randomUUID();
      localStorage.setItem("ep_device_id", deviceId);
    }

    const email = `${uniqueName}@echt.com`;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: uniqueCode });

    if (error) {
      const { data: newData, error: newError } = await sb.auth.signUp({ email, password: uniqueCode });

      if (!newData?.user) return alert("ما قدرناش نصاوبو الحساب. تحقق من إعدادات Supabase.");
      
      const { error: insertError } = await sb.from('profiles').insert([{ 
        id: newData.user.id, 
        email: uniqueName, 
        is_paid: false, 
        active_device_id: deviceId,
        is_blocked: false
      }]);
      if (insertError) return alert("مشكل فـ إنشاء الملف الشخصي: " + insertError.message);
      
      const userObj = { ...newData.user, name: uniqueName, isGuest: false };
      setUser(userObj);
      localStorage.setItem("ep_user", JSON.stringify(userObj));
    } else {
      await sb.from('profiles').update({ active_device_id: deviceId }).eq('id', data.user.id);
      const userObj = { ...data.user, name: uniqueName, isGuest: false };
      setUser(userObj);
      localStorage.setItem("ep_user", JSON.stringify(userObj));
    }
  };
  
  const handleGuest = () => {
    const guest = { name: "زائر", isGuest: true };
    setUser(guest);
    setIsPaid(false);
    setIsAdmin(false);
    setIsBlocked(false);
    setTrialActive(false);
    setTrialEndsAt(null);
    localStorage.setItem("ep_user", JSON.stringify(guest));

    setIsAdmin(false);
    setIsBlocked(false);
