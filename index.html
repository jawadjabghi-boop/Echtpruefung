<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EchtPrüfung</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F1B33; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #error-log { display: none; position: fixed; top: 0; left: 0; right: 0; background: #DD0000; color: white; z-index: 999999; padding: 15px; font-family: monospace; white-space: pre-wrap; font-size: 14px; direction: ltr; text-align: left; max-height: 50vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="error-log">جاري التحميل...</div>
  <iframe id="app-frame" src="./app.html"></iframe>
  
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const errorLog = document.getElementById('error-log');
      const iframe = document.getElementById('app-frame');

      function showError(msg) {
        errorLog.style.display = 'block';
        errorLog.innerText = "⚠️ ERROR DETECTED:\n\n" + msg;
      }

      window.addEventListener('error', (e) => {
        showError(`[index.html] \nFile: ${e.filename}\nLine: ${e.lineno}\nMessage: ${e.message}`);
      });

      iframe.addEventListener('load', () => {
        try {
          iframe.contentWindow.addEventListener('error', (e) => {
            let file = e.filename ? e.filename.split('/').pop() : 'app.html';
            showError(`[Inside app.html]\nFile: ${file}\nLine: ${e.lineno}\nMessage: ${e.message}`);
          });
          iframe.contentWindow.addEventListener('unhandledrejection', (e) => {
            showError(`[Promise Error in app.html]\nMessage: ${e.reason.message || e.reason}`);
          });
        } catch (err) {
          showError("Cannot access iframe errors (CORS Policy or Same-Origin issue).");
        }
      });
      
      const script = document.createElement('script');
      script.src = './addon.js';
      script.onerror = () => { showError("Failed to load addon.js. Check if the file exists."); };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
