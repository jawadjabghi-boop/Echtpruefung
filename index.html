const globalTransCache = {};
function AutoTrans({ text, lang, force = false }) {
  const [translated, setTranslated] = useState(text);
  useEffect(() => {
    if (!text || (!force && ['ar', 'ma', 'en', 'fr'].includes(lang))) return setTranslated(text);
    const cacheKey = `${lang}_${text}`;
    if (globalTransCache[cacheKey]) return setTranslated(globalTransCache[cacheKey]);
    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`)
      .then(res => res.json()).then(data => {
        if (data && data[0]) {
          const result = data[0].map(item => item[0]).join('');
          globalTransCache[cacheKey] = result;
          setTranslated(result);
        }
      }).catch(() => setTranslated(text));
  }, [text, lang, force]);
  return <span>{translated}</span>;
}

function SmartTrans({ obj, lang }) {
  if (!obj) return "";
  const textDe = obj.de || obj.en || obj.q || "";
  if (obj[lang]) return <span>{obj[lang]}</span>;
  if (['ar', 'ma', 'en', 'fr'].includes(lang)) return <span>{obj[lang] || obj.en || obj.ar || textDe}</span>;
  return <AutoTrans text={textDe} lang={lang} />;
}

  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  useEffect(() => {
    return () => { clearInterval(audioInterval.current); if (window.speechSynthesis) window.speechSynthesis.cancel(); };
  }, []);

  const playHorenAudio = (segments) => {
    if (!window.speechSynthesis) { alert("المتصفح ديالك ماكيدعمش النطق"); setIsPlaying(false); return; }
    window.speechSynthesis.cancel();
    let currentIndex = 0;
    const playNext = () => {
      if (currentIndex >= segments.length) { setIsPlaying(false); clearInterval(audioInterval.current); return; }
      const segment = segments[currentIndex];
      const utterance = new SpeechSynthesisUtterance(segment.text);
      utterance.lang = 'de-DE'; utterance.pitch = segment.pitch || 1; utterance.rate = segment.rate || 1;
      utterance.onend = () => { currentIndex++; setTimeout(playNext, 500); };
      utterance.onerror = () => { setIsPlaying(false); clearInterval(audioInterval.current); };
      window.speechSynthesis.speak(utterance);
    };
    playNext();
  };

  const toggleAudio = () => {
    if (isPlaying) { window.speechSynthesis.cancel(); clearInterval(audioInterval.current); setIsPlaying(false); return; }
    setIsPlaying(true); setAudioTime(0);
    audioInterval.current = setInterval(() => { setAudioTime(prev => prev + 1); }, 1000);
    playHorenAudio(exam.audio);
  };

  return (
    <div className="card" style={{ padding: 20, marginBottom: 24 }}>
      <h3 className="de" style={{ fontSize: "1.3em", fontWeight: 900, margin: "0 0 16px" }}>{exam.title}</h3>
      <div style={{ display: "flex", alignItems: "center", gap: 12, background: "var(--paper)", padding: 16, borderRadius: 20, marginBottom: 20 }}>
        <button onClick={toggleAudio} style={{ width: 56, height: 56, borderRadius: "50%", background: isPlaying ? "var(--red)" : "#22C55E", color: "#FFF", display: "flex", alignItems: "center", justifyContent: "center" }}>
          {isPlaying ? "⏸" : "▶"}
        </button>
        <div style={{ flex: 1 }}>
           <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 900, fontSize: "0.9em" }}>
            <span style={{ color: isPlaying ? "var(--red)" : "var(--ink)" }}>{Math.floor(audioTime / 60)}:{(audioTime % 60).toString().padStart(2, '0')}</span>
            <span>Audio Player</span>
          </div>
        </div>
      </div>
      <div style={{ border: "1px solid var(--line)", borderRadius: 16, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ display: "flex", background: "var(--paper)", borderBottom: "1px solid var(--line)", fontWeight: 900, padding: "12px 0" }}>
          <div style={{ width: 60, textAlign: "center" }}>R</div><div style={{ width: 60, textAlign: "center" }}>F</div><div style={{ flex: 1, paddingLeft: 10 }}>AUSSAGE</div>
        </div>
        {exam.items.map((it) => {
          const isRight = ans[it.n] === "R"; const isFalsch = ans[it.n] === "F"; const isCorrect = ans[it.n] === it.c;
          let rClass = "rf-circle", fClass = "rf-circle";
          if (done) {
            if (it.c === "R") rClass += " good"; else if (isRight) rClass += " bad";
            if (it.c === "F") fClass += " good"; else if (isFalsch) fClass += " bad";
          } else {
            if (isRight) rClass += " sel"; if (isFalsch) fClass += " sel";
          }
          return (
            <div key={it.n} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--line)", padding: "12px 0", background: done ? (isCorrect ? "var(--okbg)" : "var(--badbg)") : "var(--card)" }}>
              <div style={{ width: 60, display: "flex", justifyContent: "center" }}><div className={rClass} onClick={() => !done && setAns({...ans, [it.n]: "R"})}></div></div>
              <div style={{ width: 60, display: "flex", justifyContent: "center" }}><div className={fClass} onClick={() => !done && setAns({...ans, [it.n]: "F"})}></div></div>
              <div style={{ flex: 1, fontSize: "0.95em", paddingRight: 10 }}>
                <span style={{ opacity: 0.5, marginLeft: 8, fontWeight: 900 }}>{it.n}</span><span className="de">{it.de}</span>
                {showTranslation && <div style={{ marginTop: 8, fontSize: "0.85em", color: "var(--muted)" }}><SmartTrans obj={it} lang={userLang} /></div>}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <button onClick={() => setShowStory(!showStory)} style={{ color: "var(--blue)", fontWeight: 800 }}>👁️ قصة للحفظ</button>
        {!done ? <button onClick={() => setDone(true)} style={{ background: "#22C55E", color: "#FFF", padding: "8px 20px", borderRadius: 12, fontWeight: 900 }}>تصحيح</button> : <div style={{ fontWeight: 900, color: "var(--red)" }}>{score} / {total}</div>}
      </div>
      {showStory && <div className="t2-ar" style={{ marginTop: 16 }}>{exam.items[0].story}</div>}
    </div>
  );
}

function HorenGateway({ onStart, userLang }) {
  return (
    <div style={{ paddingBottom: 100 }}>
      <h1 className="de" style={{ fontSize: "2.6em", fontWeight: 900, margin: "4px 0 14px", textAlign: "center" }}>Hören</h1>
      <div className="card" style={{ textAlign: "center", padding: 40 }}>
        <h2 style={{ fontSize: "1.5em", fontWeight: 900 }}>دروس الاستماع</h2>
        <p style={{ color: "var(--muted)" }}>هنا كتلقى جميع دروس الهورن. اضغط على الزر لبدء.</p>
        <button className="btn" onClick={onStart}>ابدأ الآن</button>
      </div>
    </div>
  );
}

function ExamView({ exam, onBack, onNext, userLang, timeLeft }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(null);
  const pts = exam.type === "matching" ? 2.5 : (exam.type.includes("sprach") ? 1.5 : 5);
  const total = exam.items.length * pts;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  return (
    <div style={{ paddingBottom: 120 }}>
      <div className="header">
        <button onClick={onBack} className="btnI">⬅</button>
        <div className="de" style={{ fontWeight: 900 }}>{exam.title} - {exam.sub}</div>
        <div className="timer-badge">⏱️ {Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}</div>
      </div>
      <div style={{ margin: "20px 12px" }}>
        {exam.type === "horen" && <HorenCard exam={exam} userLang={userLang} showTranslation={true} />}
        {exam.type === "headings" && exam.items.map((it, idx) => (
          <div key={it.n} className="card" style={{ marginBottom: 16 }}>
            <div className="de" style={{ fontWeight: 900, marginBottom: 12 }}>{idx + 1}. {it.de}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {exam.options.map(o => (
                <button key={o.k} className={"opt " + (ans[it.n] === o.k ? "sel" : (done !== null ? (o.k === it.c ? "good" : (ans[it.n] === o.k ? "bad" : "")) : ""))} onClick={() => done === null && setAns({ ...ans, [it.n]: o.k })}>
                  <div className="letter">{o.k}</div><div className="de">{o.de}</div>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="bottom-bar">
        <button onClick={() => done !== null ? (setAns({}), setDone(null)) : setDone(score)} className="btn-prev-bar">{done !== null ? "إعادة" : "تصحيح"}</button>
        <button onClick={onNext} className="btn-correct-bar">{done !== null ? "رجوع" : "التالي"}</button>
      </div>
    </div>
  );
}

function SchreibenView({ userLang, isPaid, isAdmin, trialActive }) {
  const [selected, setSelected] = useState(null);
  const [userText, setUserText] = useState("");
  const [result, setResult] = useState(null);
  const [timeLeft, setTimeLeft] = useState(30 * 60);

  useEffect(() => {
    let timer;
    if (selected && !result && timeLeft > 0) timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
    return () => clearInterval(timer);
  }, [selected, result, timeLeft]);

  if (!selected) return (
    <div style={{ padding: "20px 12px" }}>
      <h1 className="de" style={{ margin: 0, fontSize: "2.5em", fontWeight: 900 }}>Schreiben</h1>
      {SCHREIBEN_DATA.map(item => (
        <div key={item.id} onClick={() => setSelected(item)} className="card" style={{ padding: 20, marginBottom: 16 }}>
          <div className="de" style={{ fontWeight: 900 }}>{item.title}</div>
          <div style={{ color: "#22C55E", fontWeight: 900, marginTop: 8 }}>{item.level}</div>
        </div>
      ))}
    </div>
  );

  if (result) return (
    <div style={{ padding: "20px 12px" }}>
      <button onClick={() => setResult(null)} className="btnI">⬅</button>
      <h2 style={{ textAlign: "center", marginTop: 20 }}>النتيجة: {result.score} / {result.maxScore}</h2>
      <div className="card" style={{ marginTop: 20 }}>{result.generalEval}</div>
    </div>
  );

  return (
    <div style={{ padding: "20px 12px", paddingBottom: 120 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
        <button onClick={() => setSelected(null)} className="btnI">⬅</button>
        <div className="timer-badge">⏱️ {Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}</div>
      </div>
      <div className="card">
        <h3 style={{ color: "#22C55E", margin: "0 0 12px" }}>SITUATION</h3>
        <div className="de" style={{ whiteSpace: "pre-wrap", lineHeight: 1.6 }}>{selected.text}</div>
      </div>
      <div className="card" style={{ marginTop: 16 }}>
        <h3 style={{ color: "#22C55E", margin: "0 0 12px" }}>AUFGABE</h3>
        <div className="de" style={{ marginBottom: 12 }}>{selected.task}</div>
        {selected.points.map((p, i) => <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}><div style={{ color: "#22C55E", fontWeight: 900 }}>{i+1}.</div><div className="de">{p}</div></div>)}
      </div>
      <textarea value={userText} onChange={e => setUserText(e.target.value)} className="de" placeholder="...اكتب هنا" style={{ width: "100%", minHeight: 200, padding: 16, borderRadius: 16, border: "1px solid var(--line)", marginTop: 16 }}></textarea>
      <div className="bottom-bar" style={{ maxWidth: 400 }}>
        <button onClick={() => { setResult({ score: 35, maxScore: 45, generalEval: "مجهود جيد!" }); }} className="btn-correct-bar">✨ تصحيح AI</button>
      </div>
    </div>
  );
}

function NotificationsBell({ userLang }) { return <button className="btnI">🔔</button>; }
function AdminPanel({ onClose }) { return <div style={{ padding: 20 }}><button onClick={onClose} className="btnI">✕</button><h2>لوحة التحكم</h2></div>; }

function App() {
  useEffect(() => { window.__APP_MOUNTED__ = true; }, []);
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem("ep_user")); } catch { return null; } });
  const [userLang, setUserLang] = useState(() => localStorage.getItem("ep_lang") || null);
  const [isPaid, setIsPaid] = useState(false);
  const [view, setView] = useState("home");
  const [level, setLevel] = useState("B1");
  const [exam, setExam] = useState(null);
  const [showHoren, setShowHoren] = useState(false);
  const [timeLeft, setTimeLeft] = useState(30*60);
  const [selectedExamTitle, setSelectedExamTitle] = useState(null);
  const [isSideMenuOpen, setIsSideMenuOpen] = useState(false);
  const [settings, setSettings] = useState(false);

  const handleLang = (c) => { setUserLang(c); localStorage.setItem("ep_lang", c); };
  const handleLogin = (e) => {
    e.preventDefault();
    const u = { name: e.target.unique_name.value, isGuest: false };
    setUser(u); localStorage.setItem("ep_user", JSON.stringify(u));
  };
  const handleGuest = () => {
    const u = { name: "زائر", isGuest: true };
    setUser(u); localStorage.setItem("ep_user", JSON.stringify(u));
  };
  const logout = () => { localStorage.removeItem("ep_user"); setUser(null); };

  if (!userLang) return (
    <div className="auth-screen">
      <div className="auth-card" style={{ textAlign: "center" }}>
        <LogoImage size={80} />
        <h2 style={{ fontWeight: 900, margin: "16px 0" }}>ختار اللغة</h2>
        <div className="lang-grid">
          {LANGS.map(l => (
            <button key={l.c} onClick={() => handleLang(l.c)} className="lang-btn">
              <span style={{ fontSize: "1.5em" }}>{l.f}</span><span>{l.n}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  if (!user) return (
    <div className="auth-screen">
      <div className="auth-card" style={{ textAlign: "center" }}>
        <LogoImage size={80} />
        <h2 style={{ fontWeight: 900, margin: "16px 0" }}>مرحبا بيك</h2>
        <form onSubmit={handleLogin}>
          <input className="auth-input" name="unique_name" placeholder="الاسم" required />
          <input className="auth-input" name="unique_code" type="password" placeholder="الكود" required />
          <button className="auth-btn" type="submit">دخول</button>
        </form>
        <button className="auth-btn guest" onClick={handleGuest}>دخول كزائر</button>
      </div>
    </div>
  );

  if (exam) return <ExamView exam={exam} userLang={userLang} onBack={() => setExam(null)} onNext={() => setExam(null)} timeLeft={timeLeft} />;

  return (
    <div style={{ paddingBottom: 100 }}>
      <div className={`menu-overlay ${isSideMenuOpen ? 'active' : ''}`} onClick={() => setIsSideMenuOpen(false)}></div>
      <nav className={`side-menu ${isSideMenuOpen ? 'active' : ''}`}>
        <div className="side-menu-header"><h2>EchtPrüfung</h2><p>{user.name}</p></div>
        <a href="#" onClick={(e) => { e.preventDefault(); setLevel('B1'); setView('lesen'); setIsSideMenuOpen(false); }} className="menu-item">📚 B1</a>
        <a href="#" onClick={(e) => { e.preventDefault(); setLevel('B2'); setView('lesen'); setIsSideMenuOpen(false); }} className="menu-item">📚 B2</a>
      </nav>

      <div className="header">
        <div className="brand">
          <button className="btnI" onClick={() => setIsSideMenuOpen(true)}>☰</button>
          <div className="logo"><LogoImage size={36} /></div>
          <div><div className="header-title">EchtPrüfung</div></div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <NotificationsBell userLang={userLang} />
          <button className="btnI" onClick={() => setSettings(true)}>⚙️</button>
        </div>
      </div>

      <main style={{ margin: "0 12px", paddingTop: 10 }}>
        {view === "home" && (
          <div className="card" style={{ textAlign: "center", padding: "60px 20px", background: "linear-gradient(135deg, #1e293b, #0f172a)", color: "#FFF" }}>
            <LogoImage size={100} />
            <h2 style={{ fontSize: "2em", fontWeight: 900, marginTop: 20 }}>EchtPrüfung</h2>
            <p style={{ color: "#FFCE00", fontWeight: 900 }}>تدرب على الامتحان الحقيقي</p>
          </div>
        )}

        {view === "lesen" && (
          <div>
            <h1 className="de" style={{ textAlign: "center", color: "var(--red)", marginBottom: 16 }}>Lesen {level}</h1>
            {Array.from(new Set(EXAMS.filter(e => e.level === level).map(e => e.title))).map(title => (
              <button key={title} className="card" onClick={() => setSelectedExamTitle(title)} style={{ width: "100%", padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div className="de" style={{ fontWeight: 900 }}>{title}</div>
                  <div style={{ color: "var(--blue)" }}>➡</div>
                </div>
              </button>
            ))}
          </div>
        )}

        {view === "horen" && (
          <div>
            {!showHoren ? <HorenGateway onStart={() => setShowHoren(true)} userLang={userLang} /> : (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                  <h1 className="de" style={{ color: "var(--red)" }}>Hören</h1>
                  <button onClick={() => setShowHoren(false)} className="btn ghost" style={{ padding: 8 }}>رجوع</button>
                </div>
                {HOREN_EXAMS.map(ex => <HorenCard key={ex.id} exam={ex} userLang={userLang} showTranslation={true} />)}
              </div>
            )}
          </div>
        )}

        {view === "schreiben" && <SchreibenView userLang={userLang} isPaid={isPaid} />}

        {(view === "sprechen" || view === "pruefung") && (
          <div className="card" style={{ textAlign: "center", padding: 40 }}><h2>قريباً...</h2></div>
        )}
      </main>

      <nav className="nav">
        {[
          { id: "home", label: "الرئيسية", icon: "⌂" }, { id: "lesen", label: "قراية", icon: "📖" },
          { id: "horen", label: "سماع", icon: "🎧" }, { id: "schreiben", label: "كتابة", icon: "✎" },
          { id: "sprechen", label: "هضرة", icon: "🎙" }, { id: "pruefung", label: "امتحان", icon: "🎓" }
        ].map(item => (
          <button key={item.id} className={view === item.id ? "on" : ""} onClick={() => { setView(item.id); setExam(null); setShowHoren(false); window.scrollTo(0,0); }}>
            <span style={{ fontSize: "1.5em" }}>{item.icon}</span><span>{item.label}</span>
          </button>
        ))}
      </nav>

      {selectedExamTitle && (
        <div className="overlay" onClick={() => setSelectedExamTitle(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <h3 className="de" style={{ fontWeight: 900 }}>{selectedExamTitle}</h3>
            {["Teile 1", "Teile 2", "Teile 3", "Sprach 1", "Sprach 2"].map(sub => {
              const ex = EXAMS.find(e => e.title === selectedExamTitle && e.sub === sub);
              return ex ? (
                <button key={sub} className="btn ghost" style={{ marginTop: 8 }} onClick={() => { setExam(ex); setSelectedExamTitle(null); setTimeLeft(30*60); }}>{sub}</button>
              ) : <button key={sub} className="btn ghost" disabled style={{ opacity: 0.4, marginTop: 8 }}>{sub}</button>
            })}
          </div>
        </div>
      )}

      {settings && (
        <div className="overlay" onClick={() => setSettings(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <h3 style={{ fontWeight: 900, marginBottom: 20 }}>الإعدادات</h3>
            <button className="btn ghost" onClick={() => { setUserLang(null); setSettings(false); }} style={{ marginBottom: 12 }}>تغيير اللغة</button>
            <button className="btn ghost" onClick={logout} style={{ color: "var(--red)", borderColor: "var(--red)" }}>خروج</button>
          </div>
        </div>
      )}
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
} catch (e) {
  document.getElementById('root').innerHTML = '<div style="padding:20px;text-align:center;color:red;font-family:sans-serif;direction:rtl"><h2>خطأ: ' + e.message + '</h2></div>';
  window.__APP_MOUNTED__ = true;
}
</script>
</body>
</html>
