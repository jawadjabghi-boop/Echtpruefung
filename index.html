<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EchtPrüfung</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --ink:#0F1B33; --gold:#F5B82E; --red:#DD0000;
    --paper:#EEF1F6; --card:#FFFFFF; --text:#1E293B; --muted:#64748B; --line:#DCE3EC;
    --okc:#15803D; --okbg:#DCFCE7; --badc:#B91C1C; --badbg:#FEE2E2;
    --fs:1;
    --flag:linear-gradient(90deg,#111 0 33.33%,#DD0000 33.33% 66.66%,#FFCE00 66.66% 100%);
    --german-grad:linear-gradient(135deg,#111111 0%,#DD0000 50%,#FFCE00 100%);
    --raise:0 1px 0 rgba(255,255,255,.9) inset,0 5px 0 rgba(15,27,51,.07),0 14px 28px rgba(15,27,51,.10);
    --press:0 1px 0 rgba(255,255,255,.9) inset,0 2px 0 rgba(15,27,51,.08),0 4px 10px rgba(15,27,51,.08);
  }
  .dark{
    --paper:#0A0F1E; --card:#17213A; --text:#F1F5F9; --muted:#94A3B8; --line:#2A3858;
    --okc:#86EFAC; --okbg:#14532D; --badc:#FCA5A5; --badbg:#7F1D1D;
    --raise:0 1px 0 rgba(255,255,255,.06) inset,0 5px 0 rgba(0,0,0,.40),0 14px 28px rgba(0,0,0,.45);
    --press:0 1px 0 rgba(255,255,255,.06) inset,0 2px 0 rgba(0,0,0,.40),0 4px 10px rgba(0,0,0,.35);
  }

  html{ font-size:calc(18px * var(--fs)); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; color:var(--text); font-family:'Cairo',system-ui,sans-serif; direction:rtl;
    min-height:100vh; padding-bottom:110px; transition:background .3s,color .3s;
    background:
      radial-gradient(900px 420px at 100% -10%, rgba(245,184,46,.10), transparent 60%),
      radial-gradient(800px 400px at -10% 0%, rgba(221,0,0,.06), transparent 60%),
      var(--paper);
    background-attachment:fixed;
  }
  button{ font-family:inherit; cursor:pointer; }
  .de{ direction:ltr; text-align:left; font-family:system-ui,-apple-system,sans-serif; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:16px; margin-bottom:14px; color:var(--text);
    box-shadow:var(--raise); position:relative;
  }

  .header{
    position:sticky; top:10px; z-index:30; margin:10px; display:flex; justify-content:space-between;
    align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:24px; padding:12px 16px; box-shadow:var(--raise); transition:transform .3s ease;
  }
  .header::after{
    content:""; position:absolute; left:24px; right:24px; bottom:-1px; height:4px;
    border-radius:4px 4px 0 0; background:var(--flag);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{
    width:50px; height:50px; border-radius:15px; background:var(--ink);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 16px rgba(15,27,51,.25);
  }

  .btnI{
    width:46px; height:46px; border:none; border-radius:50%; background:var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:transform .12s,box-shadow .12s;
    box-shadow:0 4px 0 rgba(0,0,0,.22),0 8px 14px rgba(0,0,0,.14);
  }
  .btnI:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.22),0 3px 6px rgba(0,0,0,.12); }

  .icon-de{
    background:var(--german-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .svg-de{ stroke:url(#germanGradient); fill:none; }

  .btn{
    border:none; border-radius:16px; padding:14px 16px; font-weight:800; background:var(--ink);
    color:var(--gold); width:100%; font-size:1.05em; transition:transform .12s,box-shadow .12s,opacity .2s;
    box-shadow:0 5px 0 #000,0 10px 18px rgba(15,27,51,.25);
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000,0 3px 8px rgba(15,27,51,.2); }
  .btn.ghost{
    background:var(--card); color:var(--text); border:1.5px solid var(--line);
    box-shadow:0 4px 0 var(--line),0 8px 14px rgba(15,27,51,.06);
  }
  .btn.ghost:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .chip{
    display:inline-block; border-radius:9px; padding:3px 10px; font-size:.8em; font-weight:800;
    background:var(--okbg); color:var(--okc); box-shadow:0 2px 0 rgba(0,0,0,.08);
  }

  .tabs{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:22px; padding:12px; margin-bottom:14px; box-shadow:var(--raise);
  }
  .tab{
    border:none; background:transparent; color:var(--muted); padding:12px 6px; border-radius:14px;
    font-weight:800; font-size:.95em; transition:all .2s;
  }
  .tab.on{
    background:var(--gold); color:var(--ink);
    box-shadow:0 4px 0 #C48F12,0 8px 14px rgba(245,184,46,.35);
  }
  .tab:active{ transform:translateY(2px); }

  .bar{ height:10px; border-radius:99px; background:var(--line); overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.12); }
  .fill{
    height:100%; background:linear-gradient(to right,#000 33.33%,#DD0000 33.33%,#DD0000 66.66%,#FFCE00 66.66%);
    transition:width .3s;
  }

  .opt{
    display:flex; gap:12px; align-items:center; border:2px solid var(--line); background:var(--card);
    color:var(--text); border-radius:16px; padding:14px; margin-bottom:10px; width:100%; text-align:right;
    transition:transform .12s,box-shadow .12s,border-color .2s,background .2s; font-size:1.05em;
    box-shadow:0 4px 0 var(--line),0 8px 12px rgba(15,27,51,.05);
  }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  .opt.dis{ opacity:.4; cursor:not-allowed; }
  .opt.sel{
    border-color:var(--gold); background:rgba(245,184,46,.16);
    box-shadow:0 4px 0 #C48F12,0 8px 14px rgba(245,184,46,.25);
  }
  .opt.good{ border-color:var(--okc); background:var(--okbg); color:var(--okc); box-shadow:0 4px 0 var(--okc); }
  .opt.bad{ border-color:var(--badc); background:var(--badbg); color:var(--badc); box-shadow:0 4px 0 var(--badc); }
  .opt.faded{ opacity:.4; box-shadow:none; }

  .letter{
    width:32px; height:32px; border-radius:50%; background:var(--card); display:flex; align-items:center;
    justify-content:center; font-weight:900; flex-shrink:0; font-size:1.1em; color:var(--text);
    border:1px solid var(--line); box-shadow:0 3px 0 var(--line),0 5px 8px rgba(0,0,0,.08);
  }

  .fb{ border-radius:16px; padding:14px; margin-top:10px; font-size:.95em; line-height:1.8; box-shadow:0 3px 0 rgba(0,0,0,.08); }
  .fb.good{ background:var(--okbg); color:var(--okc); }
  .fb.bad{ background:var(--badbg); color:var(--badc); }

  .toast{
    position:fixed; top:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--gold);
    padding:10px 20px; border-radius:16px; font-weight:800; z-index:60; font-size:.95em;
    box-shadow:0 4px 0 #000,0 12px 25px rgba(0,0,0,.25); animation:slideDown .3s;
  }
  @keyframes slideDown{ from{top:-20px;opacity:0} to{top:100px;opacity:1} }

  .nav{
    position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:10px 4px 22px; z-index:40;
    box-shadow:0 -8px 24px rgba(15,27,51,.08);
  }
  .nav::before{ content:""; position:absolute; top:-1px; left:0; right:0; height:3px; background:var(--flag); }
  .nav button{
    border:none; background:transparent; color:var(--muted); font-size:.8em; font-weight:800;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:56px;
  }
  .nav button.on{ color:var(--text); }
  .nav .ic{ padding:6px 14px; border-radius:14px; transition:all .2s; }
  .nav button.on .ic{ background:rgba(245,184,46,.28); box-shadow:0 3px 0 rgba(196,143,18,.55); transform:translateY(-2px); }
  .nav button:active .ic{ transform:translateY(1px); }

  .overlay{
    position:fixed; inset:0; background:rgba(8,12,24,.62); z-index:50; display:flex;
    justify-content:center; align-items:center; padding:20px; backdrop-filter:blur(5px);
  }
  .sheet{
    background:var(--card); border:1px solid var(--line); border-radius:28px; padding:24px; width:100%;
    max-width:440px; max-height:85vh; overflow-y:auto; color:var(--text);
    box-shadow:0 8px 0 rgba(0,0,0,.18),0 30px 60px rgba(0,0,0,.35);
  }

  .modeBtn{
    flex:1; padding:12px 8px; border-radius:14px; border:2px solid var(--line); background:var(--card);
    color:var(--muted); font-weight:800; font-size:.95em; font-family:inherit; cursor:pointer;
    transition:all .15s; box-shadow:0 3px 0 var(--line);
  }
  .modeBtn.on{ border-color:var(--gold); background:var(--gold); color:var(--ink); box-shadow:0 3px 0 #C48F12; }
  .modeBtn:active{ transform:translateY(2px); }

  .inline-gap{
    display:inline-flex; align-items:center; justify-content:center; min-width:90px;
    border-bottom:3px dashed var(--gold); padding:2px 8px; margin:0 6px; cursor:pointer; font-weight:900;
    color:var(--text); transition:all .2s; vertical-align:middle; background:rgba(245,184,46,.10);
    border-radius:10px 10px 0 0; font-size:1.1em;
  }
  .inline-gap.filled{ border-bottom-style:solid; background:rgba(245,184,46,.22); color:var(--gold); }
  .sp1-correct-box{
    background:var(--okbg); color:var(--okc); padding:4px 12px; border-radius:10px; font-weight:900;
    font-size:1.05em; margin:0 4px; display:inline-block; border:1px solid var(--okc); box-shadow:0 2px 0 var(--okc);
  }
  .sp1-wrong-box{
    background:var(--badbg); color:var(--badc); text-decoration:line-through; padding:4px 12px; border-radius:10px;
    font-weight:900; font-size:1.05em; margin:0 4px; display:inline-block; border:1px solid var(--badc);
  }

  .word-bank{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:14px; background:var(--paper);
    border-radius:16px; margin-bottom:14px; border:1px dashed var(--line); box-shadow:inset 0 2px 6px rgba(0,0,0,.06);
  }
  .word-btn{
    padding:12px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--text);
    font-weight:800; font-size:1em; text-align:right; transition:all .12s; display:flex; gap:10px; align-items:center;
    box-shadow:0 3px 0 var(--line);
  }
  .word-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .word-btn.used{ opacity:.3; text-decoration:line-through; pointer-events:none; }

  .modal-list{ display:flex; flex-direction:column; gap:12px; margin-top:15px; }
  .modal-item{
    padding:16px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); color:var(--text);
    font-weight:800; font-size:1.05em; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; transition:all .12s; text-align:right; box-shadow:0 4px 0 var(--line);
  }
  .modal-item:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  .modal-item.selected{ border-color:var(--gold); background:rgba(245,184,46,.16); color:var(--text); box-shadow:0 4px 0 #C48F12; }
  .modal-item.disabled{ opacity:.4; pointer-events:none; text-decoration:line-through; }

  .highlight-yellow{ background-color:#FEF08A; color:#854D0E; border-radius:4px; padding:0 4px; font-weight:bold; transition:all .3s; }
  .dark .highlight-yellow{ background-color:#854D0E; color:#FEF08A; }

  .splash-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
    z-index:9999; transition:opacity .5s;
    background:
      radial-gradient(circle at 20% 15%, rgba(221,0,0,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,206,0,.28), transparent 45%),
      #0F1B33;
  }
  .splash-logo{ width:180px; height:180px; margin-bottom:20px; animation:pulse 2s infinite; filter:drop-shadow(0 18px 24px rgba(0,0,0,.5)); }
  @keyframes pulse{ 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }

  .auth-screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .auth-card{
    background:var(--card); padding:32px; border-radius:30px; width:100%; max-width:420px;
    border:1px solid var(--line); box-shadow:0 8px 0 rgba(15,27,51,.08),0 28px 50px rgba(15,27,51,.14); position:relative;
  }
  .auth-card::before{ content:""; position:absolute; top:0; left:30px; right:30px; height:5px; border-radius:0 0 6px 6px; background:var(--flag); }
  .auth-input{
    width:100%; padding:16px; margin-bottom:16px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--text); font-family:inherit; outline:none; font-size:1.05em;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.07); transition:border-color .2s;
  }
  .auth-input:focus{ border-color:var(--gold); }
  .auth-btn{
    width:100%; padding:16px; border-radius:16px; border:none; background:var(--ink); color:var(--gold);
    font-weight:800; font-size:1.1em; cursor:pointer; margin-bottom:12px; transition:transform .12s,box-shadow .12s;
    box-shadow:0 5px 0 #000,0 10px 18px rgba(15,27,51,.25);
  }
  .auth-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .auth-btn.guest{ background:var(--gold); color:var(--ink); box-shadow:0 5px 0 #C48F12,0 10px 18px rgba(245,184,46,.3); }
  .auth-btn.guest:active{ box-shadow:0 1px 0 #C48F12; }

  .t2-para{ margin-bottom:20px; border-bottom:2px dashed var(--line); padding-bottom:18px; }
  .t2-ar{
    background:var(--paper); padding:16px; border-radius:14px; margin-top:12px; color:var(--text);
    font-size:1.05em; line-height:1.8; border-right:5px solid var(--gold); direction:rtl; text-align:right;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.05);
  }
  .t2-trans-btn{
    background:var(--card); border:1.5px solid var(--line); padding:8px 16px; border-radius:20px; font-size:.9em;
    font-weight:bold; color:var(--muted); display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    margin-top:10px; transition:all .15s; box-shadow:0 3px 0 var(--line);
  }
  .t2-trans-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
</style>
</head>
<body>
<div id="root"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="germanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="50%" stop-color="#DD0000" />
      <stop offset="100%" stop-color="#FFCE00" />
    </linearGradient>
  </defs>
</svg>

<script type="text/babel">
const { useState, useEffect } = React;
const WA = "212600000000";
const wa = (t) => window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(t), "_blank");

const LogoImage = ({ size = 50 }) => (
  <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#1E293B" />
        <stop offset="100%" stopColor="#0F1B33" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FDE047" />
        <stop offset="100%" stopColor="#F5B82E" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" floodColor="#000" floodOpacity="0.4"/>
      </filter>
    </defs>
    <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
    <rect width="98" height="98" x="1" y="1" rx="23" stroke="rgba(255,255,255,0.08)" strokeWidth="2" fill="none" />
    <rect x="18" y="28" width="36" height="10" rx="4" fill="#111111" filter="url(#shadow)"/>
    <rect x="18" y="44" width="36" height="10" rx="4" fill="#DD0000" filter="url(#shadow)"/>
    <rect x="18" y="60" width="36" height="10" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <path d="M 54 70 L 54 30 L 70 30 C 84 30, 84 52, 70 52 L 54 52" stroke="url(#goldGrad)" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" fill="none" filter="url(#shadow)"/>
    <circle cx="80" cy="80" r="5" fill="#DD0000" />
  </svg>
);

const EXAMS = [
{ id:"alex-t1", title:"Alex Und Cora", level:"B1", sub:"Teile 1", type:"headings",
  options:[
    {k:"a",de:"Eltern trotz Kritik mit der Schule zufrieden",ar:"الآباء راضون عن المدرسة رغم الانتقادات"},
    {k:"b",de:"Elektromobilität für Angestellte",ar:"التنقل الكهربائي للموظفين"},
    {k:"c",de:"STÄRKUNG VON BUS UND BAHN",ar:"تعزيز الحافلات والقطارات"},
    {k:"d",de:"Schule und Umweltschutz",ar:"المدرسة وحماية البيئة"},
    {k:"e",de:"Bald keine Firmenwagen mehr?",ar:"هل ستختفي سيارات الشركات قريباً؟"},
    {k:"f",de:"Ticketpreise bei der Bahn",ar:"أسعار التذاكر في السكك الحديدية"},
    {k:"g",de:"Lehrerberuf wird immer attraktiver",ar:"مهنة التدريس تصبح أكثر جاذبية"},
    {k:"h",de:"Engagement für die Natur",ar:"الالتزام بالطبيعة"},
    {k:"i",de:"Preissenkungen bei Bus, Straßenbahn und U-Bahn!",ar:"تخفيضات في الحافلات والترام والمترو!"},
    {k:"j",de:"ZU WENIG LEHRER - STADT REAGIERT",ar:"نقص في المعلمين - المدينة تتخذ إجراءات"}
  ],
  items:[
    {n:1,c:"b",hl:"schneller und bequemer ans Ziel",de:"Sie haben Mitarbeiter, die gern mit dem Fahrrad zur Arbeit kommen? Warum dann nicht mehr E-Bikes leasen statt nur teure Firmenwagen? Gerade in Städten kommt man mit einem E-Bike schneller und bequemer ans Ziel als mit dem Auto. Und Parkplatzprobleme gibt es auch nicht. Sie fördern zudem die Gesundheit Ihrer Mitarbeiter und schonen die Umwelt, und dabei können Sie noch Steuern sparen. Bei der BikeLeasing GmbH bekommen Sie Angebote, die zu Ihnen passen. Melden Sie sich bei uns an, und wir kümmern uns um den Rest.",ar:"الإعلان يروّج لتأجير الدراجات الكهربائية بدل سيارات الشركة، لأنها صحية وبيئية وتوفر الضرائب."},
    {n:2,c:"h",hl:"Engagement für die Natur",de:"NaturVerband ist der größte Umweltverband in Deutschland. Er engagiert sich für Umwelt- und Tierschutz. Sie wollen sich auch aktiv gegen Umweltverschmutzung einsetzen? Sie wollen sich für mehr Naturschutz engagieren? Dann sind Sie bei uns richtig. Wir haben regelmäßige Treffen und führen Informationsveranstaltungen zu verschiedenen aktuellen Themen durch. Außerdem gibt es eine monatliche Mitgliederzeitschrift. Melden Sie sich einfach bei uns.",ar:"جمعية تعمل في حماية البيئة والحيوانات، وتقدم لقاءات ومجلة شهرية."},
    {n:3,c:"f",hl:"Ticketpreise",de:"Die Bahn erhöht dieses Jahr die Ticketpreise nicht. Dies soll die Bahn attraktiver machen, sodass mehr Menschen die Züge nutzen. Ob dies wirklich erfolgreich ist, bestreiten manche Experten. Sie argumentieren, dass das Auto in Deutschland zu beliebt ist. Günstiger werden außerdem die Tickets im öffentlichen Nahverkehr, weil dann nicht mehr so viele Berufstätige mit dem Auto zur Arbeit fahren. Ob diese Maßnahmen wirklich erfolgreich sind, wird sich zeigen. Experten sind sich einig: Ein Schritt in die richtige Richtung!",ar:"النص يتكلم عن عدم رفع أسعار تذاكر القطار هذا العام."},
    {n:4,c:"a",hl:"Eltern trotz Kritik mit der Schule zufrieden",de:"Vergangenen Monat wurden etwa tausend Eltern von der Stiftung Schulqualität befragt, ob sie mit der Schule ihrer Kinder zufrieden sind. Dabei sagten 80%, dass die Schule gut oder sogar sehr gut sei. Und das, obwohl nur 40% der Eltern denken, dass die Kinder in der Schule auf den Beruf vorbereitet werden. Die Schülerinnen und Schüler sollten mehr über Ökonomie lernen. Außerdem sagten über 60%, dass das Thema Umweltschutz im Unterricht eine größere Rolle spielen sollte.",ar:"80% من الآباء راضون عن المدرسة، لكن 40% فقط يرون أن أبناءهم مجهزون للمهنة."},
    {n:5,c:"j",hl:"Lehrermangel",de:"Berlin. In der Hauptstadt herrscht weiterhin Lehrermangel: Tausende Lehrkräfte fehlen. Mittlerweile unterrichten sogar schon Studierende die Schülerinnen und Schüler der Hauptstadt, weil sich nicht genügend ausgebildete Lehrkräfte finden. Die Unterrichtsqualität leidet stark. Daher plant der Berliner Senat eine Werbekampagne, um den Lehrerberuf attraktiver zu gestalten. Dabei sollen auch Menschen in anderen Berufen angesprochen werden. Außerdem denkt man über eine Erhöhung der Gehälter für Lehrerinnen und Lehrer nach.",ar:"نقص كبير في المعلمين في برلين، والمدينة تطلق حملة لجذب المعلمين."}
  ]
},

  options:[

    {k:"h",de:"Teures Essen für mehr Jugend und Schönheit",ar:"طعام باهظ الثمن من أجل المزيد من الشباب والجمال"},
    {k:"i",de:"Weniger schlafen - länger leben",ar:"النوم أقل - العيش أطول"},
    {k:"j",de:"Schokolade essen - jung bleiben",ar:"تناول الشوكولاتة - البقاء شاباً"}
  ],
  items:[
    {n:1,c:"h",hl:"Gut aussehen mit dem richtigen Essen",de:"Du bist, was du isst, hat als Slogan ausgedient. Heute muss es heißen: Gut aussehen mit dem richtigen Essen. Der Trend kommt aus den USA: Dort kaufen bereits viele Leute neue teure Lebensmittel mit wissenschaftlichen Inhaltsstoffen, die dem Kunden jüngeres und schöneres Aussehen versprechen. So bietet z.B. ein New Yorker Nobelhotel das Menü Gegen-Graue-Haare an. Aber wer wird schon eine solche Mahlzeit bestellen? Millionen von Leuten, so die Trendforscher. Und zwar aus dem einfachen Grund, weil jeder jung und gut aussehen will, und das mit möglichst wenig Aufwand.",ar:"اتجاه جديد من أمريكا: أطعمة غالية تعد بمظهر أصغر، والناس مستعدون لدفع الكثير."},
    {n:2,c:"c",hl:"nehmen oft schon in den Flitterwochen einige Kilos zu",de:"Frisch verheiratete Paare nehmen oft schon in den Flitterwochen einige Kilos zu, weil sie ihre Essgewohnheiten ändern. Das belegt eine neue Studie. In Deutschland sind fast die Hälfte der verheirateten Frauen und circa zwei Drittel der Ehemänner übergewichtig. Alleinstehende sind vermutlich schlanker, weil sie besonderen Wert auf ihr Äußeres legen, mehr Sport treiben und sich selten Zeit für gemütliche Mahlzeiten nehmen.",ar:"المتزوجون حديثاً يكتسبون وزناً بسبب تغيير عاداتهم الغذائية."},
    {n:3,c:"e",hl:"Therapiemethoden mit Schokolade",de:"Der Schokolade-Boom zeigt sich hierzulande nicht nur im hohen Verbrauch (jeder Schweizer isst fast 12 Kilo Schokolade im Jahr!), nein, er hat nun auch die Schönheitsindustrie erreicht. Vom 16. Januar bis zum 24. Februar bietet das Grand Hotel Bad Ragaz unter dem Namen Choco Therapy zahlreiche kosmetische Behandlungsmethoden mit Schokolade an. Die Bäder, Massagen und Hautcremes mit Kakao sind durchaus ernst gemeint, denn Kakao soll eine belebende Eigenschaft haben, die den Menschen jung und gesund aussehen lässt.",ar:"النص يتكلم عن علاجات تجميل بالشوكولاتة في فندق سويسري."},
    {n:4,c:"f",hl:"ausgewogen zu essen und sich täglich zu bewegen",de:"Nach dem Motto „beschwingt und bewegt“ starten die Schweizer Gesundheitsbehörden eine landesweite Bewegungskampagne. Dabei soll die Schweizer Bevölkerung aufgerufen werden, ausgewogen zu essen und sich täglich zu bewegen. Fast zwei Drittel der Bevölkerung in der Schweiz sind wenig aktiv und essen zu viel. Die Kampagne soll den Leuten zeigen, wie Sport und gesunde Ernährung ohne großen Aufwand in den Alltag integriert werden können, z.B. mit einem Spaziergang am Mittag oder mit einem Apfel zum Znüni statt Schokolade.",ar:"حملة صحية سويسرية لتشجيع الناس على الرياضة وأكل متوازن."},
    {n:5,c:"i",hl:"kürzere Lebenserwartung",de:"Wer acht Stunden und länger schläft, hat eine deutlich kürzere Lebenserwartung. Das berichtete das Apothekenmagazin Gesundheit am Mittwoch und bezog sich dabei auf eine neue japanische Studie. Schlecht für die Männer, denn laut dieser Studie schlafen Männer im Durchschnitt eine halbe Stunde länger pro Nacht als Frauen. Aber es gibt auch eine gute Nachricht für die Viel- und Langschläfer: Wer lange schläft, hat weniger Gewichtsprobleme und fühlt sich gesünder.",ar:"الدراسة اليابانية تقول إن النوم الطويل يقلل العمر، والعنوان الصحيح هو النوم أقل."}
  ]
},
{ id:"caroline-t1", title:"Caroline", level:"B1", sub:"Teile 1", type:"headings",
  options:[
    {k:"a",de:"Diskussion über Flughafen und Arbeitsplätze",ar:"نقاش حول المطار وفرص العمل"},
    {k:"b",de:"Flughafen Frankfurt beliebter Veranstaltungsort",ar:"مطار فرانكفورت: مكان مفضل للفعاليات"},
    {k:"c",de:"Umwelt und Flughafen: Ein Informationsabend der Bürger",ar:"البيئة والمطار: أمسية معلوماتية للمواطنين"},
    {k:"d",de:"Neue Kurse: Museumsführung für junge Väter",ar:"دورات جديدة: جولات في المتحف للآباء الشباب"},
    {k:"e",de:"Neue Kurse für Kinder",ar:"دورات جديدة للأطفال"},
    {k:"f",de:"Experten gegen Vergrößerung des Flughafens",ar:"خبراء يعارضون توسيع المطار"},
    {k:"g",de:"Demonstration gegen Fluglärm",ar:"مظاهرة ضد الضوضاء الناتجة عن الطيران"},
    {k:"h",de:"Familienbildung Schwerpunkt Beruf und Familie",ar:"التوفيق بين العمل والأسرة: محور تعليم الأسرة"},
    {k:"i",de:"Flughafen Frankfurt wird 10 Jahre",ar:"مطار فرانكفورت يحتفل بمرور 10 سنوات"},
    {k:"j",de:"Neue Kurse: Spiele für Mütter und Kinder",ar:"دورات جديدة: ألعاب للأمهات والأطفال"}
  ],
  items:[
    {n:1,c:"b",hl:"beliebter Ort für Veranstaltungen",de:"Der Frankfurter Flughafen erfreut sich bei vielen Firmen als beliebter Ort für Veranstaltungen und Tagungen. Dies zeigt ein Bericht des Frankfurter Flughafens, der beim zehnjährigen Jubiläum des Kongresszentruns vorgelegt wurde. Im Jubiläumsjahr haben am Frankfurter Flughafen 6800 Veranstaltungen mit insgesamt 72000 Teilnehmern stattgefunden. Im Jahr davor waren es nur 6300 Veranstaltungen mit 70000 Gästen. Im Kongresszentrum, das direkt gegenüber dem Hauptgebäude des Flughafens liegt, gibt es 28 Konferenzräume für bis zu 200 Teilnehmer. Modernste Technik wie Laptop-Anschlüsse und Internetzugänge in allen Konferenzräumen sind ebenso vorhanden, wie ein Dolmetscherdienst und verschiedene Speisemöglichkeiten. Eine transportable Videokonferenz-Anlage ermöglicht Verbindungen in die ganze Welt.",ar:"مطار فرانكفورت مكان مفضل للشركات لتنظيم الفعاليات والمؤتمرات."},
    {n:2,c:"h",hl:"Thema Berufstätige Eltern",de:"Das neue Halbjahresprogramm der Evangelischen Familienbildungsstätte bringt eine Übersicht über viele Veranstaltungen. Neben Kursen wie Geburtsvorbereitung und Babypflege steht diesmal das Thema Berufstätige Eltern im Mittelpunkt. In Gruppen und Kursen vor allem für Frauen geht es darum, wie sich nach der Geburt eines Kindes Beruf und Familie miteinander vereinbaren lassen. Das Verhältnis zwischen Mann und Frau spielt eine große Rolle im Angebot der Familienbildung; hierzu gibt es wieder spezielle Programme nur für Frauen oder nur für Männer. Auch zum Verhältnis der Generationen (Großeltern und Enkelkinder) gibt es wieder Angebote. Darüber hinaus wartet das Programm mit Kursen für Entspannung und Zeitmanagement auf, die bei Fragen des Alltags helfen wollen.",ar:"برنامج لمراكز التعليم الأسري حول التوفيق بين العمل والأسرة."},
    {n:3,c:"e",hl:"neue Kurse für Kinder",de:"Die Volkshochschule Dornbirn bietet in den kommenden Wochen neue Kurse an. Am Mittwoch nächster Woche beginnen zwei Malkurse für Kinder. Zweieinhalb- bis vierjährige Kinder treffen sich um 15.30 Uhr, Kinder im Alter von fünf und sechs Jahren um 17.00 Uhr. Für Kinder im Alter zwischen eineinhalb und sechs Jahren und ihre Väter beginnt am Samstag um 10.00 Uhr eine feste Vater-Kind-Gruppe. Am darauf-folgenden Samstag gibt es dann auch ein Treffen für Väter und Kinder bis dreieinhalb Jahren. Etwas anderes ist die Kultur- und Kreativwerkstatt am Montag nächster Woche. Aus Ton und Erde sollen Figuren nach afrikanischen Beispielen gebastelt werden. Zur Vorbereitung treffen sich die Teilnehmer am kommenden Montag zuerst im Museum. Anmeldung spätestens morgen bis 15.00 Uhr.",ar:"دورات جديدة للأطفال، من رسم وأنشطة للآباء والأطفال وورشة طين."},
    {n:4,c:"c",hl:"Informationsabend über den Ausbau",de:"Der Frankfurter Flughafen wird weiter ausgebaut. Eine Gruppe von Frankfurter Bürgern aus den östlichen Stadtteilen, die sich seit Jahren aktiv für den Naturschutz und die Umwelt einsetzt, lädt für Donnerstag dieser Woche um 19.30 Uhr zu einem Informationsabend über den Ausbau des Frankfurter Flughafens ein. Im Bürgerhaus Ostend, Parkstraße 24, Clubraurn 12, werden verschiedene Sprecher zu hören sein. Die Gruppe möchte Antworten auf folgende Fragen suchen: Wie viel Lärm durch Flugzeuge verträgt die Stadt? Oder Welche Auswirkungen hat der Flugverkehr auf Umwelt und Natur?",ar:"أمسية معلومات يدعو إليها مواطنون ناشطون في البيئة حول توسعة المطار."},
    {n:5,c:"a",hl:"Thema Arbeitsplätze am Frankfurter Flughafen",de:"Eine Bürgergruppe mit dem Namen Südliches Frankfurt lädt für Montag kommender Woche, um 19.30 Uhr ins Pfarrhaus St. Mauritius, Mauritiusstraße 14, zu einer öffentlichen Expertenbefragung zum Thema Arbeitsplätze am Frankfurter Flughafen ein. Der Gruppe liegen Berichte und Daten vor, die nach den Worten der Sprecher der Gruppe sehr fantastisch und zweifelhaft sind. Deshalb hat die Bürgergruppe Südliches Frankfurt den Personalleiter des Frankfurter Flughafens, einen Experten aus dem Wirtschaftsministerium, einen bekannten Stadtentwicklungsplaner und einen Soziologen, der sich mit der Arbeitsplatzentwicklung in der Frankfurter Region beschäftigt, eingeladen. Im Anschluss an die Vorträge der Experten haben die Gäste Zeit, Fragen zu stellen.",ar:"لقاء عام مع خبراء حول فرص العمل في المطار."}
  ]
},
{ id:"vera-t1", title:"Vera", level:"B1", sub:"Teile 1", type:"headings",
  options:[
    {k:"a",de:"Abendwanderungen ab 89 Euro",ar:"جولات مسائية من 89 يورو"},
    {k:"b",de:"Ausflugsziele für Literaturinteressierte",ar:"أهداف سياحية لمحبي الأدب"},
    {k:"c",de:"Hinweis für Besucher der Bregenzer Festspiele",ar:"ملاحظة لزوار مهرجان بريغنتس"},
    {k:"d",de:"Ihre Zeitung folgt Ihnen in den Urlaub",ar:"صحيفتك تتبعك في العطلة"},
    {k:"e",de:"Laute Musik stört den Nachbarn",ar:"الموسيقى الصاخبة تزعج الجار"},
    {k:"f",de:"Musikveranstaltungen am Nachmittag",ar:"فعاليات موسيقية بعد الظهر"},
    {k:"g",de:"Neue Zeitung für Ihre Urlaubsplanung",ar:"صحيفة جديدة لتخطيط عطلتك"},
    {k:"h",de:"Rekord: 70.000 Besucher im Bücherdorf",ar:"رقم قياسي: 70,000 زائر في قرية الكتب"},
    {k:"i",de:"Schlechtes Wetter: Festspiele abgesagt",ar:"طقس سيئ: إلغاء المهرجانات"},
    {k:"j",de:"Wandern ohne Gepäck",ar:"المشي بدون أمتعة"}
  ],
  items:[
    {n:1,c:"d",hl:"Zeitung in den Urlaubtort nachsenden",de:"Wenn Sie verreisen, wünschen wir ihnen erholsame und angenehme Ferienlage Bitte denken Sie daran, sich ihre Zeitung in den Urlaubtort nachsenden zu lassen. Denn mit den Neuigkeiten von zu Hause und aus aller Weil lässt sich die schönste Zeit des Jahres erst richtig genießen ganz Europa kostenlos, Die Höhe des Bezeugendes bleibt unverändert. Ausführliche Informationen und entsprechende Coupons ihrem Europabericht. Griechisch wird meistens von Zwölftklässlern als dritte Fremdsprache neben Französisch und Englisch gewählt. finden Sie in unserem großen Reise Service – Anzeigen oder rufen Sie uns einfach an: Telefon 01 30-18 58 50 zum Nulltarif. Hannoversche Allgemeine Neue Presse",ar:"تقدم صحيفة هانوفرشه ألغماينه لقرائها المسافرين خدمة مميزة تتيح لهم متابعة أخبار وطنهم والعالم من خلال شحن النسخ الورقية إلى أماكن قضاء عطلاتهم في مختلف أنحاء أوروبا دون أي تكاليف إضافية حيث تظل قيمة الاشتراك ثابتة دون تغيير."},
    {n:2,c:"j",hl:"Wanderungen ohne Gepäck",de:"Im Luftkurort Stadtkylf in der Mittelgebirgslandschaft des Oberen Kullas werden dreitägige Wanderungen ohne Gepäck veranstaltet Die Rundwanderung im deutsch – bei gischen Naturpark führt abends zu reservierten Zimmern. Die Betriebe übernehmen den Gepäcktransport zum nächsten Tagesziel. Die Wanderungen werden ganzjährig angeboten. In den Wanderprogramm sind drei Übernachtungen mit Frühstück dreimal Gepäcktransport, eine Wanderkarte, eine Wegbeschreibung und ein Wanderpass enthalten. Der Pauschalbetrag beträgt pro Person 89 Euro. Auskünfte: Verkehrsverein Erholungsgebiet Oberes Kylltal. Kurallee, 54589 Stadtkylf, Telefon ( 06597) 28 78.",ar:"تنظم منطقة شتادت كيل السياحية جولات مشي دائرية تمتد لثلاثة أيام في المحمية الطبيعية وتتميز هذه الرحلات بخدمة نقل الأمتعة بين الفنادق بشكل مستقل ليتفرغ السائح للمشي."},
    {n:3,c:"e",hl:"Laute Musik stört den Nachbarn",de:"Für den einen ist es musikalischer Hochgenuss für den anderen schlicht Lärm. Gemeint ist Musik, die aus Lautsprechen, Radios oder durch Musikinstrumente durch geöffnet Türen und Fenster bei sommerlichen Temperaturen ins Freie dringt. Die Gemeinde weist darauf hin, dass der Mittagsruhe von 13 bis 15 Uhr und nachts von 22 bis 7 Uhr keine musikalische Ruhestörung erfolgen darf. Gartengeräte mit Motoren dürfen montags bis freitags nur von 8 bis 13 und von 15 bis 19 Uhr benutzt werden, an Sonnabenden von 9 bis 13 Uhr. An Sonn - und Feiertagen dürfen die Geräte nicht zum Einsatz kommen.",ar:"أصدرت البلدية توجيهات صارمة بخصوص الضوضاء الناتجة عن الموسيقى والأدوات ذات المحركات لضمان راحة السكان."},
    {n:4,c:"b",hl:"Bücherdorf",de:"Das erste deutsche Bücherdorf hat in Mühlbeck/ Fredersdorf (Sachsen – Anhalt ) seit Ende September seine Tore geöffnet. In acht Antiquarten warten über 70 000 Bücher aus allen Bereichen der Literatur auf Interessenten. Das in reizvoller landschaftlicher Umgebung liegende Bücherdorf nahe Bitterfeld - unweit der A19 und des Flughafens Leipzig - ist aus allen Teilen Deutschlands leicht zu erreich. Geöffnet sind die Antiquariate auch am Samstag und Sonntag. In Europa gibt es bereits acht solcher Bücherdörfer in Belgien, Frankreich, Großbritannien, den Niederlanden, Norwegen und der Schweiz. Initiatorin des deutschen Bücherdorfes ist Heidi Dehne (Tel. 03493/4 30 43).",ar:"أصبحت منطقة مولبيك فريدرسدورف مقراً لأول قرية كتب ألمانية حيث تضم ثمانية متاجر متخصصة في الكتب القديمة تعرض ما يزيد عن سبعين ألف مؤلف."},
    {n:5,c:"c",hl:"Hinweis für Besucher",de:"Die Bregenzer Festspiele sind bemüht, die Vorstellungen auch bei zweifelhafter Witterung bzw. leichtem Regen auf der Seebühne abzuhalten, weshalb es zu Verzögerungen des Beginns oder zu Unterbrechungen kommen kann. Sollte die Seeaufführung nicht stattfinden können, wird eine halbszenische Version von Porgy and Bess im Festspielhaus gegeben. Wir empfehlen unseren Gästen , bei unsicherer Wetterlage regenfester Kleidung den Vorzug zu geben und auf Schirme zu verzichten, da diese die Sicht beeinträchtigen. Das Spiel auf dem See wird ohne Pause gespielt. Die Spieldauer beträgt ca.2 Std. 45 Min.",ar:"تبذل إدارة مهرجان بريغنتس قصارى جهدها لتقديم العروض على المسرح العائم حتى في حال تقلب الطقس."}
  ]
},
{ id:"alex-t2", title:"Alex Und Cora", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Egal ob Hund, Katze oder Maus: Haustiere sind in Deutschland sehr beliebt. Markus Kleinoth aus der Freizeitredaktion hat sich mit diesem Thema beschäftigt.", ar: "سواء كان كلباً أو قطة أو فأراً: الحيوانات الأليفة تحظى بشعبية كبيرة في ألمانيا. ماركوس كلاينوت من قسم الترفيه تناول هذا الموضوع." },
    { de: "In deutschen Haushalten gibt es rund 34 Millionen Haustiere. Besonders Katzen sind sehr beliebt, denn davon leben 14 Millionen in Deutschland. Und das, obwohl Deutschland als Land der Hundefans gilt. Insgesamt gibt es aber etwa 10 Millionen Hunde.", ar: "يوجد في الأسر الألمانية حوالي 34 مليون حيوان أليف. القطط تحظى بشعبية خاصة، حيث يعيش منها 14 مليوناً في ألمانيا. وهذا على الرغم من أن ألمانيا تعتبر بلد محبي الكلاب. ومع ذلك، هناك حوالي 10 ملايين كلب في المجموع." },
    { de: "Für den Hund ist manchen Menschen nichts zu teuer. Eine Hundebesitzerin, die überdurchschnittlich viel Geld für ihren Liebling ausgibt, ist Bettina Schröther: Morgens vor der Arbeit bringe ich meinen Hund in eine sehr gute Tagesbetreuung, in der es auch eine Hundeschule gibt. Aber wenn ich frei habe, sind wir immer zusammen, auch im Urlaub. Ich war mit ihm sogar schon in einem Wellnesshotel für Hunde.", ar: "بالنسبة للبعض، لا شيء غالٍ جداً من أجل الكلب. إحدى مربيات الكلاب التي تنفق أموالاً أكثر من المتوسط على حيوانها المفضل هي بيتينا شرودر: في الصباح قبل العمل آخذ كلبي إلى رعاية نهارية جيدة جداً، حيث يوجد أيضاً مدرسة للكلاب. ولكن عندما أكون في عطلة، نكون دائماً معاً، حتى في الإجازة. لقد ذهبت معه حتى إلى فندق صحي للكلاب." },
    { de: "Der Hundeexperte Marius Klotz kennt solche Fälle, sieht das aber kritisch: Viele Besitzer meinen es gut und tun zu viel für ihre Hunde. Hier sollte man aufpassen. Für einen Hund ist es sehr wichtig, eine gute Erziehung zu bekommen. Wichtig sind klare Regeln, die er verstehen kann. Außerdem braucht er viel Bewegung und unbedingt passendes Futter. Frisches Futter ist nicht unbedingt das beste, da sollte man sich gut informieren, am besten Fachleute fragen.", ar: "خبير الكلاب ماريوس كلوتز يعرف مثل هذه الحالات، لكنه يراها بشكل نقدي: العديد من المالكين يقصدون الخير ويفعلون الكثير جداً لكلابهم. هنا يجب الحذر. من المهم جداً للكلب أن يحصل على تربية جيدة. القواعد الواضحة التي يمكنه فهمها مهمة. بالإضافة إلى ذلك، يحتاج إلى الكثير من الحركة والطعام المناسب حتماً. الطعام الطازج ليس بالضرورة الأفضل، هنا يجب الاستفسار جيداً، والأفضل سؤال الخبراء." },
    { de: "Viele Menschen sehen ihre Katzen und Hunde als Teil der Familie. So auch Ellie Herfried, Hundebesitzerin aus Erfurt: Unsere Familie feiert jedes Jahr mit unserem kleinen Schatz Geburtstag. Er bekommt einen Geburtstagshundekuchen, natürlich mit Kerzen, und auch ein Geschenk. Dieses Jahr haben wir außerdem seine Hundefreunde eingeladen.", ar: "كثير من الناس يرون قططهم وكلابهم كجزء من العائلة. وكذلك إلي هيرفريد، مالكة كلب من إرفورت: عائلتنا تحتفل كل عام بعيد ميلاد كنزنا الصغير. يحصل على كعكة عيد ميلاد للكلاب، بالطبع مع شموع، وأيضاً على هدية. هذا العام دعونا أيضاً أصدقاءه من الكلاب." },
    { de: "Auch in einigen Seniorenheimen sind mittlerweile Tiere erlaubt. Sandra Bärenweger ist Altenpflegerin in Hamburg: Bei uns im Haus haben einige Senioren einen Hund oder eine Katze. Dadurch haben sie eine Aufgabe, denn sie müssen sich ja um ihr Tier kümmern, es füttern, oder mit ihm rausgehen, wenn er ein Hund ist. So haben sie jeden Tag eine sinnvolle Beschäftigung. Das tut den älteren Menschen gut; viele bleiben dadurch fit.", ar: "حتى في بعض دور رعاية المسنين، أصبحت الحيوانات مسموح بها الآن. ساندرا بيرينفيغر ممرضة مسنين في هامبورغ: في منزلنا، لدى بعض كبار السن كلب أو قطة. بهذه الطريقة لديهم مهمة، لأنه يتعين عليهم الاعتناء بحيواناتهم، وإطعامها، أو الخروج معها إذا كان كلباً. بهذه الطريقة لديهم نشاط مفيد كل يوم. هذا يفيد كبار السن؛ الكثير منهم يبقون لائقين بسببه." },
    { de: "Der tägliche Spaziergang mit dem Hund oder das Spielen mit der Katze bietet vielen Haustierbesitzern Ruhe und Entspannung, eine kleine Erholung vom Alltag. Das bestätigen auch Fachleute: Haustiere können gerade bei Stress für viele Menschen ein guter Ausgleich sein. Das Haustier ist dabei auch viel mehr als ein Hobby, da es ein Lebewesen ist, das schnell zum Familienmitglied wird und das Leben bereichert.", ar: "التنزه اليومي مع الكلب أو اللعب مع القطة يوفر للعديد من أصحاب الحيوانات الأليفة الهدوء والاسترخاء، وهو استراحة صغيرة من الحياة اليومية. يؤكد الخبراء ذلك أيضاً: الحيوانات الأليفة يمكن أن تكون تعويضاً جيداً للكثير من الناس، خاصة في أوقات التوتر. الحيوان الأليف هو أكثر بكثير من مجرد هواية، لأنه كائن حي يصبح بسرعة عضواً في الأسرة ويثري الحياة." }
  ],
  items:[
    {n:1,c:"C",q:"Die Hundebesitzerin Elli Herfeld",opts:[{k:"A",de:"feiert ihren Geburtstag immer mit ihrem Hund."},{k:"B",de:"sieht ihren Hund als festes Familienmitglied."},{k:"C",de:"backt ihrem Hund zum Geburtstag einen Kuchen."}],ar:"النص يقول إنها تحضر كعكة عيد ميلاد لكلبها."},
    {n:2,c:"A",q:"In Seniorenheimen gibt es oft Tiere, damit",opts:[{k:"A",de:"die Senioren etwas tun, was gut für sie ist."},{k:"B",de:"sie auf die älteren Menschen aufpassen."},{k:"C",de:"die Senioren mehr spazieren gehen."}],ar:"الحيوانات تعطي المسنين مهمة مفيدة لصحتهم."},
    {n:3,c:"A",q:"Bettina Schröther …",opts:[{k:"A",de:"verbringt die ganze Freizeit mit ihrem Hund."},{k:"B",de:"macht mit ihrem Hund regelmäßig Wellnessurlaube."},{k:"C",de:"lässt ihren Hund in einer Hundeschule erziehen."}],ar:"النص يقول إنها تكون مع كلبها كل وقت فراغها."},
    {n:4,c:"C",q:"Nach Meinung von Hundeexperte Marius Klotz sollte man",opts:[{k:"A",de:"sich zur Ernährung des Tiers beraten lassen."},{k:"B",de:"seinen Hund immer gut behandeln."},{k:"C",de:"die Regeln bei der Hundeerziehung beachten."}],ar:"الخبير يشدد على قواعد واضحة في تربية الكلب."},
    {n:5,c:"A",q:"Fachleute meinen, dass",opts:[{k:"A",de:"man sich durch sein Haustier erholen kann."},{k:"B",de:"man mit seinem Hund täglich spazieren gehen sollte."},{k:"C",de:"ein Haustier ein sinnvolles Hobby ist."}],ar:"الحيوان الأليف يساعد على الراحة والاسترخاء."}

{ id:"rita-t2", title:"Rita", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Von Antje Blinda Coz-Ausstoß: null. Geplante Strecke: einmal um die Welt. Endlich wird der Traum von Louis Palmer wahr: Der Schweizer startet mit seinem Auto, das mit Sonnenenergie fährt, zur Weltumrundung. Er will damit zeigen, dass Autofahren auch geht, ohne der Umwelt zu schaden.", ar: "بقلم أنتيي بليندا. انبعاثات ثاني أكسيد الكربون: صفر. المسار المخطط: مرة واحدة حول العالم. أخيراً يتحقق حلم لويس بالمر: يبدأ السويسري رحلته حول العالم بسيارته التي تعمل بالطاقة الشمسية. يريد أن يثبت بذلك أن قيادة السيارة ممكنة أيضاً دون الإضرار بالبيئة." },
    { de: "Entwickelt für mich ein Fahrzeug für eine Weltreise, die mit Sonnenenergie fährt, forderte Louis Palmer Studenten an Schweizer Universitäten auf. Das war vor drei Jahren. Heute ist das Auto fertig: ein dreirädriges Fahrzeug mit zwei Sitzplätzen. Und die Weltreise? Am 3. Juli starten er und sein 7-köpfiges Team in Luzern: Das Auto soll als erstes Solarfahrzeug die Welt umrunden.", ar: "\"طوروا لي مركبة لرحلة حول العالم تعمل بالطاقة الشمسية\"، طلب لويس بالمر من طلاب في جامعات سويسرية. كان ذلك قبل ثلاث سنوات. اليوم السيارة جاهزة: مركبة بثلاث عجلات ومقعدين. والرحلة حول العالم؟ في 3 يوليو يبدأ هو وفريقه المكون من 7 أفراد في لوسيرن: من المفترض أن تدور السيارة حول العالم كأول مركبة شمسية." },
    { de: "Die ganze Welt wartet auf revolutionäre Erfindungen für ein umweltbewusstes Auto, sagt der Schweizer, ich will darauf aufmerksam machen, dass die technischen Lösungen schon jetzt vorhanden sind. Mit 14 Jahren hatte Louis den Entschluss gefasst. Gegen die Veränderung des Klimas muss etwas getan werden. Die Lösung hatte er auch schon: Mit kräftigen Strichen zeichnete er ein Rennauto, verziert mit lachendem Sonnen. Der Rest war nur eine Frage der Organisation und der konsequenten Lebensplanung. Ich unterteile mein Leben in drei Phasen, sagt Palmer und lacht über sich selbst: zwischen 20 und 30 die Welt kennen lernen, zwischen 30 und 40 die Welt aufmerksam machen und zwischen 40 und 50 die Welt verändern.", ar: "\"العالم كله ينتظر اختراعات ثورية لسيارة صديقة للبيئة\"، يقول السويسري، \"أريد أن ألفت الانتباه إلى أن الحلول التقنية موجودة بالفعل الآن\". في سن 14 عاماً اتخذ لويس قراره. يجب فعل شيء ضد تغير المناخ. كان لديه الحل بالفعل: بخطوط قوية رسم سيارة سباق، مزينة بشمس ضاحكة. كان الباقي مجرد مسألة تنظيم وتخطيط حياة متسق. \"أقسم حياتي إلى ثلاث مراحل\"، يقول بالمر ويضحك على نفسه: بين 20 و 30 تعلم العالم، بين 30 و 40 لفت انتباه العالم، وبين 40 و 50 تغيير العالم." },
    { de: "Phase eins begann mit 23 Jahren: Er zog aus, um 50 Länder auf allen Kontinenten zu bereisen: Anstatt an die Uni zu gehen, habe ich die Welt studiert. Mit dem Fahrrad fuhr er von Kenia nach Kapstadt, mit einem Segelflugzeug überflog er Südamerika und als Fotograf reiste er mehrmals nach Afghanistan.", ar: "بدأت المرحلة الأولى في سن 23: خرج للسفر إلى 50 دولة في جميع القارات: \"بدلاً من الذهاب إلى الجامعة، درست العالم\". سافر بالدراجة من كينيا إلى كيب تاون، وحلق فوق أمريكا الجنوبية بطائرة شراعية، وسافر عدة مرات إلى أفغانستان كمصور." },
    { de: "Phase zwei startete vor drei Jahren: Palmer konnte Studenten von vier Universitäten gewinnen, die für ihn das Auto bauten. Schwierig war es aber, Firmen und private Sponsoren für die finanzielle Unterstützung zu finden, meint Palmer. Doch auch das hat dann schließlich geklappt.", ar: "بدأت المرحلة الثانية قبل ثلاث سنوات: تمكن بالمر من إقناع طلاب من أربع جامعات ببناء السيارة له. لكن كان من الصعب العثور على شركات ورعاة من القطاع الخاص لتقديم الدعم المالي، كما يقول بالمر. لكن ذلك نجح في النهاية أيضاً." },
    { de: "Nun ist Palmer bereit für die Tour. Ich habe keine Ahnung, was auf uns zukommt, sagt der erfahrene Globetrotter, der sechs Sprachen spricht. Ich habe schon etwas Angst, z.B. vor dem Straßenverkehr in Millionenstädten oder unvorhersehbaren Zwischenfällen. Das Schlimmste ist aber, wenn jeder Tag wie der andere ist. In den nächsten 16 Monaten wird es dazu nicht kommen.", ar: "الآن بالمر مستعد للجولة. \"ليس لدي فكرة عما ينتظرنا\"، يقول الرحالة ذو الخبرة الذي يتحدث ست لغات. \"لدي بعض الخوف، على سبيل المثال من حركة المرور في المدن المليونية أو الحوادث غير المتوقعة. لكن الأسوأ هو أن يكون كل يوم مثل الآخر. في الـ 16 شهراً القادمة لن يحدث ذلك\"." }
  ],
  items:[
    {n:1,c:"C",q:"Mit 23 Jahren wollte Louis Palmer",opts:[{k:"A",de:"für Studenten Reisen nach Südamerika organisieren"},{k:"B",de:"mit dem Fahrrad durch 50 verschiedene Länder fahren"},{k:"C",de:"viele verschiedene Länder kennen lernen"}],ar:"في سن 23 أراد أن يتعرف على دول كثيرة ويسافر حول العالم."},
    {n:2,c:"C",q:"Sein Projekt konnte Palmer realisieren,",opts:[{k:"A",de:"weil er einen Preis von einer Universität gewonnen hat"},{k:"B",de:"weil er finanzielle Unterstützung von vier Universitäten erhalten hat."},{k:"C",de:"weil ihn Firmen und Universitäten unterstützt haben"}],ar:"الطلاب من أربع جامعات بنوا السيارة، لكن الدعم جاء في النهاية من الشركات والممولين."},
    {n:3,c:"A",q:"Palmers Auto",opts:[{k:"A",de:"fährt mit alternativer Energie"},{k:"B",de:"geht auf eine dreijährige Weltreise"},{k:"C",de:"hat genug Platz für sieben Personen"}],ar:"السيارة تسير بالطاقة الشمسية."},
    {n:4,c:"A",q:"Louis Palmer",opts:[{k:"A",de:"wird sich in nächster Zeit nicht langweilen"},{k:"B",de:"möchte mit seinem Auto nicht durch Großstädte fahren"},{k:"C",de:"hat für die Weltreise sechs Sprachen gelernt"}],ar:"هو يقول إن الأيام القادمة لن تكون مملة."},
    {n:5,c:"C",q:"Schon als Jugendlicher",opts:[{k:"A",de:"baute Louis an einem umweltfreundlichen Auto"},{k:"B",de:"wollte Louis etwas für die Umwelt tun."},{k:"C",de:"wusste Louis genau, wie er sein Leben einteilen will"}],ar:"وهو صغير عرف كيف يقسم حياته إلى ثلاث مراحل."}
  ]
},
{ id:"caroline-t2", title:"Caroline", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Anne und Melanie (beide 6) stehen Erzieherinnen mit Vorschlägen hilfreich zur Seite. Von Christiane Altenberger, Sie sind die Problemlöser im Kindergarten an der Munckerstraße. Wenn das Malprogram spinnt, plötzlich ein Spiel auftaucht, das keiner kennt, dann rufen die Erzieherinnen nach Anne und Melanie. Die sind zwar erst sechs Jahre alt, aber mit den Computerspielen kennen sie sich aus. Die Kinder wissen manchmal mehr als wir sagt Eva Schilling. Leiterin des Kindergartens. Gelernt haben die beiden ihr Know-how bei Multimedia - Landschaften für Kinder, einem Projekt, das das Schulamt zusammen mit dem Studio im Netz gestartet hat.", ar: "آن وميلاني (كلاهما 6 سنوات) تساعدان المربيات باقتراحات مفيدة. بقلم كريستيان ألتنبرغر، هما حلال المشاكل في روضة الأطفال في شارع مونكر. إذا تعطل برنامج الرسم، أو ظهرت فجأة لعبة لا يعرفها أحد، فإن المربيات ينادين آن وميلاني. عمرهما ست سنوات فقط، لكنهما تعرفان ألعاب الكمبيوتر. \"الأطفال يعرفون أحياناً أكثر منا\"، كما تقول إيفا شيلينغ، مديرة الروضة. تعلمت الفتاتان معرفتهما في مشروع \"مناظر الوسائط المتعددة للأطفال\"، وهو مشروع أطلقته إدارة المدرسة مع \"استوديو الإنترنت\"." },
    { de: "Im Rahmen dieses Projekts werden in städtischen Kindergärten zwei Wanderstationen mit je drei Multimedia- Computern und einem Farbdrucker installiert. Die Stationen wandern durch 14 Kindergärten, wo sie jeweils für vier Wochen installiert werden. Mit dabei in den Kindergärten: ein ganzer Satz von Spiel – Software. Vierjährige am Computer? In Pädagogen kreisen sind viele Berührungsängste da, weiß Edith llg, Fachberaterin für Kindergärten beim Schulamt, aber wir können uns aus dieser Entwicklung nicht ausklinken. Die Kinder wollen sich mit ihrer Umwelt auseinandersetzen. Angefangen hat diese Auseinandersetzung im Studio im Netz – 193 Kinder waren eingeladen, um erste Erfahrungen am Computer zu sammeln. Die Kinder waren absolut begeistert, haben immer wieder gefragt, wann gehen wir da wieder hin, so Frau llg.", ar: "في إطار هذا المشروع، سيتم تركيب محطتين متنقلتين في رياض الأطفال البلدية، كل منهما تحتوي على ثلاثة أجهزة كمبيوتر متعددة الوسائط وطابعة ملونة. تتنقل المحطات عبر 14 روضة أطفال، حيث يتم تركيبها لمدة أربعة أسابيع في كل مرة. معهم في رياض الأطفال: مجموعة كاملة من برامج الألعاب. طفل في الرابعة من العمر أمام الكمبيوتر؟ في أوساط التربويين هناك الكثير من المخاوف من التواصل، كما تعلم إيديث إلغ، المستشارة المتخصصة في رياض الأطفال في إدارة المدرسة، \"لكننا لا يمكننا الانفصال عن هذا التطور. الأطفال يريدون التعامل مع بيئتهم\". بدأ هذا التعامل في \"استوديو الإنترنت\" - تمت دعوة 193 طفلاً لجمع الخبرات الأولى على الكمبيوتر. \"كان الأطفال متحمسين تماماً، وسألوا مراراً وتكراراً متى سنذهب إلى هناك مرة أخرى\"، كما تقول السيدة إلغ." },
    { de: "Bevor jedoch die Computer in die Kindergärten kamen, waren die Eltern aufzuklären. Bei manchen Eltern löste das Stichwort Computer akute Ängste aus nach dem Motto: Mein fröhliches, gesundes Kind setzt sich vor den Computer und steht sechs Stunden später krank, sprachlos und einsam wieder auf.", ar: "لكن قبل أن تصل أجهزة الكمبيوتر إلى رياض الأطفال، كان لا بد من توعية الآباء. عند بعض الآباء، أثارت كلمة \"كمبيوتر\" مخاوف حادة وفقاً لشعار: \"طفلي السعيد السليم يجلس أمام الكمبيوتر ويقف بعد ست ساعات مريضاً، صامتاً ووحيداً\"." },
    { de: "Diese Ängste haben sich inzwischen gelegt und die Erfahrung vor Ort zeigt, dass sie weitgehend über flüssig sind. Die Erzieherinnen achten auch darauf, dass die Kinder nie länger als 15 bis 20 Minuten vor den Computern sitzen, und holen vor allem kreative Software auf den Bildschirm.", ar: "لقد هدأت هذه المخاوف في غضون ذلك، وتظهر التجربة الميدانية أنها زائدة عن الحاجة إلى حد كبير. يحرص المربيات أيضاً على ألا يجلس الأطفال أمام الكمبيوتر لأكثر من 15 إلى 20 دقيقة، ويجلبون برامج إبداعية إلى الشاشة قبل كل شيء." },
    { de: "Das einsame Dämmern vor dem Computer ist wohl ohnehin eher Sache der Erwachsenen – die Kinder spielen immer zu zweit oder zu dritt an der Maschine. Eva Schilling hat beobachtet, dass die Kinder am Computer sehr friedlich miteinander umgehen, sie helfen sich gegenseitig, es gibt wenig Konflikte. Dabei entwickeln gerade Kinder, die sich sonst nur schwer auf etwas konzentrieren können, plötzlich ungeahnte Konzentrationszeiten. Eva Schilling kann sich deshalb die Computer als Dauereinrichtung im Kindergarten vorstellen.", ar: "على أي حال، فإن النعاس الوحيد أمام الكمبيوتر هو بالأحرى من شؤون البالغين - فالأطفال يلعبون دائماً في مجموعات من شخصين أو ثلاثة على الجهاز. لاحظت إيفا شيلينغ أن الأطفال يتعاملون مع بعضهم البعض بسلام شديد على الكمبيوتر، ويساعدون بعضهم البعض، ولا يوجد سوى القليل من الصراعات. في الوقت نفسه، يطور الأطفال الذين يجدون صعوبة في التركيز على شيء آخر فجأة فترات تركيز غير متوقعة. لذلك يمكن لإيفا شيلينغ أن تتخيل أجهزة الكمبيوتر كمنشأة دائمة في رياض الأطفال." }
  ],
  items:[
    {n:1,c:"A",q:"Das Schulamt hat ein Projekt gestartet, bei dem",opts:[{k:"A",de:"Computer in Kindergärten aufgestellt werden."},{k:"B",de:"Computerspiele für Vierjährige entwickelt werden sollen."},{k:"C",de:"Kinder neue Farbdrucker ausprobieren sollen."}],ar:"المشروع يهدف لتجهيز روض الأطفال بالحواسيب."},
    {n:2,c:"A",q:"Die Kinder",opts:[{k:"A",de:"hatten großen Spaß bei dem Projekt."},{k:"B",de:"wollten lieber draußen im Freien spielen."},{k:"C",de:"wussten nicht, wann sie ins Studio im Netz gehen sollten."}],ar:"النص يقول إنهم كانوا مبسوطين بزاف (absolut begeistert)."},
    {n:3,c:"A",q:"Eltern fürchten, dass",opts:[{k:"A",de:"der Computer ihren Kindern schadet."},{k:"B",de:"ihre Kinder nicht so früh aufstehen können."},{k:"C",de:"ihre Kinder vor dem Computer Angst haben."}],ar:"الآباء كان عندهم خوف أن الحاسوب يضر بصحة أطفالهم."},
    {n:4,c:"C",q:"Die Erzieherinnen",opts:[{k:"A",de:"arbeiten jeden Tag 15 bis 20 Minuten am Computer."},{k:"B",de:"spielen immer mit zwei oder drei Kindern am Computer."},{k:"C",de:"wählen für die Kinder die Software aus."}],ar:"المربيات هن اللي كيختارو البرامج الإبداعية."},
    {n:5,c:"B",q:"Wenn die Kinder am Computer sitzen, dann",opts:[{k:"A",de:"gibt es häufig Streit."},{k:"B",de:"hilft ein Kind dem anderen."},{k:"C",de:"können sich die meisten nicht lange konzentrieren."}],ar:"النص يقول إنهم يتعاونون (helfen sich gegenseitig)."}
  ]
},

{ id:"alex-sp1", title:"Alex Und Cora", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Schaffhausen, den...\nHallo Isabelle,\nwie geht es dir? Hast du deine Prüfungen geschafft?\nWie du ja weißt, .....(1)..... ich seit zwei Monaten in einem Altersheim .....(2)..... der Nähe von Schaffhausen. Die Arbeit in .....(3)..... Haus gefällt mir gut, obwohl es manchmal auch sehr stressig ist. Besonders schön ist der enge .....(4)..... zu einigen der alten Menschen. Eine Frau, Anna Ringier, mag ich .....(5)..... gern. Sie ist schon 96 Jahre alt und sitzt im Rollstuhl, aber sie ist immer fröhlich. Gestern hat sie mir .....(6)..... ganzes Leben erzählt. Sie hat bis zum 84. Lebensjahr .....(7)..... gearbeitet. Schon als achtjähriges Mädchen musste sie bei einem Bauern arbeiten, .....(8)..... ihre Eltern die neunköpfige Familie nicht ernähren konnten. Später arbeitete Anna als Schneiderin.\nNeben ihrer Arbeit hat Anna .....(9)..... auf eine Sache nie verzichtet: das Bergsteigen! Das war immer ihre große Leidenschaft. Diese Frau ist wirklich sehr beeindruckend!\nAber du .....(10)..... bestimmt auch viel erlebt. Ich würde mich sehr freuen, wenn du mir bald wieder einmal schreibst!\nHerzliche Grüße\ndeine Julie`,

{ id:"rita-sp1", title:"Rita", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Liebe Catherine,\nich hab's geschafft! Endlich habe ich einen Job bekommen. Wie versprochen möchte ich dir gleich .....(1)..... erzählen. Am Anfang .....(2)..... ich ziemlich enttäuscht, weil ich auf meine vielen Bewerbungsschreiben insgesamt .....(3)..... zwei Antworten bekommen habe. Aber zum Glück hat einer davon .....(4).....: Ich werde nun zwei Nachmittage in der Woche als Babysitterin .....(5)..... einer Familie arbeiten, die zwei Kinder hat. Sie sind 3 und 5 Jahre alt und .....(6)..... sind sehr nett. Wir haben in der .....(7)..... Woche bereits Vieles gemeinsam gemacht, sind in den Zoo und .....(8)..... Kindermuseum gegangen. .....(9)..... kann man eine Stadt gar nicht kennenlernen, und es macht mir viel Spaß!\nFür heute wünsche ich dir alles Gute, schreibe mir bald, wie es dir .....(10)..... .\nLiebe Grüße\nDeine Tanja`,

{ id:"caroline-sp1", title:"Caroline", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Liebe Catherine,\nseit ich dir letzte Mal von meinem Sprachhaufenhalt in der Schweiz .....(1)..... habe, ist viel passiert. Ich kenne .....(2)..... Land jetzt schon recht gut. Die Schweiz ist ja wirklich nicht groß. .....(3)..... in jeder Gegend wird ein anderer Dialekt oder gar eine andere Sprache gesprochen. Das ist .....(4)..... mich fast unglaublich! Bei uns in Australien fährt man mit dem Auto 24 Stunden lang geradeaus, und .....(5)..... man ankommt, dann sprechen die Leute dort immer noch dieselbe Sprache. Am Anfang hat mich das Sprachgemisch .....(6)..... sehr verwirrt, aber .....(7)..... verstehe ich fast alles, wenn jemand auf Schweizerdeutsch zu mir spricht. Ich kann aber nur auf Hochdeutsch antworten. Zwischen der Schule hier und unserem Schulsystem in Australien gibt es einige .....(8).....: In der Schweiz sprechen die Lehrer viel und die Schüler .....(9)..... Vieles im Kopf behalten oder aufschreiben. In Australien arbeiten wir meistens im Rahmen von Projekten und machen eigentlich alle Aufgaben auf .....(10)..... Computer.\nViele Grüße\nJack`,
