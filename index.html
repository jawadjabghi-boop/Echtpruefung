              </button>
            ) : (
              <div className="bg-ink text-white p-6 rounded-2xl text-center shadow-xl">
                <h2 className="text-slate-300 font-semibold mb-2">Ergebnis</h2>
                <div className="text-5xl font-extrabold text-gold de mb-4">{score} / {texts.length * 5}</div>
                <button 
                  onClick={() => { setAnswers({}); setCorrected(false); window.scrollTo(0,0); }} 
                  className="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-xl font-bold transition-colors"
                >
                  إعادة المحاولة
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function NavItem({ icon, label, active, activeColor, activeBg, onClick }) {
      return (
        <div onClick={onClick} className="flex flex-col items-center gap-1 cursor-pointer w-14">
          <div className={`px-3 py-1.5 rounded-xl transition-colors ${active ? activeBg : ''}`}>
            <Icon n={icon} s={22} className={active ? activeColor : 'text-slate-400 dark:text-slate-500'} />
          </div>
          <span className={`text-[10px] font-bold ${active ? activeColor : 'text-slate-400 dark:text-slate-500'}`}>{label}</span>
        </div>
      );
    }

    function MenuItem({ icon, label, color, bg, onClick }) {
      return (
        <div onClick={onClick} className="flex items-center justify-between p-3 rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
          <div className="flex items-center gap-4">
            <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${bg} ${color}`}>
              <Icon n={icon} s={24} />
            </div>
            <span className="font-bold text-ink dark:text-white">{label}</span>
          </div>
          <Icon n="arrowLeft" s={20} className="text-slate-300 dark:text-slate-600" />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
