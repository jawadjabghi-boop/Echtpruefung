    // دالة فك التشفير
    const getDecryptedExams = () => {
      try {
        const bytes = CryptoJS.AES.decrypt(ENCRYPTED_DATA, SECRET_KEY);
        const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
        return JSON.parse(decryptedStr);
      } catch (e) {
        console.error("خطأ فـ فك التشفير", e);
        return [];
      }
    };

    const localExams = getDecryptedExams();

    function App() {
      const [currentExamIndex, setCurrentExamIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [corrected, setCorrected] = useState(false);
      const [showAr, setShowAr] = useState(false);
      const [toast, setToast] = useState(null);
      const [shuffledOptions, setShuffledOptions] = useState([]);

      if (!localExams || localExams.length === 0) {
        return <div className="min-h-screen flex items-center justify-center font-bold text-red-500">خطأ فـ التشفير: تأكد من النص المشفر والمفتاح.</div>;
      }

      const exam = localExams[currentExamIndex];

      const resetState = () => {
        setAnswers({});
        setCorrected(false);
        setShowAr(false);
        setToast(null);
        setShuffledOptions(exam.exam_data.options);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelect = (textId, key) => {
        if (corrected) return;
        const usedElsewhere = Object.entries(answers).some(([tid, k]) => Number(tid) !== textId && k === key);
        if (usedElsewhere) return;
        setAnswers(prev => ({ ...prev, [textId]: key }));
      };

      const toggleTranslation = () => {
        setShowAr(!showAr);
        setToast(!showAr ? "تم إظهار الترجمة" : "تم إخفاء الترجمة");
        setTimeout(() => setToast(null), 2000);
      };

      const shuffleOptions = () => {
        const shuffled = [...exam.exam_data.options].sort(() => Math.random() - 0.5);
        setShuffledOptions(shuffled);
        setToast("تم تفعيل الترتيب العشوائي");
        setTimeout(() => setToast(null), 2000);
      };

      const nextExam = () => {
        if (currentExamIndex < localExams.length - 1) {
          setCurrentExamIndex(currentExamIndex + 1);
          resetState();
        } else {
          alert("مبروك! لقد أكملت جميع الامتحانات المتاحة.");
        }
      };

      const currentOptions = shuffledOptions.length > 0 ? shuffledOptions : exam.exam_data.options;
      const texts = exam.exam_data.texts;
      const answeredCount = Object.keys(answers).length;
      const usedOptions = Object.values(answers);
      const allAnswered = answeredCount === texts.length;

      let score = 0;
      if (corrected) {
        texts.forEach(t => { if (answers[t.id] === t.correct) score += 5; });
      }

      const scrollToNext = () => {
        const unanswered = texts.find(t => !answers[t.id]);
        if (unanswered) {
          const el = document.getElementById(`text-${unanswered.id}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      useEffect(() => {
        setShuffledOptions(exam.exam_data.options);
      }, [currentExamIndex]);

      return (
        <div className="min-h-screen bg-[#F8FAFC] pb-32 relative">
          
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-toast">
              <div className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg ${
                toast.includes('العشوائي') ? 'bg-green-50 border border-green-200 text-green-700' : 'bg-blue-50 border border-blue-200 text-blue-700'
              }`}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                {toast}
              </div>
            </div>

          <div className="bg-white px-4 py-3 flex items-center gap-3 border-b border-slate-100 sticky top-0 z-40">
            <div className="flex-1">
              <h1 className="font-bold text-base text-slate-900 de">{exam.title.substring(0, 12)}...</h1>
              <div className="flex items-center gap-2 mt-0.5">
                <span className="bg-blue-50 text-blue-600 text-[10px] px-1.5 py-0.5 rounded font-bold">{exam.level}</span>
                <span className="text-[10px] text-slate-500 uppercase tracking-wide de">{exam.skill} {exam.sub_section}</span>
              </div>
            </div>
          </div>

          <div className="bg-white px-4 pb-3 border-b border-slate-100">
            <div className="flex items-center justify-between mt-2">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" strokeWidth="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
                </div>
                <span className="font-bold text-sm text-slate-900">ÜBERSCHRIFTEN {answeredCount} / {texts.length}</span>
              </div>
              <div className="flex gap-2">
                <button onClick={shuffleOptions} className="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button onClick={toggleTranslation} className={`w-9 h-9 rounded-lg border flex items-center justify-center transition-colors ${showAr ? 'bg-blue-50 border-blue-200 text-blue-600' : 'bg-white border-slate-200 text-slate-600'}`}>
                  <span className="text-xs font-bold">A/أ</span>
                </button>
              </div>
            </div>
            
            <div className="w-full h-2 bg-slate-100 rounded-full mt-2 overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300 german-flag-progress" style={{width: `${(answeredCount/texts.length)*100}%`}}></div>
            </div>
          </div>

          <div className="max-w-3xl mx-auto px-3 mt-3 space-y-3">
            <div className="bg-white rounded-2xl p-4 border border-slate-100">
              <h2 className="font-extrabold text-lg text-slate-900 mb-1 de">{exam.title}</h2>
              <p className="text-xs text-slate-500 uppercase tracking-wide de">LESEVERSTEHEN · TEIL 1</p>
            </div>

            {texts.map((text, index) => (
              <div key={text.id} id={`text-${text.id}`} className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm">
                <div className="p-4 pb-2">
                  <div className="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center font-bold text-slate-700 mb-3 text-base">{index + 1}</div>
                  <p className="text-[16px] leading-[2] text-slate-800 de" dir="ltr">{text.content}</p>
                </div>

                <div className="px-3 pb-3 space-y-1.5">
                  {currentOptions.map(opt => {
                    const isSelected = answers[text.id] === opt.key;
                    const usedElsewhere = !isSelected && usedOptions.includes(opt.key);
                    const isCorrectOpt = corrected && opt.key === text.correct;
                    const isWrongOpt = corrected && isSelected && !isCorrectOpt;
                    
                    let containerClass = "flex items-start gap-3 p-3 rounded-xl transition-all ";
                    let letterClass = "w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold shrink-0 mt-0.5 ";
                    let textClass = "text-[15px] leading-relaxed de ";
                    let arTextClass = "text-[13px] mt-1 ";
                    
                    if (corrected) {
                      if (isCorrectOpt) {
                        containerClass += "bg-green-50 border-2 border-green-500";
                        letterClass += "bg-green-500 text-white";
                        textClass += "text-green-900 font-semibold";
                        arTextClass += "text-green-700";
                      } else if (isWrongOpt) {
                        containerClass += "bg-red-50 border-2 border-red-500";
                        letterClass += "bg-red-500 text-white";
                        textClass += "text-red-900";
                        arTextClass += "text-red-700";
                      } else {
                        containerClass += "bg-slate-50 opacity-40";
                        letterClass += "bg-white text-slate-400";
                        textClass += "text-slate-500";
                        arTextClass += "text-slate-400";
                      }
                    } else {
                      if (isSelected) {
                        containerClass += "bg-blue-500 border-2 border-blue-500 cursor-pointer";
                        letterClass += "bg-white/20 text-white";
                        textClass += "text-white font-semibold";
                        arTextClass += "text-blue-100";
                      } else if (usedElsewhere) {
                        containerClass += "bg-slate-50 opacity-30 cursor-not-allowed";
                        letterClass += "bg-white text-slate-300";
                        textClass += "text-slate-300";
                        arTextClass += "text-slate-300";
                      } else {
                        containerClass += "bg-slate-50 border-2 border-transparent hover:bg-slate-100 cursor-pointer";
                        letterClass += "bg-white text-slate-600 shadow-sm";
                        textClass += "text-slate-800";
                        arTextClass += "text-slate-500";
                      }
                    }
                    
                    return (
                      <div key={opt.key} onClick={() => handleSelect(text.id, opt.key)} className={containerClass}>
                        <div className={letterClass}>{opt.key}</div>
                        <div className="flex-1">
                          <div className={textClass} dir="ltr">{opt.de}</div>
                          {showAr && <div className={arTextClass}>{opt.ar}</div>}
                        </div>
                        {isSelected && !corrected && (
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" className="shrink-0 mt-1"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                        )}
                        {corrected && isCorrectOpt && (
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="3" className="shrink-0 mt-1"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                        )}
                      </div>
                    );
                  })}
                </div>

                {corrected && (
                  <div className="p-4 bg-blue-50 border-t border-blue-100">
                    <div className="flex items-center gap-2 mb-2">
                      <div className="w-6 h-6 rounded-md bg-blue-100 flex items-center justify-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" strokeWidth="2.5"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div>
                      <h4 className="font-bold text-sm text-blue-900">ملخص الإعلان</h4>
                    </div>
                    <p className="text-[13px] text-slate-700 leading-[1.9]">{text.exp_ar}</p>
                  </div>
                )}
              </div>
            ))}

            {corrected && (
              <div className="bg-slate-900 text-white rounded-2xl p-6 text-center shadow-xl">
                <h3 className="text-xs text-slate-400 uppercase tracking-widest mb-1 de">ERGEBNIS</h3>
                <div className="text-5xl font-extrabold text-gold mb-4 de">{score} / {texts.length * 5}</div>
                <button onClick={() => { setAnswers({}); setCorrected(false); window.scrollTo({top: 0, behavior: 'smooth'}); }} className="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-xl font-bold text-sm transition">إعادة المحاولة</button>
              </div>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-3 py-3 flex gap-2 z-40 shadow-lg">
            <button onClick={() => { if (allAnswered && !corrected) setCorrected(true); }} disabled={!allAnswered || corrected} className={`flex-1 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition ${allAnswered && !corrected ? 'bg-blue-500 text-white shadow-lg shadow-blue-200' : 'bg-slate-100 text-slate-400'}`}>تصحيح</button>
            <button onClick={nextExam} className="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-500 text-white flex items-center justify-center gap-2 shadow-lg shadow-blue-200">التالي</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
