  .lang-btn{ display:flex; align-items:center; gap:10px; padding:12px; border-radius:14px; background:var(--paper); border:2px solid var(--line); color:var(--text); font-weight:800; transition:all 0.2s; }
  .lang-btn.on{ background:rgba(245,184,46,0.15); border-color:var(--gold); }
  
  .inline-gap{ display:inline-flex; align-items:center; justify-content:center; min-width:90px; border-bottom:2px dashed var(--gold); padding:2px 8px; margin:0 6px; cursor:pointer; font-weight:900; vertical-align:middle; background:rgba(245,184,46,0.05); border-radius:6px 6px 0 0; }

  .rf-circle.bad { border-color: var(--badc); background: var(--badbg); }
  .rf-circle.sel::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
  .rf-circle.good::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--okc); }
  .rf-circle.bad::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--badc); }
</style>

  items:[
    {n:1,c:"b",hl:"schneller und bequemer ans Ziel",de:"Sie haben Mitarbeiter, die gern mit dem Fahrrad zur Arbeit kommen? Warum dann nicht mehr E-Bikes leasen statt nur teure Firmenwagen? Gerade in Städten kommt man mit einem E-Bike schneller und bequemer ans Ziel als mit dem Auto. Und Parkplatzprobleme gibt es auch nicht. Sie fördern zudem die Gesundheit Ihrer Mitarbeiter und schonen die Umwelt, und dabei können Sie noch Steuern sparen. Bei der BikeLeasing GmbH bekommen Sie Angebote, die zu Ihnen passen. Melden Sie sich bei uns an, und wir kümmern uns um den Rest.",ar:"الإعلان يروّج لتأجير الدراجات الكهربائية بدل سيارات الشركة، لأنها صحية وبيئية وتوفر الضرائب."},
    {n:2,c:"h",hl:"Engagement für die Natur",de:"NaturVerband ist der größte Umweltverband in Deutschland. Er engagiert sich für Umwelt- und Tierschutz. Sie wollen sich auch aktiv gegen Umweltverschmutzung einsetzen? Sie wollen sich für mehr Naturschutz engagieren? Dann sind Sie bei uns richtig. Wir haben regelmäßige Treffen und führen Informationsveranstaltungen zu verschiedenen aktuellen Themen durch. Außerdem gibt es eine monatliche Mitgliederzeitschrift. Melden Sie sich einfach bei uns.",ar:"جمعية تعمل في حماية البيئة والحيوانات، وتقدم لقاءات ومجلة شهرية."},
    {n:3,c:"f",hl:"Ticketpreise",de:"Die Bahn erhöht dieses Jahr die Ticketpreise nicht. Dies soll die Bahn attraktiver machen, sodass mehr Menschen die Züge nutzen. Ob dies wirklich erfolgreich ist, bestreiten manche Experten. Sie argumentieren, dass das Auto in Deutschland zu beliebt ist. Günstiger werden außerdem die Tickets im öffentlichen Nahverkehr, weil dann nicht mehr so viele Berufstätige mit dem Auto zur Arbeit fahren. Ob diese Maßnahmen wirklich erfolgreich sind, wird sich zeigen. Experten sind sich einig: Ein Schritt in die richtige Richtung!",ar:"النص يتكلم عن عدم رفع أسعار تذاكر القطار هذا العام."},
    {n:4,c:"a",hl:"Eltern trotz Kritik mit der Schule zufrieden",de:"Vergangenen Monat wurden etwa tausend Eltern von der Stiftung Schulqualität befragt, ob sie mit der Schule ihrer Kinder zufrieden sind. Dabei sagten 80%, dass die Schule gut oder sogar sehr gut sei. Und das, obwohl nur 40% der Eltern denken, dass die Kinder in der Schule auf den Beruf vorbereitet werden. Die Schülerinnen und Schüler sollten mehr über Ökonomie lernen. Außerdem sagten über 60%, dass das Thema Umweltschutz im Unterricht eine größere Rolle spielen sollte.",ar:"80% من الآباء راضون عن المدرسة، لكن 40% فقط يرون أن أبناءهم مجهزون للمهنة."},

    {n:1,c:"d",hl:"Zeitung in den Urlaubtort nachsenden",de:"Wenn Sie verreisen, wünschen wir ihnen erholsame und angenehme Ferienlage Bitte denken Sie daran, sich ihre Zeitung in den Urlaubtort nachsenden zu lassen. Denn mit den Neuigkeiten von zu Hause und aus aller Weil lässt sich die schönste Zeit des Jahres erst richtig genießen ganz Europa kostenlos, Die Höhe des Bezeugendes bleibt unverändert. Ausführliche Informationen und entsprechende Coupons ihrem Europabericht. Griechisch wird meistens von Zwölftklässlern als dritte Fremdsprache neben Französisch und Englisch gewählt. finden Sie in unserem großen Reise Service – Anzeigen oder rufen Sie uns einfach an: Telefon 01 30-18 58 50 zum Nulltarif. Hannoversche Allgemeine Neue Presse",ar:"تقدم صحيفة هانوفرشه ألغماينه لقرائها المسافرين خدمة مميزة تتيح لهم متابعة أخبار وطنهم والعالم من خلال شحن النسخ الورقية إلى أماكن قضاء عطلاتهم في مختلف أنحاء أوروبا دون أي تكاليف إضافية حيث تظل قيمة الاشتراك ثابتة دون تغيير."},

    {n:3,c:"e",hl:"Laute Musik stört den Nachbarn",de:"Für den einen ist es musikalischer Hochgenuss für den anderen schlicht Lärm. Gemeint ist Musik, die aus Lautsprechen, Radios oder durch Musikinstrumente durch geöffnet Türen und Fenster bei sommerlichen Temperaturen ins Freie dringt. Die Gemeinde weist darauf hin, dass der Mittagsruhe von 13 bis 15 Uhr und nachts von 22 bis 7 Uhr keine musikalische Ruhestörung erfolgen darf. Gartengeräte mit Motoren dürfen montags bis freitags nur von 8 bis 13 und von 15 bis 19 Uhr benutzt werden, an Sonnabenden von 9 bis 13 Uhr. An Sonn - und Feiertagen dürfen die Geräte nicht zum Einsatz kommen.",ar:"أصدرت البلدية توجيهات صارمة بخصوص الضوضاء الناتجة عن الموسيقى والأدوات ذات المحركات لضمان راحة السكان."},
    {n:4,c:"b",hl:"Bücherdorf",de:"Das erste deutsche Bücherdorf hat in Mühlbeck/ Fredersdorf (Sachsen – Anhalt ) seit Ende September seine Tore geöffnet. In acht Antiquarten warten über 70 000 Bücher aus allen Bereichen der Literatur auf Interessenten. Das in reizvoller landschaftlicher Umgebung liegende Bücherdorf nahe Bitterfeld - unweit der A19 und des Flughafens Leipzig - ist aus allen Teilen Deutschlands leicht zu erreich. Geöffnet sind die Antiquariate auch am Samstag und Sonntag. In Europa gibt es bereits acht solcher Bücherdörfer in Belgien, Frankreich, Großbritannien, den Niederlanden, Norwegen und der Schweiz. Initiatorin des deutschen Bücherdorfes ist Heidi Dehne (Tel. 03493/4 30 43).",ar:"أصبحت منطقة مولبيك فريدرسدورف مقراً لأول قرية كتب ألمانية حيث تضم ثمانية متاجر متخصصة في الكتب القديمة تعرض ما يزيد عن سبعين ألف مؤلف."},
    {n:5,c:"c",hl:"Hinweis für Besucher",de:"Die Bregenzer Festspiele sind bemüht, die Vorstellungen auch bei zweifelhafter Witterung bzw. leichtem Regen auf der Seebühne abzuhalten, weshalb es zu Verzögerungen des Beginns oder zu Unterbrechungen kommen kann. Sollte die Seeaufführung nicht stattfinden können, wird eine halbszenische Version von Porgy and Bess im Festspielhaus gegeben. Wir empfehlen unseren Gästen , bei unsicherer Wetterlage regenfester Kleidung den Vorzug zu geben und auf Schirme zu verzichten, da diese die Sicht beeinträchtigen. Das Spiel auf dem See wird ohne Pause gespielt. Die Spieldauer beträgt ca.2 Std. 45 Min.",ar:"تبذل إدارة مهرجان بريغنتس قصارى جهدها لتقديم العروض على المسرح العائم حتى في حال تقلب الطقس."}
  ]
},
{ id:"alex-t2", title:"Alex Und Cora", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de: "Egal ob Hund, Katze oder Maus: Haustiere sind in Deutschland sehr beliebt. Markus Kleinoth aus der Freizeitredaktion hat sich mit diesem Thema beschäftigt.", ar: "سواء كان كلباً أو قطة أو فأراً: الحيوانات الأليفة تحظى بشعبية كبيرة في ألمانيا. ماركوس كلاينوت من قسم الترفيه تناول هذا الموضوع." },
    { de: "In deutschen Haushalten gibt es rund 34 Millionen Haustiere. Besonders Katzen sind sehr beliebt, denn davon leben 14 Millionen in Deutschland. Und das, obwohl Deutschland als Land der Hundefans gilt. Insgesamt gibt es aber etwa 10 Millionen Hunde.", ar: "يوجد في الأسر الألمانية حوالي 34 مليون حيوان أليف. القطط تحظى بشعبية خاصة، حيث يعيش منها 14 مليوناً في ألمانيا. وهذا على الرغم من أن ألمانيا تعتبر بلد محبي الكلاب. ومع ذلك، هناك حوالي 10 ملايين كلب في المجموع." },
    { de: "Für den Hund ist manchen Menschen nichts zu teuer. Eine Hundebesitzerin, die überdurchschnittlich viel Geld für ihren Liebling ausgibt, ist Bettina Schröther: Morgens vor der Arbeit bringe ich meinen Hund in eine sehr gute Tagesbetreuung, in der es auch eine Hundeschule gibt. Aber wenn ich frei habe, sind wir immer zusammen, auch im Urlaub. Ich war mit ihm sogar schon in einem Wellnesshotel für Hunde.", ar: "بالنسبة للبعض، لا شيء غالٍ جداً من أجل الكلب. إحدى مربيات الكلاب التي تنفق أموالاً أكثر من المتوسط على حيوانها المفضل هي بيتينا شرودر: في الصباح قبل العمل آخذ كلبي إلى رعاية نهارية جيدة جداً، حيث يوجد أيضاً مدرسة للكلاب. ولكن عندما أكون في عطلة، نكون دائماً معاً، حتى في الإجازة. لقد ذهبت معه حتى إلى فندق صحي للكلاب." },
    { de: "Der Hundeexperte Marius Klotz kennt solche Fälle, sieht das aber kritisch: Viele Besitzer meinen es gut und tun zu viel für ihre Hunde. Hier sollte man aufpassen. Für einen Hund ist es sehr wichtig, eine gute Erziehung zu bekommen. Wichtig sind klare Regeln, die er verstehen kann. Außerdem braucht er viel Bewegung und unbedingt passendes Futter. Frisches Futter ist nicht unbedingt das beste, da sollte man sich gut informieren, am besten Fachleute fragen.", ar: "خبير الكلاب ماريوس كلوتز يعرف مثل هذه الحالات، لكنه يراها بشكل نقدي: العديد من المالكين يقصدون الخير ويفعلون الكثير جداً لكلابهم. هنا يجب الحذر. من المهم جداً للكلب أن يحصل على تربية جيدة. القواعد الواضحة التي يمكنه فهمها مهمة. بالإضافة إلى ذلك، يحتاج إلى الكثير من الحركة والطعام المناسب حتماً. الطعام الطازج ليس بالضرورة الأفضل، هنا يجب الاستفسار جيداً، والأفضل سؤال الخبراء." },
    { de: "Viele Menschen sehen ihre Katzen und Hunde als Teil der Familie. So auch Ellie Herfried, Hundebesitzerin aus Erfurt: Unsere Familie feiert jedes Jahr mit unserem kleinen Schatz Geburtstag. Er bekommt einen Geburtstagshundekuchen, natürlich mit Kerzen, und auch ein Geschenk. Dieses Jahr haben wir außerdem seine Hundefreunde eingeladen.", ar: "كثير من الناس يرون قططهم وكلابهم كجزء من العائلة. وكذلك إلي هيرفريد، مالكة كلب من إرفورت: عائلتنا تحتفل كل عام بعيد ميلاد كنزنا الصغير. يحصل على كعكة عيد ميلاد للكلاب، بالطبع مع شموع، وأيضاً على هدية. هذا العام دعونا أيضاً أصدقاءه من الكلاب." },
    { de: "Auch in einigen Seniorenheimen sind mittlerweile Tiere erlaubt. Sandra Bärenweger ist Altenpflegerin in Hamburg: Bei uns im Haus haben einige Senioren einen Hund oder eine Katze. Dadurch haben sie eine Aufgabe, denn sie müssen sich ja um ihr Tier kümmern, es füttern, oder mit ihm rausgehen, wenn er ein Hund ist. So haben sie jeden Tag eine sinnvolle Beschäftigung. Das tut den älteren Menschen gut; viele bleiben dadurch fit.", ar: "حتى في بعض دور رعاية المسنين، أصبحت الحيوانات مسموح بها الآن. ساندرا بيرينفيغر ممرضة مسنين في هامبورغ: في منزلنا، لدى بعض كبار السن كلب أو قطة. بهذه الطريقة لديهم مهمة، لأنه يتعين عليهم الاعتناء بحيواناتهم، وإطعامها، أو الخروج معها إذا كان كلباً. بهذه الطريقة لديهم نشاط مفيد كل يوم. هذا يفيد كبار السن؛ الكثير منهم يبقون لائقين بسببه." },
    { de: "Der tägliche Spaziergang mit dem Hund oder das Spielen mit der Katze bietet vielen Haustierbesitzern Ruhe und Entspannung, eine kleine Erholung vom Alltag. Das bestätigen auch Fachleute: Haustiere können gerade bei Stress für viele Menschen ein guter Ausgleich sein. Das Haustier ist dabei auch viel mehr als ein Hobby, da es ein Lebewesen ist, das schnell zum Familienmitglied wird und das Leben bereichert.", ar: "التنزه اليومي مع الكلب أو اللعب مع القطة يوفر للعديد من أصحاب الحيوانات الأليفة الهدوء والاسترخاء، وهو استراحة صغيرة من الحياة اليومية. يؤكد الخبراء ذلك أيضاً: الحيوانات الأليفة يمكن أن تكون تعويضاً جيداً للكثير من الناس، خاصة في أوقات التوتر. الحيوان الأليف هو أكثر بكثير من مجرد هواية، لأنه كائن حي يصبح بسرعة عضواً في الأسرة ويثري الحياة." }
  ],
  items:[
    {n:1,c:"C",q:"Die Hundebesitzerin Elli Herfeld",opts:[{k:"A",de:"feiert ihren Geburtstag immer mit ihrem Hund.",ar:"تحتفل بعيد ميلادها مع كلبها"},{k:"B",de:"sieht ihren Hund als festes Familienmitglied.",ar:"تعتبر كلبها فرداً ثابتاً في العائلة"},{k:"C",de:"backt ihrem Hund zum Geburtstag einen Kuchen.",ar:"تخبز لكلبها كعكة عيد ميلاد"}],ar:"النص يقول إنها تحضر كعكة عيد ميلاد لكلبها."},
    {n:2,c:"A",q:"In Seniorenheimen gibt es oft Tiere, damit",opts:[{k:"A",de:"die Senioren etwas tun, was gut für sie ist.",ar:"يقوم المسنون بشيء مفيد لهم"},{k:"B",de:"sie auf die älteren Menschen aufpassen.",ar:"يعتنون بكبار السن"},{k:"C",de:"die Senioren mehr spazieren gehen.",ar:"يمشون أكثر"}],ar:"الحيوانات تعطي المسنين مهمة مفيدة."},
    {n:3,c:"A",q:"Bettina Schröther …",opts:[{k:"A",de:"verbringt die ganze Freizeit mit ihrem Hund.",ar:"تقضي كل وقت فراغها مع كلبها"},{k:"B",de:"macht regelmäßig Wellnessurlaube.",ar:"تأخذ عطلات صحية"},{k:"C",de:"lässt ihren Hund erziehen.",ar:"تترك كلبها يتدرب"}],ar:"النص يقول إنها تكون مع كلبها كل وقت فراغها."},
    {n:4,c:"C",q:"Nach Meinung von Hundeexperte Marius Klotz sollte man",opts:[{k:"A",de:"sich zur Ernährung beraten lassen.",ar:"استشارة حول التغذية"},{k:"B",de:"seinen Hund immer gut behandeln.",ar:"معاملة جيدة"},{k:"C",de:"die Regeln bei der Hundeerziehung beachten.",ar:"مراعاة القواعد في التربية"}],ar:"الخبير يشدد على قواعد واضحة."},
    {n:5,c:"A",q:"Fachleute meinen, dass",opts:[{k:"A",de:"man sich durch sein Haustier erholen kann.",ar:"يمكن للمرء أن يسترخي"},{k:"B",de:"man täglich spazieren gehen sollte.",ar:"المشي يومياً"},{k:"C",de:"ein Haustier ein sinnvolles Hobby ist.",ar:"هواية مفيدة"}],ar:"الحيوان الأليف يساعد على الراحة."}
  ]
},

{ id:"alex-sp1", title:"Alex Und Cora", level:"B1", sub:"Sprach 1", type:"sprach1",
  text: `Schaffhausen, den...\nHallo Isabelle,\nwie geht es dir? Hast du deine Prüfungen geschafft?\nWie du ja weißt, .....(1)..... ich seit zwei Monaten in einem Altersheim .....(2)..... der Nähe von Schaffhausen. Die Arbeit in .....(3)..... Haus gefällt mir gut, obwohl es manchmal auch sehr stressig ist. Besonders schön ist der enge .....(4)..... zu einigen der alten Menschen. Eine Frau, Anna Ringier, mag ich .....(5)..... gern. Sie ist schon 96 Jahre alt und sitzt im Rollstuhl, aber sie ist immer fröhlich. Gestern hat sie mir .....(6)..... ganzes Leben erzählt. Sie hat bis zum 84. Lebensjahr .....(7)..... gearbeitet. Schon als achtjähriges Mädchen musste sie bei einem Bauern arbeiten, .....(8)..... ihre Eltern die neunköpfige Familie nicht ernähren konnten. Später arbeitete Anna als Schneiderin.\nNeben ihrer Arbeit hat Anna .....(9)..... auf eine Sache nie verzichtet: das Bergsteigen! Das war immer ihre große Leidenschaft. Diese Frau ist wirklich sehr beeindruckend!\nAber du .....(10)..... bestimmt auch viel erlebt. Ich würde mich sehr freuen, wenn du mir bald wieder einmal schreibst!\nHerzliche Grüße\ndeine Julie`,

const pointsOf = (ex) => {
  if (ex.type === "matching") return 2.5;
  if (ex.type === "sprach1" || ex.type === "sprach2") return 1.5;
  return 5;
};
const maxOf = (ex) => ex.items.length * pointsOf(ex);

const HighlightText = ({ text, phrase, active }) => {
  if (!active || !phrase || !text.includes(phrase)) return <span className="de" dir="ltr">{text}</span>;
  const parts = text.split(phrase);
  return (
    <span className="de" dir="ltr">
      {parts.map((p, i) => (
        <React.Fragment key={i}>
          {p}
          {i < parts.length - 1 && <span className="highlight-yellow">{phrase}</span>}
        </React.Fragment>
      ))}
    </span>
  );
};

const playHorenAudio = (segments, onEnd) => {
  if (!window.speechSynthesis) {
    alert("المتصفح ديالك ماكيدعمش النطق الصوتي.");
    return;
  }
  window.speechSynthesis.cancel();
  let currentIndex = 0;

  const playNext = () => {
    if (currentIndex >= segments.length) {
      if (onEnd) onEnd();
      return;
    }
    const segment = segments[currentIndex];
    const utterance = new SpeechSynthesisUtterance(segment.text);
    utterance.lang = 'de-DE';
    utterance.pitch = segment.pitch || 1;
    utterance.rate = segment.rate || 1;
    utterance.onend = () => {
      currentIndex++;
      setTimeout(playNext, 500);
    };
    utterance.onerror = () => {
      if (onEnd) onEnd();
    };
    window.speechSynthesis.speak(utterance);
  };
  playNext();
};

function ExamView({ exam, onBack, onNext, dark, setDark, onSave }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(null);
  const [toast, setToast] = useState(null);
  const [modalGap, setModalGap] = useState(null);
  const [activeGap, setActiveGap] = useState(null);
  const [showTranslation, setShowTranslation] = useState(false);
  const [showHeader, setShowHeader] = useState(true);
  const [excluded, setExcluded] = useState({});
  const [scrollProgress, setScrollProgress] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [showStory, setShowStory] = useState(false);

  const lastScrollY = React.useRef(0);
  const toastTimer = React.useRef(null);

  useEffect(() => {
    const handleScroll = () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY < 50) setShowHeader(true);
      else if (currentScrollY > lastScrollY.current && currentScrollY > 100) setShowHeader(false);
      lastScrollY.current = currentScrollY;
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (totalScroll > 0) setScrollProgress((currentScrollY / totalScroll) * 100);
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const pts = pointsOf(exam);
  const total = maxOf(exam);
  const answered = Object.keys(ans).length;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  useEffect(() => () => clearTimeout(toastTimer.current), []);

  const flash = (m) => {
    setToast(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };

  const optsFor = (it) => {
    if (exam.type === "headings") return exam.options;
    if (exam.type === "mcq") return it.opts;
    if (exam.type === "matching") return [...exam.ads.map(a => ({ k: a.k, de: a.t })), { k: "X", de: "لا يوجد إعلان مناسب" }];
    return [];
  };

  const usedElsewhere = (n, k) => {
    if (exam.type !== "matching" || k === "X") return false;
    return Object.entries(ans).some(([id, v]) => Number(id) !== n && v === k);
  };

  const selectSituation = (n, k) => {
    if (done !== null) return;
    if (ans[n] === k) {
      const newAns = { ...ans };
      delete newAns[n];
      setAns(newAns);
      return;
    }
    if (ans[n] !== undefined && ans[n] !== k) return;
    setAns(prev => ({ ...prev, [n]: k }));
    setExcluded(prev => {
      const newExc = { ...prev };
      if (newExc[n]) delete newExc[n][k];
      return newExc;
    });
  };

  const toggleExclude = (n, k) => {
    if (done !== null) return;
    if (ans[n] !== undefined) return;
    setExcluded(prev => {
      const newExc = { ...prev };
      if (!newExc[n]) newExc[n] = {};
      if (newExc[n][k]) delete newExc[n][k];
      else newExc[n][k] = true;
      return newExc;
    });
  };

  const pick = (it, k) => {
    if (done !== null) return;
    if (usedElsewhere(it.n, k)) return;
    const newAns = { ...ans, [it.n]: k };
    if (exam.type === "sprach2") {
      Object.keys(newAns).forEach(key => { if (Number(key) !== it.n && newAns[key] === k) delete newAns[key]; });
    }
    setAns(newAns);
    if (modalGap) setModalGap(null);
  };

  const pickHoren = (n, c) => {
    if (done !== null) return;
    setAns(prev => ({ ...prev, [n]: c }));
  };

  const cls = (it, k) => {
    const sel = ans[it.n];
    const isDone = done !== null;
    if (isDone) {
      if (k === it.c) return "opt good";
      if (sel === k) return "opt bad";
      return "opt faded";
    }
    if (sel === k) return "opt sel";
    return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
  };

  const reset = () => { setAns({}); setDone(null); setActiveGap(null); setShowTranslation(false); setExcluded({}); setShowStory(false); window.scrollTo(0, 0); };
  const finish = () => { setDone(score); onSave(exam.id, score, total); window.scrollTo({ top: 0, behavior: "smooth" }); };

  const onWordClick = (w) => {
    if (done !== null) return;
    const target = activeGap !== null ? activeGap : (exam.items.find(x => ans[x.n] === undefined) || {}).n;
    if (!target) return;
    if (usedElsewhere(target, w)) return;
    const newAns = { ...ans, [target]: w };
    if (exam.type === "sprach2") {
      Object.keys(newAns).forEach(key => { if (Number(key) !== target && newAns[key] === w) delete newAns[key]; });
    }
    setAns(newAns);
    const next = exam.items.find(x => x.n !== target && newAns[x.n] === undefined);
    setActiveGap(next ? next.n : null);
  };

  const toggleAudio = () => {
    if (isPlaying) {
      window.speechSynthesis.cancel();
      setIsPlaying(false);
      return;
    }
    setIsPlaying(true);
    playHorenAudio(exam.audio, () => setIsPlaying(false));
  };

  const renderSprachText = () => {
    if (showTranslation) {
      return <div style={{ textAlign: "center", color: "var(--muted)", padding: 20, fontSize: "1.1em" }}>الترجمة العربية لهذا النص غير متوفرة حالياً.</div>;
    }
    const parts = exam.text.split(/\.{3,}\s*\((\d+)\)\s*\.{3,}/g);
    return parts.map((part, i) => {
      if (i % 2 === 1) {
        const gapNum = parseInt(part);
        const it = exam.items.find(x => x.n === gapNum);
        const selected = ans[gapNum];
        const isDone = done !== null;
        let gapContent = <span className="inline-gap" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{selected ? selected : `(${gapNum})`}</span>;
        if (isDone && selected) {
          if (selected === it.c) gapContent = <span className="sp1-correct">{selected}</span>;
          else gapContent = <span style={{display: 'inline-flex', alignItems: 'center', gap: '4px'}}><span className="sp1-wrong">{selected}</span><span className="sp1-correct">{it.c}</span></span>;
        } else if (isDone && !selected) {
           gapContent = <span className="sp1-correct">{it.c}</span>;
        } else if (selected) {
           gapContent = <span className="inline-gap filled" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{selected}</span>;
        }
        return <span key={i}>{gapContent}</span>;
      }
      return <span key={i} className="de" style={{ whiteSpace: "pre-wrap" }}>{part}</span>;
    });
  };

  const renderTeil3 = () => {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {exam.ads.map(ad => (
          <div key={ad.k} className="card" style={{ padding: 16, border: "1px solid var(--line)" }}>
            <div style={{ marginBottom: 16, borderBottom: "1px solid var(--line)", paddingBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                 <span className="de" style={{ fontWeight: 900, fontSize: "1.1em", color: "var(--gold)" }}>ANZEIGE {ad.k}</span>
              </div>
              <div className="de" style={{ fontWeight: 900, marginTop: 8, fontSize: "1.05em" }}>{ad.t}</div>
              <div className="de" style={{ fontSize: "0.95em", color: "var(--muted)", marginTop: 4, lineHeight: 1.5 }}>{ad.de}</div>
              {showTranslation && <div style={{ fontSize: "0.9em", color: "var(--muted)", marginTop: 4, direction: "rtl", textAlign: "right" }}>{ad.ar}</div>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {exam.items.map(it => {
                const isSelected = ans[it.n] === ad.k;
                const isSelectedElsewhere = ans[it.n] !== undefined && ans[it.n] !== ad.k;
                const isExcluded = excluded[it.n]?.[ad.k];
                const isDone = done !== null;
                let textStyle = {
                  flex: 1, padding: "12px 14px", borderRadius: 10,
                  border: "1.5px solid transparent", background: "var(--paper)", color: "var(--text)",
                  textAlign: "left", direction: "ltr", cursor: "pointer", transition: "all 0.2s", opacity: 1,
                  fontSize: "0.95em", lineHeight: 1.6
                };
                if (isSelected) {
                  textStyle.background = "rgba(37, 99, 235, 0.1)"; textStyle.borderColor = "#2563EB"; textStyle.color = "#2563EB";
                } else if (isSelectedElsewhere) {
                  textStyle.opacity = 0.3; textStyle.cursor = "not-allowed";
                } else if (isExcluded) {
                  textStyle.opacity = 0.3; textStyle.textDecoration = "line-through"; textStyle.cursor = "not-allowed";
                }
                if (isDone) {
                  if (ad.k === it.c) { textStyle.background = "var(--okbg)"; textStyle.borderColor = "var(--okc)"; textStyle.color = "var(--okc)"; }
                  else if (isSelected) { textStyle.background = "var(--badbg)"; textStyle.borderColor = "var(--badc)"; textStyle.color = "var(--badc)"; }
                }
                return (
                  <div key={it.n} style={{ display: "flex", gap: 12, alignItems: "flex-start", direction: "ltr" }}>
                     <button
                        onClick={() => toggleExclude(it.n, ad.k)}
                        disabled={isSelected || isSelectedElsewhere || isDone}
                        style={{
                          width: 28, height: 28, borderRadius: 6, marginTop: 4,
                          border: `1.5px solid ${isExcluded ? "var(--badc)" : "var(--line)"}`,
                          background: isExcluded ? "var(--badbg)" : "transparent",
                          color: isExcluded ? "var(--badc)" : "var(--muted)",
                          fontWeight: 900, fontSize: "1em", display: "flex", alignItems: "center", justifyContent: "center",
                          flexShrink: 0, cursor: (isSelected || isSelectedElsewhere || isDone) ? "not-allowed" : "pointer"
                        }}
                     >
                       {isExcluded ? "✕" : ""}
                     </button>
                     <span style={{ fontWeight: 900, width: 20, textAlign: "center", marginTop: 8, color: isSelected ? "#2563EB" : "var(--muted)" }}>{it.n}</span>
                     <div onClick={() => selectSituation(it.n, ad.k)} style={textStyle}>
                       <div className="de">{it.de}</div>
                       <div style={{ marginTop: 6, color: isSelected ? "#2563EB" : "var(--muted)", fontSize: "0.9em", direction: "rtl", textAlign: "right" }}>
                         {showTranslation && it.ar}
                       </div>
                     </div>
                  </div>
                )
              })}
            </div>
          </div>
        ))}
      </div>
    );
  };

  const renderHoren = () => {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div className="card" style={{ padding: 16 }}>
          <button onClick={toggleAudio} style={{
            width: "100%", padding: "16px", borderRadius: "16px",
            background: isPlaying ? "var(--badbg)" : "var(--okbg)",
            color: isPlaying ? "var(--badc)" : "var(--okc)",
            border: `2px solid ${isPlaying ? "var(--badc)" : "var(--okc)"}`,
            fontWeight: 900, fontSize: "1.1em", display: "flex", alignItems: "center", justifyContent: "center", gap: 10
          }}>
            {isPlaying ? "⏹ إيقاف الصوت" : "▶️ استمع للنص الألماني"}
          </button>
        </div>

        <div className="card" style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ display: "flex", background: "var(--paper)", borderBottom: "1px solid var(--line)", fontWeight: 900, fontSize: "0.9em", color: "var(--muted)" }}>
            <div style={{ padding: "12px 8px", width: 60, textAlign: "center" }}>R</div>
            <div style={{ padding: "12px 8px", width: 60, textAlign: "center" }}>F</div>
            <div style={{ padding: "12px 8px", flex: 1 }}>AUSSAGE</div>
            <div style={{ padding: "12px 8px", width: 40 }}></div>
          </div>

          {exam.items.map((it, idx) => {
            const isDone = done !== null;
            const isRight = ans[it.n] === "R";
            const isFalsch = ans[it.n] === "F";
            
            let rClass = "rf-circle", fClass = "rf-circle";
            if (isRight) rClass += " sel";
            if (isFalsch) fClass += " sel";
            
            if (isDone) {
              if (it.c === "R") rClass += " good";
              else if (isRight) rClass += " bad";
              
              if (it.c === "F") fClass += " good";
              else if (isFalsch) fClass += " bad";
            }

            return (
              <div key={it.n} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--line)", background: isDone ? (ans[it.n] === it.c ? "var(--okbg)" : "var(--badbg)") : "var(--card)" }}>
                <div style={{ padding: "12px 8px", width: 60, display: "flex", justifyContent: "center" }}>
                  <div className={rClass} onClick={() => !isDone && pickHoren(it.n, "R")}></div>
                </div>
                <div style={{ padding: "12px 8px", width: 60, display: "flex", justifyContent: "center" }}>
                  <div className={fClass} onClick={() => !isDone && pickHoren(it.n, "F")}></div>
                </div>
                <div style={{ padding: "12px 8px", flex: 1, fontSize: "0.95em", lineHeight: 1.5 }}>
                  <span style={{ opacity: 0.5, marginRight: 8, fontWeight: 900 }}>{it.n}</span>
                  <span className="de">{it.de}</span>
                  {showTranslation && <div style={{ marginTop: 6, fontSize: "0.85em", color: "var(--muted)", direction: "rtl", textAlign: "right" }}>{it.ar}</div>}
                </div>
                <div style={{ padding: "12px 8px", width: 40, display: "flex", justifyContent: "center" }}>
                   {isDone && (ans[it.n] === it.c ? <span style={{ color: "var(--okc)", fontWeight: 900 }}>✓</span> : <span style={{ color: "var(--badc)", fontWeight: 900 }}>✗</span>)}
                </div>
              </div>
            );
          })}
        </div>

        <div className="card" style={{ padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={() => setShowStory(!showStory)} style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--muted)", fontWeight: 800 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            قصة سهلة للحفظ
          </button>
          {done !== null && <span style={{ fontWeight: 900, color: ans[exam.items[0].n] === exam.items[0].c ? "var(--okc)" : "var(--badc)" }}>النتيجة: {score} / {total}</span>}
        </div>

        {showStory && (
          <div className="t2-ar" style={{ marginTop: 0 }}>
            {exam.items[0].story}
          </div>
        )}
      </div>
    );
  };

  const iconStyle = {
    width: 36, height: 36, borderRadius: "50%", background: "var(--card)",
    border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center",
    color: "var(--text)", padding: 2
  };

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{
        position: "fixed", top: 0, left: 0, right: 0, height: 4, zIndex: 100,
        backgroundImage: "linear-gradient(to right, #111 33.33%, #DD0000 33.33%, #DD0000 66.66%, #FFCE00 66.66%)",
        backgroundSize: `${scrollProgress}% 100%`,
        backgroundRepeat: "no-repeat",
        backgroundColor: "transparent"
      }} />

      {toast && <div className="toast">{toast}</div>}

      <div style={{
        position: "sticky", top: 0, zIndex: 30, background: "var(--paper)",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        padding: "12px 16px", transition: 'transform 0.3s ease-in-out',
        transform: showHeader ? 'translateY(0)' : 'translateY(-100%)'
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={onBack} style={{ ...iconStyle, width: 32, height: 32 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div>
            <div className="de" style={{ fontWeight: 900, fontSize: "1em", lineHeight: 1.2 }}>{exam.title}</div>
            <div className="de" style={{ fontSize: ".75em", color: "var(--muted)", fontWeight: "bold" }}>{exam.type === "horen" ? "HÖREN" : "LESEN"} · {exam.sub.toUpperCase()}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
           <div style={{ fontWeight: 900, fontSize: "0.9em", color: "var(--muted)", marginRight: 4 }}>
             <span className="de">{answered} / {exam.items.length}</span>
           </div>
           <button onClick={() => setShowTranslation(!showTranslation)} style={{ ...iconStyle, color: showTranslation ? "#2563EB" : "var(--text)" }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 5h12M9 3v2c0 4.418-2.686 8-6 8m0-8h12m-6 0v2c0 4.418 2.686 8 6 8m-4-2l-4 8m2-4h4m-2 0l2 4"/></svg>
           </button>
           <button onClick={() => setDark(!dark)} style={{ ...iconStyle }}>
            {dark ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}
           </button>
        </div>
      </div>

      <div style={{ margin: "0 10px" }}>
        {exam.type === "horen" && renderHoren()}
        
        {exam.type === "mcq" && (
          <div className="card" style={{ padding: "20px 16px" }}>
            {exam.paragraphs && exam.paragraphs.map((p, i) => (
              <div key={i} style={{ marginBottom: 20 }}>
                <p className="de" style={{ lineHeight: 1.8, margin: "0 0 10px", fontSize: "1.05em" }}>{p.de}</p>
                {showTranslation && <div className="t2-ar" style={{ marginTop: 0 }}>{p.ar}</div>}
              </div>
            ))}
          </div>
        )}

        {(exam.type === "sprach1" || exam.type === "sprach2") && (
          <div className="card" style={{ fontSize: "1.1em", lineHeight: 2.2, padding: "24px 16px" }}>
            {renderSprachText()}
          </div>
        )}

        {exam.type === "matching" && renderTeil3()}

        {exam.type !== "sprach1" && exam.type !== "sprach2" && exam.type !== "matching" && exam.type !== "horen" && exam.items.map((it, idx) => {
          const sel = ans[it.n];
          const isDone = done !== null;
          return (
            <div key={it.n} className="card" style={{ padding: 14 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 12 }}>
                <span className="letter" style={{ width: 32, height: 32, fontSize: "1em" }}>{idx + 1}</span>
                <div style={{flex: 1, paddingTop: 4}}>
                  {exam.type === "headings" && (
                    <div style={{ lineHeight: 1.8, margin: 0, fontSize: "1.05em" }}>
                      <span className="de">{it.de}</span>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em" }}>{it.ar}</div>}
                    </div>
                  )}
                  {exam.type === "mcq" && (
                    <div>
                      <p className="de" style={{ fontWeight: 900, margin: 0, fontSize: "1.05em" }}>{it.q}</p>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em" }}>{it.ar}</div>}
                    </div>
                  )}
                </div>
              </div>
              {optsFor(it).map(o => (
                <button key={o.k} className={cls(it, o.k)} onClick={() => pick(it, o.k)} disabled={isDone} style={{ padding: "12px", fontSize: "0.95em" }}>
                  <span className="letter" style={{ width: 26, height: 26, fontSize: "0.9em" }}>{o.k}</span>
                  <span className="de" style={{ flex: 1, lineHeight: 1.5 }}>{o.de}</span>
                </button>
              ))}
              {isDone && (
                <div className={sel === it.c ? "fb good" : "fb bad"} style={{ marginTop: 10, padding: 12, fontSize: "0.95em" }}>
                  <b>{sel === it.c ? "✓ صحيح" : (sel ? "✗ غلط" : "⚠️ لم تجب")}</b>
                  {sel !== it.c && <span style={{fontWeight:900}}> — الجواب: {it.c}</span>}
                  <div style={{marginTop: 6, opacity: 0.9}}>{it.ar}</div>
                </div>
              )}
            </div>
          );
        })}

        {modalGap !== null && exam.type === "sprach1" && (
          <div className="overlay" onClick={() => setModalGap(null)}>
            <div className="sheet" onClick={e => e.stopPropagation()}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15}}>
                <h3 style={{margin:0, fontSize:"1.2em"}}>الفراغ ({modalGap})</h3>
                <button className="btnI" onClick={() => setModalGap(null)}>✕</button>
              </div>
              <div className="modal-list">
                {exam.items.find(x => x.n === modalGap).opts.map((opt, i) => (
                  <button key={i} className={"modal-item" + (ans[modalGap] === opt ? " selected" : "")} onClick={() => pick(exam.items.find(x => x.n === modalGap), opt)}>
                    <span style={{ opacity: 0.5, fontWeight: 900 }}>{String.fromCharCode(65 + i)}</span>
                    <span className="de" style={{fontSize:"1.05em"}}>{opt}</span>
                    {ans[modalGap] === opt && <span style={{ color: "var(--gold)", fontSize:"1.1em" }}>✓</span>}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {activeGap !== null && exam.type === "sprach2" && (
           <div className="overlay" onClick={() => setActiveGap(null)}>
             <div className="sheet" onClick={e => e.stopPropagation()}>
               <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15}}>
                 <h3 style={{margin:0, fontSize:"1.2em"}}>اختر الكلمة للفراغ ({activeGap})</h3>
                 <button className="btnI" onClick={() => setActiveGap(null)}>✕</button>
               </div>
               <div className="word-bank" style={{marginBottom:0, gridTemplateColumns: "1fr"}}>
                 {exam.wordBank.map(w => {
                   const isUsed = Object.values(ans).includes(w.w) && ans[activeGap] !== w.w;
                   return (
                     <button key={w.k} className={"word-btn" + (isUsed ? " used" : "")} onClick={() => onWordClick(w.w)} style={{ padding: "10px" }}>
                       <span style={{ opacity: 0.6, marginRight: 8, fontWeight: 900, fontSize:"0.9em" }}>{w.k}</span> <span style={{fontSize:"1.05em"}}>{w.w}</span>
                     </button>
                   )
                 })}
               </div>
             </div>
           </div>
        )}
      </div>

      <div style={{
        position: 'fixed', bottom: 12, left: 16, right: 16, zIndex: 40,
        display: 'flex', justifyContent: 'space-between', pointerEvents: 'none'
      }}>
        <button onClick={done !== null ? reset : finish} style={{
          pointerEvents: 'auto', padding: "8px 18px", fontSize: "0.85em", fontWeight: 800, borderRadius: 20,
          background: done !== null ? "rgba(220, 252, 231, 0.85)" : "rgba(15, 27, 51, 0.85)",
          color: done !== null ? "var(--okc)" : "var(--gold)",
          border: "1px solid rgba(255,255,255,0.1)",
          backdropFilter: "blur(8px)",
          boxShadow: "0 4px 15px rgba(0,0,0,0.15)", cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6
        }}>
          {done !== null ? "إعادة" : "تصحيح"}
        </button>
        <button onClick={() => { if(done !== null) onBack(); else onNext(); }} style={{
          pointerEvents: 'auto', padding: "8px 18px", fontSize: "0.85em", fontWeight: 800, borderRadius: 20,
          background: "rgba(255, 255, 255, 0.85)", color: "var(--text)",
          border: "1px solid rgba(0,0,0,0.05)",
          backdropFilter: "blur(8px)",
          boxShadow: "0 4px 15px rgba(0,0,0,0.1)", cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6
        }}>
          {done !== null ? "رجوع" : "التالي"}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [isReady, setIsReady] = useState(false);
  const [view, setView] = useState("home");
  const [level, setLevel] = useState("B1");
  const [exam, setExam] = useState(null);
  const [dark, setDark] = useState(false);
  const [fs, setFs] = useState(() => { try { return Number(localStorage.getItem("ep_fs")) || 100; } catch (e) { return 100; } });
  const [menu, setMenu] = useState(false);
  const [settings, setSettings] = useState(false);
  const [results, setResults] = useState(() => { try { return JSON.parse(localStorage.getItem("ep_results") || "{}"); } catch (e) { return {}; } });
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedExamTitle, setSelectedExamTitle] = useState(null);
  const [showSubscription, setShowSubscription] = useState(false);

  const [userLang, setUserLang] = useState(() => { try { return localStorage.getItem("ep_lang") || "ar"; } catch (e) { return "ar"; } });

  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const flash = (m) => {
    setToast(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };

  useEffect(() => {
    const timer = setTimeout(() => setIsReady(true), 1500);
    const savedUser = localStorage.getItem("ep_user");
    if (savedUser) setUser(JSON.parse(savedUser));
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    if (user && view === "home" && !sessionStorage.getItem("subShown")) {
      const timer = setTimeout(() => {
        setShowSubscription(true);
        sessionStorage.setItem("subShown", "true");
      }, 1000);
      return () => clearTimeout(timer);
    }
  }, [user, view]);

  const handleGuest = () => { const guest = { name: "زائر", isGuest: true }; setUser(guest); localStorage.setItem("ep_user", JSON.stringify(guest)); };
  const handleAuth = (e) => {
    e.preventDefault();
    const name = e.target.name.value;
    const pass = e.target.pass.value;
    const remember = e.target.remember.checked;
    if(name && pass) {
      const newUser = { name, pass, remember };
      setUser(newUser);
      localStorage.setItem("ep_user", JSON.stringify(newUser));
    }
  };
  const logout = () => { localStorage.removeItem("ep_user"); sessionStorage.removeItem("subShown"); setUser(null); };

  useEffect(() => { document.documentElement.classList.toggle("dark", dark); }, [dark]);
  useEffect(() => { document.documentElement.style.setProperty("--fs", fs / 100); try { localStorage.setItem("ep_fs", fs); } catch (e) {} }, [fs]);
  useEffect(() => { try { localStorage.setItem("ep_results", JSON.stringify(results)); } catch (e) {} }, [results]);

  const saveResult = (id, score, max) => setResults(r => ({ ...r, [id]: { score, max, date: Date.now() } }));
  const go = (v) => { setView(v); setExam(null); setMenu(false); window.scrollTo(0, 0); };

  const levelExams = EXAMS.filter(e => e.level === level);
  const uniqueTitles = Array.from(new Set(levelExams.map(e => e.title)))
    .filter(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

  const handleNextExam = (currentExam) => {
    const currentTitleIndex = uniqueTitles.indexOf(currentExam.title);
    if (currentTitleIndex !== -1 && currentTitleIndex < uniqueTitles.length - 1) {
      const nextTitle = uniqueTitles[currentTitleIndex + 1];
      const nextParts = EXAMS.filter(e => e.title === nextTitle && e.level === level);
      if (nextParts.length > 0) setExam(nextParts[0]);
    } else {
      setExam(null);
    }
  };

  if (!isReady) {
    return (
      <div className="splash-screen">
        <div className="splash-logo"><LogoImage size={180} /></div>
        <h1 className="de" style={{ color: "#0F1B33", fontSize: "2em", marginTop: 20, fontWeight: 900 }}>EchtPrüfung</h1>
      </div>
    );
  }

  if (!user) {
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div style={{textAlign:"center", marginBottom: 30}}>
            <LogoImage size={80} />
            <h2 style={{marginTop: 16, fontSize: "1.5em", fontWeight: 900}}>مرحباً بك في EchtPrüfung</h2>
            <p style={{color: "var(--muted)"}}>تطبيقك الأول للتحضير لامتحان B1</p>
          </div>
          <button className="auth-btn guest" onClick={handleGuest}>دخول كزائر (بنقرة واحدة)</button>
          <div style={{textAlign:"center", margin:"20px 0", color:"var(--muted)"}}>أو</div>
          <form onSubmit={handleAuth}>
            <input className="auth-input" name="name" placeholder="الاسم الفريد" required />
            <input className="auth-input" name="pass" type="password" placeholder="رقم سري" required />
            <div style={{ display: "flex", alignItems: "center", marginBottom: 16, gap: 8 }}>
              <input type="checkbox" name="remember" id="remember" style={{ width: 18, height: 18, accentColor: "var(--gold)" }} />
              <label htmlFor="remember" style={{ fontSize: "0.95em", color: "var(--text)", cursor: "pointer" }}>تذكرني (الحفاظ على كلمة السر)</label>
            </div>
            <button type="submit" className="auth-btn">تسجيل الدخول</button>
          </form>
        </div>
      </div>
    );
  }

  if (exam) {
    return <ExamView
      key={exam.id}
      exam={exam}
      dark={dark}
      setDark={setDark}
      onBack={() => setExam(null)}
      onNext={() => handleNextExam(exam)}
      onSave={saveResult}
    />;
  }

  return (
    <div style={{ paddingBottom: 80 }}>
      <div className="header" style={{ top: 10 }}>
        <div className="brand">
          <div className="logo"><LogoImage size={50} /></div>
          <div>
            <div style={{ fontWeight: 900, fontSize: "1.2em" }}>EchtPrüfung</div>
            <div className="de" style={{ fontSize: ".8em", color: "var(--muted)", fontWeight:"bold", display: "flex", alignItems: "center", gap: 4 }}>

              >
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                </svg>
                <span>الاشتراك وتواصل مع الدعم</span>
              </button>
            </div>
            <div style={{ padding: "0 20px 20px" }}>
              <button className="btn" style={{ background: "rgba(185, 28, 28, 0.1)", color: "var(--badc)", border: "1px solid var(--badc)", padding: "14px", fontSize: "1.05em", display: "flex", justifyContent: "center", alignItems: "center", gap: 8 }} onClick={logout}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14l5-5-5-5m5 5H9"/></svg>
                تسجيل الخروج
              </button>
            </div>
          </div>
        </div>
      )}

      {settings && (
        <div className="overlay" onClick={() => setSettings(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <strong style={{fontSize:"1.3em"}}>الإعدادات</strong>
              <button className="btnI" onClick={() => setSettings(false)}>✕</button>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <span style={{fontWeight:900, fontSize:"1.1em"}}>حجم النص</span>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button className="btnI" onClick={() => setFs(Math.max(80, fs - 10))}>−</button>
                <span style={{ minWidth: 48, textAlign: "center", fontWeight: 900, fontSize:"1.1em" }}>{fs}%</span>
                <button className="btnI" onClick={() => setFs(Math.min(150, fs + 10))}>+</button>
              </div>
            </div>
            <p className="de" style={{ background: "var(--paper)", padding: 16, borderRadius: 12, margin: "0 0 16px", fontSize: "1.1em" }}>
              Lesen Teil 1 — Beispieltext
            </p>
            <button className="btn ghost" onClick={() => setFs(100)}>إعادة الحجم الأصلي</button>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
