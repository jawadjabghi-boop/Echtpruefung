button{font-family:inherit;cursor:pointer;border:none;background:transparent}
.de{direction:ltr;text-align:left;font-family:system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.header{position:sticky;top:10px;z-index:30;margin:10px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 16px}
.btnI{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:1em}
.btn{border-radius:14px;padding:14px;font-weight:800;background:var(--ink);color:var(--gold);width:100%;font-size:1em}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.nav{position:fixed;bottom:8px;left:10px;right:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;display:flex;justify-content:space-around;padding:8px 4px;z-index:40}
.nav button{color:var(--muted);font-size:.7em;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px}
.nav button.on{color:var(--ink)}
.dark .nav button.on{color:var(--gold)}
.nav .ic{font-size:1.5em;padding:4px 10px;border-radius:12px}
.nav button.on .ic{background:rgba(245,184,46,.2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:center;padding:20px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;background:var(--paper)}
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--card);padding:28px;border-radius:24px;border:1px solid var(--line);width:100%;max-width:420px}
.auth-input{width:100%;padding:14px;margin-bottom:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--text);font-family:inherit;outline:none;font-size:1em}
.auth-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--ink);color:var(--gold);font-weight:800;font-size:1em;cursor:pointer;margin-bottom:10px}
.auth-btn.guest{background:var(--gold);color:var(--ink)}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:60vh;overflow-y:auto}
.lang-btn{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--paper);border:2px solid var(--line);color:var(--text);font-weight:800;cursor:pointer;font-size:.9em}
.lang-btn.on{background:rgba(245,184,46,.15);border-color:var(--gold)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:right;font-size:.95em}
.opt.dis{opacity:.3!important;pointer-events:none!important}
.opt.sel{border-color:var(--gold);background:rgba(245,184,46,.12)}
.opt.good{border-color:var(--okc);background:var(--okbg);color:var(--okc)}
.opt.bad{border-color:var(--badc);background:var(--badbg);color:var(--badc)}
.opt.faded{opacity:.4}
.letter{width:30px;height:30px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;border:1px solid var(--line);font-size:.95em}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:.9em;line-height:1.7}
.fb.good{background:var(--okbg);color:var(--okc)}
.fb.bad{background:var(--badbg);color:var(--badc)}
.trans-box{margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(37,99,235,.05);border-right:3px solid #3B82F6;color:#2563EB;font-size:.85em;line-height:1.5;direction:rtl;text-align:right}
.dark .trans-box{background:rgba(59,130,246,.15);border-color:#60A5FA;color:#93C5FD}
.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);padding:10px 20px;border-radius:14px;font-weight:800;z-index:60}
.highlight-yellow{background:#FEF08A;color:#854D0E;border-radius:4px;padding:0 4px;font-weight:bold}
.dark .highlight-yellow{background:#854D0E;color:#FEF08A}
.modal-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--text);font-weight:800;width:100%;text-align:left;direction:ltr;margin-bottom:8px}
.modal-item.selected{border-color:var(--gold);background:rgba(245,184,46,.14)}

.word-btn{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;text-align:right;display:flex;gap:8px;align-items:center}
.word-btn.used{opacity:.3;text-decoration:line-through;pointer-events:none}
.inline-gap{display:inline-flex;align-items:center;justify-content:center;min-width:80px;border-bottom:2px dashed var(--gold);padding:2px 8px;margin:0 4px;cursor:pointer;font-weight:900;vertical-align:middle;background:rgba(245,184,46,.07);border-radius:6px 6px 0 0}
.inline-gap.filled{border-bottom-style:solid;background:rgba(245,184,46,.18);color:var(--gold)}
.sp1-correct{background:var(--okbg);color:var(--okc);padding:3px 10px;border-radius:6px;font-weight:900;margin:0 3px;border:1px solid var(--okc)}
.sp1-wrong{background:var(--badbg);color:var(--badc);text-decoration:line-through;padding:3px 10px;border-radius:6px;font-weight:900;margin:0 3px;border:1px solid var(--badc)}
.sahla-card{background:var(--card);border-radius:24px;margin-bottom:20px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.03);overflow:hidden}
.sahla-header{padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.sahla-title{display:flex;align-items:center;gap:12px;font-size:1.3em;font-weight:900;color:var(--text);direction:ltr;text-align:left}
.sahla-title::before{content:"";width:6px;height:24px;background:var(--gold);border-radius:4px}
.sahla-audio{background:var(--paper);border-radius:50px;padding:8px 16px;margin:0 20px 20px;display:flex;align-items:center;gap:16px;border:1px solid var(--line)}
.sahla-play{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#FFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.3em}
.sahla-progress{flex:1;display:flex;flex-direction:column;gap:6px;direction:ltr}
.sahla-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.sahla-fill{height:100%;background:var(--gold);border-radius:3px}
.sahla-table{margin:0 20px 20px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sahla-th{display:flex;background:var(--paper);padding:12px;font-weight:900;color:var(--muted);font-size:.85em;border-bottom:1px solid var(--line);direction:ltr}
.sahla-row{display:flex;padding:16px 12px;border-bottom:1px solid var(--line);align-items:flex-start;direction:ltr}
.sahla-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}

.sahla-circle.bad{border-color:var(--badc);background:var(--badc);box-shadow:inset 0 0 0 3px var(--card)}

.sahla-actions{display:flex;gap:12px;margin:0 20px 20px}

.sahla-warning{background:rgba(245,184,46,.08);border:1px solid var(--gold);border-radius:16px;padding:16px;margin:0 20px 20px;display:flex;align-items:center;gap:12px;color:var(--gold);font-weight:800}

  items:[
    {n:1, c:"b", hl:"schneller und bequemer ans Ziel", de:"Sie haben Mitarbeiter, die gern mit dem Fahrrad zur Arbeit kommen? Warum dann nicht mehr E-Bikes leasen statt nur teure Firmenwagen? Gerade in Städten kommt man mit einem E-Bike schneller und bequemer ans Ziel als mit dem Auto.", ar:"الإعلان يروّج لتأجير الدراجات الكهربائية بدل سيارات الشركة، لأنها صحية وبيئية وتوفر الضرائب.", ma:"الإعلان كيشجع على كراء الدراجات الكهربائية بلاصة طوموبيلات الشركة، حيت صحية وبيئية وكتوفر الضرائب.", eg:"الإعلان بيشجع على تأجير العجل الكهربائي بدل عربيات الشركة، عشان صحية وبيئية وبتوفر الضرايب.", en:"The ad promotes leasing e-bikes instead of company cars because they are healthy, eco-friendly, and tax-saving.", fr:"L'annonce fait la promotion de la location de vélos électriques au lieu des voitures de société, car ils sont sains, écologiques et permettent d'économiser des impôts.", hi:"विज्ञापन कंपनी की कारों के बजाय ई-बाइक पट्टे पर देने को बढ़ावा देता है क्योंकि वे स्वस्थ, पर्यावरण के अनुकूल और कर-बचत करने वाले हैं।", tr:"Reklam, şirket arabaları yerine e-bisiklet kiralamayı teşvik ediyor çünkü sağlıklı, çevre dostu ve vergi tasarrufu sağlıyor.", vi:"Quảng cáo quảng bá việc thuê xe đạp điện thay vì xe công ty vì chúng lành mạnh, thân thiện với môi trường và tiết kiệm thuế.", uk:"Реклама пропагує оренду електровелосипедів замість корпоративних автомобілів, оскільки вони корисні для здоров'я, екологічні та дозволяють економити на податках.", es:"El anuncio promueve el alquiler de bicicletas eléctricas en lugar de coches de empresa porque son saludables, ecológicas y ahorran impuestos.", pt:"O anúncio promove o aluguel de e-bikes em vez de carros da empresa, pois são saudáveis, ecológicas e economizam impostos.", zh:"该广告提倡租赁电动自行车而不是公司汽车，因为它们健康、环保且节税。", ru:"Реклама продвигает аренду электровелосипедов вместо корпоративных автомобилей, потому что они полезны для здоровья, экологичны и экономят налоги."},
    {n:2, c:"h", hl:"Engagement für die Natur", de:"NaturVerband ist der größte Umweltverband in Deutschland. Er engagiert sich für Umwelt- und Tierschutz. Sie wollen sich auch aktiv gegen Umweltverschmutzung einsetzen? Dann sind Sie bei uns richtig.", ar:"جمعية تعمل في حماية البيئة والحيوانات، وتقدم لقاءات ومجلة شهرية.", ma:"جمعية كتخدم فحماية البيئة والحيوانات، وكتقدم لقاءات ومجلة شهرية.", eg:"جمعية بتشتغل في حماية البيئة والحيوانات، وبتقدم لقاءات ومجلة شهرية.", en:"An association working in environmental and animal protection, offering meetings and a monthly magazine.", fr:"Une association œuvrant pour la protection de l'environnement et des animaux, proposant des réunions et un magazine mensuel.", hi:"पर्यावरण और पशु संरक्षण में काम करने वाला एक संघ, जो बैठकें और मासिक पत्रिका प्रदान करता है।", tr:"Çevre ve hayvan koruma alanında çalışan, toplantılar ve aylık bir dergi sunan bir dernek.", vi:"Một hiệp hội hoạt động trong lĩnh vực bảo vệ môi trường và động vật, cung cấp các cuộc họp và tạp chí hàng tháng.", uk:"Асоціація, що працює у сфері охорони навколишнього середовища та захисту тварин, пропонує зустрічі та щомісячний журнал.", es:"Una asociación que trabaja en la protección del medio ambiente y los animales, ofreciendo reuniones y una revista mensual.", pt:"Uma associação que atua na proteção ambiental e animal, oferecendo reuniões e uma revista mensal.", zh:"一个致力于环境和动物保护的协会，提供会议和月刊。", ru:"Ассоциация, работающая в сфере охраны окружающей среды и защиты животных, предлагает встречи и ежемесячный журнал."},
    {n:3, c:"f", hl:"Ticketpreise", de:"Die Bahn erhöht dieses Jahr die Ticketpreise nicht. Dies soll die Bahn attraktiver machen, sodass mehr Menschen die Züge nutzen.", ar:"النص يتكلم عن عدم رفع أسعار تذاكر القطار هذا العام.", ma:"النص كيهضر على عدم رفع أثمنة تذاكر القطار هاد العام.", eg:"النص بيتكلم عن عدم زيادة أسعار تذاكر القطر السنة دي.", en:"The text is about not increasing train ticket prices this year.", fr:"Le texte parle de la non-augmentation des prix des billets de train cette année.", hi:"पाठ इस साल ट्रेन टिकट की कीमतों में वृद्धि न करने के बारे में है।", tr:"Metin, bu yıl tren bilet fiyatlarına zam yapılmamasıyla ilgili.", vi:"Văn bản nói về việc không tăng giá vé tàu trong năm nay.", uk:"Текст про те, що цього року ціни на квитки на потяг не підвищуватимуться.", es:"El texto trata sobre no aumentar los precios de los billetes de tren este año.", pt:"O texto trata de não aumentar os preços das passagens de trem este ano.", zh:"文本内容是关于今年不提高火车票价。", ru:"В тексте говорится о том, что в этом году цены на билеты на поезд не повышаются."},
    {n:4, c:"a", hl:"Eltern trotz Kritik mit der Schule zufrieden", de:"Vergangenen Monat wurden etwa tausend Eltern von der Stiftung Schulqualität befragt, ob sie mit der Schule ihrer Kinder zufrieden sind. Dabei sagten 80%, dass die Schule gut oder sogar sehr gut sei.", ar:"تم استطلاع رأي حوالي ألف من الآباء الشهر الماضي. وقال 80% منهم إن المدرسة جيدة.", ma:"الشهر اللي فات سقسيو حوالي ألف من الوالدين. 80% منهم قالو بلي المدرسة مزيانة.", eg:"الشهر اللي فات سألوا حوالي ألف من الأهل. 80% منهم قالوا إن المدرسة كويسة.", en:"About a thousand parents were surveyed last month. 80% of them said that the school was good.", fr:"Environ un millier de parents ont été interrogés le mois dernier. 80 % d'entre eux ont déclaré que l'école était bonne.", hi:"पिछले महीने लगभग एक हजार माता-पिता का सर्वेक्षण किया गया था। उनमें से 80% ने कहा कि स्कूल अच्छा था।", tr:"Geçen ay yaklaşık bin ebeveynle anket yapıldı. Onların %80'i okulun iyi olduğunu söyledi.", vi:"Khoảng một nghìn phụ huynh đã được khảo sát vào tháng trước. 80% trong số họ nói rằng trường học tốt.", uk:"Минулого місяця було опитано близько тисячі батьків. 80% з них сказали, що школа хороша.", es:"Se encuestó a unos mil padres el mes pasado. El 80% de ellos dijo que la escuela era buena.", pt:"Cerca de mil pais foram entrevistados no mês passado. 80% deles disseram que a escola era boa.", zh:"上个月对大约一千名家长进行了调查。其中80%的人表示学校很好。", ru:"В прошлом месяце было опрошено около тысячи родителей. 80% из них сказали, что школа хорошая."},
    {n:5, c:"j", hl:"Lehrermangel", de:"Berlin. In der Hauptstadt herrscht weiterhin Lehrermangel: Tausende Lehrkräfte fehlen. Daher plant der Berliner Senat eine Werbekampagne.", ar:"برلين. لا يزال هناك نقص في المعلمين في العاصمة: آلاف المعلمين مفقودون.", ma:"برلين. مازال كاين نقص فالأساتذة فالعاصمة: آلاف من الأساتذة ناقصين.", eg:"برلين. لسه في نقص في المدرسين في العاصمة: آلاف المدرسين ناقصين.", en:"Berlin. There is still a shortage of teachers in the capital: thousands of teachers are missing.", fr:"Berlin. La pénurie d'enseignants persiste dans la capitale : des milliers d'enseignants manquent.", hi:"बर्लिन। राजधानी में अभी भी शिक्षकों की कमी है: हजारों शिक्षक गायब हैं।", tr:"Berlin. Başkentte hâlâ öğretmen sıkıntısı var: binlerce öğretmen eksik.", vi:"Berlin. Thủ đô vẫn thiếu giáo viên: hàng nghìn giáo viên bị thiếu hụt.", uk:"Берлін. У столиці досі відчувається нестача вчителів: не вистачає тисяч учителів.", es:"Berlín. Sigue habiendo escasez de profesores en la capital: faltan miles de profesores.", pt:"Berlim. Ainda há escassez de professores na capital: faltam milhares de professores.", zh:"柏林。首都仍然缺乏教师：缺少数千名教师。", ru:"Берлин. В столице по-прежнему не хватает учителей: отсутствуют тысячи учителей."}
  ]
},
{ id:"alex-t2", title:"Alex Und Cora", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs: [
    { de:"Egal ob Hund, Katze oder Maus: Haustiere sind in Deutschland sehr beliebt.", ar:"سواء كان كلباً أو قطة أو فأراً: الحيوانات الأليفة تحظى بشعبية كبيرة في ألمانيا.", ma:"سواء كان كلب ولا قط ولا فار: الحيوانات الأليفة كيعجبو بزاف فألمانيا.", eg:"سواء كلب أو قطة أو فار: الحيوانات الأليفة ليها شعبية كبيرة في ألمانيا.", en:"Whether dog, cat or mouse: pets are very popular in Germany.", fr:"Qu'il s'agisse de chiens, de chats ou de souris : les animaux de compagnie sont très populaires en Allemagne.", hi:"कुत्ता, बिल्ली या चूहा कोई भी हो: जर्मनी में पालतू जानवर बहुत लोकप्रिय हैं।", tr:"İster köpek, ister kedi ister fare olsun: evcil hayvanlar Almanya'da çok popülerdir.", vi:"Dù là chó, mèo hay chuột: thú cưng rất phổ biến ở Đức.", uk:"Незалежно від того, чи це собака, кіт чи миша: домашні тварини дуже популярні в Німеччині.", es:"Ya sea perro, gato o ratón: las mascotas son muy populares en Alemania.", pt:"Seja cão, gato ou rato: os animais de estimação são muito populares na Alemanha.", zh:"无论是狗、猫还是老鼠：宠物在德国非常受欢迎。", ru:"Будь то собака, кошка или мышь: домашние животные очень популярны в Германии."},
    { de:"In deutschen Haushalten gibt es rund 34 Millionen Haustiere. Besonders Katzen sind sehr beliebt.", ar:"يوجد في الأسر الألمانية حوالي 34 مليون حيوان أليف. القطط تحظى بشعبية خاصة.", ma:"كاين فالدور ديال الألمان حوالي 34 مليون حيوان أليف. القطط كيعجبو بزاف.", eg:"في البيوت الألمانية فيه حوالي 34 مليون حيوان أليف. القطط ليها شعبية خاصة.", en:"There are around 34 million pets in German households. Cats are particularly popular.", fr:"Il y a environ 34 millions d'animaux de compagnie dans les foyers allemands. Les chats sont particulièrement populaires.", hi:"जर्मन घरों में लगभग 34 मिलियन पालतू जानवर हैं। बिल्लियाँ विशेष रूप से लोकप्रिय हैं।", tr:"Alman hanelerinde yaklaşık 34 milyon evcil hayvan var. Özellikle kediler çok popüler.", vi:"Có khoảng 34 triệu thú cưng trong các hộ gia đình ở Đức. Mèo đặc biệt phổ biến.", uk:"У німецьких домогосподарствах налічується близько 34 мільйонів домашніх тварин. Особливо популярні коти.", es:"Hay alrededor de 34 millones de mascotas en los hogares alemanes. Los gatos son especialmente populares.", pt:"Existem cerca de 34 milhões de animais de estimação nos lares alemães. Os gatos são particularmente populares.", zh:"德国家庭中大约有3400万只宠物。猫尤其受欢迎。", ru:"В немецких домохозяйствах около 34 миллионов домашних животных. Особенно популярны кошки."},

    {n:1, c:"H", hl:"Computer", de:"Sie verbringen gern viele Stunden im Cafe, wollen aber nicht viel Geld ausgeben.", ar:"تحب قضاء ساعات طويلة في المقهى، ولكنك لا ترغب في إنفاق الكثير من المال.", ma:"كتحب تدوز ساعات فالمقهى، ولكن ما بغيتيش تصرف فلوس بزاف.", eg:"بتحب تقعد ساعات في القهوة، بس مش عايز تصرف فلوس كتير.", en:"You like spending many hours in a cafe but don't want to spend much money.", fr:"Vous aimez passer de nombreuses heures dans un café mais ne voulez pas dépenser beaucoup d'argent.", hi:"आप कैफे में कई घंटे बिताना पसंद करते हैं, लेकिन ज्यादा पैसे खर्च नहीं करना चाहते।", tr:"Bir kafede saatler geçirmeyi seviyorsunuz ancak çok fazla para harcamak istemiyorsunuz.", vi:"Bạn thích dành nhiều giờ trong quán cà phê nhưng không muốn tiêu nhiều tiền.", uk:"Ви любите проводити багато годин у кафе, але не хочете витрачати багато грошей.", es:"Te gusta pasar muchas horas en una cafetería pero no quieres gastar mucho dinero.", pt:"Você gosta de passar muitas horas num café mas não quer gastar muito dinheiro.", zh:"您喜欢在咖啡馆里待上几个小时，但不想花太多钱。", ru:"Вы любите проводить много часов в кафе, но не хотите тратить много денег."},
    {n:2, c:"G", hl:"Grundkenntnisse für die Arbeit am Computer", de:"Sie haben gerade den Beruf gewechselt und brauchen für die neue Aufgabe Grundkenntnisse für die Arbeit am Computer.", ar:"لقد غيرت مهنتك مؤخرًا وتحتاج إلى معرفة أساسية للعمل على الكمبيوتر من أجل المهمة الجديدة.", ma:"بدلتي الخدمة دابا وكتحتاج تعرف أساسيات الكمبيوتر للمهمة الجديدة.", eg:"غيرت شغلك وعايز أساسيات الكمبيوتر عشان المهمة الجديدة.", en:"You have just changed jobs and need basic computer skills for the new task.", fr:"Vous venez de changer de métier et avez besoin de connaissances informatiques de base pour votre nouvelle tâche.", hi:"आपने अभी-अभी नौकरी बदली है और नए काम के लिए आपको कंप्यूटर का बुनियादी ज्ञान चाहिए।", tr:"Yeni iş değiştirdiniz ve yeni görev için temel bilgisayar bilgisine ihtiyacınız var.", vi:"Bạn vừa thay đổi công việc và cần kiến thức cơ bản về máy tính cho nhiệm vụ mới.", uk:"Ви щойно змінили роботу і потребуєте базових навичок роботи на комп'ютері для нового завдання.", es:"Acaba de cambiar de trabajo y necesita conocimientos básicos de informática para la nueva tarea.", pt:"Você acabou de mudar de emprego e precisa de conhecimentos básicos de informática para a nova tarefa.", zh:"您刚刚换了工作，新任务需要基本的电脑技能。", ru:"Вы только что сменили работу и нуждаетесь в базовых навыках работы на компьютере для новой задачи."},
    {n:3, c:"D", hl:"besser qualifiziert sein", de:"Sie arbeiten in einem Krankenhaus und haben dort häufig mit Patienten aus aller Welt zu tun. Sie möchten für diese Arbeit noch besser qualifiziert sein.", ar:"تعمل في مستشفى وتتعامل غالبًا مع مرضى من جميع أنحاء العالم. ترغب في أن تكون أكثر تأهيلاً لهذه الوظيفة.", ma:"كتخدم فالمستشفى وكتعامل مع مرضى من العالم كامل. بغيتي تكون واجد كثر لهاد الخدمة.", eg:"بتشتغل في مستشفى وبتتعامل مع مرضى من كل حتة. عايز تبقى متأهل أكتر للشغل ده.", en:"You work in a hospital and often deal with patients from all over the world. You want to be better qualified for this work.", fr:"Vous travaillez dans un hôpital et avez souvent affaire à des patients du monde entier. Vous souhaitez être mieux qualifié pour ce travail.", hi:"आप एक अस्पताल में काम करते हैं और अक्सर दुनिया भर के मरीजों से मिलते हैं। आप इस काम के लिए बेहतर ढंग से योग्य बनना चाहते हैं।", tr:"Bir hastanede çalışıyorsunuz ve sık sık dünyanın her yerinden gelen hastalarla ilgileniyorsunuz. Bu iş için daha iyi niteliklere sahip olmak istiyorsunuz.", vi:"Bạn làm việc trong một bệnh viện và thường xuyên tiếp xúc với bệnh nhân từ khắp nơi trên thế giới. Bạn muốn có trình độ chuyên môn tốt hơn cho công việc này.", uk:"Ви працюєте в лікарні і часто маєте справу з пацієнтами з усього світу. Ви хочете мати кращу кваліфікацію для цієї роботи.", es:"Trabaja en un hospital y a menudo trata con pacientes de todo el mundo. Desea estar mejor cualificado para este trabajo.", pt:"Você trabalha em um hospital e frequentemente lida com pacientes de todo o mundo. Você quer ser mais qualificado para este trabalho.", zh:"您在医院工作，经常接触来自世界各地的病人。您希望在这项工作上具备更好的资格。", ru:"Вы работаете в больнице и часто имеете дело с пациентами со всего мира. Вы хотите быть более квалифицированным для этой работы."},
    {n:4, c:"X", hl:"Tanzkurs für Anfänger", de:"Sie möchten gern einen Tanzkurs für Anfänger besuchen. Sie haben nur abends Zeit.", ar:"ترغب في حضور دورة رقص للمبتدئين. لديك وقت فقط في المساء.", ma:"بغيتي تمشي لدورة ديال الرقص للمبتدئين. عندك غير الليل.", eg:"عايز تروح لدرس رقص للمبتدئين. عندك وقت بالليل بس.", en:"You would like to attend a dance course for beginners. You only have time in the evening.", fr:"Vous souhaitez suivre un cours de danse pour débutants. Vous n'avez le temps que le soir.", hi:"आप शुरुआती लोगों के लिए डांस कोर्स में भाग लेना चाहते हैं। आपके पास केवल शाम को समय है।", tr:"Yeni başlayanlar için bir dans kursuna katılmak istiyorsunuz. Sadece akşamları vaktiniz var.", vi:"Bạn muốn tham gia một khóa học khiêu vũ cho người mới bắt đầu. Bạn chỉ có thời gian vào buổi tối.", uk:"Ви хотіли б відвідати курс танців для початківців. У вас є час лише ввечері.", es:"Le gustaría asistir a un curso de baile para principiantes. Solo tiene tiempo por la noche.", pt:"Você gostaria de participar de um curso de dança para iniciantes. Você só tem tempo à noite.", zh:"您想参加初学者的舞蹈课程。您只有晚上有时间。", ru:"Вы хотели бы посетить курс танцев для начинающих. У вас есть время только вечером."},
    {n:5, c:"J", hl:"mit Fremdsprachen", de:"Sie möchten beruflich etwas mit Fremdsprachen machen. Deshalb wollen Sie im Ausland studieren um später vielleicht auch dort zu arbeiten.", ar:"ترغب في العمل في مجال يتعلق باللغات الأجنبية. لذلك تريد الدراسة في الخارج وربما العمل هناك لاحقًا.", ma:"بغيتي تخدم شي حاجة فاللغات. داكشي علاش بغيتي تقرا فالخارج وربما تخدم تما من بعد.", eg:"عايز تشتغل في حاجة ليها علاقة باللغات. عشان كده عايز تدرس بره ويمكن تشتغل هناك بعدين.", en:"You want to work in a field related to foreign languages. That's why you want to study abroad and maybe work there later.", fr:"Vous souhaitez travailler dans un domaine lié aux langues étrangères. C'est pourquoi vous voulez étudier à l'étranger et peut-être y travailler plus tard.", hi:"आप विदेशी भाषाओं से संबंधित क्षेत्र में काम करना चाहते हैं। इसलिए आप विदेश में अध्ययन करना चाहते हैं और शायद बाद में वहां काम करना चाहते हैं।", tr:"Yabancı dillerle ilgili bir alanda çalışmak istiyorsunuz. Bu yüzden yurtdışında okumak ve belki daha sonra orada çalışmak istiyorsunuz.", vi:"Bạn muốn làm việc trong một lĩnh vực liên quan đến ngoại ngữ. Đó là lý do tại sao bạn muốn du học và có thể làm việc ở đó sau này.", uk:"Ви хочете працювати у сфері, пов'язаній з іноземними мовами. Ось чому ви хочете вчитися за кордоном і, можливо, згодом працювати там.", es:"Quiere trabajar en un campo relacionado con los idiomas extranjeros. Por eso quiere estudiar en el extranjero y quizás trabajar allí más tarde.", pt:"Você quer trabalhar em uma área relacionada a línguas estrangeiras. É por isso que você quer estudar no exterior e talvez trabalhar lá mais tarde.", zh:"您想在与外语相关的领域工作。这就是为什么您想出国留学，也许以后在那里工作。", ru:"Вы хотите работать в области, связанной с иностранными языками. Поэтому вы хотите учиться за границей и, возможно, позже там работать."},
    {n:6, c:"A", hl:"süße Sachen isst", de:"Sie wollen mit einem Bekannten einen gemütlichen Nachmittag in der Stadt verbringen. Sie wissen, dass Ihr Bekannter am liebsten süße Sachen isst.", ar:"تريد قضاء فترة بعد الظهر المريحة في المدينة مع أحد معارفك. تعلم أن صديقك يفضل تناول الأشياء الحلوة.", ma:"بغيتي تدوز شي نهار مريح فالمدينة مع شي صاحب. عارف بلي صحابك كيحب الحلويات.", eg:"عايز تقضي بعد ضهر لطيف في المدينة مع حد تعرفه. عارف إن صاحبك بيحب الحلويات.", en:"You want to spend a cozy afternoon in the city with an acquaintance. You know that your acquaintance loves eating sweet things.", fr:"Vous voulez passer un après-midi agréable en ville avec une connaissance. Vous savez que votre connaissance aime manger des choses sucrées.", hi:"आप एक परिचित के साथ शहर में एक आरामदायक दोपहर बिताना चाहते हैं। आप जानते हैं कि आपका परिचित मीठी चीजें खाना पसंद करता है।", tr:"Bir tanıdığınızla şehirde rahat bir öğleden sonra geçirmek istiyorsunuz. Tanıdığınızın tatlı şeyler yemeyi çok sevdiğini biliyorsunuz.", vi:"Bạn muốn dành một buổi chiều ấm cúng trong thành phố với một người quen. Bạn biết rằng người quen của bạn rất thích ăn đồ ngọt.", uk:"Ви хочете провести затишний день у місті зі знайомим. Ви знаєте, що ваш знайомий любить солодке.", es:"Quiere pasar una tarde acogedora en la ciudad con un conocido. Sabe que a su conocido le encanta comer cosas dulces.", pt:"Você quer passar uma tarde agradável na cidade com um conhecido. Você sabe que seu conhecido adora comer coisas doces.", zh:"您想和一个熟人在这座城市度过一个舒适的下午。您知道您的熟人最喜欢吃甜食。", ru:"Вы хотите провести уютный день в городе со знакомым. Вы знаете, что ваш знакомый любит сладкое."},
    {n:7, c:"I", hl:"europäische Weine", de:"Ihr Freund aus den USA ist zu Besuch. Er ist Weinkenner und möchte europäische Weine probieren.", ar:"صديقك من الولايات المتحدة يزورك. هو خبير في النبيذ ويرغب في تذوق النبيذ الأوروبي.", ma:"صاحبك من أمريكا جاي يزورك. هو خبير فنبيذ وبغى يدوق النبيذ الأوروبي.", eg:"صاحبك من أمريكا جاي يزورك. هو خبير في النبيت وعايز يجرب النبيت الأوروبي.", en:"Your friend from the USA is visiting. He is a wine connoisseur and wants to try European wines.", fr:"Votre ami des États-Unis est en visite. Il est connaisseur en vin et souhaite goûter des vins européens.", hi:"अमेरिका से आपका दोस्त मिलने आया है। वह शराब पारखी है और यूरोपीय वाइन चखना चाहता है।", tr:"ABD'den gelen arkadaşınız ziyaretinizde. O bir şarap uzmanı ve Avrupa şaraplarını denemek istiyor.", vi:"Bạn của bạn từ Hoa Kỳ đến thăm. Anh ấy là một người sành rượu vang và muốn thử rượu vang châu Âu.", uk:"До вас приїхав друг із США. Він знавець вина і хоче скуштувати європейські вина.", es:"Su amigo de los EE. UU. está de visita. Es un conocedor del vino y quiere probar vinos europeos.", pt:"Seu amigo dos EUA está visitando. Ele é um conhecedor de vinhos e quer experimentar vinhos europeus.", zh:"您来自美国的朋友正在拜访。他是一位葡萄酒鉴赏家，想品尝欧洲葡萄酒。", ru:"К вам приехал друг из США. Он знаток вина и хочет попробовать европейские вина."},
    {n:8, c:"X", hl:"fremden Kulturen", de:"In Ihrer Freizeit möchten Sie sich mit anderen Ländern, fremden Kulturen und Traditionen beschäftigen.", ar:"في وقت فراغك، ترغب في التعرف على بلدان أخرى وثقافات وتقاليد مختلفة.", ma:"فوقت الفراغ ديالك، بغيتي تعرف بلدان وثقافات وتقاليد أخرى.", eg:"في وقت فراغك، عايز تتعرف على بلاد تانية وثقافات وتقاليد مختلفة.", en:"In your free time, you want to deal with other countries, foreign cultures and traditions.", fr:"Pendant votre temps libre, vous souhaitez vous intéresser à d'autres pays, cultures et traditions étrangères.", hi:"अपने खाली समय में, आप अन्य देशों, विदेशी संस्कृतियों और परंपराओं से निपटना चाहते हैं।", tr:"Boş zamanlarınızda diğer ülkeler, yabancı kültürler ve geleneklerle ilgilenmek istiyorsunuz.", vi:"Trong thời gian rảnh rỗi, bạn muốn tìm hiểu về các quốc gia khác, văn hóa và truyền thống nước ngoài.", uk:"У вільний час ви хочете займатися іншими країнами, іноземними культурами та традиціями.", es:"En su tiempo libre, quiere ocuparse de otros países, culturas y tradiciones extranjeras.", pt:"No seu tempo livre, você quer lidar com outros países, culturas e tradições estrangeiras.", zh:"在空闲时间，您想了解其他国家、外国文化和传统。", ru:"В свободное время вы хотите заниматься другими странами, иностранными культурами и традициями."},
    {n:9, c:"F", hl:"Informationen und Beratung", de:"Die Tochter Ihrer Freunde hat gerade Abitur gemacht und ist nicht sicher, was sie später machen will. Sie braucht Informationen und Beratung.", ar:"ابنة أصدقائك أنهت للتو الثانوية العامة وهي غير متأكدة مما تريد فعله لاحقًا. تحتاج إلى معلومات واستشارة.", ma:"بنت صحابك دازت الباك دابا وما عارفاش شنو بغات دير من بعد. كتحتاج معلومات ونصيحة.", eg:"بنت صحابك خلصت الثانوية العامة ومش متأكدة هتعمل إيه بعدين. محتاجة معلومات ونصيحة.", en:"Your friend's daughter has just graduated from high school and is unsure what she wants to do later. She needs information and advice.", fr:"La fille de vos amis vient d'obtenir son baccalauréat et ne sait pas ce qu'elle veut faire plus tard. Elle a besoin d'informations et de conseils.", hi:"आपके मित्र की बेटी ने अभी-अभी हाई स्कूल पूरा किया है और उसे निश्चित नहीं है कि वह बाद में क्या करना चाहती है। उसे जानकारी और सलाह की आवश्यकता है।", tr:"Arkadaşınızın kızı liseden yeni mezun oldu ve daha sonra ne yapmak istediğinden emin değil. Bilgiye ve tavsiyeye ihtiyacı var.", vi:"Con gái của bạn bạn vừa tốt nghiệp trung học và không chắc mình muốn làm gì sau này. Cô ấy cần thông tin và lời khuyên.", uk:"Донька ваших друзів щойно закінчила школу і не впевнена, чим хоче займатися далі. Їй потрібна інформація та консультація.", es:"La hija de sus amigos acaba de terminar el bachillerato y no está segura de lo que quiere hacer más tarde. Necesita información y asesoramiento.", pt:"A filha dos seus amigos acaba de se formar no ensino médio e não tem certeza do que quer fazer mais tarde. Ela precisa de informações e aconselhamento.", zh:"您朋友的女儿刚高中毕业，不确定以后想做什么。她需要信息和建议。", ru:"Дочь ваших друзей только что окончила школу и не уверена, чем хочет заниматься дальше. Ей нужна информация и консультация."},
    {n:10, c:"C", hl:"weder Fleisch noch Fisch", de:"Sie möchten mit Freunden in einem Lokal mit Unterhaltungsprogramm essen. Ihre Freunde essen aber weder Fleisch noch Fisch.", ar:"ترغب في تناول الطعام مع أصدقائك في مكان يقدم برنامج ترفيهي. لكن أصدقاؤك لا يتناولون اللحوم أو الأسماك.", ma:"بغيتي تاكل مع صحابك فشي بلاصة فيها برنامج ترفيهي. ولكن صحابك ما كياكلوش اللحم ولا الحوت.", eg:"عايز تاكل مع صحابك في مكان فيه برنامج ترفيهي. بس صحابك مش بياكلوا لحمة ولا سمك.", en:"You want to eat with friends in a restaurant with an entertainment program. But your friends eat neither meat nor fish.", fr:"Vous souhaitez manger avec des amis dans un restaurant avec un programme de divertissement. Mais vos amis ne mangent ni viande ni poisson.", hi:"आप मनोरंजन कार्यक्रम वाले रेस्तरां में दोस्तों के साथ खाना खाना चाहते हैं। लेकिन आपके दोस्त न तो मांस खाते हैं और न ही मछली।", tr:"Arkadaşlarınızla eğlence programı olan bir restoranda yemek yemek istiyorsunuz. Ancak arkadaşlarınız ne et ne de balık yiyor.", vi:"Bạn muốn ăn tối với bạn bè tại một nhà hàng có chương trình giải trí. Nhưng bạn bè của bạn không ăn thịt cũng không ăn cá.", uk:"Ви хочете повечеряти з друзями в ресторані з розважальною програмою. Але ваші друзі не їдять ні м'яса, ні риби.", es:"Quiere comer con amigos en un restaurante con programa de entretenimiento. Pero sus amigos no comen ni carne ni pescado.", pt:"Você quer comer com amigos em um restaurante com programa de entretenimento. Mas seus amigos não comem carne nem peixe.", zh:"您想和朋友们在有娱乐节目的餐厅用餐。但是您的朋友既不吃肉也不吃鱼。", ru:"Вы хотите поужинать с друзьями в ресторане с развлекательной программой. Но ваши друзья не едят ни мясо, ни рыбу."}
  ]
},
{ id:"alex-sp1", title:"Alex Und Cora", level:"B1", sub:"Sprach 1", type:"sprach1",
  text:`Schaffhausen, den...\nHallo Isabelle,\nwie geht es dir? Hast du deine Prüfungen geschafft?\nWie du ja weißt, .....(1)..... ich seit zwei Monaten in einem Altersheim .....(2)..... der Nähe von Schaffhausen. Die Arbeit in .....(3)..... Haus gefällt mir gut, obwohl es manchmal auch sehr stressig ist. Besonders schön ist der enge .....(4)..... zu einigen der alten Menschen. Eine Frau, Anna Ringier, mag ich .....(5)..... gern. Sie ist schon 96 Jahre alt und sitzt im Rollstuhl, aber sie ist immer fröhlich. Gestern hat sie mir .....(6)..... ganzes Leben erzählt. Sie hat bis zum 84. Lebensjahr .....(7)..... gearbeitet. Schon als achtjähriges Mädchen musste sie bei einem Bauern arbeiten, .....(8)..... ihre Eltern die neunköpfige Familie nicht ernähren konnten. Später arbeitete Anna als Schneiderin.\nNeben ihrer Arbeit hat Anna .....(9)..... auf eine Sache nie verzichtet: das Bergsteigen!\nAber du .....(10)..... bestimmt auch viel erlebt.\nHerzliche Grüße\ndeine Julie`,
  items:[

{ id:"alex-sp2", title:"Alex Und Cora", level:"B1", sub:"Sprach 2", type:"sprach2",
  wordBank:[{k:"a",w:"an"},{k:"b",w:"Bekannte"},{k:"c",w:"bereits"},{k:"d",w:"dafür"},{k:"e",w:"darüber"},{k:"f",w:"dass"},{k:"g",w:"Familie"},{k:"h",w:"kann"},{k:"i",w:"mich"},{k:"j",w:"mit"},{k:"k",w:"muss"},{k:"l",w:"ob"},{k:"m",w:"sehr"},{k:"n",w:"was"},{k:"o",w:"welche"}],
  text:`Sehr geehrte Damen und Herren,\n\nnachdem ich Ihr Inserat gelesen habe, möchte ich .....(1)..... gern genauer über Ihr Restaurant informieren. In einem Monat feiere ich meinen 30. Geburtstag und möchte dazu viele Freunde und .....(2)..... einladen. .....(3)..... wäre Ihr Hotel sicher sehr gut geeignet. Deshalb noch einige Fragen .....(4)..... Sie: Ich rechne ungefähr mit 25 Personen. Wie hoch ist die Miete für den passenden Raum und .....(5)..... Gerichte können Sie mir empfehlen? Da fast alle Gäste mit dem Auto kommen werden, wäre es auch wichtig, .....(6)..... genügend Parkplätze vorhanden sind.\n\nEs wäre .....(7)..... freundlich von Ihnen, wenn Sie mir möglichst bald Bescheid geben könnten, damit ich die Einladungen verschicken .....(8)...... Bitte senden Sie mir einen Prospekt Ihres Hotels .....(9)..... genauer Wegbeschreibung. Sollten Ihre Räume für den Monat Mai .....(10)..... ausgebucht sein, geben Sie mir bitte umgehend Bescheid.\n\nMit freundlichen Grüßen\nBarbara Heuberger`,

  items:[
    {n:1, c:"h", hl:"Gut aussehen mit dem richtigen Essen", de:"Du bist, was du isst, hat als Slogan ausgedient. Heute muss es heißen: Gut aussehen mit dem richtigen Essen. Der Trend kommt aus den USA: Dort kaufen bereits viele Leute neue teure Lebensmittel mit wissenschaftlichen Inhaltsstoffen, die dem Kunden jüngeres und schöneres Aussehen versprechen.", ar:"اتجاه جديد من أمريكا: أطعمة غالية تعد بمظهر أصغر، والناس مستعدون لدفع الكثير.", ma:"ترند جديد من أمريكا: ماكلة غالية كتعطي مظهر صغير، والناس واجدين يخلصو بزاف.", eg:"ترند جديد من أمريكا: أكل غالي بيوعد بمظهر أصغر، والناس مستعدين يدفعوا كتير.", en:"New trend from the USA: expensive foods promise a younger appearance, and people are willing to pay a lot.", fr:"Nouvelle tendance des États-Unis : des aliments chers promettent une apparence plus jeune, et les gens sont prêts à payer cher.", hi:"अमेरिका से नया ट्रेंड: महंगे खाद्य पदार्थ युवा रूप का वादा करते हैं, और लोग बहुत भुगतान करने को तैयार हैं।", tr:"ABD'den yeni trend: pahalı gıdalar daha genç bir görünüm vaat ediyor ve insanlar çok ödemeye razı.", vi:"Xu hướng mới từ Mỹ: thực phẩm đắt tiền hứa hẹn vẻ ngoài trẻ trung, và mọi người sẵn sàng trả nhiều.", uk:"Новий тренд зі США: дорогі продукти обіцяють молодший вигляд, і люди готові платити багато.", es:"Nueva tendencia de EE. UU.: alimentos caros prometen una apariencia más joven, y la gente está dispuesta a pagar mucho.", pt:"Nova tendência dos EUA: alimentos caros prometem uma aparência mais jovem, e as pessoas estão dispostas a pagar muito.", zh:"来自美国的新趋势：昂贵的食物承诺更年轻的外表，人们愿意为此支付大量金钱。", ru:"Новый тренд из США: дорогие продукты обещают более молодой вид, и люди готовы платить много."},
    {n:2, c:"c", hl:"nehmen oft schon in den Flitterwochen einige Kilos zu", de:"Frisch verheiratete Paare nehmen oft schon in den Flitterwochen einige Kilos zu, weil sie ihre Essgewohnheiten ändern. Das belegt eine neue Studie.", ar:"المتزوجون حديثاً يكتسبون وزناً بسبب تغيير عاداتهم الغذائية.", ma:"اللي تزوجو جديد كيزيدو فالوزن حيت كيبدلو عادات الماكلة ديالهم.", eg:"اللي اتجوزوا جديد بيزيدوا وزن بسبب تغيير عادات الأكل.", en:"Newly married couples often gain weight because they change their eating habits.", fr:"Les jeunes mariés prennent souvent du poids parce qu'ils changent leurs habitudes alimentaires.", hi:"नवविवाहित जोड़े अक्सर वजन बढ़ाते हैं क्योंकि वे अपनी खाने की आदतें बदलते हैं।", tr:"Yeni evli çiftler genellikle yeme alışkanlıklarını değiştirdikleri için kilo alırlar.", vi:"Các cặp vợ chồng mới cưới thường tăng cân vì họ thay đổi thói quen ăn uống.", uk:"Молодята часто набирають вагу, оскільки змінюють харчові звички.", es:"Las parejas recién casadas a menudo ganan peso porque cambian sus hábitos alimenticios.", pt:"Casais recém-casados geralmente ganham peso porque mudam seus hábitos alimentares.", zh:"新婚夫妇经常因为改变饮食习惯而增重。", ru:"Молодожены часто набирают вес, так как меняют пищевые привычки."},
    {n:3, c:"e", hl:"Therapiemethoden mit Schokolade", de:"Der Schokolade-Boom zeigt sich hierzulande nicht nur im hohen Verbrauch, er hat nun auch die Schönheitsindustrie erreicht. Vom 16. Januar bis zum 24. Februar bietet das Grand Hotel Bad Ragaz unter dem Namen Choco Therapy zahlreiche kosmetische Behandlungsmethoden mit Schokolade an.", ar:"النص يتكلم عن علاجات تجميل بالشوكولاتة في فندق سويسري.", ma:"النص كيهضر على علاجات ديال الزين بالشوكولا فشي فندق سويسري.", eg:"النص بيتكلم عن علاجات تجميل بالشوكولاتة في فندق سويسري.", en:"The text is about chocolate beauty treatments in a Swiss hotel.", fr:"Le texte parle de soins de beauté au chocolat dans un hôtel suisse.", hi:"पाठ स्विस होटल में चॉकलेट सौंदर्य उपचार के बारे में है।", tr:"Metin, bir İsviçre otelinde çikolatalı güzellik tedavileri hakkında.", vi:"Văn bản nói về các liệu pháp làm đẹp bằng sô-cô-la tại một khách sạn Thụy Sĩ.", uk:"Текст про шоколадні процедури краси в швейцарському готелі.", es:"El texto trata sobre tratamientos de belleza con chocolate en un hotel suizo.", pt:"O texto fala sobre tratamentos de beleza com chocolate em um hotel suíço.", zh:"文本内容是关于瑞士酒店中的巧克力美容护理。", ru:"В тексте речь идет о шоколадных косметических процедурах в швейцарском отеле."},
    {n:4, c:"f", hl:"ausgewogen zu essen und sich täglich zu bewegen", de:"Nach dem Motto „beschwingt und bewegt“ starten die Schweizer Gesundheitsbehörden eine landesweite Bewegungskampagne. Dabei soll die Schweizer Bevölkerung aufgerufen werden, ausgewogen zu essen und sich täglich zu bewegen.", ar:"حملة صحية سويسرية لتشجيع الناس على الرياضة وأكل متوازن.", ma:"حملة صحية سويسرية باش تشجع الناس على الرياضة والماكلة المتوازنة.", eg:"حملة صحية سويسرية لتشجيع الناس على الرياضة والأكل المتوازن.", en:"A Swiss health campaign to encourage people to exercise and eat a balanced diet.", fr:"Une campagne de santé suisse pour encourager les gens à faire du sport et à manger équilibré.", hi:"स्विस स्वास्थ्य अभियान लोगों को व्यायाम और संतुलित आहार के लिए प्रोत्साहित करने के लिए।", tr:"İnsanları egzersiz yapmaya ve dengeli beslenmeye teşvik eden bir İsviçre sağlık kampanyası.", vi:"Chiến dịch y tế Thụy Sĩ khuyến khích mọi người tập thể dục và ăn uống cân bằng.", uk:"Швейцарська кампанія здоров'я заохочує людей до фізичних вправ і збалансованого харчування.", es:"Campaña de salud suiza para animar a la gente a hacer ejercicio y comer de forma equilibrada.", pt:"Campanha de saúde suíça para incentivar as pessoas a se exercitar e comer de forma equilibrada.", zh:"瑞士健康运动，鼓励人们锻炼身体并均衡饮食。", ru:"Швейцарская кампания здоровья призывает людей заниматься спортом и питаться сбалансированно."},
    {n:5, c:"i", hl:"kürzere Lebenserwartung", de:"Wer acht Stunden und länger schläft, hat eine deutlich kürzere Lebenserwartung. Das berichtete das Apothekenmagazin Gesundheit und bezog sich auf eine neue japanische Studie.", ar:"الدراسة اليابانية تقول إن النوم الطويل يقلل العمر، والعنوان الصحيح هو النوم أقل.", ma:"الدراسة اليابانية كتقول بلي النعاس الطويل كينقص العمر، والعنوان الصحيح هو نعس قليل.", eg:"الدراسة اليابانية بتقول إن النوم الطويل بيقلل العمر، والعنوان الصح هو نام أقل.", en:"The Japanese study says that long sleep reduces lifespan, and the correct title is sleep less.", fr:"L'étude japonaise dit que dormir longtemps réduit l'espérance de vie, et le bon titre est dormir moins.", hi:"जापानी अध्ययन कहता है कि लंबी नींद जीवनकाल को कम करती है, और सही शीर्षक है कम सोएं।", tr:"Japon çalışması, uzun uykunun ömrü kısalttığını söylüyor ve doğru başlık daha az uyumak.", vi:"Nghiên cứu Nhật Bản nói rằng ngủ lâu làm giảm tuổi thọ, và tiêu đề đúng là ngủ ít hơn.", uk:"Японське дослідження стверджує, що тривалий сон скорочує тривалість життя, а правильна назва — менше спати.", es:"El estudio japonés dice que dormir mucho reduce la esperanza de vida, y el título correcto es dormir menos.", pt:"O estudo japonês diz que dormir muito reduz a expectativa de vida, e o título correto é dormir menos.", zh:"日本研究表明，睡眠时间长会缩短寿命，正确的标题是少睡觉。", ru:"Японское исследование утверждает, что долгий сон сокращает продолжительность жизни, и правильный заголовок — меньше спать."}
  ]

{ id:"rita-t2", title:"Rita", level:"B1", sub:"Teile 2", type:"mcq",
  paragraphs:[
    {de:"Von Antje Blinda Coz-Ausstoß: null. Geplante Strecke: einmal um die Welt. Endlich wird der Traum von Louis Palmer wahr: Der Schweizer startet mit seinem Auto, das mit Sonnenenergie fährt, zur Weltumrundung. Er will damit zeigen, dass Autofahren auch geht, ohne der Umwelt zu schaden.", ar:"بقلم أنتيي بليندا. انبعاثات ثاني أكسيد الكربون: صفر. المسار المخطط: مرة واحدة حول العالم. أخيراً يتحقق حلم لويس بالمر: يبدأ السويسري رحلته حول العالم بسيارته التي تعمل بالطاقة الشمسية. يريد أن يثبت بذلك أن قيادة السيارة ممكنة أيضاً دون الإضرار بالبيئة.", ma:"بقلم أنتيي بليندا. انبعاثات CO2: صفر. المسار: مرة وحدة حول العالم. أخيراً تحقق الحلم ديال لويس بالمر: السويسري غادي يدور العالم بالطوموبيل ديالو اللي كتمشي بالطاقة الشمسية. بغى يبين بلي السواقة ممكنة بلا ما نضرو بالبيئة.", eg:"بقلم أنتيي بليندا. انبعاثات CO2: صفر. المسار: لفة حوالين العالم. أخيراً حلم لويس بالمر اتحقق: السويسري بيبدأ رحلته حوالين العالم بعربيته اللي بتشتغل بالطاقة الشمسية. عايز يثبت إن السواقة ممكنة من غير ما نأذي البيئة.", en:"By Antje Blinda. CO2 emissions: zero. Planned route: once around the world. Louis Palmer's dream is finally coming true: the Swiss man starts his trip around the world with his solar-powered car. He wants to show that driving is possible without harming the environment.", fr:"Par Antje Blinda. Émissions de CO2 : zéro. Itinéraire prévu : un tour du monde. Le rêve de Louis Palmer se réalise enfin : le Suisse entame son tour du monde avec sa voiture solaire. Il veut prouver qu'on peut conduire sans nuire à l'environnement.", hi:"अंत्जे ब्लिंडा द्वारा। CO2 उत्सर्जन: शून्य। नियोजित मार्ग: दुनिया का एक चक्कर। लुई पामर का सपना आखिरकार सच हो रहा है: स्विस व्यक्ति अपनी सौर ऊर्जा से चलने वाली कार से दुनिया भर की यात्रा शुरू करता है। वह दिखाना चाहता है कि पर्यावरण को नुकसान पहुंचाए बिना गाड़ी चलाना संभव है।", tr:"Antje Blinda tarafından. CO2 emisyonları: sıfır. Planlanan rota: dünya turu. Louis Palmer'ın hayali nihayet gerçekleşiyor: İsviçreli, güneş enerjisiyle çalışan arabasıyla dünya turuna başlıyor. Çevreye zarar vermeden araba sürmenin mümkün olduğunu göstermek istiyor.", vi:"Bởi Antje Blinda. Phát thải CO2: bằng không. Lộ trình dự kiến: vòng quanh thế giới một lần. Giấc mơ của Louis Palmer cuối cùng đã thành hiện thực: người đàn ông Thụy Sĩ bắt đầu chuyến đi vòng quanh thế giới bằng chiếc xe chạy bằng năng lượng mặt trời. Anh ấy muốn chứng minh rằng có thể lái xe mà không gây hại cho môi trường.", uk:"Автор: Антьє Блінда. Викиди CO2: нуль. Запланований маршрут: навколо світу. Мрія Луїса Палмера нарешті здійснюється: швейцарець починає навколосвітню подорож на автомобілі на сонячних батареях. Він хоче показати, що можна їздити, не завдаючи шкоди довкіллю.", es:"Por Antje Blinda. Emisiones de CO2: cero. Ruta prevista: una vuelta al mundo. El sueño de Louis Palmer finalmente se hace realidad: el suizo inicia su viaje alrededor del mundo con su coche solar. Quiere demostrar que se puede conducir sin dañar el medio ambiente.", pt:"Por Antje Blinda. Emissões de CO2: zero. Rota planejada: uma volta ao mundo. O sonho de Louis Palmer finalmente está se tornando realidade: o suíço inicia sua viagem ao redor do mundo com seu carro movido a energia solar. Ele quer mostrar que é possível dirigir sem prejudicar o meio ambiente.", zh:"作者Antje Blinda。CO2排放：零。计划路线：绕地球一圈。Louis Palmer的梦想终于成真：这位瑞士人开始驾驶太阳能汽车环游世界。他想证明，在不损害环境的情况下驾驶是可行的。", ru:"Автор: Антье Блинда. Выбросы CO2: ноль. Запланированный маршрут: вокруг света. Мечта Луиса Палмера наконец сбывается: швейцарец отправляется в кругосветное путешествие на автомобиле на солнечных батареях. Он хочет показать, что можно ездить, не нанося вреда окружающей среде."},
    {de:"Entwickelt für mich ein Fahrzeug für eine Weltreise, die mit Sonnenenergie fährt, forderte Louis Palmer Studenten an Schweizer Universitäten auf. Heute ist das Auto fertig: ein dreirädriges Fahrzeug mit zwei Sitzplätzen.", ar:"\"طوروا لي مركبة لرحلة حول العالم تعمل بالطاقة الشمسية\"، طلب لويس بالمر من طلاب في جامعات سويسرية. اليوم السيارة جاهزة: مركبة بثلاث عجلات ومقعدين.", ma:"\"طورو ليا طوموبيل تدور العالم بالطاقة الشمسية\"، هادشي طلبو لويس بالمر من طلبة فجامعات سويسرية. اليوم السيارة واجدة: مركبة ب3 عجلات وجوج مقاعد.", eg:"\"اعملولي عربية تلف العالم بالطاقة الشمسية\"، ده اللي طلبه لويس بالمر من طلبة في جامعات سويسرية. النهارده العربية جاهزة: عربية بتلات عجلات ومقعدين.", en:"\"Develop a solar-powered vehicle for a trip around the world for me,\" Louis Palmer asked students at Swiss universities. Today the car is finished: a three-wheeled vehicle with two seats.", fr:"\"Développez-moi un véhicule solaire pour un tour du monde\", a demandé Louis Palmer à des étudiants d'universités suisses. Aujourd'hui, la voiture est prête : un véhicule à trois roues avec deux sièges.", hi:"\"मेरे लिए दुनिया भर की यात्रा के लिए सौर ऊर्जा से चलने वाला वाहन विकसित करें,\" लुई पामर ने स्विस विश्वविद्यालयों के छात्रों से कहा। आज कार तैयार है: दो सीटों वाला तीन पहिया वाहन।", tr:"\"Benim için dünya turu yapacak güneş enerjili bir araç geliştirin,\" dedi Louis Palmer İsviçre üniversitelerindeki öğrencilere. Bugün araba hazır: iki koltuklu üç tekerlekli araç.", vi:"\"Hãy phát triển cho tôi một chiếc xe chạy bằng năng lượng mặt trời cho chuyến đi vòng quanh thế giới,\" Louis Palmer yêu cầu sinh viên tại các trường đại học Thụy Sĩ. Hôm nay chiếc xe đã hoàn thành: xe ba bánh với hai chỗ ngồi.", uk:"\"Розробіть мені транспортний засіб на сонячних батареях для навколосвітньої подорожі\", — попросив Луїс Палмер студентів швейцарських університетів. Сьогодні автомобіль готовий: триколісний транспортний засіб з двома сидіннями.", es:"\"Desarrollen para mí un vehículo solar para una vuelta al mundo\", pidió Louis Palmer a estudiantes de universidades suizas. Hoy el coche está terminado: un vehículo de tres ruedas con dos asientos.", pt:"\"Desenvolvam para mim um veículo solar para uma volta ao mundo\", pediu Louis Palmer a estudantes de universidades suíças. Hoje o carro está pronto: um veículo de três rodas com dois assentos.", zh:"“为我开发一辆太阳能汽车，用于环游世界，”Louis Palmer对瑞士大学的学生们说。如今这辆车已经完成：一辆有三个轮子、两个座位的车。", ru:"«Разработайте для меня транспортное средство на солнечных батареях для кругосветного путешествия», — попросил Луис Палмер студентов швейцарских университетов. Сегодня машина готова: трехколесное транспортное средство с двумя сиденьями."},
    {de:"Die ganze Welt wartet auf revolutionäre Erfindungen für ein umweltbewusstes Auto, sagt der Schweizer, ich will darauf aufmerksam machen, dass die technischen Lösungen schon jetzt vorhanden sind.", ar:"\"العالم كله ينتظر اختراعات ثورية لسيارة صديقة للبيئة\"، يقول السويسري، \"أريد أن ألفت الانتباه إلى أن الحلول التقنية موجودة بالفعل الآن\".", ma:"\"العالم ك
