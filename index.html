    text: `Liebe(r).......\n\nIch habe eine tolle Überraschung. stelle dir vor, was mir mein Onkel angeboten hat. Er rief mich am Samstag an. Er hat ein großes Ferienhaus im Schwarzwald. Das Haus kann ich für die Ferien kostenlos haben. Ich kann auch Freunde mitbringen! Wäre das nichts für uns? Wir könnten uns alle dort treffen. Du, deine Eltern und Freunde, und ich mit meiner Familie und meinen Freunden. Ich würde mich wahnsinnig freuen, wenn das klappen würde. Bitte schreibe mir so schnell du kannst, damit wir alles planen können. Urlaub im Schwarzwald - das wird traumhaft schön!\n\nHerzliche Grüße\nPetra`,
    transText: {
      ar: `عزيزي/عزيزتي...\n\nعندي ليك مفاجأة زوينة. تخيل شنو عرض عليا عمي. عيط ليا نهار السبت. عندو دار كبيرة ديال العطلة في الغابة السوداء (Schwarzwald). نقدر ناخد الدار فهاد العطلة. ونقدر نجيب معايا حتى صحابي! واش هادشي ماشي فكرة زوينة لينا؟ نقدر ونتجمعو تما كاملين. أنت، والديك وصحابك، وأنا مع عائلتي وصحابي. غادي نفرح بزاف يلا صدقات هاد القضية. عفاك جاوبني في أقرب وقت باش نقدر وخططو لكشي. عطلة في الغابة السوداء - غتكون رائعة!\n\nتحياتي القلبية\nبيترا`,
      ma: `عزيزي/عزيزتي...\n\nعندي ليك مفاجأة زوينة. تخيل شنو عرض عليا عمي. عيط ليا نهار السبت. عندو دار كبيرة ديال العطلة في الغابة السوداء (Schwarzwald). نقدر ناخد الدار فهاد العطلة. ونقدر نجيب معايا حتى صحابي! واش هادشي ماشي فكرة زوينة لينا؟ نقدر ونتجمعو تما كاملين. أنت، والديك وصحابك، وأنا مع عائلتي وصحابي. غادي نفرح بزاف يلا صدقات هاد القضية. عفاك جاوبني في أقرب وقت باش نقدر وخططو لكشي. عطلة في الغابة السوداء - غتكون رائعة!\n\nتحياتي القلبية\nبيترا`,
      en: `Dear...\n\nI have a great surprise. Imagine what my uncle offered me. He called me on Saturday. He has a big holiday house in the Black Forest. I can have the house for the holidays for free. I can also bring friends! Wouldn't that be something for us? We could all meet there. You, your parents and friends, and me with my family and my friends. I would be incredibly happy if that would work out. Please write to me as soon as you can so that we can plan everything. Vacation in the Black Forest - that will be incredibly beautiful!\n\nBest regards\nPetra`,
      fr: `Cher/Chère...\n\nJ'ai une super surprise. Imagine ce que mon oncle m'a proposé. Il m'a appelé samedi. Il a une grande maison de vacances dans la Forêt-Noire. Je peux avoir la maison pour les vacances gratuitement. Je peux aussi amener des amis ! Ne serait-ce pas quelque chose pour nous ? Nous pourrions tous nous y retrouver. Toi, tes parents et amis, et moi avec ma famille et mes amis. Je serais incroyablement heureux si cela pouvait fonctionner. S'il te plaît, écris-moi dès que tu peux pour que nous puissions tout planifier. Des vacances dans la Forêt-Noire - ce sera incroyablement beau !\n\nCordialement\nPetra`,
      hi: `प्रिय...\n\nमेरे पास एक शानदार आश्चर्य है। सोचो मेरे चाचा ने मुझे क्या पेशकश की। उन्होंने मुझे शनिवार को फोन किया। ब्लैक फॉरेस्ट में उनका छुट्टियों का एक बड़ा घर है। मैं छुट्टियों के लिए घर मुफ्त में ले सकता हूं। मैं दोस्तों को भी ला सकता हूं! क्या यह हमारे लिए कुछ नहीं होगा? हम सब वहां मिल सकते हैं। तुम, तुम्हारे माता-पिता और दोस्त, और मैं अपने परिवार और अपने दोस्तों के साथ। अगर यह काम करेगा तो मैं अविश्वसनीय रूप से खुश होऊंगा। कृपया मुझे जल्द से जल्द लिखें ताकि हम सब कुछ योजना बना सकें। ब्लैक फॉरेस्ट में छुट्टी - यह अविश्वसनीय रूप से सुंदर होगी!\n\nसादर\nपेट्रा`
    },

  {
    id: "sch2", title: "Eva - Traumberuf Und Neuigkeiten", level: "B1",
    text: `Liebe(r).......\n\nwie geht es denn so mit dem Deutsch lernen? Kommst du gut voran, und was machst du im Moment so? Stell dir vor, ich habe die neue Stelle bei der Zeitschrift VIA bekommen! ich arbeite jetzt als Journalistin, und das war ja immer mein Traumberuf!\n\nVIA wird vor allem von jüngeren Leuten gelesen. Deshalb schreiben wir viel über Berufe und Ausbildungen und auch über Freizeit und Sport. Für die nächsten Hefte von VIA planen wir jetzt eine neue Serie über Berufs wünsche. Was ist eigentlich dein Traumberuf? Wenn du möchtest, schicke ich dir gerne einmal ein Gratisheft von VIA, damit du siehst, was ich so mache.\n\nIch freue mich schon auf deine Antwort.\n\nHerzliche Grüße\nEva`,
    transText: {
      ar: `عزيزي/عزيزتي...\n\nكيف تسير الأمور مع تعلم اللغة الألمانية؟ هل تتقدم بشكل جيد، وماذا تفعل في الوقت الحالي؟ تخيل، لقد حصلت على الوظيفة الجديدة في مجلة VIA! أنا أعمل الآن كصحفية، وكان هذا دائماً حلم حياتي!\n\nمجلة VIA يقرأها بشكل أساسي الشباب. لذلك نكتب الكثير عن المهن والتدريبات وأيضاً عن وقت الفراغ والرياضة. للأعداد القادمة من VIA، نخطط الآن لسلسلة جديدة عن المهن المرغوبة. ما هي في الواقع مهنة أحلامك؟ إذا كنت ترغب في ذلك، سأرسل لك بكل سرور عدداً مجانياً من VIA لترى ما أفعله.\n\nأتطلع بالفعل إلى ردك.\n\nتحياتي القلبية\nإيفا`,
      ma: `عزيزي/عزيزتي...\n\nكيفاش دازة معاك القراية ديال الألمانية؟ واصل مزيان؟ وشنو كدير دابا؟ تخيل، خديت الخدمة الجديدة فالمجلة VIA! أنا دابا كنخدم كصحفية، وهادشي كان ديما الحلم ديالي!\n\nالمجلة VIA كيقراها بزاف الشباب. داكشي علاش كنكتبو بزاف على المهن والتكوينات وحتى على وقت الفراغ والرياضة. للأعداد الجاية ديال VIA، كنخطوطو دابا لسلسلة جديدة على المهن اللي كيحلمو بيها الناس. شنو هو الحلم ديالك فالمستقبل؟ يلا بغيتي، نصيفط ليك عدد مجاني من VIA باش تشوف شنو كندير.\n\nكنتسنى فالرد ديالك.\n\nتحياتي\nإيفا`,
      en: `Dear...\n\nhow are things going with learning German? Are you making good progress, and what are you doing at the moment? Imagine, I got the new job at the magazine VIA! I am now working as a journalist, and that was always my dream job!\n\nVIA is read mainly by younger people. That's why we write a lot about professions and training and also about leisure and sports. For the next issues of VIA we are now planning a new series about dream jobs. What is your dream job actually? If you want, I'll gladly send you a free copy of VIA so you can see what I do.\n\nI am already looking forward to your answer.\n\nBest regards\nEva`,
      fr: `Cher/Chère...\n\ncomment se passe l'apprentissage de l'allemand ? Est-ce que tu progresses bien, et qu'est-ce que tu fais en ce moment ? Figure-toi que j'ai obtenu le nouveau poste au magazine VIA ! Je travaille maintenant comme journaliste, et c'était toujours mon métier de rêve !\n\nVIA est surtout lu par les jeunes. C'est pourquoi nous écrivons beaucoup sur les métiers et les formations, mais aussi sur les loisirs et le sport. Pour les prochains numéros de VIA, nous prévoyons maintenant une nouvelle série sur les métiers de rêve. Quel est ton métier de rêve ? Si tu veux, je te donnerai volontiers un numéro gratuit de VIA pour que tu voies ce que je fais.\n\nJe me réjouis déjà de ta réponse.\n\nCordialement\nEva`,
      hi: `प्रिय...\n\nजर्मन सीखना कैसा चल रहा है? क्या आप अच्छी प्रगति कर रहे हैं, और इस समय क्या कर रहे हैं? कल्पना कीजिए, मुझे VIA पत्रिका में नई नौकरी मिल गई! मैं अब एक पत्रकार के रूप में काम कर रहा हूँ, और यह हमेशा मेरा सपनों का काम था!\n\nVIA मुख्य रूप से युवा लोगों द्वारा पढ़ा जाता है। इसलिए हम पेशे और प्रशिक्षण के बारे में बहुत कुछ लिखते हैं और आराम और खेल के बारे में भी। VIA के अगले अंकों के लिए हम अब सपनों की नौकरियों के बारे में एक नई श्रृंखला की योजना बना रहे हैं। वास्तव में आपका सपनों का काम क्या है? यदि आप चाहें, तो मैं आपको VIA की एक मुफ्त प्रति भेजकर खुशी से भेज दूंगा ताकि आप देख सकें कि मैं क्या करता हूं।\n\nमैं पहले से ही आपके जवाब का इंतजार कर रहा हूं।\n\nसादर\nएवा`
    },

      ma: ["(1) التقدم في تعلم الألمانية.", "(2) رد الفعل على وظيفة إيفا الجديدة.", "(3) الجديد عندك.", "(4) مهنة أحلامك."],
      en: ["(1) Progress in learning German.", "(2) React to Eva's new job.", "(3) What's new with you.", "(4) Your dream job."],
      fr: ["(1) Progrès dans l'apprentissage de l'allemand.", "(2) Réagir au nouveau poste d'Eva.", "(3) Quoi de neuf chez vous.", "(4) Votre métier de rêve."],
      hi: ["(1) जर्मन सीखने में प्रगति।", "(2) ईवा की नई नौकरी पर प्रतिक्रिया दें।", "(3) आपके यहाँ क्या नया है।", "(4) आपका सपनों का काम।"]

  {
    id: "sch3", title: "TIKKI TAKKA - Beschwerde", level: "B2",
    text: `Das Party-Abenteuer für Kinder!\nErleben Sie spannende Kinder-Partys mit TIKKI TAKKA!\n\n• Abenteuerliche Spiele und lustige Party-Animation\n• Spaßige Schatzsuchen & spannende Entdeckungsreisen\n• Zauberer, Clowns & Kinderschminken\n• Tolle Party-Pakete für unvergessliche Erlebnisse\nTOLLE AKTIONSPREISE!\n\nAbenteuer TIKKI TAKKA\nBirkenweg 5, 12345 Beispielstadt\nwww.tikki-takka.de\n+49 1234 567890\n\nSie haben bei der Firma Abenteuer TIKKI TAKKA eine Schatzsuche für den Geburtstag Ihres Kindes gebucht. Trotz günstiger Preise war die Geburtstagsfeier nicht so schön wie erwartet und Sie sind nicht damit zufrieden. Schreiben Sie eine Beschwerde und gehen Sie dabei auf die genannten Punkte ein.`,
    transText: {
      ar: `مغامرة الحفلات للأطفال!\nاستمتعوا بحفلات الأطفال المثيرة مع TIKKI TAKKA!\n\n• ألعاب مغامرات وأنشطة حفلات ممتعة\n• بحث عن الكنز ورحلات اكتشاف مثيرة\n• سحرة، مهرجون وتزيين وجه الأطفال\n• باقات حفلات رائعة لتجارب لا تُنسى\nأسعار رائعة!\n\nمغامرة TIKKI TAKKA\nطريق بيركن 5، 12345 مدينة المثال\nwww.tikki-takka.de\n+49 1234 567890\n\nلقد حجزتم في شركة مغامرة TIKKI TAKKA بحثًا عن الكنز بمناسبة عيد ميلاد طفلكم. على الرغم من الأسعار المعقولة، إلا أن حفلة عيد الميلاد لم تكن كما هو متوقع ولم تكونوا راضين عنها. اكتبوا شكوى واذكروا النقاط المذكورة.`,
      ma: `مغامرة الحفلات للدراري!\nاستمتعو بحفلات الدراري المثيرة مع TIKKI TAKKA!\n\n• ألعاب مغامرات وأنشطة حفلات ممتعة\n• بحث على الكنز ورحلات اكتشاف مثيرة\n• سحرة، مهرجين وتزيين وجه الدراري\n• باقات حفلات زوينة لتجارب ما تتنساش\nأثمنة زوينة!\n\nمغامرة TIKKI TAKKA\nطريق بيركن 5، 12345 مدينة المثال\nwww.tikki-takka.de\n+49 1234 567890\n\nحجزتو فشركة مغامرة TIKKI TAKKA بحث على الكنز بمناسبة عيد ميلاد ولدكم. رغم الأثمنة المعقولة، ولكن حفلة عيد الميلاد ما كانتش بحال ما كنتو متوقعين وما كنتوش راضيين عليها. كتبو شكوى وذكرو النقط المذكورة.`,
      en: `The party adventure for children!\nExperience exciting children's parties with TIKKI TAKKA!\n\n• Adventurous games and fun party animation\n• Fun treasure hunts & exciting discovery trips\n• Magicians, clowns & face painting\n• Great party packages for unforgettable experiences\nGREAT PROMOTIONAL PRICES!\n\nAbenteuer TIKKI TAKKA\nBirkenweg 5, 12345 Beispielstadt\nwww.tikki-takka.de\n+49 1234 567890\n\nYou booked a treasure hunt for your child's birthday at the company Abenteuer TIKKI TAKKA. Despite reasonable prices, the birthday party was not as nice as expected and you are not satisfied with it. Write a complaint and address the mentioned points.`,
      fr: `L'aventure de fête pour les enfants !\nVivez des fêtes d'enfants passionnantes avec TIKKI TAKKA !\n\n• Jeux aventureux et animation de fête amusante\n• Chasses au trésor amusantes et voyages de découverte passionnants\n• Magiciens, clowns et maquillage pour enfants\n• Superbes forfaits de fête pour des expériences inoubliables\nSUPER PRIX PROMOTIONNELS !\n\nAbenteuer TIKKI TAKKA\nBirkenweg 5, 12345 Beispielstadt\nwww.tikki-takka.de\n+49 1234 567890\n\nVous avez réservé une chasse au trésor pour l'anniversaire de votre enfant auprès de la société Abenteuer TIKKI TAKKA. Malgré des prix raisonnables, la fête d'anniversaire n'était pas aussi belle que prévu et vous n'en êtes pas satisfait. Rédigez une réclamation et abordez les points mentionnés.`,
      hi: `बच्चों के लिए पार्टी साहसिक कार्य!\nTIKKI TAKKA के साथ रोमांचक बच्चों की पार्टियों का अनुभव करें!\n\n• साहसिक खेल और मजेदार पार्टी एनिमेशन\n• मजेदार खजाने की खोज और रोमांचक खोज यात्राएं\n• जादूगर, जोकर और चेहरे की पेंटिंग\n• अविस्मरणीय अनुभवों के लिए बेहतरीन पार्टी पैकेज\nशानदार प्रोत्साहन मूल्य!\n\nAbenteuer TIKKI TAKKA\nBirkenweg 5, 12345 Beispielstadt\nwww.tikki-takka.de\n+49 1234 567890\n\nआपने कंपनी Abenteuer TIKKI TAKKA में अपने बच्चे के जन्मदिन के लिए खजाने की खोज बुक की है। उचित कीमतों के बावजूद, जन्मदिन की पार्टी उम्मीद के मुताबिक अच्छी नहीं थी और आप इससे संतुष्ट नहीं हैं। एक शिकायत लिखें और उल्लिखित बिंदुओं को संबोधित करें।`
    },

      hi: ["(1) आप किस ऑफर से संतुष्ट नहीं थे?", "(2) समझाएं कि ऑफर ने उत्साह क्यों नहीं दिया।", "(3) सुधार के लिए सुझाव: आपकी राय में TIKKI TAKKA क्या बेहतर कर सकता था?"]

      ma: "أليكس انتقل ل ميونخ قبل جوج سيمانات. ف البداية لقى مشاكل كبار حيت مازال ما عندوش دار. اضطر يسكن ف فندق مدة سيمانة. لحسن الحظ عاونتو زميلة. خبراتو على دور مختلفين. دابا أليكس ساكن ف دار صغيرة ولكن زوينة قريب من وسط المدينة. هو فرحان بالمحيط الجديد ديالو. ف نهاية السيمانة باغي يلعب الكورة مع الزملاء ديالو.",
      en: "Alex moved to Munich two weeks ago. At first he had big problems because he didn't have an apartment yet. He had to stay in a hotel for a week. Fortunately, a colleague helped him. She informed him about various apartments. Now Alex lives in a small but nice apartment near the city center. He is happy about his new surroundings. At the weekend he wants to play football with his colleagues.",
      fr: "Alex a déménagé à Munich il y a deux semaines. Au début, il a eu de gros problèmes parce qu'il n'avait pas encore d'appartement. Il a dû séjourner dans un hôtel pendant une semaine. Heureusement, une collègue l'a aidé. Elle l'a informé de différents appartements. Maintenant, Alex vit dans un petit appartement mais agréable près du centre-ville. Il est content de son nouvel environnement. Le week-end, il veut jouer au football avec ses collègues."

    paragraphs: [
      { de: "Rita ist 34 Jahre alt und arbeitet als Verkäuferin in einem kleinen Geschäft in Köln. Sie wohnt allein in einer Zweizimmerwohnung, die ihr sehr gefällt. Obwohl sie ihre Arbeit mag, träumt sie schon lange von einer Karriere im Marketing.", ar: "ريتا تبلغ 34 عاماً وتعمل بائعة في متجر صغير في كولونيا. تعيش وحدها في شقة بغرفتين تحبها كثيراً. على الرغم من أنها تحب عملها، إلا أنها تحلم منذ فترة طويلة بمهنة في التسويق.", ma: "ريتا عندها 34 عام وكتخدم كبائعة ف حانوت صغير ف كولونيا. كتعيش بوحدها ف دار بجوج بيوت كتحبها بزاف. بالرغم من أنها كتحب الخدمة ديالها، ولكن كتحلم من مدة بمهنة ف التسويق.", en: "Rita is 34 years old and works as a saleswoman in a small shop in Cologne. She lives alone in a two-room apartment that she likes very much. Although she likes her job, she has long dreamed of a career in marketing.", fr: "Rita a 34 ans et travaille comme vendeuse dans un petit magasin à Cologne. Elle vit seule dans un deux-pièces qu'elle aime beaucoup. Bien qu'elle aime son travail, elle rêve depuis longtemps d'une carrière dans le marketing." },

    text: "Rita wohnt .....(1)..... vielen Jahren in Köln. Sie arbeitet als Verkäuferin, aber sie möchte .....(2)..... eine Karriere im Marketing beginnen. Deshalb macht sie .....(3)..... Praktikum in einer Agentur. Sie arbeitet dort zwei Tage pro Woche und lernt jeden Tag etwas Neues. Ihr größter Traum ist es, .....(4)..... eigene Werbeagentur zu leiten. Sie ist sehr motiviert und freut sich .....(5)..... ihre berufliche Zukunft.",
    transText: {
      ar: "تعيش ريتا منذ سنوات عديدة في كولونيا. تعمل بائعة، لكنها تريد بدء مهنة في التسويق. لذلك تقوم بتدريب في وكالة. تعمل هناك يومين في الأسبوع وتتعلم شيئاً جديداً كل يوم. حلمها الأكبر هو إدارة وكالة إعلانات خاصة بها. إنها متحمسة جداً ومتفائلة بمستقبلها المهني.",
      ma: "ريتا كتعيش من بزاف ديال السنين ف كولونيا. كتخدم بائعة، ولكن باغية تبدا مهنة ف التسويق. داكشي علاش كتدير تدريب ف وكالة. كتخدم تما جوج أيام ف السيمانة وكتتعلم شي حاجة جديدة كل يوم. أكبر حلم ديالها هو أنها تدير وكالة إعلانات ديالها. هي متحمسة بزاف وفرحانة بالمستقبل المهني ديالها.",
      en: "Rita has lived in Cologne for many years. She works as a saleswoman, but she wants to start a career in marketing. That's why she is doing an internship at an agency. She works there two days a week and learns something new every day. Her greatest dream is to run her own advertising agency. She is very motivated and happy about her professional future.",
      fr: "Rita vit à Cologne depuis de nombreuses années. Elle travaille comme vendeuse, mais elle souhaite commencer une carrière dans le marketing. C'est pourquoi elle fait un stage dans une agence. Elle y travaille deux jours par semaine et apprend quelque chose de nouveau chaque jour. Son plus grand rêve est de diriger sa propre agence de publicité. Elle est très motivée et se réjouit de son avenir professionnel."
    },

      { n: 1, c: "seit", opts: ["seit", "vor", "für"], exp: "'seit' + Dativ للتعبير عن مدة مستمرة حتى الآن (تعيش منذ سنوات)." },

      { de: "Caroline ist 42 Jahre alt und arbeitet als Lehrerin an einer Grundschule in Stuttgart. Sie ist verheiratet und hat zwei Kinder, einen Sohn und eine Tochter. Die Familie wohnt in einem kleinen Haus am Stadtrand mit einem großen Garten.", ar: "كارولين تبلغ 42 عاماً وتعمل معلمة في مدرسة ابتدائية في شتوتغارت. هي متزوجة ولديها طفلان، ابن وابنة. تعيش العائلة في منزل صغير على أطراف المدينة مع حديقة كبيرة.", ma: "كارولين عندها 42 عام وكتخدم أستاذة ف مدرسة ابتدائية ف شتوتغارت. هي متزوجة وعندها جوج ولاد، ولد وبنت. العائلة كتعيش ف دار صغيرة ف حدود المدينة مع جنان كبير.", en: "Caroline is 42 years old and works as a teacher at a primary school in Stuttgart. She is married and has two children, a son and a daughter. The family lives in a small house on the outskirts of the city with a large garden.", fr: "Caroline a 42 ans et travaille comme enseignante dans une école primaire à Stuttgart. Elle est mariée et a deux enfants, un fils et une fille. La famille vit dans une petite maison en périphérie de la ville avec un grand jardin." },

// ============================================================
// AutoTrans — ترجمة تلقائية عبر Google Translate API
// ============================================================
const globalTransCache = {};

function AutoTrans({ text, lang, force = false }) {
  const [translated, setTranslated] = useState(text);
  
  useEffect(() => {
    if (!text) return;
    if (!force && ['ar', 'ma', 'en', 'fr', 'de'].includes(lang)) {
      setTranslated(text);
      return;
    }
    
    const cacheKey = `${lang}_${text}`;
    if (globalTransCache[cacheKey]) {
      setTranslated(globalTransCache[cacheKey]);
      return;
    }

    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data[0]) {
          const result = data[0].map(item => item[0]).join('');
          globalTransCache[cacheKey] = result;
          setTranslated(result);
        }
      })
      .catch(() => setTranslated(text));
  }, [text, lang, force]);

  return <span>{translated}</span>;
}

// ============================================================
// SmartTrans — ترجمة ذكية: كيستعمل الترجمة اليدوية يلا كانت، وإلا كيدير AutoTrans
// ============================================================
function SmartTrans({ obj, lang }) {
  if (!obj) return "";
  const textDe = obj.de || obj.en || (obj.q ? obj.q : "") || (typeof obj === 'string' ? obj : "");
  
  if (typeof obj === 'object' && obj[lang]) {
    return <span>{obj[lang]}</span>;
  }
  
  if (['ar', 'ma', 'en', 'fr'].includes(lang)) {
    return <span>{typeof obj === 'object' ? (obj[lang] || obj['en'] || obj['ar'] || textDe) : textDe}</span>;
  }

  return <AutoTrans text={textDe} lang={lang} />;
}

      setIsPlaying(false);
      return;
    }
    window.speechSynthesis.cancel();
    let currentIndex = 0;

    const playNext = () => {
      if (currentIndex >= segments.length) {
        setIsPlaying(false);
        clearInterval(audioInterval.current);
        return;
      }
      const segment = segments[currentIndex];
      const utterance = new SpeechSynthesisUtterance(segment.text);

      utterance.pitch = segment.pitch || 1;
      utterance.rate = segment.rate || 1;
      utterance.onend = () => {
        currentIndex++;
        setTimeout(playNext, 500);
      };
      utterance.onerror = () => {

        clearInterval(audioInterval.current);
      };
      window.speechSynthesis.speak(utterance);
    };
    playNext();

          }
          
          return (
            <div key={it.n} style={{ display: "flex", alignItems: "center", borderBottom: "1px solid var(--line)", padding: "12px 0", background: rowBg }}>
              <div style={{ width: 60, display: "flex", justifyContent: "center" }}>
                <div className={rClass} onClick={() => pickHoren(it.n, "R")}></div>
              </div>
              <div style={{ width: 60, display: "flex", justifyContent: "center" }}>
                <div className={fClass} onClick={() => pickHoren(it.n, "F")}></div>
              </div>
              <div style={{ flex: 1, fontSize: "0.95em", lineHeight: 1.6, paddingRight: 10 }}>
                <span style={{ opacity: 0.5, marginLeft: 8, fontWeight: 900 }}>{it.n}</span>
                <span className="de">{it.de}</span>
                {showTranslation && (
                  <div style={{ marginTop: 8, fontSize: "0.85em", color: "var(--muted)", direction: userLang === 'hi' ? 'ltr' : "rtl", textAlign: userLang === 'hi' ? 'left' : "right" }}>
                    <SmartTrans obj={it} lang={userLang} />
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={() => setShowStory(!showStory)} style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--blue)", fontWeight: 800, background: "rgba(37, 99, 235, 0.1)", padding: "10px 16px", borderRadius: 12 }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          {t("story_memo", userLang)}
        </button>
        <div style={{ display: "flex", gap: 10 }}>
          {!done ? (
            <button onClick={() => setDone(true)} style={{ background: "#22C55E", color: "#FFF", padding: "10px 24px", borderRadius: 12, fontWeight: 900, boxShadow: "0 6px 15px rgba(34,197,94,0.3)" }}>{t("check_btn", userLang)}</button>
          ) : (
            <div style={{ fontWeight: 900, color: score === total ? "var(--okc)" : "var(--red)", display: "flex", alignItems: "center", fontSize: "1.1em" }}>{score} / {total}</div>
          )}
        </div>
      </div>
      {showStory && (
        <div className="t2-ar" style={{ marginTop: 16 }}>
          {userLang === 'ar' || userLang === 'ma' ? exam.items[0].story : (
            <AutoTrans text={exam.items[0].story} lang={userLang} force={true} />
          )}
        </div>
      )}
    </div>
  );
}

// ============================================================
// HorenGateway — بوابة الدخول لدروس الاستماع
// ============================================================
function HorenGateway({ onStart, userLang }) {
  return (
    <div style={{ paddingBottom: 100 }}>
      <h1 className="de" style={{ fontSize: "2.6em", fontWeight: 900, margin: "4px 0 14px", textAlign: "center" }}>Hören</h1>
      <div className="horen-gateway-card">
        <div className="horen-gateway-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
        </div>
        <h2 style={{ fontSize: "1.5em", fontWeight: 900, margin: 0 }}>{t("listen_title", userLang)}</h2>
        <p style={{ color: "var(--muted)", fontSize: "1em", margin: 0, lineHeight: 1.6 }}>
          {t("listen_desc", userLang)}
        </p>
        <button className="horen-start-btn" onClick={onStart}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 3l14 9-14 9V3z"/></svg>
          {t("start_now", userLang)}
        </button>
      </div>
    </div>
  );
}
// ============================================================
// ExamView — عرض الامتحان (Lesen + Horen + Matching + Sprach)
// ✅ يحتوي على: زر التصحيح الأزرق، Matching الجديد، التوضيح 💡
// ============================================================
function ExamView({ exam, onBack, onNext, dark, setDark, onSave, userLang, timeLeft, setTimeLeft }) {
  const [ans, setAns] = useState({});
  const [done, setDone] = useState(null);
  const [modalGap, setModalGap] = useState(null);
  const [activeGap, setActiveGap] = useState(null);
  const [activeMatchingQ, setActiveMatchingQ] = useState(null); // ✅ Matching
  const [showTranslation, setShowTranslation] = useState(false);
  const [excluded, setExcluded] = useState({});
  const [scrollProgress, setScrollProgress] = useState(0);
  const [mode, setMode] = useState("exam");

  useEffect(() => {
    const handleScroll = () => {
      const currentScrollY = window.scrollY;
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (totalScroll > 0) setScrollProgress((currentScrollY / totalScroll) * 100);
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const pts = exam.type === "matching" ? 2.5 : (exam.type.includes("sprach") ? 1.5 : 5);
  const total = exam.items.length * pts;
  const score = exam.items.filter(it => ans[it.n] === it.c).length * pts;

  const usedElsewhere = (n, k) => {
    if ((exam.type !== "matching" && exam.type !== "headings") || k === "X") return false;
    return Object.entries(ans).some(([id, v]) => Number(id) !== n && v === k);
  };

  // ✅ Matching helpers
  const clearMatch = (qNumber) => {
    const newAns = { ...ans };
    delete newAns[qNumber];
    setAns(newAns);
  };

  const pickMatch = (qNumber, adKey) => {
    if (done !== null) return;
    const newAns = { ...ans };
    Object.keys(newAns).forEach(key => {
      if (newAns[key] === adKey) delete newAns[key];
    });
    newAns[qNumber] = adKey;
    setAns(newAns);
    const nextQ = exam.items.find(x => newAns[x.n] === undefined);
    setActiveMatchingQ(nextQ ? nextQ.n : null);
  };

  const pick = (it, k) => {
    if (done !== null) return;
    if (usedElsewhere(it.n, k)) return;
    if (ans[it.n] === k) {
      const newAns = { ...ans };
      delete newAns[it.n];
      setAns(newAns);
    } else {
      setAns({ ...ans, [it.n]: k });
    }
    if (modalGap) setModalGap(null);
  };

  const pickSprach2 = (w) => {
    if (done !== null) return;
    const target = activeGap !== null ? activeGap : (exam.items.find(x => ans[x.n] === undefined) || {}).n;
    if (!target) return;
    if (usedElsewhere(target, w)) return;
    const newAns = { ...ans, [target]: w };
    Object.keys(newAns).forEach(key => { if (Number(key) !== target && newAns[key] === w) delete newAns[key]; });
    setAns(newAns);
    const next = exam.items.find(x => x.n !== target && newAns[x.n] === undefined);
    setActiveGap(next ? next.n : null);
  };

  const cls = (it, k) => {
    const sel = ans[it.n];
    const isDone = done !== null || (mode === "practice" && sel !== undefined);
    if (isDone) {
      if (k === it.c) return "opt good";
      if (sel === k) return "opt bad";
      return "opt faded";
    }
    if (mode === "exam") {
      if (sel === k) return "opt sel";
      return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
    }
    if (sel === undefined) return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
    return "opt" + (usedElsewhere(it.n, k) ? " dis" : "");
  };

  const finish = () => { setDone(score); onSave(exam.id, score, total); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const reset = () => { setAns({}); setDone(null); setShowTranslation(false); setExcluded({}); setActiveMatchingQ(null); window.scrollTo(0, 0); };

  const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  return (
    <div style={{ paddingBottom: 120 }}>
      <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: 4, zIndex: 100, backgroundImage: "linear-gradient(to right, #111 33.33%, #DD0000 33.33%, #DD0000 66.66%, #FFCE00 66.66%)", backgroundSize: `${scrollProgress}% 100%`, backgroundRepeat: "no-repeat" }} />

      <div style={{ position: "sticky", top: 0, zIndex: 30, background: "var(--paper)", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 16px", boxShadow: "0 4px 15px rgba(0,0,0,0.05)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={onBack} className="btnI" style={{ width: 36, height: 36 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div>
            <div className="de" style={{ fontWeight: 900, fontSize: "1em", lineHeight: 1.2 }}>{exam.title}</div>
            <div className="de" style={{ fontSize: ".7em", color: "var(--muted)", fontWeight: "bold" }}>{exam.type === "horen" ? "HÖREN" : "LESEN"} · {exam.sub.toUpperCase()}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
           <div className="timer-badge" style={{ padding: '4px 10px', fontSize: '14px' }}>
             ⏱️ {formatTime(timeLeft)}
           </div>
           <button onClick={() => setShowTranslation(!showTranslation)} className="btnI" style={{ width: 40, height: 40, color: showTranslation ? "var(--blue)" : "var(--text)", borderColor: showTranslation ? "var(--blue)" : "var(--line)" }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 5h12M9 3v2c0 4.418-2.686 8-6 8m0-8h12m-6 0v2c0 4.418 2.686 8 6 8m-4-2l-4 8m2-4h4m-2 0l2 4"/></svg>
           </button>
           <button onClick={() => setDark(!dark)} className="btnI" style={{ width: 36, height: 36 }}>
            {dark ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}
           </button>
        </div>
      </div>

      <div style={{ margin: "10px 12px" }}>
        {exam.type !== "matching" && exam.type !== "horen" && (
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            <button className={"modeBtn " + (mode === "exam" ? "on" : "")} onClick={() => { setMode("exam"); reset(); }}>🎯 {t("exam_mode", userLang)}</button>
            <button className={"modeBtn " + (mode === "practice" ? "on" : "")} onClick={() => { setMode("practice"); reset(); }}>📚 {t("practice_mode", userLang)}</button>
          </div>
        )}

        {exam.type === "horen" && (
          <HorenCard exam={exam} userLang={userLang} showTranslation={showTranslation} />
        )}

        {exam.type === "mcq" && exam.paragraphs && exam.paragraphs.length > 0 && (
          <div className="card" style={{ padding: 20 }}>
            {exam.paragraphs.map((p, i) => (
              <div key={i} style={{ marginBottom: 16 }}>
                <p className="de" style={{ lineHeight: 1.8, fontSize: "1.05em", margin: 0 }}>{p.de}</p>
                {showTranslation && <div className="t2-ar"><SmartTrans obj={p} lang={userLang} /></div>}
              </div>
            ))}
          </div>
        )}

        {(exam.type === "sprach1" || exam.type === "sprach2") && (
          <div className="card" style={{ fontSize: "1.1em", lineHeight: 2.2, padding: 20 }}>
            {exam.text.split(/\.{3,}\s*\((\d+)\)\s*\.{3,}/g).map((part, i) => {
              if (i % 2 === 1) {
                const gapNum = parseInt(part);
                const it = exam.items.find(x => x.n === gapNum);
                const sel = ans[gapNum];
                const isDone = done !== null;
                
                let content = <span className="inline-gap" onClick={() => { if(!isDone) { exam.type === "sprach2" ? setActiveGap(gapNum) : setModalGap(gapNum); } }}>{sel || `(${gapNum})`}</span>;
                if (isDone) {
                  if (sel === it.c) content = <span className="sp1-correct">{sel}</span>;
                  else if (sel) content = <span style={{display:'inline-flex', gap:4}}><span className="sp1-wrong">{sel}</span><span className="sp1-correct">{it.c}</span></span>;
                  else content = <span className="sp1-correct">{it.c}</span>;
                }
                return <React.Fragment key={i}>{content}</React.Fragment>;
              }
              return <span key={i} className="de" style={{ whiteSpace: "pre-wrap" }}>{part}</span>;
            })}
            {showTranslation && (
              <div className="t2-ar" style={{ marginTop: 20 }}>
                {exam.transText ? <SmartTrans obj={exam.transText} lang={userLang} /> : <AutoTrans text={exam.text.replace(/\.{3,}\s*\(\d+\)\s*\.{3,}/g, " ___ ")} lang={userLang} force={true} />}
              </div>
            )}
          </div>
        )}

        {/* ✅ Matching الجديد */}
        {exam.type === "matching" && exam.ads && (
          <div>
            <div className="card" style={{ padding: 20 }}>
              <h3 className="de" style={{ fontSize: "1.2em", fontWeight: 900, marginBottom: 16 }}>SITUATIONEN</h3>
              {exam.items.map((it) => {
                const isMatched = ans[it.n];
                const isActive = activeMatchingQ === it.n;
                return (
                  <div key={it.n}
                    onClick={() => setActiveMatchingQ(isActive ? null : it.n)}
                    style={{
                      display: "flex", gap: 12, alignItems: "center",
                      padding: 12, marginBottom: 8, borderRadius: 12,
                      background: isActive ? "rgba(37, 99, 235, 0.1)" : "var(--paper)",
                      border: isActive ? "2px solid var(--blue)" : "2px solid transparent",
                      cursor: "pointer", transition: "all 0.2s"
                    }}>
                    <div style={{
                      width: 32, height: 32, borderRadius: "50%",
                      background: isActive ? "var(--blue)" : "var(--line)",
                      color: isActive ? "#FFF" : "var(--text)",
                      display: "flex", justifyContent: "center", alignItems: "center", fontWeight: 900, flexShrink: 0
                    }}>{it.n}</div>
                    <div style={{ flex: 1 }}>
                      <div className="de" style={{ fontSize: "1.05em", fontWeight: 600 }}>{it.de}</div>
                      {showTranslation && (
                        <div style={{ marginTop: 4, fontSize: "0.85em", color: "var(--muted)" }}>
                          <SmartTrans obj={it} lang={userLang} />
                        </div>
                      )}
                    </div>
                    {isMatched && (
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--okbg)", color: "var(--okc)", display: "flex", justifyContent: "center", alignItems: "center", fontWeight: 900, border: "1px solid var(--okc)" }}>{isMatched}</div>
                        <button onClick={(e) => { e.stopPropagation(); clearMatch(it.n); }} style={{ background: "transparent", border: "none", fontSize: "1.2em", color: "var(--red)", cursor: "pointer", padding: 4 }}>✕</button>
                      </div>
                    )}
                  </div>
                )
              })}
            </div>
            <div className="card" style={{ padding: 20 }}>
              <h3 className="de" style={{ fontSize: "1.2em", fontWeight: 900, marginBottom: 16 }}>ANZEIGEN</h3>
              {exam.ads.map((ad) => {
                const isUsed = Object.values(ans).includes(ad.k);
                return (
                  <div key={ad.k}
                    onClick={() => { if (!activeMatchingQ) return; pickMatch(activeMatchingQ, ad.k); }}
                    style={{
                      padding: 16, marginBottom: 12, borderRadius: 12,
                      background: isUsed ? "var(--okbg)" : "var(--paper)",
                      border: "1px solid var(--line)", opacity: isUsed ? 0.7 : 1,
                      cursor: activeMatchingQ ? "pointer" : "default", transition: "all 0.2s"
                    }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
                      <div style={{ background: "var(--blue)", color: "#FFF", padding: "4px 12px", borderRadius: 8, fontWeight: 900 }}>{ad.k}</div>
                      <div className="de" style={{ fontWeight: 900 }}>{ad.t}</div>
                    </div>
                    <div className="de" style={{ fontSize: "0.95em", color: "var(--muted)", whiteSpace: "pre-wrap" }}>{ad.de}</div>
                    {showTranslation && (
                      <div style={{ marginTop: 8, fontSize: "0.85em", color: "var(--muted)", borderTop: "1px dashed var(--line)", paddingTop: 8 }}>
                        <SmartTrans obj={ad} lang={userLang} />
                      </div>
                    )}
                  </div>
                )
              })}
            </div>
          </div>
        )}

        {(exam.type === "headings" || exam.type === "mcq") && exam.items && exam.items.map((it, idx) => {
          const sel = ans[it.n];
          const isDone = done !== null || (mode === "practice" && sel !== undefined);
          const options = exam.type === "headings" ? (exam.options || []) : (it.opts || []);
          return (
            <div key={it.n} className="card" style={{ padding: 16 }}>
              <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                <div className="letter" style={{ width: 36, height: 36, fontSize: "1.1em", boxShadow: "0 2px 5px rgba(0,0,0,0.1)" }}>{idx + 1}</div>
                <div style={{ flex: 1 }}>
                  {exam.type === "headings" && (
                    <div style={{ lineHeight: 1.6, fontSize: "1.05em" }}>
                      <div className="de">{it.de}</div>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={it} lang={userLang} /></div>}
                    </div>
                  )}
                  {exam.type === "mcq" && (
                    <div>
                      <p className="de" style={{ fontWeight: 900, margin: 0, fontSize: "1.05em" }}>{it.q}</p>
                      {showTranslation && <div style={{ marginTop: 8, color: "var(--muted)", fontSize: "0.9em", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={{de: it.q}} lang={userLang} /></div>}
                    </div>
                  )}
                </div>
              </div>
              {options.map(o => (
                <button key={o.k} className={cls(it, o.k)} onClick={() => pick(it, o.k)} disabled={isDone} style={{ padding: 14 }}>
                  <div className="letter" style={{ width: 28, height: 28, fontSize: "0.9em" }}>{o.k}</div>
                  <div className="de" style={{ flex: 1, textAlign: "left" }}>
                    {o.de}
                    {showTranslation && <div style={{ marginTop: 6, fontSize: "0.85em", color: "var(--muted)", direction: userLang === 'hi' ? 'ltr' : 'rtl', textAlign: userLang === 'hi' ? 'left' : 'right' }}><SmartTrans obj={o} lang={userLang} /></div>}
                  </div>
                </button>
              ))}
              {isDone && mode === "practice" && (
                <div className={sel === it.c ? "fb good" : "fb bad"} style={{ marginTop: 12, padding: 14, fontSize: "0.95em", borderRadius: 12 }}>
                  <b>{sel === it.c ? t("correct", userLang) : (sel ? t("wrong", userLang) : t("no_answer", userLang))}</b>
                  {sel !== it.c && <span style={{fontWeight:900}}> — {t("the_answer", userLang)}: {it.c}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ✅ Modal Sprach 1 مع التوضيح 💡 */}
      {modalGap !== null && exam.type === "sprach1" && (() => {
        const gapItem = exam.items.find(x => x.n === modalGap);
        if (!gapItem) return null;
        return (
          <div className="overlay" onClick={() => setModalGap(null)}>
            <div className="sheet" onClick={e => e.stopPropagation()}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20}}>
                <h3 style={{margin:0, fontSize:"1.3em", fontWeight: 900}}>{t("gap_num", userLang)} ({modalGap})</h3>
                <button className="btnI" onClick={() => setModalGap(null)}>✕</button>
              </div>
              <div className="modal-list" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {(gapItem.opts || []).map((opt, i) => (
                  <button key={i} className={"btn ghost"} style={{ textAlign: 'left', direction: 'ltr', borderColor: ans[modalGap] === opt ? "var(--blue)" : "var(--line)", background: ans[modalGap] === opt ? "rgba(37,99,235,0.1)" : "var(--card)", color: ans[modalGap] === opt ? "var(--blue)" : "var(--text)" }} onClick={() => pick(gapItem, opt)}>
                    <span style={{ opacity: 0.5, fontWeight: 900, marginRight: 12 }}>{String.fromCharCode(65 + i)}</span>
                    <span className="de" style={{fontSize:"1.05em", flex: 1}}>{opt}</span>
                    {ans[modalGap] === opt && <span style={{ color: "var(--blue)", fontSize:"1.2em" }}>✓</span>}
                  </button>
                ))}
              </div>
              {/* ✅ التوضيح 💡 */}
              {gapItem.exp && (
                <div className="t2-ar" style={{marginTop: 20, fontSize: "0.95em"}}>
                  💡 {gapItem.exp}
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Modal Sprach 2 */}
      {activeGap !== null && exam.type === "sprach2" && (
         <div className="overlay" onClick={() => setActiveGap(null)}>
           <div className="sheet" onClick={e => e.stopPropagation()}>
             <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20}}>
               <h3 style={{margin:0, fontSize:"1.3em", fontWeight: 900}}>{t("choose_word_gap", userLang)} ({activeGap})</h3>
               <button className="btnI" onClick={() => setActiveGap(null)}>✕</button>
             </div>
             <div className="word-bank" style={{marginBottom:0, gridTemplateColumns: "1fr"}}>
               {(exam.wordBank || []).map(w => {
                 const isUsed = Object.values(ans).includes(w.w) && ans[activeGap] !== w.w;
                 return (
                   <button key={w.k} className={"word-btn" + (isUsed ? " used" : "")} onClick={() => pickSprach2(w.w)} style={{ padding: "14px", borderColor: ans[activeGap] === w.w ? "var(--blue)" : "var(--line)", background: ans[activeGap] === w.w ? "rgba(37,99,235,0.1)" : "var(--card)", color: ans[activeGap] === w.w ? "var(--blue)" : "var(--text)" }}>
                     <span style={{ opacity: 0.5, marginRight: 10, fontWeight: 900, fontSize:"0.9em" }}>{w.k}</span> <span style={{fontSize:"1.05em"}}>{w.w}</span>
                   </button>
                 )
               })}
             </div>
           </div>
         </div>
      )}

      {/* ✅ Bottom Bar — زر التصحيح الأزرق */}
      <div className="bottom-bar">
        <button onClick={done !== null ? reset : finish} className="btn-prev-bar">
          {done !== null ? t("reset_btn", userLang) : t("check_btn", userLang)}
        </button>
        <button onClick={() => done !== null ? onBack() : onNext()} className="btn-correct-bar">
          {done !== null ? t("back_btn", userLang) : t("next_btn", userLang)}
        </button>
        <button className="btn-next-bar" onClick={done !== null ? onBack : onNext}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
    </div>
  );
}

function SchreibenView({ userLang, dark, setDark, isPaid, isAdmin, trialActive }) {
  const [selected, setSelected] = useState(null);
  const [showTransText, setShowTransText] = useState(false);
  const [showTransTask, setShowTransTask] = useState(false);
  const [userText, setUserText] = useState("");
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeStep, setAnalyzeStep] = useState(0);
  const [result, setResult] = useState(null);
  const [timeLeft, setTimeLeft] = useState(30 * 60);
  const [searchQuery, setSearchQuery] = useState("");

  useEffect(() => {
    let timer;
    if (selected && !result && timeLeft > 0) {
      timer = setInterval(() => { setTimeLeft(prev => prev - 1); }, 1000);
    }
    return () => clearInterval(timer);
  }, [selected, result, timeLeft]);

  const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  const wordCount = userText.trim() === "" ? 0 : userText.trim().split(/\s+/).length;
  const insertChar = (char) => setUserText(prev => prev + char);

  const checkWithAI = () => {
    if (!userText.trim()) return;
    setIsAnalyzing(true);
    setAnalyzeStep(1);
    setResult(null);
    let currentStep = 1;
    const interval = setInterval(() => {
      currentStep++;
      setAnalyzeStep(currentStep);
      if (currentStep > 4) {
        clearInterval(interval);
        finishAnalysis();
      }
    }, 800);
  };

  const finishAnalysis = () => {
    const cleanText = userText.replace(/[^a-zA-ZäöüÄÖÜß\s]/g, '').trim();
    const words = cleanText.split(/\s+/).filter(w => w.length > 0);
    const isGibberish = words.length < 10 || /(.)\1{3,}/.test(userText) || cleanText.length < 15;

    if (isGibberish) {
      setResult({
        score: 0, maxScore: 45, contentScore: "0/5",
        generalEval: userLang === 'hi' ? "नमस्ते, पाठ की सामग्री खाली है और यह वह नहीं है जो आवश्यक है।" : "سلام كَشْ بو، فمحتوى الرسالة خالي من المعلومات وهاداشي ماشي هو المطلوب. خصك تكتب رد حقيقي فيه كلمات ألمانية مفهومة.",
        contentFeedback: userLang === 'hi' ? "आपने कार्य के किसी भी बिंदु का उल्लेख नहीं किया।" : "ما ذكرت حتى نقطة من النقط المطلوبة فالمهمة. ما كاينش محتوى مقروء.",
        errors: []
      });
    } else {
      setResult({
        score: 35, maxScore: 45, contentScore: "4/5",
        generalEval: userLang === 'hi' ? "अच्छा प्रयास! आपने अधिकांश आवश्यक बिंदुओं का उत्तर दिया है।" : "مجهود جيد! لقد أجبت على معظم النقاط المطلوبة، ولكن هناك بعض الأخطاء اللغوية البسيطة.",
        contentFeedback: userLang === 'hi' ? "आपने कार्य में अधिकांश आवश्यक बिंदुओं का उल्लेख किया है।" : "لقد ذكرت أغلب النقاط المطلوبة في المهمة.",
        errors: [{ error: "Ich habe gehen", fix: "Ich bin gegangen", type: userLang === 'hi' ? "व्याकरण (Grammatik)" : "قواعد (Grammatik)" }]
      });
    }
    setIsAnalyzing(false);
  };

  // ✅ فتح درس Schreiben — مع دعم Premium
  const openLesson = async (item) => {
    if (item.isPremium) {
      const hasAccess = isPaid || isAdmin || trialActive;
      if (!hasAccess) {
        wa(t("wa_upgrade_msg", userLang) + " - " + item.title);
        return;
      }
      // محاولة جلب المحتوى من Supabase

      if (error || !data) {

  const filteredLessons = SCHREIBEN_DATA.filter(item =>

function NotificationsBell({ userLang }) {
  const [notifs, setNotifs] = useState([]);
  const [open, setOpen] = useState(false);
  const [seen, setSeen] = useState(() => {
    try { return JSON.parse(localStorage.getItem('ep_seen_notifs') || '[]'); } catch { return []; }
  });

  useEffect(() => {
    const load = () => {
      sb.from('notifications').select('*').eq('is_active', true)
        .order('created_at', { ascending: false })
        .then(({ data }) => { if (data) setNotifs(data); });
    };
    load();
    const interval = setInterval(load, 60000);
    return () => clearInterval(interval);
  }, []);

  const unread = notifs.filter(n => !seen.includes(n.id)).length;

  const toggle = () => {
    const next = !open;
    setOpen(next);
    if (next && unread > 0) {
      setTimeout(() => {
        const ids = notifs.map(n => n.id);
        localStorage.setItem('ep_seen_notifs', JSON.stringify(ids));
        setSeen(ids);
      }, 1500);
    }
  };

  const isRTL = ['ar', 'ma', 'fa'].includes(userLang);

  return (
    <div style={{ position: 'relative' }}>
      <button onClick={toggle} className="btnI" style={{ position: 'relative' }}>
        🔔
        {unread > 0 && (
          <span style={{
            position: 'absolute', top: -4, right: -4, background: 'var(--red)',
            color: '#FFF', borderRadius: '50%', minWidth: 18, height: 18,
            fontSize: 11, display: 'flex', alignItems: 'center',
            justifyContent: 'center', fontWeight: 900, padding: '0 4px'
          }}>{unread}</span>
        )}
      </button>

      {open && (
        <>
          <div style={{ position: 'fixed', inset: 0, zIndex: 999 }} onClick={() => setOpen(false)} />
          <div style={{
            position: 'absolute', top: 48, right: 0, width: 320, maxHeight: 420,
            overflowY: 'auto', background: 'var(--paper)', borderRadius: 16,
            padding: 14, zIndex: 1000, border: '1px solid var(--line)',
            boxShadow: '0 10px 40px rgba(0,0,0,0.25)',
            direction: isRTL ? 'rtl' : 'ltr'
          }}>
            <div style={{ fontWeight: 900, fontSize: '1.05em', marginBottom: 12, color: 'var(--blue)' }}>
              📬 {t('notifications', userLang)}
            </div>
            {notifs.length === 0 ? (
              <p style={{ opacity: 0.6, fontSize: '0.9em', textAlign: 'center', padding: 20 }}>
                {t('no_notifications', userLang)}
              </p>
            ) : notifs.map(n => (
              <div key={n.id} style={{
                padding: 10, marginBottom: 8, borderRadius: 10,
                background: seen.includes(n.id) ? 'var(--card)' : 'rgba(37,99,235,0.08)',
                borderLeft: seen.includes(n.id) ? 'none' : '3px solid var(--blue)'
              }}>
                <div style={{ fontWeight: 900, fontSize: '0.95em', marginBottom: 4 }}>{n.title}</div>
                <div style={{ fontSize: '0.85em', lineHeight: 1.6, color: 'var(--muted)' }}>{n.message}</div>
                <div style={{ fontSize: '0.7em', opacity: 0.5, marginTop: 6 }}>
                  {new Date(n.created_at).toLocaleString()}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}
