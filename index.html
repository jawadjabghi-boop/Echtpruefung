    fr:"Ahmed fait presque tout seul dans le ménage (im Haushalt fast alles alleine), mais maintenant il a décidé de partager le travail avec sa partenaire (mit seiner Partnerin die Arbeit) pour que tout ne repose pas sur lui.",
    hi:"अहमद घर में लगभग सब कुछ अकेले करता है (im Haushalt fast alles alleine), लेकिन अब उसने अपनी साथी के साथ काम बांटने का फैसला किया है (mit seiner Partnerin die Arbeit) ताकि सब कुछ उस पर न पड़े।",
    tr:"Ahmed evde neredeyse her şeyi tek başına yapıyor (im Haushalt fast alles alleine), ancak artık işi partneriyle paylaşmaya karar verdi (mit seiner Partnerin die Arbeit) böylece her şey onun üzerine yıkılmaz.",
    vi:"Ahmed làm gần như mọi thứ một mình trong nhà (im Haushalt fast alles alleine), nhưng bây giờ anh ấy đã quyết định chia sẻ công việc với bạn đời của mình (mit seiner Partnerin die Arbeit) để mọi thứ không đổ dồn lên anh ấy.",

    ru:"Ахмед делает почти все по дому один (im Haushalt fast alles alleine), но теперь он решил разделить работу со своей партнершей (mit seiner Partnerin die Arbeit), чтобы все не ложилось на него."

{
  id:"h25",
  title:{
    ar:"مسارات الدراجات (المعدل)", ma:"مسارات البيسكليت (المعدل)", eg:"مسارات العجل (المعدل)",
    en:"Cycle Paths (Modified)", fr:"Pistes cyclables (Modifié)", hi:"साइकिल पथ (संशोधित)",
    tr:"Bisiklet Yolları (Değiştirilmiş)", vi:"Đường xe đạp (Đã sửa)", uk:"Велодоріжки (Змінено)",
    es:"Carriles bici (Modificado)", pt:"Ciclovias (Modificado)", zh:"自行车道（修改版）", ru:"Велодорожки (Изменено)"
  },
  level:"B1", sub:"Teile 1", type:"horen",
  audio:null,
  story:{
    ar:"حميد كيشوف بلي طرقان البيسكليت فيهم فوايد واضحة (klare Vorteile)، حيت مالين البيسكليتات فالشارع كيعرقلو السير (den Verkehr behindern)، وهاد الطرقان كيخليو الركوب ديال البيسكليت آمن كثر (das Radfahren sicherer).",
    ma:"حميد كيشوف بلي طرقان البيسكليت فيهم فوايد واضحة (klare Vorteile)، حيت مالين البيسكليتات فالشارع كيعرقلو السير (den Verkehr behindern)، وهاد الطرقان كيخليو الركوب ديال البيسكليت آمن كثر (das Radfahren sicherer).",
    eg:"حميد شايف إن مسارات العجل فيها فوايد واضحة (klare Vorteile)، لأن اللي بيركبوا العجل في الشارع بيعرقلوا المرور (den Verkehr behindern)، والمسارات دي بتخلي سواقة العجلة أأمن (das Radfahren sicherer).",
    en:"Hamid sees clear advantages in cycle paths (klare Vorteile), because cyclists on the road obstruct traffic (den Verkehr behindern), and these paths make cycling safer (das Radfahren sicherer).",
    fr:"Hamid voit des avantages clairs dans les pistes cyclables (klare Vorteile), car les cyclistes sur la route gênent la circulation (den Verkehr behindern), et ces pistes rendent le vélo plus sûr (das Radfahren sicherer).",
    hi:"हमीद साइकिल पथों में स्पष्ट फायदे देखते हैं (klare Vorteile), क्योंकि सड़क पर साइकिल चालक यातायात में बाधा डालते हैं (den Verkehr behindern), और ये पथ साइकिल चलाना सुरक्षित बनाते हैं (das Radfahren sicherer)।",
    tr:"Hamid bisiklet yollarında net avantajlar görüyor (klare Vorteile), çünkü yolda bisiklet sürenler trafiği engelliyor (den Verkehr behindern) ve bu yollar bisiklet sürmeyi daha güvenli hale getiriyor (das Radfahren sicherer).",
    vi:"Hamid thấy rõ những lợi thế của đường xe đạp (klare Vorteile), vì người đi xe đạp trên đường cản trở giao thông (den Verkehr behindern), và những con đường này làm cho việc đi xe đạp an toàn hơn (das Radfahren sicherer).",
    uk:"Хамід бачить явні переваги у велодоріжках (klare Vorteile), оскільки велосипедисти на дорозі заважають руху (den Verkehr behindern), і ці доріжки роблять їзду на велосипеді безпечнішою (das Radfahren sicherer).",
    es:"Hamid ve claras ventajas en los carriles bici (klare Vorteile), porque los ciclistas en la carretera obstruyen el tráfico (den Verkehr behindern), y estos carriles hacen que ir en bicicleta sea más seguro (das Radfahren sicherer).",
    pt:"Hamid vê claras vantagens nas ciclovias (klare Vorteile), porque os ciclistas na estrada obstruem o trânsito (den Verkehr behindern), e estas vias tornam o ciclismo mais seguro (das Radfahren sicherer).",
    zh:"哈米德在自行车道上看到了明显的好处（klare Vorteile），因为路上的自行车会阻碍交通（den Verkehr behindern），这些道路让骑自行车更安全（das Radfahren sicherer）。",
    ru:"Хамид видит явные преимущества в велодорожках (klare Vorteile), потому что велосипедисты на дороге мешают движению (den Verkehr behindern), и эти дорожки делают езду на велосипеде безопаснее (das Radfahren sicherer)."
  },
  items:[
    { n:1, c:"R", de:"Der Sprecher sieht in Radwegen klare Vorteile.", ar:"يرى المتحدث مزايا واضحة في مسارات الدراجات.", ma:"المتحدث كيشوف فوايد واضحة فمسارات البيسكليت.", eg:"المتحدث شايف فوايد واضحة في مسارات العجل.", en:"The speaker sees clear advantages in cycle paths.", fr:"L'orateur voit des avantages clairs dans les pistes cyclables.", hi:"वक्ता साइकिल पथों में स्पष्ट फायदे देखता है।", tr:"Konuşmacı bisiklet yollarında net avantajlar görüyor.", vi:"Người nói thấy rõ lợi thế của đường xe đạp.", uk:"Мовець бачить явні переваги у велодоріжках.", es:"El orador ve claras ventajas en los carriles bici.", pt:"O orador vê claras vantagens nas ciclovias.", zh:"说话者在自行车道上看到了明显的好处。", ru:"Говорящий видит явные преимущества в велодорожках." },

function HorenCard({ exam, onBack, userLang, dark, setDark }) {
  const [ans, setAns] = useState({});
  const [checked, setChecked] = useState(false);
  const [showStory, setShowStory] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const [time, setTime] = useState(0);
  const timerRef = React.useRef(null);
  const sessionRef = React.useRef(0);
  const T = UI_TEXTS[userLang] || UI_TEXTS.ar;
  const chunks = exam.audio ? exam.audio.split(/(?=Nummer \d+\.)/).map(s => s.trim()).filter(Boolean) : [];

  const stopAudio = () => {
    sessionRef.current++;
    clearInterval(timerRef.current);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setIsPlaying(false);
  };

  React.useEffect(() => () => {
    sessionRef.current++;
    clearInterval(timerRef.current);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }, []);

  const handlePick = (n, val) => {
    if (checked) return;
    if (ans[n] === val) { const next = {...ans}; delete next[n]; setAns(next); return; }
    setAns({...ans, [n]: val});
  };

  const handlePlay = () => {
    if (!exam.audio) return;
    if (isPlaying) { stopAudio(); return; }
    if (!window.speechSynthesis) { alert("المتصفح لا يدعم الصوت"); return; }
    window.speechSynthesis.cancel();
    const session = ++sessionRef.current;
    setIsPlaying(true); setTime(0);
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => setTime(t => t + 1), 1000);
    const voice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("de"));
    let i = 0;
    const finish = () => { if (session === sessionRef.current) { clearInterval(timerRef.current); setIsPlaying(false); } };
    const playNext = () => {
      if (session !== sessionRef.current) return;
      if (i >= chunks.length) { finish(); return; }
      const utt = new SpeechSynthesisUtterance(chunks[i]);
      utt.lang = "de-DE";
      if (voice) utt.voice = voice;
      utt.pitch = 0.8 + (i % 3) * 0.2;
      utt.rate = 0.9 + (i % 2) * 0.1;
      utt.onend = () => { if (session === sessionRef.current) { i++; setTimeout(playNext, 400); } };
      utt.onerror = () => finish();
      window.speechSynthesis.speak(utt);
    };
    playNext();
  };

  const formatTime = (secs) => `${Math.floor(secs/60)}:${(secs%60) < 10 ? '0' : ''}${secs%60}`;
  const handleCheck = () => setChecked(true);
  const handleReset = () => { stopAudio(); setAns({}); setChecked(false); setTime(0); };
  const emptyAnswers = exam.items.filter(it => !ans[it.n]);
  const emptyCorrect = emptyAnswers.map(it => `${it.n} (${it.c})`).join(' , ');
  const score = exam.items.filter(it => ans[it.n] === it.c).length;

  const renderStory = (text) => {
    return text.split(/(\([^)]+\))/).map((part, i) => {
      if (part.startsWith('(') && part.endsWith(')')) return <span key={i} className="sahla-highlight">{part}</span>;
      return <span key={i}>{part}</span>;
    });
  };

  return (
    <div style={{ paddingBottom: 100 }}>
      <div className="header">
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <button className="btnI" onClick={onBack}>←</button>
          <div>
            <div className="de" style={{ fontWeight: 900, fontSize: "1em", lineHeight: 1.2 }}>{tr(exam.title, userLang)}</div>
            <div className="de" style={{ fontSize: ".75em", color: "var(--muted)", fontWeight: "bold" }}>HÖREN · {exam.sub}</div>
          </div>
        </div>
        <button className="btnI" onClick={() => setDark(!dark)}>{dark ? "☀️" : "🌙"}</button>
      </div>

      <div style={{ margin: "0 12px" }}>
        <div className="sahla-card">
          <div className="sahla-header">
            <div className="sahla-title">{tr(exam.title, userLang)}</div>
          </div>
          {exam.audio ? (
            <div className="sahla-audio">
              <button className="sahla-play" onClick={handlePlay}>{isPlaying ? "⏸" : "▶"}</button>
              <div className="sahla-progress">
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.75em", fontWeight: 700, color: "var(--muted)" }}>
                  <span style={{ color: "var(--gold)" }}>{formatTime(time)}</span>
                  <span>{chunks.length} Teile</span>
                </div>
                <div className="sahla-track"><div className="sahla-fill" style={{ width: isPlaying ? "50%" : time > 0 ? "100%" : "0%" }}></div></div>
              </div>
            </div>
          ) : (
            <div className="sahla-audio" style={{ justifyContent: "center" }}>
              <div style={{ fontSize: "0.9em", color: "var(--muted)", fontWeight: "bold", padding: "10px 0" }}>Audio nicht verfügbar</div>
            </div>
          )}

          <div className="sahla-table">
            <div className="sahla-th">
              <div style={{ width: 40, textAlign: "center" }}>R</div>
              <div style={{ width: 40, textAlign: "center" }}>F</div>
              <div style={{ flex: 1, textAlign: "left", paddingLeft: 10 }}>AUSSAGE</div>
            </div>
            {exam.items.map(it => {
              let rCls = "sahla-circle", fCls = "sahla-circle";
              if (ans[it.n] === "R") rCls += " sel";
              if (ans[it.n] === "F") fCls += " sel";
              if (checked) {
                if (it.c === "R") rCls += " good"; else if (ans[it.n] === "R") rCls += " bad";
                if (it.c === "F") fCls += " good"; else if (ans[it.n] === "F") fCls += " bad";
              }
              return (
                <div key={it.n} className="sahla-row" style={{ background: checked ? (ans[it.n] === it.c ? "var(--okbg)" : "var(--badbg)") : "transparent" }}>
                  <div style={{ width: 40, display: "flex", justifyContent: "center", paddingTop: 2 }}><div className={rCls} onClick={() => handlePick(it.n, "R")}></div></div>
                  <div style={{ width: 40, display: "flex", justifyContent: "center", paddingTop: 2 }}><div className={fCls} onClick={() => handlePick(it.n, "F")}></div></div>
                  <div style={{ flex: 1, display: "flex", gap: 12, textAlign: "left", fontSize: "0.95em", lineHeight: 1.5 }}>
                    <div style={{ width: 28, height: 28, borderRadius: "50%", background: "var(--paper)", color: "var(--muted)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: "0.85em", flexShrink: 0 }}>{it.n}</div>
                    <div className="de">{it.de}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <button className="sahla-story-btn" onClick={() => setShowStory(!showStory)}>👁️ {userLang === "en" ? "Easy story" : userLang === "fr" ? "Histoire facile" : "قصة سهلة للحفظ"}</button>
          {showStory && <div className="sahla-story-box">{renderStory(tr(exam.story, userLang))}</div>}

          <div className="sahla-actions">
            <button className="sahla-btn-check" onClick={handleCheck}>✓ Prüfen</button>
            <button onClick={handleReset} style={{ width: 56, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, color: "var(--muted)" }}>↺</button>
          </div>

          {checked && emptyAnswers.length > 0 && (
            <div className="sahla-warning">
              <span style={{ fontSize: "1.3em" }}>⚠️</span>
              <div style={{ flex: 1, textAlign: "center" }}>{emptyCorrect}</div>
            </div>
          )}

          {checked && emptyAnswers.length === 0 && (
            <div className="sahla-warning" style={{ background: score === exam.items.length ? "var(--okbg)" : "var(--paper)", borderColor: score === exam.items.length ? "var(--okc)" : "var(--gold)" }}>
              <span style={{ fontSize: "1.3em" }}>{score === exam.items.length ? "🎉" : "📊"}</span>
              <div style={{ flex: 1, textAlign: "center", fontWeight: 900 }}>{score} / {exam.items.length}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function HorenCard({ exam, userLang, onBack }) {
  const [ans, setAns] = useState({});
  const [checked, setChecked] = useState(false);
  const [showStory, setShowStory] = useState(false);
  const [isPlaying, setIsPlaying] = useState(false);
  const T = UI_TEXTS[userLang] || UI_TEXTS.ar;

  const handlePick = (n, val) => {
    if (checked) return;
    if (ans[n] === val) { const next = { ...ans }; delete next[n]; setAns(next); return; }
    setAns({ ...ans, [n]: val });
  };

  const playAudio = () => {
    if (!exam.audio || !window.speechSynthesis) return;
    if (isPlaying) { window.speechSynthesis.cancel(); setIsPlaying(false); return; }
    setIsPlaying(true);
    const chunks = exam.audio.split(/(?=Nummer \d+\.)/).map(s => s.trim()).filter(Boolean);
    let i = 0;
    const next = () => {
      if (i >= chunks.length) { setIsPlaying(false); return; }
      const utt = new SpeechSynthesisUtterance(chunks[i]);
      utt.lang = 'de-DE'; utt.pitch = 0.9 + (i % 3) * 0.15; utt.rate = 0.95;
      utt.onend = () => { i++; setTimeout(next, 400); };
      window.speechSynthesis.speak(utt);
    };
    next();
  };

  const score = exam.items.filter(it => ans[it.n] === it.c).length;
  const empty = exam.items.filter(it => !ans[it.n]);

  const renderStory = (text) => {
    if (!text) return "";
    return text.split(/(\([^)]+\))/).map((p, i) => {
      if (p.startsWith('(') && p.endsWith(')')) return <span key={i} className="sahla-highlight">{p}</span>;
      return <span key={i}>{p}</span>;
    });
  };

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, background: "var(--paper)", zIndex: 10 }}>
        <button onClick={onBack} className="btnI" style={{ width: 40, height: 40 }}>←</button>
        <div className="de" style={{ fontWeight: 900, fontSize: "1.05em" }}>{tr(exam.title, userLang)}</div>
      </div>

      <div style={{ margin: "0 12px" }}>
        <div className="sahla-card">
          <div className="sahla-header">
            <div className="sahla-title">{tr(exam.title, userLang)}</div>
          </div>

          {exam.audio ? (
            <div className="sahla-audio">
              <button className="sahla-play" onClick={playAudio}>
                {isPlaying ? "⏹" : "▶"}
              </button>
              <div className="sahla-progress">
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.8em", fontWeight: 700, color: "var(--muted)" }}>
                  <span style={{ color: "var(--okbtn)" }}>0:00</span><span>3:35</span>
                </div>
                <div className="sahla-track"><div className="sahla-fill" style={{ width: isPlaying ? "40%" : "0%" }}></div></div>
              </div>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </div>
          ) : (
            <div className="sahla-audio" style={{ justifyContent: "center" }}>
              <div style={{ fontSize: "0.9em", color: "var(--muted)", fontWeight: "bold", padding: "10px 0" }}>Audio nicht verfügbar</div>
            </div>
          )}

          <div className="sahla-table">
            <div className="sahla-th">
              <div style={{ width: 40, textAlign: "center" }}>R</div>
              <div style={{ width: 40, textAlign: "center" }}>F</div>
              <div style={{ flex: 1, paddingLeft: 10 }}>AUSSAGE</div>
            </div>
            {exam.items.map(it => {
              const isDone = checked;
              const isR = ans[it.n] === "R";
              const isF = ans[it.n] === "F";
              let rC = "sahla-circle", fC = "sahla-circle";
              if (isR) rC += " sel"; if (isF) fC += " sel";
              if (isDone) {
                if (it.c === "R") rC += " good"; else if (isR) rC += " bad";
                if (it.c === "F") fC += " good"; else if (isF) fC += " bad";
              }
              return (
                <div key={it.n} className="sahla-row" style={{ background: isDone ? (ans[it.n] === it.c ? "var(--okbg)" : "var(--badbg)") : "transparent" }}>
                  <div style={{ width: 40, display: "flex", justifyContent: "center", paddingTop: 2 }}>
                    <div className={rC} onClick={() => handlePick(it.n, "R")}></div>
                  </div>
                  <div style={{ width: 40, display: "flex", justifyContent: "center", paddingTop: 2 }}>
                    <div className={fC} onClick={() => handlePick(it.n, "F")}></div>
                  </div>
                  <div style={{ flex: 1, display: "flex", gap: 10, textAlign: "left", fontSize: "0.95em", lineHeight: 1.5 }}>
                    <span style={{ color: "var(--muted)", fontWeight: 900 }}>{it.n}</span>
                    <span className="de">{tr(it, userLang) !== it.de ? it.de : it.de}</span>
                  </div>
                </div>
              );
            })}
          </div>

          <button className="sahla-story-btn" onClick={() => setShowStory(!showStory)} style={{ color: "var(--okbtn)" }}>
            <div style={{ width: 32, height: 32, borderRadius: 10, background: "var(--okbg)", color: "var(--okbtn)", display: "flex", alignItems: "center", justifyContent: "center" }}>👁️</div>
            {userLang === "en" ? "Easy story to memorize" : "قصة سهلة للحفظ"}
          </button>
          {showStory && <div className="sahla-story-box" style={{ color: "var(--okbtn)", background: "var(--okbg)" }}>{renderStory(exam.story)}</div>}

          <div className="sahla-actions">
            <button className="sahla-btn-check" onClick={() => setChecked(true)} style={{ background: "var(--okbtn)", color: "#FFF" }}>
              ✓ {userLang === "en" ? "Check" : "Prüfen"}
            </button>
            <button onClick={() => { setAns({}); setChecked(false); }} style={{ width: 60, background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--muted)" }}>
              🔄
            </button>
          </div>

          {checked && empty.length > 0 && (
            <div className="sahla-warning">
              <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--gold)", color: "#FFF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontWeight: 900 }}>!</div>
              <div style={{ flex: 1, textAlign: "center" }}>
                {userLang === "en" ? "You left answers empty. Correct: " : "تركت الإجابات فارغة. الصحيح هو: "}
                <span style={{ direction: "ltr", display: "inline-block" }}>{empty.map(it => `${it.n} (${it.c})`).join(', ')}</span>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

            <LogoImage size={80} />
            <h2 style={{ marginTop: 16, fontSize: "1.5em", fontWeight: 900 }}>{T.welcome}</h2>
            <p style={{ color: "var(--muted)" }}>{T.subtitle}</p>
          </div>
          <button className="auth-btn guest" onClick={handleGuest}>{T.guest}</button>
          <div style={{ textAlign: "center", margin: "20px 0", color: "var(--muted)" }}>—</div>
          <form onSubmit={handleAuth}>
            <input className="auth-input" name="name" placeholder={T.namePlaceholder} required />
            <input className="auth-input" name="pass" type="password" placeholder={T.passPlaceholder} required />
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              <input type="checkbox" id="rem" style={{ width: 18, height: 18 }} />
              <label htmlFor="rem" style={{ fontSize: "0.95em", cursor: "pointer" }}>{T.remember}</label>
            </div>
            <button type="submit" className="auth-btn">{T.login}</button>
          </form>
        </div>
      </div>
    );
  }

  if (horenExam) return <HorenCard exam={horenExam} userLang={userLang} onBack={() => setHorenExam(null)} />;
  if (exam) return <ExamView exam={exam} userLang={userLang} onBack={() => setExam(null)} onNext={() => setExam(null)} onSave={() => {}} dark={dark} setDark={setDark} />;

  const navItems = [
    ["lesen", T.reading, "📖"],
    ["horen", T.listening, "🎧"],
    ["schreiben", T.writing, "✎"],
    ["sprechen", T.speaking, "🎙"],
    ["pruefung", T.exam, "🎓"],
    ["home", T.home, "⌂"]
  ];

  const uniqueTitles = [...new Set(EXAMS_DATA.map(e => e.title))];

  return (
    <div style={{ paddingBottom: 90 }}>
      <div className="header">
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ width: 42, height: 42, borderRadius: 14, background: "var(--ink-grad)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <LogoImage size={42} />
          </div>
          <div>
            <div style={{ fontWeight: 900, fontSize: "1.15em" }}>EchtPrüfung</div>
            <div className="de" style={{ fontSize: ".75em", color: "var(--muted)", fontWeight: "bold" }}>Deutsch B1/B2 · {LANGS.find(l => l.c === userLang)?.n}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btnI" onClick={() => setDark(!dark)}>{dark ? "☀️" : "🌙"}</button>
          <button className="btnI" onClick={() => setSettings(true)}>⚙️</button>
          <button className="btnI" onClick={() => setMenu(true)}>☰</button>
        </div>
      </div>

      <main style={{ margin: "0 12px" }}>
        {view === "home" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <div style={{ position: "relative", borderRadius: 24, overflow: "hidden", minHeight: 380, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: "40px 20px", border: "1px solid var(--line)", boxShadow: "0 10px 30px rgba(0,0,0,0.1)" }}>
              <div style={{ position: "absolute", inset: 0, backgroundImage: "url('https://images.unsplash.com/photo-1560969184-10fe8719e047?q=80&w=1000&auto=format&fit=crop')", backgroundSize: "cover", backgroundPosition: "center" }} />
              <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to bottom, rgba(15,27,51,0.4) 0%, rgba(15,27,51,0.95) 100%)" }} />
              <div style={{ position: "relative", zIndex: 2, textAlign: "center", width: "100%" }}>
                <div style={{ display: "inline-block", padding: 20, background: "rgba(255,255,255,0.1)", borderRadius: 28, backdropFilter: "blur(10px)", border: "1px solid rgba(255,255,255,0.2)" }}>
                  <LogoImage size={90} />
                </div>
                <h2 className="de" style={{ margin: "20px 0 8px", fontSize: "2.2em", fontWeight: 900, color: "#FFF", letterSpacing: "-0.5px" }}>EchtPrüfung</h2>
                <p style={{ margin: "0 0 20px", color: "#E2E8F0", fontSize: "1.1em", fontWeight: 700 }}>{T.trainText || T.subtitle}</p>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 12, direction: "ltr", fontSize: "1.8em", fontWeight: 900, background: "rgba(255,255,255,0.95)", padding: "10px 28px", borderRadius: 20 }}>
                  <span style={{ color: "#0F1B33" }}>B1</span>
                  <span style={{ color: "#DD0000" }}>&</span>
                  <span style={{ color: "#F5B82E" }}>B2</span>
                </div>
              </div>
            </div>
          </div>
        )}

        {view === "lesen" && (
          <div>
            <h1 className="de" style={{ fontSize: "2.4em", fontWeight: 900, margin: "4px 0 14px" }}>Lesen</h1>
            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <div style={{ display: "inline-flex", background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 4 }}>
                <button style={{ padding: "8px 28px", borderRadius: 12, fontWeight: 900, background: "var(--ink-grad)", color: "var(--gold)" }}>B1</button>
                <button style={{ padding: "8px 28px", borderRadius: 12, fontWeight: 900, color: "var(--muted)" }}>B2</button>
              </div>
            </div>
            <h3 style={{ fontWeight: 900, margin: "8px 0" }}>{T.examList}</h3>
            {uniqueTitles.map(title => (
              <button key={title} className="card" onClick={() => setSelectedTitle(title)} style={{ width: "100%", textAlign: "right", padding: 16, color: "var(--text)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div className="de" style={{ fontWeight: 900, fontSize: "1.15em" }}>{title}</div>
                  <span>←</span>
                </div>
              </button>
            ))}
          </div>
        )}

        {view === "horen" && <HorenSahlaView horenList={HOREN_EXAMS} userLang={userLang} onPick={setHorenExam} />}

        {view !== "home" && view !== "lesen" && view !== "horen" && (
          <div className="card" style={{ textAlign: "center", padding: 40 }}>
            <p style={{ color: "var(--muted)", fontSize: "1.1em", fontWeight: 700 }}>{T.comingSoon}</p>
          </div>
        )}
      </main>

      <nav className="nav">
        {navItems.map(([k, label, ic]) => (
          <button key={k} className={view === k ? "on" : ""} onClick={() => { setView(k); setExam(null); setHorenExam(null); window.scrollTo(0,0); }}>
            <span className="ic">{ic}</span><span>{label}</span>
          </button>
        ))}
      </nav>

      {selectedTitle && (
        <div className="overlay" onClick={() => setSelectedTitle(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 className="de" style={{ margin: 0, fontWeight: 900 }}>{selectedTitle}</h3>
              <button className="btnI" onClick={() => setSelectedTitle(null)}>✕</button>
            </div>
            {["Teile 1","Teile 2","Teile 3","Sprach 1","Sprach 2"].map(sub => {
              const ex = EXAMS_DATA.find(e => e.title === selectedTitle && e.sub === sub);
              return (
                <button key={sub} className="btn ghost" disabled={!ex} style={{ marginBottom: 10, opacity: ex ? 1 : 0.4, display: "flex", justifyContent: "space-between" }} onClick={() => { if (ex) { setExam(ex); setSelectedTitle(null); } }}>
                  <span className="de" style={{ fontWeight: 800 }}>{sub}</span>
                  <span>{ex ? "←" : "🔒"}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {settings && (
        <div className="overlay" onClick={() => setSettings(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <strong style={{ fontSize: "1.3em" }}>{T.settings}</strong>
              <button className="btnI" onClick={() => setSettings(false)}>✕</button>
            </div>
            <div style={{ marginBottom: 16 }}>
              <span style={{ fontWeight: 900, display: "block", marginBottom: 8 }}>{T.changeLang}</span>
              <div className="lang-grid" style={{ maxHeight: 200 }}>
                {LANGS.map(l => (
                  <button key={l.c} onClick={() => chooseLang(l.c)} className={"lang-btn " + (userLang === l.c ? "on" : "")} style={{ padding: 10 }}>
                    <span style={{ fontSize: "1.2em" }}>{l.f}</span>
                    <span style={{ fontSize: "0.9em" }}>{l.n}</span>
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <span style={{ fontWeight: 900 }}>{T.fontSize}</span>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button className="btnI" onClick={() => setFs(Math.max(80, fs - 10))}>−</button>
                <span style={{ minWidth: 48, textAlign: "center", fontWeight: 900 }}>{fs}%</span>
                <button className="btnI" onClick={() => setFs(Math.min(150, fs + 10))}>+</button>
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <span style={{ fontWeight: 900 }}>{T.darkMode}</span>
              <button onClick={() => setDark(!dark)} style={{ width: 50, height: 28, borderRadius: 20, background: dark ? "var(--gold)" : "var(--line)", position: "relative" }}>
                <div style={{ width: 22, height: 22, borderRadius: "50%", background: "#FFF", position: "absolute", top: 3, left: dark ? 25 : 3, transition: "left .3s" }} />
              </button>
            </div>
            <button className="btn ghost" onClick={() => setFs(100)}>{T.resetSize}</button>
          </div>
        </div>
      )}

      {menu && (
        <div className="overlay" onClick={() => setMenu(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()} style={{ padding: 0, maxWidth: 400 }}>
            <div style={{ padding: 24, textAlign: "center", borderBottom: "1px solid var(--line)" }}>
              <div style={{ width: 72, height: 72, margin: "0 auto 12px", borderRadius: "50%", background: "linear-gradient(135deg,#111 33%,#DD0000 33%,#DD0000 66%,#FFCE00 66%)", padding: 3 }}>
                <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--card)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "2em", fontWeight: 900, color: "var(--text)" }}>{(user.name||"G").charAt(0).toUpperCase()}</div>
              </div>
              <h2 style={{ margin: 0, fontSize: "1.3em", fontWeight: 900 }}>{user.name}</h2>
              <div className="de" style={{ margin: "6px 0 0", fontSize: "0.85em", color: "var(--muted)", fontWeight: "bold" }}>{user.isGuest ? "Gast-Modus" : "Profil"}</div>
            </div>
            <div style={{ padding: 20 }}>
              <button className="btn ghost" style={{ marginBottom: 10, display: "flex", justifyContent: "center", gap: 10 }} onClick={() => { setShowOnboarding(true); setMenu(false); }}>
                🌐 {T.changeLang}
              </button>
              <button className="btn" style={{ marginBottom: 10, background: "#25D366", color: "#FFF" }} onClick={() => window.open("https://wa.me/212600000000", "_blank")}>
                💬 WhatsApp Support
              </button>
              <button className="btn" style={{ background: "rgba(185,28,28,.1)", color: "var(--badc)", border: "1px solid var(--badc)" }} onClick={logout}>
                🚪 {T.logout || "تسجيل الخروج"}
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
